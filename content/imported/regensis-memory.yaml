    **Trade-off to manage:** Summaries must be accurate and privacy-compliant.

    **How you prove it worked:**

    - Repeat-explanation rate on cross-channel contacts.

    **Same pattern elsewhere:** FinTech: a customer who reported fraud in the app must re-explain it to the phone agent.
