    - +Same evals · Held-out
    - Fraction · Of cost
    good_note: Small fine-tuned model, large model for hard cases
  solution: |-
    1. Fine-tune or distil a small model (or train a classical classifier) for high-volume narrow tasks.
    2. Use the large model for hard or low-confidence cases only.
    3. Evaluate both on the same held-out set.
  works: |-
    **Trade-off to manage:** Fine-tuned models need retraining and MLOps upkeep.

    **How you prove it worked:**

    - Cost per thousand items; accuracy by confidence band.

