- id: tel-11
  title: A 12-second gap in the trace is an uninstrumented bureau call
  tags:
  - Reliability
  - Latency
  - FinTech
  scenario: |-
    A lender's application assistant has slow responses. The trace shows two LLM spans with a 12-second gap between them. Only LLM calls emit spans; the gap turns out to be a credit-bureau call that retries three times on timeout.
  antipattern: |-
    **Only LLM calls emit spans.**

    *Think of it this way:* A delivery tracker that shows "left depot" and "delivered" and nothing about the four-hour stop in between.
  fails: |-
    **Mechanism:** Tool latency and failures are invisible.

    - Only LLM calls are instrumented.
    - Tool and API latency and failures are invisible.
    - Time is misattributed to the model.

    **Root cause:** Incomplete span coverage.

    **Where it breaks:** Instrumentation.
  diagram:
    bad:
    - LLM span · 1.1 s
    - '!Gap · 12 s unknown'
    - LLM span · 0.9 s
    - '!Blames model · Wrong cause'
    bad_note: Only LLM calls emit spans
    good:
    - Tool spans · Every call
    - +Bureau call · 3 retries seen
    - +Auto-instrument · HTTP, DB
    - Gap metric · Unaccounted
    good_note: Spans for every tool and external call
  solution: |-
    1. Emit spans for every tool call, retrieval, database query and external API, with (redacted) arguments, status, retries and result size.
    2. Auto-instrument HTTP clients and DB drivers.
