- id: eval-18
  title: Payment instructions from emails fail to parse 3% of the time
  tags:
  - Quality
  - FinTech
  scenario: |-
    A corporate-banking operations team uses an LLM to turn client emails into payment instructions (beneficiary, amount, currency, value date). The evals check whether fields are correct but not whether the JSON validates. 3% of outputs fail schema validation in production, landing in an exceptions queue and missing cut-off times.
  antipattern: |-
    **Grading content but not format.**

    *Think of it this way:* Checking that a letter says the right things but not whether the envelope has a valid address.
  fails: |-
    **Mechanism:** Downstream systems need valid schemas, not just good ideas.

    - Free-form generation sometimes produces extra prose, wrong types or missing fields.
    - Evals graded content, not format.
    - Downstream systems need strict schemas.

    **Root cause:** No deterministic format checks in evals, and no structured-output enforcement at runtime.

    **Where it breaks:** Output contract and eval suite.
  diagram:
    bad:
    - Client email · Pay request
    - '!Free-form JSON · From LLM'
    - 3% invalid · Schema fails
    - '!Missed cut-off · Exceptions'
    bad_note: Grade content, ignore format
    good:
    - Structured out · JSON schema
    - +Pydantic · Plus IBAN check
    - +Retry once · Then human
    - Metric · Parse failures
    good_note: Schema-enforced output, code checks, retry
  solution: |-
    1. Use the provider's structured outputs or tool calling with a JSON schema, and validate with Pydantic.
    2. On validation failure, retry once with the error message, then route to a human.
    3. Add schema validity and field-level accuracy as separate eval metrics, measured by code not a judge.
    4. Validate business rules in code too (IBAN checksum, currency codes, cut-off times).
  works: |-
    **Trade-off to manage:** Strict schemas can reject valid edge cases; version the schema and review rejects.

    **How you prove it worked:**

    - Parse-failure rate and exceptions-queue volume per model version.

    **Same pattern elsewhere:** Telco: an order-intake bot produces addresses that fail the serviceability API format 4% of the time.
  takeaway: Check format with code, not with a judge.
  related:
  - prm-06
  - eval-15
  code: |
    class PaymentInstruction(BaseModel):
        iban: str; amount: Decimal; currency: str; value_date: date
        @field_validator("iban")
        def iban_ok(cls, v): assert iban_checksum(v); return v
        @field_validator("currency")
        def ccy_ok(cls, v): assert v in ISO_4217; return v

    def parse(email):
        for attempt in range(2):
            try:
                return PaymentInstruction.model_validate(llm.structured(email, schema=PaymentInstruction))
            except ValidationError as e:
                email = f"{email}\n\nPrevious output failed validation: {e}"
        return route_to_human(email)
