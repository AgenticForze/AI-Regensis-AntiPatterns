- id: sec-18
  title: Agent installs a hallucinated package name
  tags:
  - Security
  - Telco
  scenario: |-
    A carrier's internal coding agent writes a script to parse network telemetry and runs pip install for a package name it invented. An attacker had registered that name, a known "slopsquatting" pattern. The package installs a backdoor on a build server.
  antipattern: |-
    **Agent installs packages from public registry.**

    *Think of it this way:* Buying a spare part from a shop that opened yesterday because the part number sounded right.
  fails: |-
    - Models invent plausible package names.
    - Agents install dependencies without checks.
    - Public registries accept any new name.

    **Root cause:** Unvetted dependency installation by agents.

    **Where it breaks:** Build and agent environment.
  diagram:
    bad:
    - Agent script · Parse telemetry
    - '!Invented name · Package'
    - Attacker · Registered it
    - '!Backdoor · Build server'
    bad_note: Agent installs packages from public registry
    good:
    - Mirror · Internal
    - +Allow-list · Packages
    - +Review · New deps
    - Scan · Before install
    good_note: Internal mirror, allow-list, human review
  solution: |-
    1. Install only from an internal mirror with an allow-list.
    2. Require human review for new dependencies.
    3. Scan packages and block installs in agent sandboxes from public registries.
  works: |-
    **Trade-off to manage:** Slower adoption of new libraries.

    **How you prove it worked:**

    - Attempts to install unknown packages.

    **Same pattern elsewhere:** FinTech: a quant team's coding agent pulls a typosquatted package into a research environment.
  takeaway: An agent's dependencies are your supply chain.
  related:
  - sec-14
  - cicd-07
  code: |
    # pip.conf inside agent sandboxes
    # [global]
    # index-url = https://pypi-mirror.corp/simple      ← internal mirror, allow-listed packages only

    def install(pkg):
        if pkg not in ALLOWLIST:
            return review_queue.request(pkg, requested_by="agent")   # human review for new deps
        subprocess.run(["pip", "install", f"{pkg}=={ALLOWLIST[pkg]}"], check=True)
