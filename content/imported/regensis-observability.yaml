- id: tel-06
  title: Slow tracing backend slows down customer replies
  tags:
  - Reliability
  - Latency
  - Telco
  scenario: |-
    A carrier's tracing backend has a bad day and responds slowly. The care bot's trace exporter sends spans synchronously, so every customer reply waits for it. Median latency goes from 1.5 to 7 seconds, and the bot breaches its SLO because of its own monitoring.
  antipattern: |-
    **Synchronous export of spans and logs.**

    *Think of it this way:* A shop that can't serve customers while the security camera is buffering.
  fails: |-
    **Mechanism:** Monitoring becomes a dependency of the product.

    - Spans and logs are exported synchronously on the request path.
    - Telemetry backends have their own outages.
    - No buffer or drop policy.

    **Root cause:** Telemetry is a hard dependency of the product.

    **Where it breaks:** Exporter configuration.
  diagram:
    bad:
    - Trace backend · Slow
    - '!Sync export · On request'
    - 1.5 s to 7 s · Median
    - '!SLO breach · Self-inflicted'
    bad_note: Synchronous span export
    good:
    - Async batch · Exporter
    - +Local agent · Collector
    - +Bounded buffer · Drop if full
    - Drop metric · Alerted
    good_note: Async batched export, drop instead of block
  solution: |-
    1. Use async, batched exporters and a local collector agent.
    2. Bound buffers and drop telemetry rather than blocking requests.
    3. Alert on dropped-span counts.
  works: |-
    **Trade-off to manage:** Dropping telemetry loses data during backend outages; that's the right trade.

    **How you prove it worked:**

    - Exporter latency and dropped spans as metrics.

    **Same pattern elsewhere:** FinTech: a payments assistant times out because the logging service's TLS handshake is slow.
  takeaway: Telemetry must never take down the thing it watches.
  related:
  - tel-07
  code: |
    from opentelemetry.sdk.trace.export import BatchSpanProcessor
    from opentelemetry.exporter.otlp.proto.grpc.trace_exporter import OTLPSpanExporter

    provider.add_span_processor(BatchSpanProcessor(
        OTLPSpanExporter(endpoint="localhost:4317"),     # local collector agent, not the remote backend
        max_queue_size=4096,                             # bounded: drop, never block requests
        schedule_delay_millis=2000, export_timeout_millis=5000))
    # alert on otelcol_exporter_send_failed_spans and processor dropped-span counters
