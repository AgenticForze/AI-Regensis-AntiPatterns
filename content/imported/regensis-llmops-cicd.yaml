- id: cicd-17
  title: Eval set changed and scores aren't comparable
  tags:
  - Reliability
  - FinTech
  scenario: |-
    A bank's eval dataset is a spreadsheet that analysts edit freely. Scores go from 84% to 90% between releases. Half the gain came from someone deleting hard cases they thought were mislabelled.
  antipattern: |-
    **Eval set in a freely edited spreadsheet.**

    *Think of it this way:* Changing the exam questions and claiming the class got smarter.
  fails: |-
    - Eval data isn't versioned.
    - Changes aren't reviewed.
    - Scores across versions aren't comparable.

    **Root cause:** Unversioned eval datasets.

    **Where it breaks:** Eval data management.
  diagram:
    bad:
    - Spreadsheet · Free edits
    - '!Hard cases · Deleted'
    - 84% to 90% · Scores
    - '!False gain · Reported'
    bad_note: Eval set in a freely edited spreadsheet
    good:
    - Repo dataset · Versioned
    - +Review · Changes
    - +Version tag · On results
    - Frozen subset · Long-term
    good_note: Versioned, reviewed datasets and frozen subset
  solution: |-
    1. Version eval datasets in the repository (or a dataset registry) with review for changes.
    2. Report results with the dataset version, and re-baseline when the dataset changes.
    3. Keep a frozen benchmark subset for long-term comparison.
  works: |-
    **Trade-off to manage:** Review slows dataset fixes slightly.

    **How you prove it worked:**

    - Dataset version recorded on every eval result.

    **Same pattern elsewhere:** Telco: a carrier's care eval set is silently edited, hiding a regression in roaming answers.
  takeaway: Version the test set like the code.
  related:
  - eval-17
  - tel-16
  code: |
    EVAL = {"dataset": "care_eval", "version": "v9", "frozen_subset": "care_eval_frozen_v1"}

    def report(results):
        return {"dataset_version": EVAL["version"],
                "score": results.score,
                "frozen_subset_score": run(EVAL["frozen_subset"]).score}   # long-term comparability

    if EVAL["version"] != last_baseline.dataset_version:
        rebaseline(EVAL["version"])
