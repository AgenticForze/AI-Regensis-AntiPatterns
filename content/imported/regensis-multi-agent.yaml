- id: mas-20
  title: Only the orchestrator's final answer is evaluated
  tags:
  - Reliability
  - Cost
  - Telco
  scenario: |-
    A carrier evaluates its multi-agent network-diagnosis system on whether the final root cause is right (82%). It never evaluates sub-agents. Investigation shows the log-analysis sub-agent is wrong 40% of the time, but the orchestrator often compensates by using other evidence, at high cost and with some lucky guesses.
  antipattern: |-
    **Evaluate only the final answer.**

    *Think of it this way:* Judging a team only by the final score while one player keeps scoring own goals.
  fails: |-
    - Sub-agent quality is invisible.
    - Compensation hides weak components.
    - Improvements can't be targeted.

    **Root cause:** No component-level evals in multi-agent systems.

    **Where it breaks:** Eval design.
  diagram:
    bad:
    - Final answer · 82% right
    - '!Sub-agents · Not evaluated'
    - Log agent · 40% wrong
    - '!Hidden · By compensation'
    bad_note: Evaluate only the final answer
    good:
    - Per-agent · Evals
    - +Override rate · Tracked
    - +Fix weak · Or remove
    - Team score · Plus parts
    good_note: Per-agent evals and override tracking
  solution: |-
    1. Evaluate each sub-agent on its own task with labelled data.
    2. Track how often the orchestrator overrides or ignores each sub-agent.
    3. Improve or remove weak sub-agents.
  works: |-
    **Trade-off to manage:** Labelled data per sub-agent.

    **How you prove it worked:**

    - Per-agent accuracy and usage dashboards.

    **Same pattern elsewhere:** FinTech: a bank's research multi-agent system has a weak earnings-extraction agent hidden by a strong summariser.
  takeaway: Evaluate every agent, not just the team score.
  related:
  - eval-13
  - aev-10
  code: |
    def subagent_report(traces, labelled):
        report = {}
        for agent in SUBAGENTS:
            spans = [s for t in traces for s in t.spans if s.agent == agent]
            report[agent] = {
                "task_accuracy": accuracy(agent, labelled[agent]),
                "override_rate": mean(s.overridden_by_orchestrator for s in spans),
                "ignored_rate": mean(s.output_unused for s in spans)}
        return report
  lang: python
