- id: tel-08
  title: Voice bot feels slow, but total latency looks fine
  tags:
  - Reliability
  - Latency
  - Telco
  scenario: |-
    A carrier's IVR voice bot answers in 2.8 seconds on average, which looks acceptable. Callers say it feels slow and talk over it. The metric measured total response time. Time to first audio was 2.6 seconds, because speech synthesis waited for the full LLM response before starting.
  antipattern: |-
    **Measuring only total request duration.**

    *Think of it this way:* A waiter who brings every dish at once after an hour, versus one who brings the first course in five minutes.
  fails: |-
    **Mechanism:** For streaming, perceived speed depends on time to first token.

    - Only total duration was measured.
    - Perceived speed depends on the first token and first audio.
    - The pipeline waited instead of streaming.

    **Root cause:** Telemetry didn't capture the user-experience timing.

    **Where it breaks:** Instrumentation and pipeline design.
  diagram:
    bad:
    - Avg 2.8 s · Total time
    - '!First audio · 2.6 s'
    - TTS waits · Full reply
    - '!Callers · Talk over bot'
    bad_note: Measure total duration only
    good:
    - TTFT metric · Separate
    - +First audio · SLO under 1 s
    - +Stream TTS · By sentence
    - Barge-in · Tracked
    good_note: Time to first token/audio, stream to TTS
  solution: |-
    1. Emit time to first token, time to first audio, tokens per second and total duration as separate metrics.
    2. Stream tokens into speech synthesis by sentence.
    3. Set SLOs on time to first audio for voice (for example under 1 second).
  works: |-
    **Trade-off to manage:** Streaming makes post-generation guardrails harder; run fast checks per sentence.

    **How you prove it worked:**

    - Barge-in rate (callers talking over the bot) by latency band.

    **Same pattern elsewhere:** FinTech: a bank's voice assistant waits for the full answer before speaking card balance information.
  takeaway: For streaming, time to first token is the UX metric.
  related:
  - obs-04
  - cost-03
  code: |
    async def speak(reply_stream):
        t0 = monotonic(); first_tok = first_audio = None; buf = ""
        async for tok in reply_stream:
            first_tok = first_tok or monotonic()
            buf += tok
            if buf.rstrip().endswith((".", "?", "!")):
                await tts.play(buf); buf = ""
                first_audio = first_audio or monotonic()
        ttft.observe(first_tok - t0); time_to_first_audio.observe(first_audio - t0)   # SLO: < 1 s
  lang: python
- id: tel-09
  title: GDPR deletion request no one can fulfil in the trace store
  tags:
  - Reliability
  - Compliance
  - FinTech
  scenario: |-
    A European neobank receives a right-to-erasure request. Customer data has been deleted from core systems, but three years of assistant traces and conversation logs remain in the observability platform, not indexed by customer. The DPO can't confirm deletion within the legal deadline.
  antipattern: |-
    **Keeping everything forever.**

    *Think of it this way:* Moving house but leaving copies of your letters in every room of the old one.
  fails: |-
    **Mechanism:** Cost grows without limit and so does legal exposure.

    - No retention policy for telemetry.
    - Traces aren't indexed by customer identity.
    - Deletion processes ignore observability stores.

    **Root cause:** Retention and deletion were not designed for telemetry.

    **Where it breaks:** Data governance for telemetry.
  diagram:
    bad:
    - Erasure ask · GDPR
    - '!Core deleted · Systems'
    - 3 years traces · Unindexed
    - '!Can''t confirm · Deadline'
    bad_note: Keep all telemetry forever
    good:
    - Raw 30 days · Content
    - +Redacted 90 · Traces
    - +Customer key · Pseudonymous
    - DSR process · Includes telemetry
    good_note: Tiered retention and per-customer deletion
  solution: |-
    1. Tier retention (raw content 30 days, redacted traces 90 days, aggregates for years).
    2. Tag traces with a pseudonymous customer key so per-customer deletion is possible.
    3. Include telemetry stores in the data-subject request process and records of processing.
  works: |-
    **Trade-off to manage:** Short retention limits long-term analysis; keep redacted aggregates for that.

    **How you prove it worked:**

    - Age of the oldest raw-content record; DSR completion time.

    **Same pattern elsewhere:** Telco: an EU operator can't erase a subscriber's chatbot conversations because they sit in an unindexed log archive.
  takeaway: Retention is a design decision, not a default.
  related:
  - data-07
  - gov-09
  code: |
    RETENTION = {"raw_content": 30, "redacted_traces": 90, "aggregates": 365 * 5}   # days

    span.set_attribute("customer.pseudo_key", hmac_sha256(KEY, customer_id))      # deletable per customer

    def fulfil_dsr(customer_id):
        key = hmac_sha256(KEY, customer_id)
        for store in (raw_content_store, trace_store, log_store):
            store.delete(filter={"customer.pseudo_key": key})
        dsr_log.record(customer_id, stores=["raw_content", "traces", "logs"])
