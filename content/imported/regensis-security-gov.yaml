- id: sec-19
  title: Approvers rubber-stamp the agent's persuasive summaries
  tags:
  - Security
  - FinTech
  scenario: |-
    A bank's payments agent prepares high-value transfers for human approval with a summary. Approvers handle 300 a day and rely on the summaries. An attacker's injected invoice text makes the agent summarise a fraudulent payment as "routine renewal for long-standing vendor". The approver clicks approve.
  antipattern: |-
    **Approvers rely on the agent's summary.**

    *Think of it this way:* A guard who checks the visitor's own description of themselves instead of their ID.
  fails: |-
    - Approvals rely on model-written summaries.
    - Volume causes approval fatigue.
    - Key risk facts aren't shown independently.

    **Root cause:** Human-in-the-loop designed without independent evidence.

    **Where it breaks:** Approval UX and process.
  diagram:
    bad:
    - 300/day · Approvals
    - '!Injected text · In invoice'
    - '''Routine'' · Agent summary'
    - '!Approved · Fraud paid'
    bad_note: Approvers rely on the agent's summary
    good:
    - System facts · Payee age
    - +Anomaly flags · Deterministic
    - +Reason needed · For flagged
    - Risk routing · Fewer items
    good_note: Independent system facts and anomaly flags
  solution: |-
    1. Show approvers system facts independently of the summary (payee age, bank detail changes, amount vs history, risk score).
    2. Highlight anomalies deterministically, and require reasons for approving flagged items.
    3. Reduce volume with risk-based routing so humans see fewer, riskier items.
  works: |-
    **Trade-off to manage:** Richer approval screens take longer to build.

    **How you prove it worked:**

    - Approval time per item; approval rate of flagged items.

    **Same pattern elsewhere:** Telco: NOC engineers approve agent-proposed configuration changes based on its summary without seeing the actual diff.
  takeaway: Humans in the loop need evidence, not just a summary.
  related:
  - gov-04
  - aev-16
  code: |
    def approval_card(item):
        facts = {"payee_age_days": payees.age(item.payee_id),
                 "bank_details_changed_recently": vendors.bank_changed_within(item.vendor_id, days=30),
                 "amount_vs_90d_median": item.amount / history.median(item.vendor_id, days=90),
                 "risk_score": risk.score(item)}
        flags = [k for k, v in facts.items() if anomaly(k, v)]       # deterministic highlights
        return {"system_facts": facts, "flags": flags, "agent_summary": item.summary,
                "require_reason": bool(flags)}
