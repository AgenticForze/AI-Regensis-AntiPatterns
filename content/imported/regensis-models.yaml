patterns:
- id: cost-01
  title: No one knows what a resolved card dispute costs
  tags:
  - Cost
  - FinTech
  scenario: |-
    A card issuer's AI assistant costs $140k a month. Finance asks whether it pays for itself. The team can report total tokens but not cost per intent, cost per resolved dispute, or how it compares with an agent-handled contact.
  antipattern: |-
    **Only total spend is known.**

    *Think of it this way:* A restaurant that knows its total food bill but not what each dish costs to make.
  fails: |-
    - Cost isn't attributed to intents or outcomes.
    - No comparison with the human baseline.
    - Optimisation targets are guesses.

    **Root cause:** No unit economics.

    **Where it breaks:** Metering and analytics.
  diagram:
    bad:
    - $140k/month · Total
    - '!Per intent? · Unknown'
    - Vs agents? · Unknown
    - '!Guessing · Priorities'
    bad_note: Only total spend is known
    good:
    - Tag cost · Intent, outcome
    - +Cost/success · Per intent
    - +Human baseline · Compare
    - Prioritise · High volume
    good_note: Cost per successful outcome by intent
  solution: |-
    1. Tag cost per request with intent, outcome and version, and compute cost per successful outcome by intent.
    2. Compare with fully loaded human cost per contact for the same intent.
    3. Prioritise optimisation on high-volume, low-margin intents.
  works: |-
    **Trade-off to manage:** Outcome attribution needs joins to downstream systems.

    **How you prove it worked:**

    - Cost per outcome dashboard reviewed monthly.

    **Same pattern elsewhere:** Telco: a carrier can't tell whether its bot is cheaper than care agents for plan changes versus bill explanations.
  takeaway: Know the cost of a success, per intent.
  related:
  - ops-09
  - obs-05
  code: |
    def cost_per_resolved(intent, month):
        ai = ledger.sum(intent=intent, month=month)                              # tagged per request
        resolved = outcomes.count(intent=intent, outcome="resolved", month=month)
        human_baseline = contact_center.loaded_cost_per_contact(intent)
        return {"ai_cost_per_resolved": ai / resolved, "human_cost_per_contact": human_baseline,
                "volume": outcomes.count(intent=intent, month=month)}

    priorities = sorted(INTENTS, key=lambda i: -(volume(i) * (1 - margin(i))))
  lang: python
- id: cost-02
  title: Router sends hard complaints to the small model
  tags:
  - Cost
  - FinTech
  scenario: |-
    A bank introduces a router that sends "simple" questions to a small model and "complex" ones to a large model, based on message length. Short but serious complaints ("You closed my account and my salary bounced") go to the small model, which handles them poorly. Complaint escalations rise.
  antipattern: |-
    **Route by message length.**

    *Think of it this way:* A hospital triaging patients by how long they talk rather than by symptoms.
  fails: |-
    - Routing criteria don't reflect difficulty or risk.
    - The router wasn't evaluated.
    - High-risk intents can hit the cheap path.

    **Root cause:** Unvalidated routing heuristics.

    **Where it breaks:** Router design.
  diagram:
    bad:
    - Short message · Serious
    - '!Router · By length'
    - Small model · Handles it
    - '!Escalations · Rise'
    bad_note: Route by message length
    good:
    - Intent + risk · Router
    - +High risk · Strong path
    - +Router eval · Misroutes
    - Escalate · If unsure
    good_note: Route by intent and risk, evaluated, with escalation
  solution: |-
    1. Route by intent and risk tier (complaints, vulnerability and disputes always to the stronger path).
    2. Evaluate the router (misroute rate) and each path per intent.
    3. Allow the small model to escalate when uncertain.
  works: |-
    **Trade-off to manage:** Lower savings from routing; safer outcomes.

    **How you prove it worked:**

    - Quality by route and intent; escalations after small-model answers.

    **Same pattern elsewhere:** Telco: a router sends short outage complaints from business customers to a small model that can't check incident data.
  takeaway: Route by risk and intent, not by message length.
  related:
  - agf-20
  - eval-09
  code: |
    ALWAYS_STRONG = {"complaint", "vulnerability", "dispute", "bereavement"}

    def route(msg):
        intent = router.classify(msg)
        if intent.name in ALWAYS_STRONG or intent.risk_tier == "high":
            return STRONG_MODEL
        return SMALL_MODEL

    def small_with_escalation(msg):
        out = SMALL_MODEL.generate(msg, schema=WithConfidence)
        return out if out.confidence >= 0.75 else STRONG_MODEL.generate(msg)
    # eval: router misroute rate + quality per path per intent
  lang: python
- id: cost-03
  title: Voice agent pauses for 3 seconds before every reply
  tags:
  - Cost
  - Latency
  - Telco
  scenario: |-
    A carrier's AI voice agent chains speech recognition, an LLM call, a tool call and text-to-speech, each run to completion before the next starts. Callers hear 3 seconds of silence after every sentence and assume the line dropped.
  antipattern: |-
    **Sequential voice pipeline.**

    *Think of it this way:* A conversation where the other person waits until they've written their whole reply before saying a word.
  fails: |-
    - No end-to-end latency budget.
    - Stages run sequentially without streaming.
    - Tool calls happen on the critical path.

    **Root cause:** Voice pipeline designed without a latency budget.

    **Where it breaks:** Voice architecture.
  diagram:
    bad:
    - ASR · Full
    - '!LLM + tool · Sequential'
    - TTS · After all
    - '!3 s silence · Hang-ups'
    bad_note: Sequential voice pipeline
    good:
    - Budget · 800 ms first
    - +Stream · ASR, LLM, TTS
    - +Prefetch · Account data
    - Filler · While tools run
    good_note: Latency budget, streaming, prefetch
  solution: |-
    1. Set an end-to-end budget (for example under 800 ms to first audio) and per-stage targets.
    2. Stream ASR partials, stream LLM tokens into TTS by sentence, and use a fast model for the first response.
    3. Prefetch likely tool data (account summary) at call start; use filler acknowledgements while slow tools run.
  works: |-
    **Trade-off to manage:** Streaming complicates guardrails; check per sentence.

    **How you prove it worked:**

    - Time to first audio per turn; caller hang-ups during silence.

    **Same pattern elsewhere:** FinTech: a bank's voice bot waits for the full balance lookup and answer before speaking.
  takeaway: In voice, latency is the user experience.
  related:
  - tel-08
  - rag-18
  code: |
    BUDGET_MS = {"asr_final": 200, "llm_first_token": 350, "tts_first_audio": 200}   # < 800 ms to first audio

    async def on_call_start(call):
        call.prefetch = asyncio.create_task(accounts.summary(call.customer_id))      # prefetch

    async def on_utterance(call, partial_text):
        async for sentence in sentences(fast_model.stream(partial_text, context=await call.prefetch)):
            await tts.speak(sentence)                                                 # stream by sentence
        if needs_slow_tool(partial_text):
            await tts.speak("One moment while I check that.")                         # filler while tools run
  lang: python
- id: cost-04
  title: Fifteen-thousand-token system prompt for a balance question
  tags:
  - Cost
  - Latency
  - FinTech
  scenario: |-
    A bank's assistant system prompt has grown to 15k tokens covering every product. Ninety percent of conversations are about cards and balances. Each turn pays for the full prompt, and time to first token is 1.8 seconds.
  antipattern: |-
    **One 15k-token prompt for everything.**

    *Think of it this way:* Reading the whole employee handbook before answering "what time do you close?"
  fails: |-
    - One giant prompt for all intents.
    - Unused instructions cost money and latency.
    - Attention is diluted.

    **Root cause:** Prompt bloat.

    **Where it breaks:** Prompt and context design.
  diagram:
    bad:
    - 15k prompt · All products
    - '!90% cards · Conversations'
    - Pay full · Every turn
    - '!1.8 s TTFT · Slow'
    bad_note: One 15k-token prompt for everything
    good:
    - Core prompt · Compact
    - +By intent · Load extras
    - +Cache core · Prefix
    - Measure · Per intent
    good_note: Compact core plus intent-loaded instructions
  solution: |-
    1. Keep a compact core prompt and load product-specific instructions by intent.
    2. Use prompt caching for the stable core.
    3. Measure tokens and latency per intent.
  works: |-
    **Trade-off to manage:** Intent detection must be reliable.

    **How you prove it worked:**

    - Prompt tokens per turn by intent.

    **Same pattern elsewhere:** Telco: a care bot includes instructions for every device brand in every prompt.
  takeaway: Load instructions for the job at hand.
  related:
  - ctx-05
  - ctx-06
  code: |
    CORE = load_prompt("care.core@9")                       # ~1.5k tokens, cached
    MODULES = {"balance": "", "roaming": load_prompt("care.roaming@4"), "device": load_prompt("care.device@6")}

    def build(intent, msg):
        return {"system": [{"type": "text", "text": CORE, "cache_control": {"type": "ephemeral"}},
                           {"type": "text", "text": MODULES.get(intent, "")}],
                "messages": [{"role": "user", "content": msg}]}
    metrics.observe("input_tokens", resp.usage.input_tokens, intent=intent)
  lang: python
- id: cost-05
  title: Prompt caching enabled, but the cache expires between turns
  tags:
  - Cost
  - Telco
  scenario: |-
    A carrier enables prompt caching for its care bot. Hit rates are low because the provider's default cache lifetime is a few minutes, and customers often take longer to reply. The team assumed caching would work for whole conversations.
  antipattern: |-
    **Assume the cache lasts the conversation.**

    *Think of it this way:* A coffee machine that switches off between cups.
  fails: |-
    - Cache lifetime wasn't understood.
    - Traffic patterns weren't analysed.
    - Hit rate wasn't monitored.

    **Root cause:** Caching enabled without understanding its mechanics.

    **Where it breaks:** Caching configuration.
  diagram:
    bad:
    - Caching on · Default
    - '!Short TTL · Minutes'
    - Slow replies · Customers
    - '!Low hits · Savings lost'
    bad_note: Assume the cache lasts the conversation
    good:
    - TTL options · Checked
    - +Shared prefix · Stays warm
    - +Hit rate · Monitored
    - Right TTL · By pattern
    good_note: Choose lifetime by traffic, shared warm prefix
  solution: |-
    1. Check the provider's cache lifetime options and choose them by traffic pattern (longer lifetimes where offered and cost-effective).
    2. Keep the shared prefix identical across all customers so it stays warm from overall traffic.
    3. Monitor cached-token share.
  works: |-
    **Trade-off to manage:** Longer cache lifetimes may cost more to write.

    **How you prove it worked:**

    - Cache hit rate by time of day and conversation gap.

    **Same pattern elsewhere:** FinTech: a bank's batch jobs run hours apart and never benefit from prompt caching.
  takeaway: Know how your cache expires before you count the savings.
  related:
  - ctx-06
  - ops-10
  code: |
    SHARED_PREFIX = CORE_PROMPT + TOOL_DEFINITIONS          # byte-identical for every customer

    def request(customer_ctx, history, msg):
        return {"system": [{"type": "text", "text": SHARED_PREFIX,
                            "cache_control": {"type": "ephemeral", "ttl": CACHE_TTL_BY_TRAFFIC}}],   # lifetime chosen by traffic
                "messages": history + [{"role": "user", "content": f"{customer_ctx}\n{msg}"}]}

    metrics.gauge("cached_token_share", u.cache_read_input_tokens / (u.input_tokens + u.cache_read_input_tokens))
  lang: python
- id: cost-06
  title: Semantic cache confuses cancel my card with cancel my card payment
  tags:
  - Cost
  - FinTech
  scenario: |-
    A bank's semantic cache uses a similarity threshold of 0.88. "How do I cancel my card?" and "How do I cancel a card payment?" exceed it, so customers who want to stop a payment receive instructions for closing their card.
  antipattern: |-
    **Similarity-only cache hits.**

    *Think of it this way:* A receptionist who answers the question they think you asked because it sounded similar.
  fails: |-
    - Similar wording, different intents.
    - Threshold chosen without evaluation.
    - Cached answers aren't checked against the intent.

    **Root cause:** Over-aggressive semantic caching.

    **Where it breaks:** Cache design.
  diagram:
    bad:
    - '''Cancel card?'' · Cached'
    - '!''Stop payment?'' · Asked'
    - 0.88 similar · Hit
    - '!Wrong steps · Card closed?'
    bad_note: Similarity-only cache hits
    good:
    - Intent key · Plus text
    - +Tuned · Near-miss set
    - +FAQ only · Stable intents
    - Feedback · On hits
    good_note: Intent in the key, tuned threshold, FAQ-only
  solution: |-
    1. Tune thresholds on a labelled set of near-miss pairs, and add intent classification to the cache key.
    2. Cache only for high-volume, stable FAQ intents.
    3. Monitor negative feedback on cache hits.
  works: |-
    **Trade-off to manage:** Lower hit rates.

    **How you prove it worked:**

    - Feedback and rephrase rate on cached answers.

    **Same pattern elsewhere:** Telco: "How do I block a number?" gets the cached answer for "How do I unblock my number?"
  takeaway: Similar isn't the same. Key the cache by intent.
  related:
  - ctx-17
  - ops-10
  code: |
    CACHEABLE_INTENTS = {"store_hours", "how_to_activate_card", "fee_schedule_general"}

    def cache_get(q):
        intent = classify(q)
        if intent not in CACHEABLE_INTENTS:
            return None
        return semantic_cache.get(q, namespace=intent, min_sim=THRESHOLD[intent])   # intent in the key

    # thresholds tuned on near-miss pairs: ("cancel my card", "cancel my card payment") must NOT match
    # monitor: thumbs-down rate on cache hits vs misses
  lang: python
- id: cost-07
  title: One conversation costs $40
  tags:
  - Cost
  - Telco
  scenario: |-
    A carrier's agent costs about $0.08 per conversation on average. A few conversations with long troubleshooting loops and repeated tool calls cost over $40. With no per-conversation cap, outliers make up 20% of spend.
  antipattern: |-
    **No per-conversation cost cap.**

    *Think of it this way:* An all-you-can-eat buffet with no time limit.
  fails: |-
    - No per-conversation budget.
    - Outliers aren't monitored.
    - Long sessions grow context cost quadratically.

    **Root cause:** No cost caps per unit of work.

    **Where it breaks:** Runtime limits.
  diagram:
    bad:
    - Avg $0.08 · Per chat
    - '!Outliers · $40+'
    - 20% spend · From few
    - '!Unseen · No cap'
    bad_note: No per-conversation cost cap
    good:
    - Budget · Per chat
    - +Handoff · When exceeded
    - +Compact · Long sessions
    - p99 alert · Weekly review
    good_note: Budgets, compaction, outlier alerts
  solution: |-
    1. Set per-conversation and per-task budgets (tokens and dollars), with graceful handoff to a human when exceeded.
    2. Compact context in long sessions.
    3. Alert on cost outliers and review them weekly.
  works: |-
    **Trade-off to manage:** Some long, legitimate sessions get handed off.

    **How you prove it worked:**

    - Cost distribution per conversation (p99).

    **Same pattern elsewhere:** FinTech: a few research-agent runs on complex companies cost hundreds of dollars each.
  takeaway: Budget each conversation, not just the month.
  related:
  - agf-02
  - obs-15
  - mas-09
  code: |
    class ConversationBudget:
        def __init__(self, usd=0.50, tokens=150_000): self.usd, self.tokens = usd, tokens
        def charge(self, resp):
            self.usd -= price(resp); self.tokens -= resp.usage.total_tokens
            return self.usd > 0 and self.tokens > 0

    if not budget.charge(resp):
        return handoff_to_human(summary=compact(conversation))
    if conversation.tokens > 40_000:
        conversation = compact(conversation)
  lang: python
- id: cost-08
  title: Replies three times longer than customers need
  tags:
  - Cost
  - FinTech
  scenario: |-
    A bank's assistant averages 450 output tokens per reply, with long introductions and repeated disclaimers. Customers on mobile scroll past most of it. Output tokens cost several times more than input tokens.
  antipattern: |-
    **No length guidance.**

    *Think of it this way:* Answering "what's the time?" with a history of clocks.
  fails: |-
    - No length guidance or limits.
    - Disclaimers repeated every turn.
    - Output cost isn't monitored.

    **Root cause:** Unmanaged verbosity.

    **Where it breaks:** Prompt and UX.
  diagram:
    bad:
    - 450 tokens · Avg reply
    - '!Intros · Repeated'
    - Disclaimers · Every turn
    - '!Cost + scroll · Wasted'
    bad_note: No length guidance
    good:
    - Length guide · Per intent
    - +Max tokens · Per channel
    - +Disclaimer · Once in UI
    - Measure · Readability
    good_note: Length by intent and channel, disclaimers in UI
  solution: |-
    1. Set length guidance per intent and channel, and appropriate max output tokens.
    2. Show required disclaimers once in the UI, not in every reply.
    3. Measure output tokens and readability.
  works: |-
    **Trade-off to manage:** Too short can drop needed information; evaluate.

    **How you prove it worked:**

    - Output tokens per intent; scroll and engagement data.

    **Same pattern elsewhere:** Telco: an SMS channel bot sends multi-part messages that cost per segment.
  takeaway: Shorter answers are cheaper and usually better.
  related:
  - cost-04
  code: |
    LENGTH = {("balance", "chat"): 40, ("plan_compare", "chat"): 150, ("balance", "voice"): 25}   # words

    def generate(intent, channel, msg):
        words = LENGTH.get((intent, channel), 100)
        return llm.generate(msg, max_tokens=int(words * 1.6),
                            system=f"Answer in at most {words} words. Disclaimers are shown in the UI; don't repeat them.")
    metrics.observe("output_tokens", resp.usage.output_tokens, intent=intent)
  lang: python
- id: cost-09
  title: Nightly ticket summaries run on the real-time API
  tags:
  - Cost
  - Telco
  scenario: |-
    A carrier summarises 400,000 closed tickets each night for analytics, using the same real-time API as its chatbot, at full price. The job also competes with chatbot traffic for rate limits during early-morning peaks.
  antipattern: |-
    **Offline jobs on the real-time API.**

    *Think of it this way:* Sending bulk mail by courier.
  fails: |-
    - Non-urgent work uses the real-time path.
    - Batch discounts aren't used.
    - Shared rate limits create contention.

    **Root cause:** No distinction between real-time and batch workloads.

    **Where it breaks:** Workload architecture.
  diagram:
    bad:
    - 400k tickets · Nightly
    - '!Real-time API · Full price'
    - Rate limits · Contention
    - '!Chatbot · Slowed'
    bad_note: Offline jobs on the real-time API
    good:
    - Batch API · Discounted
    - +Separate quota · Batch keys
    - +Off-peak · Scheduled
    - Cheaper · Same output
    good_note: Batch API, separate quotas, off-peak scheduling
  solution: |-
    1. Use the provider's batch API for offline jobs (typically discounted, with higher throughput).
    2. Separate quotas or keys for batch and interactive traffic.
    3. Schedule jobs away from interactive peaks.
  works: |-
    **Trade-off to manage:** Batch results arrive later (hours), which is fine for analytics.

    **How you prove it worked:**

    - Share of offline tokens on real-time endpoints.

    **Same pattern elsewhere:** FinTech: a bank classifies a month of transactions through the interactive API.
  takeaway: If it can wait, batch it.
  related:
  - ops-17
  code: |
    def nightly_summaries():
        reqs = [{"custom_id": t.id, "params": {"model": MODEL, "max_tokens": 300,
                 "messages": [{"role": "user", "content": SUMMARY_PROMPT + t.text}]}}
                for t in tickets.closed_since(hours=24)]
        batch = batch_client.create(requests=reqs)           # discounted offline API, separate key/quota
        scheduler.poll(batch.id, on_done=store_summaries)

    # cron: 0 2 * * *   (away from interactive peaks)
  lang: python
- id: cost-10
  title: Extended reasoning turned on for every request
  tags:
  - Cost
  - Latency
  - FinTech
  scenario: |-
    A bank switches its whole assistant to a reasoning model with a large thinking budget after it performed well on complex mortgage questions. Simple questions ("What's my sort code?") now take 9 seconds and cost 10 times more, with no quality gain.
  antipattern: |-
    **Maximum reasoning for every request.**

    *Think of it this way:* Calling a committee meeting to decide what to have for lunch.
  fails: |-
    - Reasoning effort applied uniformly.
    - Thinking tokens are billed and add latency.
    - Simple tasks gain nothing.

    **Root cause:** No effort routing.

    **Where it breaks:** Model and parameter selection.
  diagram:
    bad:
    - Reasoning · All requests
    - '!''Sort code?'' · 9 seconds'
    - 10x cost · Thinking
    - '!No gain · Simple asks'
    bad_note: Maximum reasoning for every request
    good:
    - Route · By complexity
    - +Budget · Per intent
    - +Evals · Prove gain
    - Escalate · If unsure
    good_note: Reasoning budgets by intent, validated by evals
  solution: |-
    1. Route by complexity; enable extended reasoning (or a higher effort setting) only for intents that benefit in evals.
    2. Set thinking budgets per intent.
    3. Measure quality, latency and cost per intent.
  works: |-
    **Trade-off to manage:** Routing errors may under-think hard questions; allow escalation.

    **How you prove it worked:**

    - Thinking tokens per intent.

    **Same pattern elsewhere:** Telco: a care bot uses deep reasoning to answer "what's my balance?"
  takeaway: Pay for thinking where thinking pays.
  related:
  - agf-20
  - cost-02
  code: |
    REASONING = {"complaint_resolution": "high", "plan_comparison": "medium"}   # chosen from evals

    def call(intent, msg):
        effort = REASONING.get(intent)
        kwargs = {"thinking_budget": BUDGET[effort]} if effort else {}         # off by default
        return llm.generate(msg, **kwargs)

    report = per_intent(metrics=["quality", "p95_latency", "cost"], compare=["reasoning_on", "reasoning_off"])
  lang: python
- id: cost-11
  title: Customers stare at a spinner for 8 seconds
  tags:
  - Cost
  - Latency
  - Telco
  scenario: |-
    A carrier's web chat waits for the full reply before showing anything. Complex bill explanations take 8 seconds. Many customers send a second message or leave before the answer appears.
  antipattern: |-
    **Wait for the whole reply.**

    *Think of it this way:* A waiter who brings nothing until the whole meal is ready, not even water.
  fails: |-
    - No streaming.
    - No progress indicators for tool calls.
    - Perceived latency equals total latency.

    **Root cause:** Non-streaming UX.

    **Where it breaks:** Front end and API.
  diagram:
    bad:
    - Full reply · Then show
    - '!8 seconds · Spinner'
    - Second msg · Or leave
    - '!Abandon · Rate up'
    bad_note: Wait for the whole reply
    good:
    - Stream · Tokens
    - +Tool status · 'Checking bill'
    - +Chunk checks · Guardrails
    - Engaged · Users
    good_note: Stream tokens and tool progress
  solution: |-
    1. Stream tokens to the UI.
    2. Show step status for tool calls ("Checking your latest bill...").
    3. Run fast output guardrails per chunk or hold back only high-risk segments.
  works: |-
    **Trade-off to manage:** Streaming makes full-response guardrails harder.

    **How you prove it worked:**

    - Abandonment and duplicate messages during waits.

    **Same pattern elsewhere:** FinTech: a bank's assistant doesn't stream statements summaries, and users refresh the page.
  takeaway: Show progress. Silence feels slower than it is.
  related:
  - tel-08
  - cost-03
  code: |
    async def chat_stream(msg, ws):
        async for event in agent.stream(msg):
            if event.type == "tool_start":
                await ws.send({"status": STATUS_TEXT[event.tool]})       # "Checking your latest bill..."
            elif event.type == "token":
                buf.append(event.text)
                if sentence_complete(buf):
                    chunk = "".join(buf); buf.clear()
                    await ws.send({"text": chunk if fast_guard.ok(chunk) else "[removed]"})   # per-chunk guard
  lang: python
- id: cost-12
  title: Independent lookups run one after another
  tags:
  - Cost
  - Latency
  - FinTech
  scenario: |-
    A bank's onboarding agent calls ID verification, sanctions screening, address validation and device-risk scoring one by one, though none depends on the others. Each takes about 1.5 seconds, so the step takes 6 seconds.
  antipattern: |-
    **Independent calls in sequence.**

    *Think of it this way:* Cooking four dishes one at a time on a four-burner stove.
  fails: |-
    - Independent calls are serialised.
    - The agent loop makes one tool call per turn.
    - No dependency analysis.

    **Root cause:** Missed parallelism.

    **Where it breaks:** Orchestration.
  diagram:
    bad:
    - ID check · 1.5 s
    - '!Sanctions · Then 1.5 s'
    - Address, device · Then 3 s
    - '!6 seconds · Total'
    bad_note: Independent calls in sequence
    good:
    - Fan-out · All 4
    - +Parallel · 1.5 s total
    - +Timeouts · Per call
    - Partial · Handled
    good_note: Parallel fan-out with timeouts
  solution: |-
    1. Run independent tool calls in parallel (parallel tool calling or workflow fan-out).
    2. Model dependencies explicitly in the workflow.
    3. Set a timeout per call and handle partial results.
  works: |-
    **Trade-off to manage:** More concurrent load on downstream systems.

    **How you prove it worked:**

    - Critical-path latency vs sum of tool latencies.

    **Same pattern elsewhere:** Telco: an order agent checks credit, serviceability and stock sequentially.
  takeaway: Parallelise what doesn't depend on each other.
  related:
  - rag-18
  code: |
    async def context_for(account_id):
        results = await asyncio.gather(
            with_timeout(billing.latest(account_id), 2),
            with_timeout(network.outages_near(account_id), 2),
            with_timeout(orders.open(account_id), 2),
            return_exceptions=True)                                  # independent → parallel
        bill, outages, orders_ = [r if not isinstance(r, Exception) else None for r in results]
        return {"bill": bill, "outages": outages, "orders": orders_, "partial": None in (bill, outages, orders_)}
