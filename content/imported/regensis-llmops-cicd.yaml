  - Telco
  scenario: |-
    A carrier's agent gains the ability to schedule technician visits. A bug double-books technicians. The only option is to roll back the whole release, removing three other improvements, because the capability isn't behind a flag.
  antipattern: |-
    **Capabilities coupled to the release.**

    *Think of it this way:* A house where the only way to turn off one lamp is the main fuse.
  fails: |-
    - Capabilities ship coupled to the release.
    - No independent switch per tool or intent.
    - Rollback is all or nothing.

    **Root cause:** No feature flags for agent capabilities.

    **Where it breaks:** Release design.
  diagram:
    bad:
    - New tool · Scheduling
    - '!Bug · Double-books'
    - No flag · Coupled
    - '!Full rollback · 3 fixes lost'
    bad_note: Capabilities coupled to the release
    good:
    - Flag · Per tool
    - +Kill switch · On-call
    - +Targeting · Segments
    - Remove flags · After rollout
    good_note: Flag per tool and intent, kill switches
  solution: |-
    1. Put new tools, intents and prompts behind feature flags, with per-segment targeting.
    2. Build kill switches per tool and intent, usable by on-call.
    3. Remove flags after full rollout to avoid flag debt.
  works: |-
    **Trade-off to manage:** Flag management overhead.

    **How you prove it worked:**

    - Share of new capabilities released behind flags.

    **Same pattern elsewhere:** FinTech: a bank can't disable its new payment-scheduling tool without removing the whole assistant release.
