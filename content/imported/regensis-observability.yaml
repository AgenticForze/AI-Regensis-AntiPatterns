- id: obs-18
  title: Online judge on 100% of traffic costs more than the product
  tags:
  - Reliability
  - Cost
  - Latency
  - FinTech
  scenario: |-
    A wealth platform runs a large-model judge inline on every assistant answer to check faithfulness. It doubles latency and costs more than the assistant itself. Finance asks for the assistant to be shut down.
  antipattern: |-
    **Running an expensive judge on every request.**

    *Think of it this way:* Hiring a second chef to taste every dish before it leaves the kitchen.
  fails: |-
    **Mechanism:** Online evaluation doubles cost and latency if done inline.

    - Expensive evaluation on every request.
    - Inline evaluation adds user-visible latency.
    - Most answers are low risk.

    **Root cause:** No sampling strategy for online evaluation.

    **Where it breaks:** Online eval design.
  diagram:
    bad:
    - Every answer · Judged inline
    - '!2x latency · User sees'
    - Cost > product · Judge
    - '!Shutdown ask · From finance'
    bad_note: Inline judge on every request
