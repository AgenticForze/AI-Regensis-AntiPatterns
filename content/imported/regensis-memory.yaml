- id: mem-01
  title: Customer moves from chat to the IVR and repeats everything
  tags:
  - Quality
  - Cost
  - Latency
  - Telco
  scenario: |-
    A customer spends ten minutes in a carrier's chat diagnosing slow home internet, then calls because the chat can't book a technician. The voice agent has no access to the chat session and asks the customer to repeat the problem, their address and the steps already tried.
  antipattern: |-
    **Memory stays inside one channel.**

    *Think of it this way:* A hospital where the A&E notes don't follow you to the ward.
  fails: |-
    - Session memory is per channel.
    - No shared case or interaction record.
    - The handoff to voice carries no context.

    **Root cause:** Working memory isn't persisted beyond the channel.

    **Where it breaks:** Session and case management.
  diagram:
    bad:
    - Chat session · 10 minutes
    - '!Calls IVR · To book tech'
    - No context · Voice agent
    - '!Repeats all · Frustrated'
    bad_note: Memory stays inside one channel
    good:
    - Case record · TMF621
    - +Summary · Structured
    - +Load · Any channel
    - Acknowledge · 'I can see...'
    good_note: Structured interaction record, loaded on any channel
  solution: |-
    1. Write a structured interaction summary (problem, diagnostics run, results, next step) to the customer's case (TMF621 trouble ticket or the CRM interaction record).
    2. Load recent open cases into the next session on any channel.
    3. Tell the customer the agent can see their previous chat.
