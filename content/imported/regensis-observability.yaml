- id: tel-05
  title: The 1% trace sample contains almost no failed disputes
  tags:
  - Reliability
  - Cost
  - FinTech
  scenario: |-
    To control cost, a card issuer samples 1% of traces at the start of each request. The dispute assistant fails on about 0.5% of requests. In a week of traffic, the trace store holds 3 failed traces, too few to diagnose a new failure pattern.
  antipattern: |-
    **Random sampling decided at the start of the request.**

    *Think of it this way:* Keeping one in a hundred security-camera clips at random, and then finding the robbery wasn't recorded.
  fails: |-
    **Mechanism:** Failures and slow requests are rare, so random sampling throws them away.

    - Head sampling decides before the outcome is known.
    - Failures are rare, so random samples rarely contain them.
    - The interesting traces are thrown away.

    **Root cause:** Sampling strategy ignores outcomes.

    **Where it breaks:** Collector configuration.
  diagram:
    bad:
    - 1% sampled · At start
    - '!0.5% fail · Rare'
    - 3 failures · Kept per week
    - '!Can''t diagnose · Too few'
    bad_note: Random 1% head sampling
    good:
    - Tail sampling · At collector
    - +Keep 100% · Errors, slow
    - +Plus feedback · And guardrails
    - 1% baseline · Random
    good_note: Tail sampling keeps every interesting trace
  solution: |-
    1. Use tail-based sampling at the collector, keeping 100% of errors, slow requests, negative feedback, guardrail hits and escalations.
    2. Keep a small random baseline (1%) for unbiased statistics.
    3. Raise sampling temporarily for new releases.
  works: |-
    **Trade-off to manage:** Tail sampling needs collectors that buffer whole traces, which costs memory.

    **How you prove it worked:**

    - Count of retained failure traces per day.

    **Same pattern elsewhere:** Telco: random sampling of the care bot's traces misses almost all port-in failures.
  takeaway: Sample after you know whether the request was interesting.
  related:
  - obs-18
