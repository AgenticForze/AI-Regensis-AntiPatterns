source: regensis
section: agents
patterns:
- id: agf-01
  title: Port-in processing built as a free-roaming agent
  tags:
  - Reliability
  - Telco
  scenario: |-
    A carrier builds a ReAct agent to process mobile number port-in requests: validate the account number and PIN from the losing carrier, check the number is portable, submit the port request, schedule activation and notify the customer. The steps never change, yet the agent takes 9-14 LLM calls per request, sometimes skips the portability check, and 1 in 10 ports fails or is delayed.
  antipattern: |-
    **A fully autonomous ReAct loop for a fixed process.**

    *Think of it this way:* Hiring a creative chef to run a vending machine. The job is the same every time, and creativity only adds ways to get it wrong.
  fails: |-
    **Mechanism:** Each LLM decision adds latency, cost, and a chance of error. Errors compound: 95% reliability per step over 10 steps gives about 60% success.

    - Every step is an LLM decision, so each one adds latency, cost and a chance of error.
    - Errors compound; 95% reliability per step over 10 steps gives about 60% end-to-end success.
    - The model sometimes reorders or skips steps that the process requires.

    **Root cause:** An autonomous loop was used for a fixed, well-understood business process.

    **Where it breaks:** Orchestration design.
  diagram:
    bad:
    - Port-in request · Fixed steps
    - '!ReAct loop · 9-14 LLM calls'
    - Skips a check · Portability
    - '!1 in 10 fails · Delayed ports'
    bad_note: ReAct loop for a fixed port-in process
    good:
    - Workflow · State machine
    - +Coded checks · Each step
    - +LLM step · Parse rejection
    - Exceptions · To agent/human
    good_note: Deterministic workflow, LLM only for judgement
  solution: |-
    1. Model the port-in as a deterministic workflow (state machine or durable workflow engine) with explicit steps and retries.
    2. Use the LLM only where judgement is needed, such as interpreting a free-text rejection reason from the losing carrier or drafting the customer message.
    3. Validate each step's output in code before moving on.
  works: |-
    **Trade-off to manage:** Workflows are less flexible for unexpected cases; add an "exception" branch that hands off to an agent or a human.

    **How you prove it worked:**

    - Step-completion and skip rates per run, and port success rate by version.

    **Same pattern elsewhere:** FinTech: account-opening checks (ID verification, sanctions screening, credit pull, account creation) run as an agent and occasionally skip sanctions screening.
  takeaway: Autonomy is a cost, so spend it only where the path is unknown.
  related:
  - agf-07
  - agf-13
  - mas-08
  code: |
    port_in = StateMachine(steps=[
        Step("validate_request", validate_port_request),          # deterministic
        Step("submit_to_npac", submit_port, retries=3),
        Step("await_losing_carrier", wait_for_response, timeout="48h"),
        Step("interpret_rejection", llm_interpret_rejection, when=lambda s: s.rejected),  # LLM judgement
        Step("draft_customer_msg", llm_draft_message),
        Step("activate", activate_number),
    ])
    for step in port_in:
        out = step.run(state)
        step.schema.model_validate(out)                            # validate before moving on
  lang: python
- id: agf-02
  title: Reconciliation agent loops all night on one break
  tags:
  - Reliability
  - Cost
  - FinTech
  scenario: |-
    A payments company runs a reconciliation agent that investigates unmatched transactions between the ledger and bank statements. One break involves a transaction split across two settlement files. The agent keeps re-querying the same files with slightly different filters for 6 hours, making 2,400 LLM calls and costing $310, then produces nothing.
  antipattern: |-
    **`while not done:` with no ceiling.**

    *Think of it this way:* A dishwasher with no timer that keeps rinsing the same plate because a spot won't come off.
  fails: |-
    **Mechanism:** Models can repeat the same failing tool call or never decide they are done.

    - The loop has no ceiling on steps, tokens, time or money.
    - The model doesn't recognise that it is repeating itself.
    - No partial result or escalation path exists.

    **Root cause:** An unbounded agent loop with no circuit breaker.

    **Where it breaks:** Agent runtime.
  diagram:
    bad:
    - Recon break · Split settlement
    - '!Agent loop · No limit'
    - Same queries · 2,400 calls
    - '!$310 spent · Nothing found'
    bad_note: While not done, with no ceiling
    good:
    - Caps · Steps, time, $
    - +Loop detector · Same tool+args
    - +Partial result · What was tried
    - Human queue · Escalated
    good_note: Step, time and money caps plus loop detection
  solution: |-
    1. Cap steps, tokens, wall-clock time and dollars per run, with per-tenant budgets.
    2. Detect loops (same tool and arguments, or no new information after N steps) and stop.
    3. On a cap, return a partial result with what was tried, and route to a human queue.
  works: |-
    **Trade-off to manage:** Caps can stop legitimately long investigations; set them per task type and allow a human to extend.

    **How you prove it worked:**

    - Alerts on steps per run, run duration and cost outliers.

    **Same pattern elsewhere:** Telco: a network-diagnosis agent keeps re-running the same ping and traceroute on a dead site overnight.
  takeaway: Every loop needs a circuit breaker.
  related:
  - obs-15
  - cost-07
  code: |
    for step in range(MAX_STEPS):                       # hard ceiling
        if budget.spent_usd > MAX_USD or clock() > deadline:
            return escalate(state, reason="budget")
        call = agent.next_action(state)
        sig = (call.tool, canonical_json(call.args))
        if seen[sig] >= 2:                              # loop detector
            return escalate(state, reason="repeating")
        seen[sig] += 1
        state = state.with_result(run_tool(call))
    return escalate(state, reason="max_steps")
  lang: python
- id: agf-03
  title: Care agent exposed to 60 BSS APIs
  tags:
  - Reliability
  - Cost
  - Telco
  scenario: |-
    A carrier gives its care agent every BSS API as a tool: 60 tools across CRM, billing, ordering, inventory, payments and loyalty. Tool definitions take 22k tokens per call. The agent picks the wrong tool 25% of the time, for example calling get_invoice instead of get_bill_explanation, or update_product instead of add_addon.
  antipattern: |-
    **Exposing every API as a tool to a single agent.**

    *Think of it this way:* Giving a new hire a 60-button remote control on day one and asking them to change the channel.
  fails: |-
    **Mechanism:** Tool definitions consume context, and similar tools confuse selection.

    - Similar tools confuse selection.
    - Tool definitions consume context and money on every call.
    - Accuracy degrades as the toolbox grows.

    **Root cause:** APIs were exposed one-to-one as tools, with no grouping or routing.

    **Where it breaks:** Tool design and agent architecture.
  diagram:
    bad:
    - 60 tools · All BSS APIs
    - '!22k tokens · Per call'
    - Similar names · Confusion
    - '!25% wrong · Tool picked'
    bad_note: Every BSS API as a tool
    good:
    - Intent router · Billing, orders
    - +Domain tools · 10-20 visible
    - +Task-shaped · Wrap APIs
    - Tool search · Long tail
    good_note: Route by intent, load a small task-shaped toolset
  solution: |-
    1. Route by intent first (billing, orders, tech support), then load only that domain's tools.
    2. Design fewer task-shaped tools that wrap several APIs, instead of one tool per endpoint.
    3. Keep about 10-20 tools visible at a time; use tool search for the long tail.
  works: |-
    **Trade-off to manage:** Routing adds a classification step and can misroute; keep a fallback that loads more tools.

    **How you prove it worked:**

    - Tool-selection accuracy on a labelled eval set; tool-call error rates.

    **Same pattern elsewhere:** FinTech: a banking agent with 45 core-banking tools confuses transfer_internal with transfer_external.
  takeaway: Tool choice degrades as the toolbox grows.
  related:
  - tool-03
  - ctx-11
  code: |
    DOMAIN_TOOLS = {
        "billing":  [explain_bill, apply_payment_arrangement, get_balance],
        "orders":   [track_order, change_delivery],
        "tech":     [run_line_test, check_outage, reset_router],
    }

    def tools_for(msg):
        intent = router.classify(msg)                              # route first
        tools = DOMAIN_TOOLS[intent.domain]
        if len(tools) < 10:
            tools += tool_search(msg, k=5)                         # long tail on demand
        return tools[:20]
  lang: python
- id: agf-04
  title: Payment tool amount in cents read as dollars
  tags:
  - Reliability
  - FinTech
  - Critical
  scenario: |-
    A small-business banking agent can schedule supplier payments. The tool parameter is amount: integer, documented only as "payment amount". The API expects minor units (cents). A user asks to pay an invoice of $4,500. The agent passes 4500, and $45.00 is sent. Another time it passes 450000 for $45, sending $4,500, which is only caught by an approval limit.
  antipattern: |-
    **One-line tool descriptions and free-text parameters.**

    *Think of it this way:* A form field labelled "amount" with no currency or units. Half the people write dollars, half write cents.
  fails: |-
    **Mechanism:** The tool description is the model's only documentation. Ambiguity becomes wrong calls.

    - The tool description doesn't state units, format or limits.
    - The model guesses the convention, inconsistently.
    - The API accepts any positive integer.

    **Root cause:** Tool schemas were written like internal API signatures, not like documentation for a new user.

    **Where it breaks:** Tool definition and validation.
  diagram:
    bad:
    - Pay $4,500 · Invoice
    - '!amount: int · Units unclear'
    - Sends 4500 · Read as cents
    - '!$45.00 paid · Supplier short'
    bad_note: '''amount: integer'', no units'
    good:
    - Decimal + ISO · Major units
    - +Doc for humans · Examples, limits
    - +Check invoice · Inside tool
    - Confirm · Before execute
    good_note: Typed units, in-tool validation, confirmation
  solution: |-
    1. Use explicit, typed parameters (amount as a decimal string plus an ISO 4217 currency code) and convert to minor units inside the tool.
    2. Write the description as for a new hire (when to use it, examples, units, limits, what not to do).
    3. Validate inside the tool (amount equals the invoice amount on file, within limits) and return an actionable error.
    4. Echo back a human-readable confirmation for approval before execution.
  works: |-
    **Trade-off to manage:** Stricter schemas reject some legitimate free-form requests; respond with a clarifying question instead.

    **How you prove it worked:**

    - Mismatch alerts between payment amount and invoice amount; distribution of amounts per payee.

    **Same pattern elsewhere:** Telco: a data-add-on tool takes size as an integer and the agent mixes MB and GB, selling 1 MB packs instead of 1 GB.
  takeaway: Tool descriptions are prompts, so engineer them.
  related:
  - tool-02
  - agf-11
  code: |
    class SchedulePayment(BaseModel):
        """Schedule a supplier payment. Amount is in MAJOR units (e.g. "4500.00" = $4,500).
        Use only after the user confirmed payee and amount. Never infer the amount."""
        payee_id: str
        amount: Decimal = Field(gt=0, max_digits=12, decimal_places=2)
        currency: Literal["USD", "EUR", "GBP"]
        invoice_id: str          # tool checks amount == invoice.amount_due
  lang: python
- id: agf-05
  title: Care agent issues a $400 goodwill credit on its own
  tags:
  - Reliability
  - Telco
  scenario: |-
    A carrier's care agent has a tool to apply bill credits. A frustrated customer claims three outages and demands compensation. The agent, aiming to be helpful, applies a $400 credit. Similar patterns spread on a forum, and goodwill credits triple in a month.
  antipattern: |-
    **Write and irreversible tools called autonomously.**

    *Think of it this way:* Giving a new receptionist the company credit card with no spending limit and asking them to keep customers happy.
  fails: |-
    **Mechanism:** The model can be wrong or manipulated, and some actions can't be undone.

    - A write tool with financial impact runs autonomously.
    - The limit is in the prompt ("don't give more than $50"), which the model can be talked out of.
    - No check against actual outage records.

    **Root cause:** Business limits and approvals are enforced by instructions instead of by the tool and a human gate.

    **Where it breaks:** Tool layer and approval workflow.
  diagram:
    bad:
    - Angry customer · Claims outages
    - '!Credit tool · No hard limit'
    - $400 credit · Applied
    - '!Credits x3 · Pattern spreads'
    bad_note: Autonomous credit tool, limit in prompt
    good:
    - Outage check · OSS records
    - +Tool limit · Small auto cap
    - +Approval · Above cap
    - Credit audit · Per reason
    good_note: Limits in the tool, outage check, approval
  solution: |-
    1. Classify tools by risk; credits above a small limit require human approval with the conversation and evidence attached.
    2. Enforce the limit inside the tool and the billing system, not in the prompt.
    3. Check outage claims against network incident records (OSS) before offering anything.
  works: |-
    **Trade-off to manage:** Approvals slow resolution; keep small credits automatic and fast.

    **How you prove it worked:**

    - Credits per agent version, per customer and per reason; spike alerts.

    **Same pattern elsewhere:** FinTech: a bank agent reverses a $300 overdraft fee for every customer who says they are a student.
  takeaway: Put the guardrail in the tool, not the prompt.
  related:
  - gov-02
  - prm-16
  - sec-05
  code: |
    @tool(risk="write")
    def issue_goodwill_credit(account_id: str, amount: Decimal, reason: str, ctx: Session):
        outage = oss.incidents.affecting(account_id, window=days(7))   # verify the claim first
        if reason == "outage" and not outage:
            return {"status": "REFUSED", "why": "no outage recorded for this service"}
        if amount > AUTO_CREDIT_LIMIT:                                  # enforced in the tool, not the prompt
            return approvals.request(account_id, amount, evidence=[ctx.transcript_id, outage.id if outage else None])
        return billing.credit(account_id, amount, idempotency_key=f"gw:{ctx.case_id}")
  lang: python
- id: agf-06
  title: Retry after timeout sends a wire twice
  tags:
  - Reliability
  - Latency
  - FinTech
  - Critical
  scenario: |-
    A treasury agent initiates a $250,000 vendor wire. The payment gateway processes it but the response times out. The framework's automatic retry calls initiate_wire again, and a second wire is sent. Recovering it takes nine days and a recall request through the correspondent bank.
  antipattern: |-
    **Retrying side-effecting calls with no idempotency key.**

    *Think of it this way:* Pressing the lift button again because the light was slow. For lifts it's harmless. For money, it orders a second lift.
  fails: |-
    **Mechanism:** The first call succeeded but the response was lost.

    - The first call succeeded, but the response was lost.
    - Generic retry logic treats all tools as safe to repeat.
    - The API has no idempotency key.

    **Root cause:** Side-effecting tool calls are retried without idempotency.

    **Where it breaks:** Tool layer and payment API contract.
  diagram:
    bad:
    - Wire $250k · Initiated
    - '!Timeout · Response lost'
    - Auto-retry · Same call
    - '!Two wires · 9-day recall'
    bad_note: Auto-retry a payment call
    good:
    - Idem key · Instruction id
    - +Status check · Before retry
    - +Writes marked · No auto-retry
    - Durable flow · Exactly once
    good_note: Idempotency key, status check, no auto-retry on writes
  solution: |-
    1. Send an idempotency key derived from the business request (payment instruction id) on every write call.
    2. Before retrying, query the status of the original request.
    3. Mark tools as read or write; the framework never auto-retries writes.
    4. Run payment execution in a durable workflow with exactly-once semantics at the business level.
  works: |-
    **Trade-off to manage:** Status checks add latency to error paths only, which is acceptable for payments.

    **How you prove it worked:**

    - Duplicate detection on (beneficiary, amount, date) within a window; reconciliation alerts.

    **Same pattern elsewhere:** Telco: a retry on a timed-out SIM activation creates two orders and two ICCIDs bound to the same number.
  takeaway: Assume every tool call might run twice.
  related:
  - tool-05
  - agf-07
  code: |
    @tool(kind="write", auto_retry=False)                         # framework never retries writes
    def send_wire(instr: WireInstruction):
        key = f"wire:{instr.instruction_id}"                       # from the business request
        try:
            return payments.send(instr, idempotency_key=key, timeout=10)
        except Timeout:
            status = payments.status(idempotency_key=key)          # check before any retry
            if status in ("ACCEPTED", "SETTLED"):
                return {"status": status}
            return payments.send(instr, idempotency_key=key)       # safe: same key
  lang: python
- id: agf-07
  title: B2B order agent loses state on a pod restart
  tags:
  - Reliability
  - Telco
  scenario: |-
    An enterprise ordering agent coordinates a 40-site SD-WAN order over several hours: site surveys, feasibility, pricing approvals and order creation. A Kubernetes pod is rescheduled during a deploy. The agent's in-memory state is lost, and it restarts from scratch, re-requesting surveys and creating duplicate draft orders.
  antipattern: |-
    **Agent state held only in process memory.**

    *Think of it this way:* Writing a long report without saving. When the laptop restarts, you start over.
  fails: |-
    **Mechanism:** Long-running agents outlive containers, deploys, and network blips.

    - State lives only in process memory.
    - Long-running work outlives containers, deploys and network blips.
    - Restarting re-executes side effects.

    **Root cause:** No durable execution or checkpointing.

    **Where it breaks:** Agent runtime.
  diagram:
    bad:
    - 40-site order · Hours long
    - '!Pod restart · During deploy'
    - State lost · In memory
    - '!Starts over · Duplicates'
    bad_note: Agent state only in memory
    good:
    - Checkpoint · After each step
    - +Durable store · DB or Temporal
    - +Resume · Skip done steps
    - Idempotent · Safe replay
    good_note: Checkpoint every step and resume
  solution: |-
    1. Checkpoint state after every step to a durable store (LangGraph checkpointers, Temporal, a database).
    2. Resume from the last checkpoint after a restart, skipping completed side effects.
    3. Combine checkpointing with idempotent tools so replays are safe.
  works: |-
    **Trade-off to manage:** Checkpointing adds write latency and storage; it is small relative to multi-hour tasks.

    **How you prove it worked:**

    - Count of runs restarted from step 1; duplicate draft orders per order id.

    **Same pattern elsewhere:** FinTech: a commercial loan document-collection agent loses progress overnight and re-emails the borrower for documents already received.
  takeaway: Long-running agents need durable execution.
  related:
  - agf-06
  - agf-15
  code: |
    from langgraph.checkpoint.postgres import PostgresSaver

    graph = builder.compile(checkpointer=PostgresSaver.from_conn_string(DB_URL))
    cfg = {"configurable": {"thread_id": f"b2b-order-{order_id}"}}

    # after a pod restart, invoking with the same thread_id resumes from the last checkpoint
    graph.invoke(None if graph.get_state(cfg).values else {"order": order}, cfg)

    # side-effect nodes check completion markers + idempotency keys, so replay is safe
  lang: python
- id: agf-08
  title: Five agents for a loan pre-qualification
  tags:
  - Reliability
  - Cost
  - Latency
  - FinTech
  scenario: |-
    A lender builds loan pre-qualification as five agents: intake, income analyst, credit analyst, risk reviewer and writer. It costs 8 times more per application and takes 40 seconds. A single agent with three tools (income verification, credit pull, pricing rules) matches its accuracy in 6 seconds.
  antipattern: |-
    **Adding agents because it looks sophisticated.**

    *Think of it this way:* Five people passing a form around an office when one person with the right tools could fill it in.
  fails: |-
    **Mechanism:** Each handoff loses context and adds coordination failure modes.

    - Each handoff loses context and adds failure modes.
    - Coordination overhead dominates the actual work.
    - Nobody measured whether more agents helped.

    **Root cause:** Multi-agent design chosen for appearance, not because of a measured need.

    **Where it breaks:** Architecture decision.
  diagram:
    bad:
    - 5 agents · Intake to writer
    - '!Handoffs · Context lost'
    - 8x cost · 40 seconds
    - '!Same accuracy · As one agent'
    bad_note: Five agents for one task
    good:
    - One agent · 3 tools
    - +Measure · Q, latency, $
    - +Split if · Need is proven
    - Ablation · Evals
    good_note: One agent with tools, split only on evidence
  solution: |-
    1. Start with one agent and good tools.
    2. Split only for a measured reason (context overflow, real parallelism, different permissions or a separate review step).
    3. Prove each added agent with evals on quality, latency and cost.
  works: |-
    **Trade-off to manage:** Single agents can get overloaded on very broad tasks; that is when to split.

    **How you prove it worked:**

    - Ablation evals that remove or merge agents.

    **Same pattern elsewhere:** Telco: a plan-change flow with planner, eligibility, pricing and confirmation agents that one agent with a catalog tool handles better.
  takeaway: Add agents to solve a measured problem, not for the diagram.
  related:
  - mas-01
  - mas-02
  code: |
    baseline = Agent(model=MID, tools=[credit_bureau, income_verify, affordability_calc, policy_search])

    def justify_split(candidate_design):
        a, b = run_evals(baseline), run_evals(candidate_design)
        return (b.quality - a.quality > 0.03 and b.p95_latency < SLO and b.cost < a.cost * 1.5,
                {"quality": (a.quality, b.quality), "latency": (a.p95_latency, b.p95_latency),
                 "cost": (a.cost, b.cost)})
  lang: python
- id: agf-09
  title: Framework default prompt overrides the brand voice
  tags:
  - Reliability
  - Cost
  - Security
  - Telco
  scenario: |-
    A carrier builds its care agent on a high-level framework. Responses start with "As an AI assistant, I can help you with that!" and occasionally mention tools by internal names. The team spends days searching their own prompts before finding a default system prompt and output parser injected by the framework three layers down.
  antipattern: |-
    **Adopting a heavy framework without understanding what it sends to the model.**

    *Think of it this way:* Renting a furnished flat and not knowing what's in the locked cupboard until it starts leaking.
  fails: |-
    **Mechanism:** Hidden default prompts and retry logic make behavior hard to control and upgrade.

    - The framework adds hidden prompts, retries and parsing.
    - Developers never see the final request sent to the model.
    - Framework upgrades change behaviour silently.

    **Root cause:** A heavy abstraction adopted without visibility into what it sends.

    **Where it breaks:** Framework choice and tracing.
  diagram:
    bad:
    - Framework · High level
    - '!Hidden prompt · 3 layers down'
    - Off-brand · 'As an AI...'
    - '!Days lost · Searching'
    bad_note: Hidden framework prompts and parsers
    good:
    - Trace request · Exact messages
    - +Own prompts · Override defaults
    - +Pin version · Upgrade evals
    - Diff in CI · Rendered calls
    good_note: Trace the final request, own critical prompts
  solution: |-
    1. Trace and inspect the exact final messages and tool definitions sent to the model.
    2. Own critical prompts in your code; override or remove framework defaults.
    3. Prefer thin abstractions, and pin framework versions with upgrade evals.
  works: |-
    **Trade-off to manage:** Thinner abstractions mean more code to own; for critical paths that's worth it.

    **How you prove it worked:**

    - Diff the rendered request across framework versions in CI.

    **Same pattern elsewhere:** FinTech: a framework's default retry parser silently "fixes" malformed amounts in payment JSON by dropping fields.
  takeaway: Always know exactly what goes to the model.
  related:
  - tel-19
  - ctx-19
  code: |
    agent = Agent(
        model=MODEL,
        system_prompt=load_prompt("brand_voice@v7"),              # ours, not the framework default
        tools=TOOLS,
        default_prompts=None,                                      # remove hidden scaffolding where supported
    )

    @tracer.hook("before_model_call")
    def capture(request):
        log.debug("final_messages", messages=request.messages, tools=request.tools)   # inspect what is really sent
    # requirements.txt pins the framework; upgrades run the eval suite first
  lang: python
- id: agf-10
  title: 80 KB of usage records dumped into the agent context
  tags:
  - Reliability
  - Cost
  - Telco
  scenario: |-
    A billing agent calls get_usage_records to explain a high bill. The tool returns the raw rated usage (TMF635) for the cycle, 80 KB of JSON with 1,900 records. The agent loses track of the customer's question, mentions irrelevant SMS records, and each turn costs 25k tokens.
  antipattern: |-
    **Passing full tool responses back to the model.**

    *Think of it this way:* Asking an accountant why the bill is high and getting the whole ledger dropped on your desk.
  fails: |-
    **Mechanism:** Noise floods the context window and buries the instructions.

    - Tools return everything the API returns.
    - Noise buries the user's question and the instructions.
    - Cost and latency rise with every turn.

    **Root cause:** Tool outputs are designed for machines, not for the model's limited attention.

    **Where it breaks:** Tool design.
  diagram:
    bad:
    - High bill? · Customer asks
    - '!get_usage · 1,900 records'
    - 80 KB JSON · In context
    - '!Lost focus · 25k tokens'
    bad_note: Raw tool output into context
    good:
    - Aggregate · By type, day
    - +Top drivers · Anomalies
    - +Drill-down · One category
    - Reference id · Raw kept aside
    good_note: Task-shaped summaries plus drill-down
  solution: |-
    1. Shape tool output for the task (aggregate by usage type and day, top drivers, anomalies).
    2. Paginate or let the agent request details for one category.
    3. Store large raw results outside the context and pass a reference id.
  works: |-
    **Trade-off to manage:** Pre-aggregation can hide a detail the agent needed; offer a drill-down tool.

    **How you prove it worked:**

    - Tokens per tool result; answer quality against tool output size.

    **Same pattern elsewhere:** FinTech: a spending-insights agent receives a full year of card transactions as raw JSON instead of category totals.
  takeaway: Tools should return answers, not data dumps.
  related:
  - tool-04
  - ctx-13
  code: |
    @tool
    def usage_summary(account_id: str, period: str) -> dict:
        rows = usage_store.records(account_id, period)             # 80 KB raw
        ref = scratch.put(rows)                                     # raw stays outside the context
        by_type = aggregate(rows, by=["usage_type", "day"])
        return {"totals": by_type.totals(), "top_drivers": by_type.top(5),
                "anomalies": detect_spikes(by_type), "detail_ref": ref,
                "hint": "call usage_detail(detail_ref, usage_type) for one category"}
  lang: python
- id: agf-11
  title: Agent retries an opaque KYC vendor error ten times
  tags:
  - Reliability
  - Compliance
  - FinTech
  scenario: |-
    An onboarding agent calls an identity-verification vendor. The vendor returns HTTP 422 with body "Error". The agent retries the same call 10 times, then tells the customer verification succeeded. The vendor's actual problem was an expired date of birth format.
  antipattern: |-
    **Unhelpful error messages to the model.**

    *Think of it this way:* A satnav that only says "error" when you take a wrong turn. You keep driving in circles.
  fails: |-
    **Mechanism:** The model can't recover from errors it can't understand.

    - Errors reach the model as stack traces or bare codes.
    - The model can't tell retryable from fatal errors.
    - The model fills the gap with an invented outcome.

    **Root cause:** Tool errors are not designed as instructions for the next step.

    **Where it breaks:** Tool layer.
  diagram:
    bad:
    - KYC call · Vendor API
    - '!422 ''Error'' · No detail'
    - 10 retries · Same call
    - '!Claims success · Invented'
    bad_note: Opaque errors back to the model
    good:
    - Map errors · Field + reason
    - +Classify · Retry, fix, fatal
    - +Status enum · VERIFIED only
    - Fix and retry · Once
    good_note: Structured, actionable, classified errors
  solution: |-
    1. Translate errors into structured, actionable messages ("date_of_birth must be YYYY-MM-DD; received 07/03/1990").
    2. Classify errors as retryable, fixable by the agent, or fatal, and say which.
    3. Return explicit status values (VERIFIED, FAILED, PENDING) and forbid success claims without VERIFIED.
  works: |-
    **Trade-off to manage:** Mapping vendor errors takes effort; start with the top 10 by frequency.

    **How you prove it worked:**

    - Same-error repeat counts; claimed outcomes compared with tool results.

    **Same pattern elsewhere:** Telco: a serviceability check returns "500" and the agent tells the customer fiber is available at their address.
  takeaway: Error messages are instructions for the next step.
  related:
  - agf-04
  - aev-12
  - tool-06
  code: |
    class ToolError(BaseModel):
        status: Literal["RETRYABLE", "FIXABLE", "FATAL"]; message: str; field: str | None = None

    def verify_identity(dob: str, **kw):
        try:
            r = kyc_vendor.verify(dob=dob, **kw)
        except VendorError as e:
            if e.code == "E107":
                return ToolError(status="FIXABLE", field="date_of_birth",
                                 message=f"date_of_birth must be YYYY-MM-DD; received {dob}")
            return ToolError(status="RETRYABLE" if e.transient else "FATAL", message=e.public_text)
        return {"status": r.status}                                # VERIFIED | FAILED | PENDING only
  lang: python
- id: agf-12
  title: Care agent runs with an admin BSS service account
  tags:
  - Reliability
  - Security
  - Telco
  - Critical
  scenario: |-
    A carrier's care agent authenticates to BSS with a shared admin service account. A prompt injection in a customer's chat convinces it to "update the plan on account X", which belongs to someone else. The change succeeds because the service account can modify any account.
  antipattern: |-
    **The agent runs with an admin service account.**

    *Think of it this way:* Giving the shop assistant the master key to every safe deposit box because it is easier than issuing individual keys.
  fails: |-
    **Mechanism:** The agent's permissions are the blast radius of any mistake or attack.

    - The agent's permissions are far broader than the customer it serves.
    - Account ownership is not re-checked in tools.
    - Any mistake or injection has full blast radius.

    **Root cause:** Agent credentials are not scoped to the user and task.

    **Where it breaks:** Identity and access management for tools.
  diagram:
    bad:
    - Care agent · Admin account
    - '!Injection · Other account'
    - No owner check · In tool
    - '!Plan changed · Wrong customer'
    bad_note: Shared admin account for the agent
    good:
    - User token · Delegated
    - +Owner check · Every tool
    - +Narrow scopes · Per tool
    - Audit · Cross-account
    good_note: Delegated, scoped tokens and ownership checks
  solution: |-
    1. Act on behalf of the authenticated customer (delegated, scoped tokens), not as an admin.
    2. Re-check ownership inside every tool (account_id must belong to the session's party).
    3. Use separate, narrow service accounts per tool, and sandbox code execution.
  works: |-
    **Trade-off to manage:** Delegated auth adds integration work with the identity provider and BSS.

    **How you prove it worked:**

    - Alerts for cross-account access in tool calls; access reviews of agent credentials.

    **Same pattern elsewhere:** FinTech: a banking agent's service account can move money from any account, so an injected instruction transfers funds from another customer.
  takeaway: An agent should never have more access than the user it serves.
  related:
  - sec-05
  - tool-07
  code: |
    def get_account(account_id: str, ctx: Session):
        token = sts.exchange(ctx.customer_token, scope="bss.account.read")   # delegated, scoped
        if account_id not in party_service.accounts_of(ctx.party_id):
            return {"status": "REFUSED", "why": "account not owned by caller"}  # re-check in the tool
        return bss.accounts.get(account_id, bearer=token)

    # each tool has its own narrow service account; code execution runs in a sandbox with no BSS creds
