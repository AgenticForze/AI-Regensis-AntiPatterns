- id: agf-20
  title: Frontier model used for every care-flow step
  tags:
  - Reliability
  - Cost
  - Telco
  scenario: |-
    A carrier's care agent uses the largest model for every call: intent detection, entity extraction, policy checks, tool selection and the final reply. The monthly bill reaches $90k, and 70% of calls are simple classification and extraction steps.
  antipattern: |-
    **The biggest model everywhere.**

    *Think of it this way:* Sending a senior surgeon to take every patient's temperature.
  fails: |-
    **Mechanism:** Most steps don't need frontier reasoning.

    - Simple steps don't need frontier reasoning.
    - Latency is higher than necessary at every step.
    - Cost scales with call volume.

    **Root cause:** No model routing by task difficulty.

    **Where it breaks:** Model selection per step.
  diagram:
    bad:
    - Every step · Frontier model
    - '!70% simple · Classify, extract'
    - High latency · Every call
    - '!$90k/month · Bill'
    bad_note: Biggest model for every step
    good:
    - Small model · Classify, extract
    - +Large model · Plan, reason
    - +Per-step evals · Validate
    - Gateway · Switch by config
    good_note: Route each step to the smallest model that passes
  solution: |-
    1. Use small, fast models for classification, extraction and routing; large models for planning and complex reasoning.
    2. Validate each choice with evals for that step.
    3. Use a gateway to switch models per step without code changes.
  works: |-
    **Trade-off to manage:** More models means more evals and versions to manage.

    **How you prove it worked:**

    - Cost and latency per step; quality per step after routing changes.

    **Same pattern elsewhere:** FinTech: a bank uses its largest model to classify card transaction categories at 100 million transactions a month.
  takeaway: Match the model to the step.
  related:
  - cost-02
  - cost-01
  code: |
    STEP_MODELS = {                               # chosen per step from evals; switchable in the gateway
        "classify_intent":  "small-fast",
        "extract_entities": "small-fast",
        "route":            "small-fast",
        "plan_resolution":  "frontier",
        "draft_reply":      "mid",
    }

    def call(step, **kw):
        return gateway.generate(model=STEP_MODELS[step], **kw)
