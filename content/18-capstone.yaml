  - md: |
      ### How the layers map to the anti-patterns

      | Layer | Key design decisions | Anti-patterns avoided |
      |---|---|---|
      | Data foundation | Structure-aware parsing, metadata contract, medallion storage, CDC with tombstones, redaction before embedding | 1.1–1.5, 2.3 |
      | Knowledge & tools | Hybrid retrieval, reranking, ACL pre-filtering, validity filters, MCP gateway, typed memory | 2.1, 2.4, 3.1–3.5, 4.3, 9.2–9.3, 10.1–10.2 |
      | Models | Portfolio routing, fallback, ladder before fine-tuning, caching, batch | 6.1–6.4, 14.4, 14.6 |
      | AI gateway | Central guardrails, metering, residency-aware routing, spillover | 5.4, 6.2, 12.3, 12.5, 13.5, 13.10 |
      | Agents & workflows | Least autonomy, budgets, checkpoints, typed hand-offs, supervisors, circuit breakers | 7.1–7.5, 8.1–8.5 |
      | Control planes | OBO identity, evals at every stage, OTel tracing, governance registry, red-team regression | 10.3, 11.1–11.5, 12.1–12.4, 15.1–15.8 |
