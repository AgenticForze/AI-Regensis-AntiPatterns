  - agf-16
  - agf-07
  code: |
    DEPENDS_ON = {"current_account": ["kyc"], "credit_card": ["kyc", "credit_check"], "savings": ["kyc"]}

    async def onboard(application):
        for product in application.products:
            deps = DEPENDS_ON[product]
            if any(breaker[d].open for d in deps):
                await workflows.pause(application.id, product, waiting_on=[d for d in deps if breaker[d].open])
                continue                                       # other products proceed
            await provision(product, application)
