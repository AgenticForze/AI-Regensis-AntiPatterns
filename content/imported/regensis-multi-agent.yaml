- id: mas-16
  title: Five levels of sub-agents add 30 seconds
  tags:
  - Reliability
  - Latency
  - Telco
  scenario: |-
    A carrier's assistant uses a hierarchy: concierge, domain lead, specialist, sub- specialist and tool agent. A simple data-balance question passes through five LLM calls before any tool is called, taking 30 seconds.
  antipattern: |-
    **Deep agent hierarchy for every question.**

    *Think of it this way:* A question that has to go up and down five levels of management to reach the person who knows.
  fails: |-
    - Deep hierarchies multiply latency.
    - Each level adds interpretation errors.
    - Simple questions pay the full cost.

    **Root cause:** Organisation-chart architecture instead of task-based routing.

    **Where it breaks:** Architecture.
  diagram:
    bad:
    - Concierge · Level 1
    - '!Lead, specialist · Levels 2-4'
    - Tool agent · Level 5
    - '!30 seconds · Data balance'
    bad_note: Deep agent hierarchy for every question
    good:
    - Router · Intent
    - +Direct · To tool agent
    - +Hierarchy · Complex only
    - Budget · Per intent
    good_note: Flat routing straight to the capable agent
  solution: |-
    1. Flatten (route directly to the agent or tool that can answer).
    2. Use hierarchy only when tasks truly decompose.
    3. Set latency budgets per intent.
  works: |-
    **Trade-off to manage:** Flat routing needs a good router.

    **How you prove it worked:**

    - Depth and latency per intent.

    **Same pattern elsewhere:** FinTech: a bank's "balance" question passes through four agents before reaching the core-banking tool.
