- id: cicd-05
  title: New prompt goes to all customers at once
  tags:
  - Reliability
  - FinTech
  scenario: |-
    A bank deploys a new prompt for its card-services assistant to 100% of traffic after evals pass. A subtle change makes it ask for the full card number in some flows. Within an hour, thousands of customers have typed their card numbers into chat, creating a PCI incident.
  antipattern: |-
    **100% rollout after evals pass.**

    *Think of it this way:* Launching a new recipe to every branch of a restaurant chain on the same day.
  fails: |-
    - Evals didn't cover that flow.
    - No canary limited exposure.
    - No automated guard on a critical metric.

    **Root cause:** No progressive delivery for prompt changes.

    **Where it breaks:** Deployment.
  diagram:
    bad:
    - New prompt · Evals pass
    - '!100% traffic · At once'
    - Asks for PAN · Some flows
    - '!PCI incident · 1 hour'
    bad_note: 100% rollout after evals pass
    good:
    - Canary 2% · Behind flag
    - +Guards · PAN, refusals
    - +Auto-rollback · On breach
    - Ramp · Then 100%
    good_note: Canary with guard metrics and auto-rollback
  solution: |-
    1. Deploy prompt and model changes behind flags to a canary (1-5%), compare with control, then ramp.
    2. Monitor critical guards (PAN patterns in input, refusal rate, escalations) with automatic rollback.
    3. Add an input filter that blocks and masks card numbers.
  works: |-
    **Trade-off to manage:** Slower full rollout; much smaller blast radius.

    **How you prove it worked:**

    - Canary vs control comparison on guard metrics.

    **Same pattern elsewhere:** Telco: a new prompt starts asking customers for their account PIN in chat, rolled out to everyone at once.
  takeaway: Every change gets a canary.
  related:
  - ops-06
  - cicd-16
  code: |
    flags.set("prompt.care_main", variants={"v31": 0.97, "v32": 0.03})      # canary 3%

    PAN = re.compile(r"\b(?:\d[ -]?){15,19}\b")
    def input_filter(text):
        return PAN.sub(lambda m: mask(m.group()) if luhn_valid(m.group()) else m.group(), text)

    @watch(window="15m")
    def guard():
        if delta("pan_in_input_rate", "v32", "v31") > 0 or delta("escalation_rate", "v32", "v31") > 0.02:
            flags.set("prompt.care_main", variants={"v31": 1.0}); alert("auto-rollback v32")
