  code: |
    @schedule(cron="0 * * * *")
    def ingestion_watchdog():
        last_ok = runs.last_success("kb_ingestion")
        if now() - last_ok > timedelta(hours=26):
            page("kb_ingestion: no successful run in 26h")        # dead man's switch
        if creds.expires_in("sharepoint_connector") < timedelta(days=14):
            alert("connector credential expiring")
        if index.newest_doc_age("kb") > timedelta(days=2) or index.count("kb") < 0.95 * expected():
            alert("index freshness/volume check failed")
