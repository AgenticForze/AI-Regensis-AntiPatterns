    EXAMPLES = example_store.load("support_replies")             # tagged by intent, embedded

    def pick_examples(msg, intent, k=3):
        pool = [e for e in EXAMPLES if e.intent == intent] or EXAMPLES
        ranked = sorted(pool, key=lambda e: -cos(embed(msg), e.vec))
        return diverse(ranked, k=k)                               # MMR-style diversity

    prompt = render(TEMPLATE, examples=pick_examples(msg, intent),
                    required="Every reply must state the next step and the expected timeline.")
