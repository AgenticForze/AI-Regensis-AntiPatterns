                f'authority="{p.meta["authority"]}">\n{p.text}\n</source>')

    SYSTEM = ("Cite source ids for every claim. If sources conflict, prefer the newest effective date, "
              "then higher authority, and say that a conflict exists.")
    context = "\n".join(wrap(p) for p in passages)
