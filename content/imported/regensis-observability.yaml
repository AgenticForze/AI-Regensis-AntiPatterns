    RISKY = {"payments", "disputes", "complaints"}

    def after_response(trace):
        inline_checks(trace)                                 # 100%: amounts, schema, banned phrases
        rate = 0.02
        if trace.intent in RISKY or trace.feedback == "down" or trace.version in NEW_VERSIONS:
