    #   tail_sampling:
    #     decision_wait: 10s
    #     policies:
    #       - {name: errors,    type: status_code, status_code: {status_codes: [ERROR]}}
    #       - {name: slow,      type: latency,     latency: {threshold_ms: 8000}}
    #       - {name: feedback,  type: string_attribute, string_attribute: {key: feedback, values: [down]}}
    #       - {name: guardrail, type: boolean_attribute, boolean_attribute: {key: guardrail.hit, value: true}}
    #       - {name: escalated, type: boolean_attribute, boolean_attribute: {key: escalated, value: true}}
    #       - {name: baseline,  type: probabilistic, probabilistic: {sampling_percentage: 1}}
