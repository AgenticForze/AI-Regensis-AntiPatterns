- id: mas-19
  title: One failing agent takes down the whole onboarding flow
  tags:
  - Reliability
  - FinTech
  scenario: |-
    A bank's onboarding system has agents for ID verification, sanctions screening, credit check and account setup. When the credit-bureau agent fails due to a vendor outage, the orchestrator aborts every application, including those for products that don't need a credit check.
  antipattern: |-
    **All agents are hard dependencies.**

    *Think of it this way:* A whole train stopping because the café car's coffee machine broke.
  fails: |-
    - Agents are hard dependencies of each other.
    - No partial completion or retry later.
    - Failure handling is all or nothing.

    **Root cause:** No isolation of failures between agents.

    **Where it breaks:** Orchestration resilience.
  diagram:
    bad:
    - Credit agent · Vendor down
    - '!Orchestrator · Aborts'
    - All apps fail · Even no-credit
    - '!Lost signups · Day'
    bad_note: All agents are hard dependencies
    good:
    - Dependencies · Per product
    - +Pause/resume · Durable
    - +Breaker · Per agent
    - Others continue · Unaffected
    good_note: Per-product dependencies, pause and resume
  solution: |-
    1. Model dependencies per product (only credit products need the credit check).
    2. Pause and resume tasks waiting on a failed dependency, with durable state.
    3. Use circuit breakers per agent and degrade gracefully.
  works: |-
    **Trade-off to manage:** More complex state handling.

    **How you prove it worked:**

    - Tasks failed due to unrelated dependencies.

    **Same pattern elsewhere:** Telco: an order flow fails for SIM-only orders because the device-financing agent is down.
  takeaway: One agent's outage shouldn't be everyone's outage.
