    3. Alert on threshold breaches and on sustained trends.
  works: |-
    **Trade-off to manage:** Thresholds can be set too tight and cause alert fatigue; review them quarterly.

    **How you prove it worked:**

    - Monthly control attestation by the owner.

    **Same pattern elsewhere:** Telco: a care-bot containment metric drifts down for months because no single team owns it after a reorganisation.
  takeaway: Every metric needs a threshold and an owner.
  related:
  - gov-01
  - obs-08
  code: |
    OWNERSHIP = {
        "card_dispute_assistant": {
            "owner": "disputes-product@bank", "model_risk": "mrm-team",
            "metrics": {"faithfulness": {"min": 0.95, "breach": "rollback"},
                        "refusal_correct": {"min": 0.9, "breach": "investigate"},
                        "pii_leak": {"max": 0, "breach": "disable"}}}}

    for uc, cfg in OWNERSHIP.items():
        for m, rule in cfg["metrics"].items():
            if breached(current(uc, m), rule) or trend_down(uc, m, weeks=3):
                page(cfg["owner"], uc, m, action=rule["breach"])
