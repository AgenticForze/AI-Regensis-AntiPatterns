- id: sec-20
  title: An AI security incident with no playbook
  tags:
  - Security
  - Telco
  scenario: |-
    A carrier's SOC is alerted that its care bot leaked customer addresses via a prompt injection. The SOC's playbooks don't cover AI systems. Nobody knows how to find affected conversations, which logs exist, or who can disable the bot. Notification deadlines approach.
  antipattern: |-
    **SOC playbooks ignore AI systems.**

    *Think of it this way:* A fire service that has never been inside this kind of building.
  fails: |-
    - AI systems aren't in security operations scope.
    - No logs suited to investigation.
    - No owner or kill switch known to the SOC.

    **Root cause:** No AI-specific incident response.

    **Where it breaks:** Security operations.
  diagram:
    bad:
    - Data leak · Via bot
    - '!No playbook · For AI'
    - Logs unclear · Scope?
    - '!Deadline · Notification'
    bad_note: SOC playbooks ignore AI systems
    good:
    - Playbook · AI incidents
    - +SIEM · AI events
    - +Kill switch · Known to SOC
    - Tabletop · Exercises
    good_note: AI playbooks, SIEM integration, tabletop drills
  solution: |-
    1. Write AI incident playbooks (detect, contain with kill switches, investigate via traces, notify, remediate, add tests).
    2. Integrate AI guardrail and tracing events into the SIEM.
    3. Run tabletop exercises with the AI team and SOC.
  works: |-
    **Trade-off to manage:** Requires SOC training time.

    **How you prove it worked:**

    - Time to contain in exercises.

    **Same pattern elsewhere:** FinTech: a bank's SOC can't scope which customers saw an AI assistant's data leak.
  takeaway: If the SOC can't see it, it can't defend it.
  related:
  - obs-19
  - obs-07
  code: |
    PLAYBOOK = ["detect", "contain", "investigate", "notify", "remediate", "add_tests"]

    def contain(incident):
        flags.set(f"tool.{incident.tool}", False)                     # kill switch
        traces.preserve(trace_ids=incident.trace_ids)                 # forensic copy
        siem.send(event="ai_incident", severity=incident.severity, detail=incident.summary)

    # guardrail + tracing events stream to the SIEM; tabletop exercise each quarter with AI team + SOC
  lang: python
