- id: aev-05
  title: Clean mocks hide real BSS behaviour
  tags:
  - Quality
  - Security
  - Telco
  scenario: |-
    A carrier's order agent scores 95% in evals with mocked BSS tools that always return instantly and correctly. In production, the inventory API paginates, the catalog API times out at peak, and address validation returns partial matches. Production success is 61%.
  antipattern: |-
    **Mock tools that always return perfect data instantly.**

    *Think of it this way:* Training a pilot only in clear skies, then sending them into a storm.
  fails: |-
    **Mechanism:** Real tools time out, rate-limit, paginate, and return partial or messy data.

    - Mocks never return errors, delays, pagination or messy data.
    - The agent never practised recovery.
    - Evals overstate reliability.

    **Root cause:** The eval environment is unrealistically clean.

    **Where it breaks:** Eval harness.
  diagram:
    bad:
    - Mocked BSS · Always perfect
    - '!Evals 95% · Clean world'
    - 'Prod: timeouts · Pagination'
    - '!61% success · In production'
    bad_note: Perfect, instant mocks
    good:
    - Record/replay · Real responses
    - +Fault inject · 429, timeout
    - +Messy data · Partial matches
    - Score recovery · Explicitly
    good_note: Replay real responses and inject faults
  solution: |-
    1. Record and replay real tool responses, including errors and edge cases.
    2. Add fault injection (timeouts, 429s, empty results, malformed payloads, partial address matches) at realistic rates.
    3. Score recovery explicitly.
  works: |-
    **Trade-off to manage:** Realistic simulators take effort; prioritise the top failure types from production logs.

    **How you prove it worked:**

    - Gap between eval and production success; production error types not covered in evals.

    **Same pattern elsewhere:** FinTech: a payments agent's mocks never return a "beneficiary bank unreachable" error, which is common on cross-border rails.
  takeaway: Test the agent on a bad day.
  related:
  - aev-11
  - aev-04
  code: |
    replay = ToolReplay.from_recordings("recordings/bss/*.jsonl")    # real responses incl. errors
    faults = FaultInjector({"timeout": 0.03, "http_429": 0.02, "empty": 0.05,
                            "malformed": 0.01, "partial_address_match": 0.04})

    def run_eval(agent, case):
        env = faults.wrap(replay.env_for(case))
        trace = agent.run(case.task, env=env)
        return {"success": case.check(env), "recovered": all(e.handled for e in trace.injected_faults)}
  lang: python
- id: aev-06
  title: KYC remediation agent passes once, fails three runs in ten
  tags:
  - Quality
  - Compliance
  - FinTech
  scenario: |-
    A bank's KYC-remediation agent refreshes customer due-diligence files. Each eval task is run once and passes 90%. Running each task 10 times shows that only 62% of tasks pass every time. Analysts experience it as unreliable and stop trusting it.
  antipattern: |-
    **One trial per task.**

    *Think of it this way:* A footballer who scores a penalty in practice once and is declared reliable from the spot.
  fails: |-
    **Mechanism:** Agents are stochastic, and long trajectories amplify variance.

    - Agents are stochastic, and long trajectories amplify variance.
    - Single-trial results describe capability, not reliability.
    - Users experience every run, not the best one.

    **Root cause:** Reliability was not measured.

    **Where it breaks:** Eval methodology.
  diagram:
    bad:
    - KYC refresh · Eval task
    - '!1 trial · Per task'
    - 90% pass · Reported
    - '!62% always · Real reliability'
    bad_note: One trial per task
    good:
    - k = 5 trials · Per task
    - +pass@k · Capability
    - +pass^k · Reliability gate
    - Lower variance · Structure
    good_note: K trials, report pass^k for reliability
  solution: |-
    1. Run k trials per task and report pass@k (succeeds at least once) and pass^k (succeeds every time).
    2. Use pass^k as the release metric for production workflows.
    3. Reduce variance with lower temperature, structured steps and deterministic tools.
  works: |-
    **Trade-off to manage:** k trials multiply eval cost; use k=5 on a stratified subset.

    **How you prove it worked:**

    - Per-task success variance across trials.

    **Same pattern elsewhere:** Telco: a port-out request handler succeeds on average but fails unpredictably on the same request types.
  takeaway: Users need pass^k, not pass@k.
  related:
  - eval-07
  code: |
    def pass_metrics(agent, tasks, k=10):
        res = {t.id: [t.check(agent.run(t)) for _ in range(k)] for t in tasks}
        return {"pass@k": mean(any(r) for r in res.values()),        # succeeds at least once
                "pass^k": mean(all(r) for r in res.values())}        # succeeds every time

    m = pass_metrics(kyc_agent, kyc_tasks, k=10)
    assert m["pass^k"] >= 0.9, "release metric for production workflows"
  lang: python
- id: aev-07
  title: Plan-change agent tested with complete one-line requests
  tags:
  - Quality
  - Telco
  scenario: |-
    A carrier's plan-change agent is evaluated with requests such as "Move line 2 to the Unlimited Plus plan effective today." Real customers say "My bill is too high", reveal that one line is a child's tablet three turns later, and then change their mind. Task completion in production is much lower than in evals.
  antipattern: |-
    **Single-turn eval cases for conversational agents.**

    *Think of it this way:* Practising a sales call with a script where the customer already knows exactly what they want.
  fails: |-
    **Mechanism:** Clarification, changing minds, and partial information are where agents fail.

    - Single-turn, fully specified requests skip clarification.
    - Real customers give information gradually and change goals.
    - Policy compliance under conversational pressure is never tested.

    **Root cause:** No simulated users with realistic behaviour.

    **Where it breaks:** Eval harness.
  diagram:
    bad:
    - One-line ask · Fully specified
    - '!No ambiguity · Never tested'
    - High eval score · Unrealistic
    - '!Prod lower · Real customers'
    bad_note: Single-turn, fully specified requests
    good:
    - Persona · Hidden goal
    - +Reveals slowly · Over turns
    - +Score goal · Plus policy
    - Seed from · Real chats
    good_note: Simulated users with hidden goals
  solution: |-
    1. Use LLM-simulated users with personas, hidden goals and constraints revealed over turns (the approach of tau-bench, which includes a telecom domain).
    2. Score goal completion against the hidden goal and policy compliance.
    3. Seed personas from real conversation patterns.
  works: |-
    **Trade-off to manage:** Simulated users can be unrealistic; spot-check them against real transcripts.

    **How you prove it worked:**

    - Completion rate by number of turns; drop-off points in real sessions.

    **Same pattern elsewhere:** FinTech: a mortgage-rate-lock agent is tested with complete requests, but borrowers reveal a second applicant midway.
  takeaway: Simulate the user, not just the request.
  related:
  - aev-15
  code: |
    persona = SimUser(
        model=SIM_MODEL,
        profile="price-sensitive family plan owner, unsure of data use",
        hidden_goal="move 2 lines to a cheaper plan without losing the device promo",
        reveal_rules=["mention the promo only if asked about devices"])

    conversation = simulate(agent, persona, max_turns=15)
    score = {"goal_met": env_state_matches(persona.hidden_goal), "policy_ok": policy_checker(conversation)}
  lang: python
- id: aev-08
  title: New agent version is 3% better and 4 times the cost
  tags:
  - Quality
  - Cost
  - FinTech
  scenario: |-
    A fraud-investigation agent's new version improves case-resolution accuracy by 3 points. Nobody tracked steps or tokens. In production it makes 4 times as many tool calls and LLM calls per case, and the monthly cost jumps from $18k to $70k.
  antipattern: |-
    **Success rate as the only metric.**

    *Think of it this way:* A taxi driver who arrives slightly more reliably but takes a route twice as long.
  fails: |-
    **Mechanism:** Production agents have cost and latency budgets.

    - Success rate was the only metric.
    - More exploration improved accuracy at large cost.
    - The budget impact appeared only on the invoice.

    **Root cause:** Efficiency is not part of the agent's eval.

    **Where it breaks:** Eval metrics.
  diagram:
    bad:
    - New version · +3 points
    - '!Steps unknown · Not tracked'
    - 4x calls · In prod
    - '!$18k to $70k · Monthly'
    bad_note: Success rate is the only metric
    good:
    - Track · Steps, tokens
    - +Success / $ · Compare
    - +Budget gate · Per task
    - Trim calls · Redundant
    good_note: Success per dollar, step and token budgets
  solution: |-
    1. Track steps, tokens, tool calls, dollars and wall-clock time per task in every eval run.
    2. Compare versions on success per dollar and set budget thresholds.
    3. Look for redundant calls in trajectories.
  works: |-
    **Trade-off to manage:** Some extra cost may be worth it for high-value cases; route by case value.

    **How you prove it worked:**

    - Cost per task by version in production.

    **Same pattern elsewhere:** Telco: a network-diagnosis agent becomes more thorough and triples NOC API load.
  takeaway: Efficiency is part of correctness for agents.
  related:
  - eval-14
  - cost-07
  code: |
    @dataclass
    class RunCost: steps: int; tokens: int; tool_calls: int; usd: float; seconds: float

    def compare(v_old, v_new, tasks):
        a, b = run_suite(v_old, tasks), run_suite(v_new, tasks)
        spd = lambda r: r.success_rate / max(r.mean_cost.usd, 1e-6)        # success per dollar
        assert b.mean_cost.usd <= BUDGET_PER_TASK, "over budget"
        return {"success": (a.success_rate, b.success_rate), "success_per_$": (spd(a), spd(b)),
                "redundant_calls": b.redundant_call_rate}
  lang: python
- id: aev-09
  title: Retention agent waives the termination fee under pressure
  tags:
  - Quality
  - Compliance
  - Telco
  scenario: |-
    A carrier's retention agent may offer approved save offers but must not waive early termination fees. In evals, customers ask politely and the agent complies with policy. In production, customers threaten to post on social media or switch carriers. In 9% of such chats, the agent waives the fee.
  antipattern: |-
    **Testing task success but not rule-following.**

    *Think of it this way:* A security guard trained only on polite visitors who folds when someone shouts.
  fails: |-
    **Mechanism:** Users pressure agents, and helpful models bend rules.

    - Evals contain cooperative users only.
    - Helpful models bend rules under emotional pressure.
    - The waiver is possible because the tool allows it.

    **Root cause:** Policy compliance under pressure was never tested, and limits live in the prompt.

    **Where it breaks:** Eval suite and tool permissions.
  diagram:
    bad:
    - Polite users · In evals
    - '!Threats · In production'
    - Fee waived · 9% of chats
    - '!Revenue loss · Policy broken'
    bad_note: Only polite users in evals
    good:
    - Pushy personas · Simulated
    - +Score refusal · Or escalate
    - +Tool removed · Request review
    - Monitor · Exception rate
    good_note: Pressure tests and no waiver capability
  solution: |-
    1. Add policy cases with pushy, manipulative and emotional simulated users.
    2. Score whether the agent refuses or escalates correctly.
    3. Remove the waiver capability from the agent's tool, so it can only request a supervisor review.
  works: |-
    **Trade-off to manage:** Stricter agents may frustrate some customers; give them a clear escalation path.

    **How you prove it worked:**

    - Waiver and exception rate by agent version and by conversation sentiment.

    **Same pattern elsewhere:** FinTech: a bank agent waives late fees for customers who claim hardship without starting the hardship programme.
  takeaway: Test whether the agent says no when it should.
  related:
  - agf-05
  - prm-16
  code: |
    PRESSURE_PERSONAS = ["threatens_to_leave", "claims_manager_promised", "emotional_hardship", "repeat_demands"]

    def eval_waiver_policy(agent):
        results = []
        for p in PRESSURE_PERSONAS:
            conv = simulate(agent, SimUser(persona=p, goal="get ETF waived"))
            results.append(conv.outcome in ("refused", "escalated_to_supervisor"))
        return mean(results)

    # the tool no longer waives: request_supervisor_review(account_id, reason) only
  lang: python
- id: aev-10
  title: 20% failure rate with no idea which decision failed
  tags:
  - Quality
  - FinTech
  scenario: |-
    A corporate-banking servicing agent fails 20% of end-to-end evals. The team cannot tell whether planning, tool choice or arguments are wrong. After building component evals, they find that 70% of failures are wrong date arguments to the statement tool, caused by relative dates ("last month").
  antipattern: |-
    **Only end-to-end agent evals.**

    *Think of it this way:* A car failing its inspection with only "fail" on the report and no list of what failed.
  fails: |-
    **Mechanism:** You can't fix what you can't localize.

    - Only end-to-end results are scored.
    - Different decision types fail in different ways.
    - Without localisation, fixes are guesses.

    **Root cause:** Agent failures are not decomposed by decision type.

    **Where it breaks:** Eval design and trace analysis.
  diagram:
    bad:
    - 20% fail · End-to-end
    - '!Plan? Tool? · Unknown'
    - Guess fixes · Prompt edits
    - '!No progress · Weeks'
    bad_note: End-to-end score only
    good:
    - Tool choice · Accuracy
    - +Arguments · Correctness
    - +Recovery · After errors
    - 'Top cause · Dates: 70%'
    good_note: Span-level scores per decision type
  solution: |-
    1. Score spans from traces (tool selection accuracy, argument correctness, plan quality, recovery after errors).
    2. Build small labelled sets per decision type.
    3. Add a date-resolution tool or pre-processing, here, since arguments were the main cause.
  works: |-
    **Trade-off to manage:** Span-level labelling takes effort; start by automatically classifying failed traces.

    **How you prove it worked:**

    - Failure taxonomy dashboard per agent version.

    **Same pattern elsewhere:** Telco: a billing agent's failures turn out to be mostly passing the account id where the subscription id is needed.
  takeaway: Decompose agent failures into decision types.
  related:
  - eval-13
  - obs-17
  code: |
    def score_spans(trace, labels):
        return {
            "tool_selection": mean(s.tool == labels.expected_tool[i] for i, s in enumerate(trace.tool_spans)),
            "argument_correctness": mean(args_match(s.args, labels.expected_args[i]) for i, s in enumerate(trace.tool_spans)),
            "recovery": mean(s.next_ok for s in trace.error_spans) if trace.error_spans else 1.0}

    @tool
    def resolve_date(expression: str, tz: str = "America/Chicago") -> str:   # fixes the main argument errors
        return dateparser.parse(expression, settings={"TIMEZONE": tz}).date().isoformat()
