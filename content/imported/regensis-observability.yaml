- id: obs-17
  title: Every failure logged as "LLM error"
  tags:
  - Reliability
  - Latency
  - Telco
  scenario: |-
    A carrier's AI team reports "2.3% LLM errors" each week. Nobody knows what those are. When they finally classify a sample, they find timeouts, refusals, wrong plan prices, format errors and tool failures, each needing a different fix and owner.
  antipattern: |-
    **No classification of failure modes.**

    *Think of it this way:* A hospital that records every visit as "illness".
  fails: |-
    **Mechanism:** You can't prioritize what you can't count.

    - No classification of failure modes.
    - Different root causes are counted together.
    - Prioritisation is impossible.

    **Root cause:** No failure taxonomy.

    **Where it breaks:** Logging and analytics.
  diagram:
    bad:
    - 2.3% errors · Weekly
    - '!One bucket · ''LLM error'''
    - Mixed causes · Unknown
    - '!No priority · No owner'
    bad_note: One 'LLM error' bucket
    good:
    - Taxonomy · 8 categories
    - +Auto-classify · Codes, schemas
    - +Sample review · Manual
    - Owner + trend · Per category
    good_note: Failure taxonomy with owners and trends
  solution: |-
    1. Define a taxonomy (retrieval miss, hallucination, refusal, format error, tool failure, timeout, policy violation, wrong action).
    2. Classify automatically where possible (error codes, schema checks, judges) and manually on samples.
    3. Track trends per category with owners.
  works: |-
    **Trade-off to manage:** Taxonomies need upkeep as systems change.

    **How you prove it worked:**

    - Category share over time, by intent.

    **Same pattern elsewhere:** FinTech: a bank lumps fraud-assistant errors together and misses that most are timeouts from one vendor.
  takeaway: Name your failure modes, then count them.
  related:
  - aev-10
  - aev-17
  code: |
    class Failure(str, Enum):
        RETRIEVAL_MISS = "retrieval_miss"; HALLUCINATION = "hallucination"; REFUSAL = "refusal"
        FORMAT = "format_error"; TOOL = "tool_failure"; TIMEOUT = "timeout"
        POLICY = "policy_violation"; WRONG_ACTION = "wrong_action"

    def classify_failure(trace) -> Failure:
        if trace.timed_out: return Failure.TIMEOUT
        if trace.schema_error: return Failure.FORMAT
        if any(s.status == "error" for s in trace.tool_spans): return Failure.TOOL
        if not trace.retrieved_relevant: return Failure.RETRIEVAL_MISS
        return judge.classify(trace, labels=list(Failure))
