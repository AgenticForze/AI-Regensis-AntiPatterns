- id: eval-14
  title: Best fraud-summary prompt is too slow and too costly
  tags:
  - Quality
  - Cost
  - Latency
  - FinTech
  scenario: |-
    A fraud-operations team picks the prompt and model with the highest summary quality for alert triage. It is 4 points better than the runner-up but takes 11 seconds and costs 6 times as much. At 40,000 alerts a day, it exceeds the budget and slows analysts, who skip the summary.
  antipattern: |-
    **Quality-only leaderboards.**

    *Think of it this way:* Choosing a delivery van by top speed alone, then discovering it can't fit through the warehouse door.
  fails: |-
    **Mechanism:** Production has budgets. A model that misses the SLA fails users.

    - The leaderboard ranks only on quality.
    - Latency and cost were checked after the decision.
    - The quality gain did not change analyst decisions.

    **Root cause:** Quality, latency and cost were evaluated separately rather than as one decision.

    **Where it breaks:** Model and prompt selection.
  diagram:
    bad:
    - Best quality · +4 points
    - '!11 s per alert · 6x cost'
    - 40k alerts/day · Over budget
    - '!Analysts skip · Too slow'
    bad_note: Choose on quality alone
    good:
    - Score all 3 · Q, p95, cost
    - +Pareto set · Candidates
    - +Constraints · Under 3 s, budget
    - Decision test · Changes outcome?
    good_note: Choose on the quality-latency-cost frontier
  solution: |-
    1. Report quality, p95 latency and cost per item for every candidate together.
    2. Pick from the Pareto frontier, using the business constraint (under 3 s, budget per alert).
    3. Measure whether the quality difference changes decisions (analyst agreement), not just scores.
  works: |-
    **Trade-off to manage:** A cheaper model may need better prompts or a small fine-tune to close the gap.

    **How you prove it worked:**

    - Cost per alert and summary usage rate in production.

    **Same pattern elsewhere:** Telco: the most accurate network-incident summary model is too slow for the NOC's 5-minute update cycle.
  takeaway: Quality, latency and cost are one decision.
  related:
  - cost-01
  - cost-02
  code: |
    def pareto(candidates):
        rows = [{"name": c.name, "quality": c.quality, "p95_s": c.p95_s, "cost": c.cost_per_item}
                for c in candidates]
        feasible = [r for r in rows if r["p95_s"] < 3.0 and r["cost"] <= BUDGET_PER_ALERT]
        frontier = [r for r in feasible if not any(o["quality"] >= r["quality"] and o["cost"] < r["cost"]
                                                   for o in feasible)]
        return max(frontier, key=lambda r: r["quality"])

    # also check: does the quality gap change analyst decisions? (agreement on 100 alerts)
  lang: python
