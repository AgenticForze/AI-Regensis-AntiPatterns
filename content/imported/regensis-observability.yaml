- id: obs-12
  title: Payday 429s blamed on application bugs
  tags:
  - Reliability
  - Cost
  - FinTech
  scenario: |-
    A neobank sees random assistant failures on the 1st and 15th of each month. Engineers spend weeks debugging the app. The real cause is provider 429 rate-limit responses at payday peaks, retried without backoff, which made things worse.
  antipattern: |-
    **Not monitoring 429s, provider latency, and retries.**

    *Think of it this way:* Blaming the car for slow traffic during rush hour.
  fails: |-
    **Mechanism:** Provider-side limits and degradations look like application bugs.

    - Provider responses (429, 5xx) are not monitored separately.
    - Retries without backoff amplify the problem.
    - Capacity is not planned for known peaks.

    **Root cause:** The model provider is an unobserved dependency.

    **Where it breaks:** Gateway metrics and capacity planning.
  diagram:
    bad:
    - Payday peaks · 1st and 15th
    - '!429s · From provider'
    - Retry storm · No backoff
    - '!Blamed app · Weeks lost'
    bad_note: Provider limits not monitored
    good:
    - 429/5xx rate · Per provider
    - +Headroom · TPM vs limit
    - +Backoff · Plus jitter
    - Peak quota · Planned
    good_note: Provider health metrics, backoff, peak capacity
  solution: |-
    1. Monitor 429 and 5xx rates per provider and model, retry counts, queue depth and tokens-per-minute headroom.
    2. Retry with exponential backoff and jitter, and shed low-priority traffic first.
    3. Plan quota or provisioned throughput for known peaks.
  works: |-
    **Trade-off to manage:** Provisioned throughput costs more; use it for peak windows only if possible.

    **How you prove it worked:**

    - Headroom dashboard against provider limits.

    **Same pattern elsewhere:** Telco: chatbot failures every bill-run day are traced to provider rate limits.
  takeaway: Your provider is a dependency, so observe it.
  related:
  - ops-17
  - agf-16
  code: |
    @retry(wait=wait_exponential_jitter(initial=0.5, max=20), stop=stop_after_attempt(4),
           retry=retry_if_exception_type((RateLimited, ServerError)))
    def call_model(req):
        if req.priority == "low" and headroom_tpm(req.model) < 0.1:
            raise Shed("low-priority traffic shed")              # shed first
        return provider.generate(req)

    metrics.gauge("provider_tpm_headroom", headroom_tpm(MODEL), model=MODEL)
