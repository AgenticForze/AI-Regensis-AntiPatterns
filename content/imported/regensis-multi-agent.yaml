    def handle_partner_message(msg):
        if not mtls.verified(msg.peer_cert) or not verify_signature(msg):
            return reject("unauthenticated partner agent")
        if msg.type not in ALLOWED_TYPES:                               # e.g. settlement_query, dispute_notice
            return reject("message type not allowed")
        claims = extract_claims(msg.body)                               # untrusted input → claims
        verified = [c for c in claims if settlements.verify(c)]
        if any(c.kind == "financial_adjustment" for c in verified):
            return approvals.request("partner_adjustment", claims=verified)
