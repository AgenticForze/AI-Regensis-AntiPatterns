    def client_memories(q, advisor):
        book = crm.book_of_business(advisor.id)                        # same entitlement as the CRM
        return memory.search(q, filter={"client_id": {"$in": book}, "kind": "client"})

    def promote_to_firm_knowledge(pattern):
        anon = anonymise(pattern, remove=["names", "account_ids", "amounts", "dates"])
        firm_kb.add(anon, reviewed_by=compliance.review(anon))
  lang: python
- id: mem-15
  title: Client disputes what the assistant remembered, no audit
  tags:
  - Quality
  - Compliance
  - FinTech
  scenario: |-
    A client complains that an advisor recommended high-risk products based on a risk tolerance the client says they never gave. The assistant's memory says "high risk tolerance". No record shows when the memory was written, from which conversation, or whether it was edited.
  antipattern: |-
    **Unaudited memory for regulated facts.**

    *Think of it this way:* A diary with no dates and pages that can be rewritten.
  fails: |-
    - Memories have no provenance.
    - Edits aren't versioned.
    - Suitability-relevant facts are stored in memory instead of the KYC record.

    **Root cause:** Unaudited memory used for regulated facts.

    **Where it breaks:** Memory design and data ownership.
  diagram:
    bad:
    - '''High risk'' · In memory'
    - '!Client disputes · Never said'
    - No provenance · When? Where?
    - '!Can''t defend · Complaint'
    bad_note: Unaudited memory for regulated facts
    good:
    - KYC system · Risk tolerance
    - +Provenance · Source, time
    - +Versioning · Edits
    - Audit trail · Changes
    good_note: KYC system for suitability, provenance on memory
  solution: |-
    1. Keep regulated facts (risk tolerance, suitability) in the KYC or suitability system with formal capture.
    2. Give memories provenance (source conversation, time, writer) and version history.
    3. Make memory changes auditable.
  works: |-
    **Trade-off to manage:** None significant.

    **How you prove it worked:**

    - Memories used in recommendations without provenance.

    **Same pattern elsewhere:** Telco: a dispute over whether a customer agreed to a contract renewal can't be settled from the assistant's memory.
  takeaway: If a fact can be disputed, it needs provenance.
  related:
  - mem-08
  - gov-07
  code: |
    def record_suitability(client_id, risk_tolerance, conversation_id):
        kyc_system.capture(client_id, field="risk_tolerance", value=risk_tolerance,
                           method="advisor_confirmed")                   # regulated facts in the KYC system

    def write_memory(client_id, fact, writer, conversation_id):
        memory.put_versioned(client_id, fact,
                             provenance={"conversation": conversation_id, "writer": writer, "at": now()})
        audit.log("memory_change", client=client_id, fact=fact.key, writer=writer)
