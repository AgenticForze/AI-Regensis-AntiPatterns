- id: gov-15
  title: Human review queue with no SLA or capacity plan
  tags:
  - Compliance
  - FinTech
  scenario: |-
    A bank routes high-risk AI fraud decisions to human analysts. Volume grows faster than the team, and the queue reaches 4 days. Legitimate customers' cards stay blocked, and complaints surge.
  antipattern: |-
    **Review step without capacity planning.**

    *Think of it this way:* A checkpoint with one guard and a growing queue of cars.
  fails: |-
    - Review step without capacity planning.
    - No SLA or prioritisation.
    - Automation volume changes without staffing changes.

    **Root cause:** Human-in-the-loop designed as a step, not as a service.

    **Where it breaks:** Operations design.
  diagram:
    bad:
    - AI flags · High risk
    - '!Volume grows · Team doesn''t'
    - 4-day queue · Cards blocked
    - '!Complaints · Surge'
    bad_note: Review step without capacity planning
    good:
    - SLA · Per queue
    - +Capacity · Forecast
    - +Prioritise · Risk, impact
    - Age alerts · Before breach
    good_note: SLAs, risk prioritisation, queue monitoring
  solution: |-
    1. Set SLAs for review queues and plan capacity from forecast volumes.
    2. Prioritise by risk and customer impact; auto-resolve low-risk cases with safeguards.
    3. Monitor queue age and alert before SLA breaches.
  works: |-
    **Trade-off to manage:** Staffing costs, or accepting more automation risk at the margin.

    **How you prove it worked:**

    - Queue age, throughput and SLA compliance.

    **Same pattern elsewhere:** Telco: port-out fraud reviews queue for days, blocking legitimate customers from switching carriers within regulated timeframes.
  takeaway: A human in the loop is a service with a capacity.
  related:
  - sec-19
  code: |
    def review_capacity_plan(forecast_items_per_day, minutes_per_item, sla_hours=24):
        needed_fte = forecast_items_per_day * minutes_per_item / (7.5 * 60)
        return {"needed_fte": round(needed_fte, 1), "sla_hours": sla_hours}

    def route(item):
        if item.risk == "low" and safeguards_pass(item):
            return auto_resolve(item)
        queue.put(item, priority=item.risk_score * item.customer_impact)

    # alert when oldest item age > 0.75 × SLA
