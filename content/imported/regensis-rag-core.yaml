- id: rag-09
  title: Scanned loan agreements parsed as flat text
  tags:
  - Quality
  - FinTech
  scenario: |-
    A commercial bank's credit-monitoring copilot reads borrowers' loan agreements and quarterly financials to flag covenant breaches. The agreements are scanned PDFs with two-column layouts and covenant tables. pdftotext interleaves the columns, so the copilot reads a minimum DSCR of 1.25x as 1.52x and misses a breach for two quarters.
  antipattern: |-
    **`pdftotext` on complex layouts.**

    *Think of it this way:* Reading a newspaper by going straight across the page, line by line, through every column at once. Each sentence becomes half of two different stories.
  fails: |-
    **Mechanism:** Multi-column layouts interleave lines. Tables become number soup. Headers and footers repeat into every chunk.

    - Text extraction ignores layout, so columns, footnotes and tables merge.
    - Headers and footers repeat into every chunk.
    - Scanned pages need OCR, which adds character errors in numbers.
    - The LLM reasons fluently over corrupted text and returns a confident wrong ratio.

    **Root cause:** Parsing quality is never measured. Everything downstream inherits the parser's errors.

    **Where it breaks:** Document ingestion.
  diagram:
    bad:
    - Scanned PDF · Two columns
    - '!Flat text · Columns merged'
    - DSCR misread · 1.25 to 1.52
    - '!Missed breach · Two quarters'
    bad_note: Pdftotext on scanned agreements
    good:
    - Layout parser · OCR + tables
    - +Typed covenant · Analyst confirms
    - +Ratio in code · Deterministic
    - Breach alert · On time
    good_note: Layout parsing, typed covenants, code math
  solution: |-
    1. Use layout-aware parsing (Azure Document Intelligence, AWS Textract, Docling) or a vision model for scanned pages.
    2. Extract covenants into a typed schema (covenant, threshold, operator, test date) and have a credit analyst confirm it once per agreement.
    3. Compute breaches deterministically in code from extracted values and financials.
    4. Keep a parse-quality check in the pipeline, such as table cell counts and number format validation.
  works: |-
    **Trade-off to manage:** Premium parsers cost per page and are slower. Use them for high-value documents and cheap extraction for low-risk ones.

    **How you prove it worked:**

    - Sample review of parsed output against originals, tracked as field-level accuracy.
    - Reconcile extracted totals with sums in the same table.

    **Same pattern elsewhere:** Telco: a wholesale team's copilot misreads interconnect rate tables in carrier contracts and approves an incorrect invoice.
  takeaway: Garbage parsing in, confident garbage out.
  related:
  - data-02
  - rag-12
  code: |
    class Covenant(BaseModel):
        name: str; metric: str; operator: Literal["<=", ">="]; threshold: float; test_date: date

    doc = doc_intel.analyze(pdf_bytes, model="prebuilt-layout")          # layout-aware + OCR
    assert doc.min_confidence > 0.9 and doc.table_cells > 0, "parse quality gate"
    covenants = llm.extract(doc.markdown, schema=list[Covenant])         # analyst confirms once
    breaches = [c for c in covenants
                if not OPS[c.operator](financials[c.metric], c.threshold)]  # deterministic check
