- id: rag-12
  title: RAG used to total quarterly dining spend
  tags:
  - Quality
  - Cost
  - FinTech
  scenario: |-
    A bank's app assistant indexes statement transactions for RAG. A customer asks "How much did I spend on dining last quarter?" Retrieval returns the 8 most similar transactions, and the LLM adds them up to $184. The real total across 63 transactions is $1,212. The customer screenshots the answer on social media.
  antipattern: |-
    **Semantic search for questions that need counting or joins.**

    *Think of it this way:* Asking someone to count the people in a stadium by showing them 8 photos of the crowd. They can only count what they see.
  fails: |-
    **Mechanism:** Top-k retrieval returns samples, not totals. The LLM extrapolates from five rows.

    - Top-k retrieval returns a sample, not the full set.
    - The LLM treats the sample as complete and computes a total.
    - Arithmetic over retrieved text is unreliable anyway.

    **Root cause:** Semantic search is used for an aggregate question that needs filtering, grouping and summing over structured data.

    **Where it breaks:** Intent routing in front of retrieval.
  diagram:
    bad:
    - Dining total? · Last quarter
    - '!Top 8 txns · A sample'
    - LLM adds up · $184
    - '!Real $1 · 212'
    bad_note: RAG over transactions for totals
    good:
    - Intent router · Analytic
    - +SQL template · MCC + dates
    - +Sum in DB · All 63 txns
    - LLM explains · $1
    good_note: Route analytics to tested query templates
  solution: |-
    1. Classify the intent first; analytic intents route to a parameterised query over the transaction store (merchant category, date range, customer id).
    2. Prefer pre-built, tested query templates over free text-to-SQL for customer-facing use.
    3. The LLM formats and explains the result; it does not do the maths.
  works: |-
    **Trade-off to manage:** Templates cover fewer question shapes than free text-to-SQL, but are safe and testable.

    **How you prove it worked:**

    - Eval set of aggregate questions checked against SQL ground truth.
    - Flag answers that contain sums computed by the model rather than returned by a tool.

    **Same pattern elsewhere:** Telco: "How much roaming did I use last month?" answered from a handful of usage records instead of the rated usage total in billing (TMF635).
  takeaway: RAG retrieves passages. It can't count.
  related:
  - agf-17
  - tool-02
  code: |
    TEMPLATES = {"spend_by_category": """SELECT SUM(amount) FROM txns
                   WHERE customer_id = :cid AND mcc = ANY(:mccs) AND posted_at BETWEEN :start AND :end"""}

    def answer(q, cid):
        intent = classify(q)                                     # "analytic" vs "policy"
        if intent.kind == "analytic":
            params = extract_params(q, schema=SpendQuery)        # category, period
            total = db.execute(TEMPLATES["spend_by_category"], cid=cid, **params.sql_args()).scalar()
            return llm.explain(q, result={"total": total, **params.dict()})   # LLM formats, never sums
        return rag(q)
