- id: mas-14
  title: Debugging a multi-agent failure from six separate logs
  tags:
  - Reliability
  - Cost
  - Telco
  scenario: |-
    A carrier's order system has six agents. An enterprise order fails silently. Each agent logs to its own file with its own ids. Engineers spend two days stitching logs by timestamp to find that the planner passed an empty site list.
  antipattern: |-
    **Separate logs per agent.**

    *Think of it this way:* Investigating a relay race with six separate stopwatches and no baton numbers.
  fails: |-
    - No shared trace id across agents.
    - Handoffs aren't logged as events.
    - Failure points are invisible.

    **Root cause:** No distributed tracing for agents.

    **Where it breaks:** Instrumentation.
  diagram:
    bad:
    - 6 agents · 6 logs
    - '!Order fails · Silently'
    - Stitch logs · By time
    - '!2 days · Empty list'
    bad_note: Separate logs per agent
    good:
    - Trace id · Propagated
    - +Handoffs · Span events
    - +Agent graph · Per task
    - Minutes · To root cause
    good_note: One trace across agents and handoffs
  solution: |-
    1. Propagate a trace id through every agent call and handoff.
    2. Log handoff payloads (validated) as span events.
    3. Visualise the agent graph per task.
  works: |-
    **Trade-off to manage:** None significant.

    **How you prove it worked:**

    - Share of tasks with a complete trace.

    **Same pattern elsewhere:** FinTech: a bank's onboarding agents can't be traced end to end when an application gets stuck.
  takeaway: Multi-agent without tracing is multi-mystery.
