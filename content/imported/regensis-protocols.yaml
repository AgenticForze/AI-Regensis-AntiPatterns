- id: tool-17
  title: Tool returns ACH return code R03 with no explanation
  tags:
  - Reliability
  - FinTech
  scenario: |-
    A bank's payment-status tool returns only codes like "R03" or "R10". The agent guesses their meaning and tells a customer their payment was "returned for insufficient funds" (R01) instead of "no account found" (R03), so the customer doesn't fix the account number.
  antipattern: |-
    **Raw codes in tool output.**

    *Think of it this way:* A doctor's note with only diagnosis codes and no description.
  fails: |-
    - Responses carry codes without meaning.
    - The model guesses from training data.
    - The next action isn't given.

    **Root cause:** Tool outputs lack business semantics.

    **Where it breaks:** Tool response design.
  diagram:
    bad:
    - 'Status: R03 · Code only'
    - '!Agent guesses · Means R01?'
    - '''Low funds'' · Wrong reason'
    - '!Not fixed · Account no.'
    bad_note: Raw codes in tool output
    good:
    - Code map · In tool
    - +Meaning · No account
    - +Next action · Check number
    - Fixable · By customer
    good_note: Meaning and next action from the tool
  solution: |-
    1. Map codes to human-readable meanings and recommended next actions inside the tool.
    2. Include whether the customer can fix it and how.
  works: |-
    **Trade-off to manage:** Code mappings need maintenance.

    **How you prove it worked:**

    - Explanation accuracy for returned payments in evals.

    **Same pattern elsewhere:** Telco: a port-in rejection code is returned raw and the agent explains it wrongly.
  takeaway: Return meaning and next step, not just codes.
  related:
  - aev-11
  - agf-11
  code: |
    ACH_CODES = {
        "R01": ("Insufficient funds", "customer_fixable", "Ask the customer to fund the account and retry in 2 days."),
        "R03": ("No account / unable to locate account", "customer_fixable", "Ask the customer to confirm the account and routing numbers."),
        "R10": ("Customer advises not authorized", "not_fixable", "Escalate to disputes; do not retry."),
    }

    @tool
    def payment_status(payment_id: str) -> dict:
        p = ach.status(payment_id)
        if p.return_code:
            meaning, fixable, next_action = ACH_CODES[p.return_code]
            return {"status": "RETURNED", "code": p.return_code, "meaning": meaning,
                    "customer_can_fix": fixable == "customer_fixable", "next_action": next_action}
        return {"status": p.status}
  lang: python
