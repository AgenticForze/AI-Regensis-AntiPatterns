- id: sec-12
  title: Cloned voice passes voice biometrics on the IVR agent
  tags:
  - Security
  - Telco
  - Critical
  scenario: |-
    A carrier's AI voice agent authenticates callers with voice biometrics and then allows account changes, including SIM swaps. Attackers clone a victim's voice from social media videos, pass the voiceprint check, and order a SIM swap to take over the victim's bank OTPs.
  antipattern: |-
    **Voiceprint authorises high-risk actions.**

    *Think of it this way:* A lock that opens for anyone who can play a recording of the owner saying "open".
  fails: |-
    - Voice alone is a weak factor against synthetic speech.
    - High-risk actions follow a single factor.
    - No liveness or channel risk signals.

    **Root cause:** Single-factor voice authentication for high-risk actions.

    **Where it breaks:** Authentication and risk policy.
  diagram:
    bad:
    - Cloned voice · From videos
    - '!Voiceprint · Passes'
    - SIM swap · Allowed
    - '!Bank OTPs · Stolen'
    bad_note: Voiceprint authorises high-risk actions
    good:
    - Voice = signal · Not auth
    - +Deepfake check · Liveness
    - +Step-up · App or passkey
    - Risk signals · Device change
    good_note: Voice as a signal, step-up for SIM swaps
  solution: |-
    1. Treat voice biometrics as one risk signal, not authentication, for high-risk actions.
    2. Require step-up through the app or a passkey for SIM swaps and port-outs.
    3. Add synthetic-voice detection and network signals (recent SIM change, device change).
  works: |-
    **Trade-off to manage:** More friction for customers without the app; offer a store visit path.

    **How you prove it worked:**

    - High-risk actions authorised by voice only; deepfake detector scores.

    **Same pattern elsewhere:** FinTech: a bank's voice agent approves a wire after a cloned voice of a business owner calls.
  takeaway: Voice is a signal, not a key.
  related:
  - sec-10
  - gov-02
  code: |
    def sim_swap_request(call, account):
        risk = risk_engine.score(
            voice_match=call.voice_biometric_score,           # one signal, not authentication
            synthetic_voice=deepfake_detector.score(call.audio),
            recent_sim_change=network.sim_changed_within(account.msisdn, days=30),
            device_change=network.device_changed_within(account.msisdn, days=7))
        return step_up.via_app(account.id, action="sim_swap", reason=risk.explanation)   # always step up
