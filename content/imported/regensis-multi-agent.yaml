    def call_agent(agent, payload):
        with tracer.start_as_current_span(f"agent {agent.name}") as span:
            span.add_event("handoff", {"payload": json.dumps(Handoff.model_validate(payload).model_dump())})
            headers = {}; inject(headers)                              # trace context to the next agent
            return agent.invoke(payload, headers=headers)
    # trace backend renders the agent graph per task id
