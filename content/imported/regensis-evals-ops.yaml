- id: eval-19
  title: Unpinned model alias changes refusal behaviour overnight
  tags:
  - Quality
  - Telco
  scenario: |-
    A carrier's care bot calls a model through a "latest" alias. The provider updates the model behind it. With no deployment on the carrier's side, the bot starts refusing to discuss account security topics such as SIM PIN resets, and transfers to agents rise 12% in a day.
  antipattern: |-
    **Using an unpinned model alias like "latest".**

    *Think of it this way:* Building on a library that auto-updates to the newest major version every night.
  fails: |-
    **Mechanism:** The provider updated the model behind the alias.

    - The model is a dependency that changed without a release.
    - No scheduled eval ran against production configuration.
    - The team assumed "nothing deployed, nothing changed".

    **Root cause:** Unpinned model versions and no continuous canary evaluation.

    **Where it breaks:** Model configuration and monitoring.
  diagram:
    bad:
    - '''latest'' alias · In config'
    - '!Provider update · Overnight'
    - New refusals · SIM PIN topics
    - '!Transfers +12% · No deploy'
    bad_note: Call the model through a 'latest' alias
    good:
    - Pin version · Exact id
    - +Eval upgrade · Via PR
    - +Canary eval · Hourly
    - Deprecation · On calendar
    good_note: Pin versions, canary evals, planned upgrades
  solution: |-
    1. Pin exact model versions in config.
    2. Evaluate new versions offline before switching, as a normal change with a PR.
    3. Run a scheduled canary eval (hourly or daily) against production configuration and alert on drift.
    4. Track provider deprecation dates on a calendar.
  works: |-
    **Trade-off to manage:** Pinning means you must actively upgrade before deprecation; plan it in.

    **How you prove it worked:**

    - Canary eval drift, plus transfer-rate and refusal-rate monitoring.

    **Same pattern elsewhere:** FinTech: a bank's KYC extraction accuracy shifts after a provider update to an unpinned alias.
  takeaway: The model is a dependency, so pin it and test upgrades.
  related:
  - ops-16
  - cicd-06
  code: |
    # models.yaml: pin exact versions, never floating aliases
    # care_bot: {provider: x, model: "model-name-2026-08-14"}

    @schedule(cron="0 * * * *")
    def canary():
        r = run_suite("refusal_canary", config=load("models.yaml"))
        if r.refusal_rate - BASELINE.refusal_rate > 0.03:
            alert("refusal behaviour drift on production config", r)

    deprecations = provider.deprecation_schedule()            # put dates on the team calendar
