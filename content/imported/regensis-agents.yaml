- id: agf-16
  title: Provider outage takes the care bot down at bill-run time
  tags:
  - Reliability
  - Telco
  scenario: |-
    A carrier's care bot depends on one model from one provider. On the first day of the billing cycle, when contact volume peaks, the provider has a 2-hour outage. The bot returns errors, all traffic hits the call centre, and wait times reach 50 minutes.
  antipattern: |-
    **One model, one provider, no degradation path.**

    *Think of it this way:* A shop with one card reader and no backup. When it fails, the queue goes out the door.
  fails: |-
    **Mechanism:** LLM APIs have rate limits and outages.

    - Single model, single provider, no degradation path.
    - Rate limits and outages happen at peak times.
    - No non-LLM fallback for top intents.

    **Root cause:** The LLM was treated as always available.

    **Where it breaks:** Serving architecture.
  diagram:
    bad:
    - Bill-run day · Peak traffic
    - '!Provider down · 2 hours'
    - Bot errors · No fallback
    - '!50-min waits · Call centre'
    bad_note: One model, one provider, no fallback
    good:
    - LLM gateway · Retry, backoff
    - +Fallback model · Evaluated
    - +Degraded mode · Top intents
    - Load test · Peak days
    good_note: Gateway with fallbacks plus a degraded mode
  solution: |-
    1. Route through an LLM gateway with retries, backoff and fallback models or providers (tested with evals).
    2. Provide a degraded mode (menu-driven flows for top intents such as bill pay and balance).
    3. Load-test against provider rate limits for peak days.
  works: |-
    **Trade-off to manage:** Fallback models behave differently; evaluate them and accept slightly lower quality during incidents.

    **How you prove it worked:**

    - Provider error rates, fallback activation metric.

    **Same pattern elsewhere:** FinTech: a bank's fraud alert explainer stops working during a provider outage on Black Friday.
  takeaway: Design for the model being unavailable.
  related:
  - ops-07
  - ops-16
  - obs-14
  code: |
    gateway = LLMGateway(routes=[
        Route("primary", provider="a", model=MID, retries=2, backoff="exponential"),
        Route("fallback", provider="b", model=MID_EQUIV, prompt_variant="b"),   # eval-tested
    ], circuit_breaker=CircuitBreaker(error_rate=0.2, window_s=60))

    def handle(msg):
        try:
            return agent.run(msg, llm=gateway)
        except AllRoutesDown:
            return menu_flow(top_intents=["pay_bill", "balance", "outage"])     # degraded mode
  lang: python
- id: agf-17
  title: Agent computes a loan payoff and gets daily interest wrong
  tags:
  - Reliability
  - FinTech
  scenario: |-
    A personal-loan servicing agent is asked for a payoff amount as of next Friday. It reasons through principal, daily interest and fees in text and quotes $12,418.77. The servicing system says $12,455.32. The customer pays the quoted amount, the loan stays open with a small balance and goes delinquent.
  antipattern: |-
    **Asking the model to compute or validate deterministic things.**

    *Think of it this way:* Asking a brilliant essayist to do your tax return in their head.
  fails: |-
    **Mechanism:** LLMs predict tokens. They are unreliable at arithmetic and exact rules.

    - LLMs predict tokens and are unreliable at multi-step arithmetic.
    - Day-count conventions and fee rules are exact.
    - The answer looks precise, so nobody doubts it.

    **Root cause:** The model performs calculations that belong in code.

    **Where it breaks:** Tool design.
  diagram:
    bad:
    - Payoff Friday? · Customer asks
    - '!LLM computes · In text'
    - $12,418.77 · Wrong
    - '!Balance left · Delinquent'
    bad_note: The model does the money maths
    good:
    - Payoff API · Servicing system
    - +Calc tool · If needed
    - +Amount check · Equals tool
    - $12,455.32 · Correct
    good_note: Payoff API, calculator tool, amount checks
  solution: |-
    1. Get the payoff quote from the servicing system's payoff API.
    2. Give the agent a calculator or date tool for anything else, and never let it compute money in text.
    3. Validate that any amount in the answer equals a tool result.
  works: |-
    **Trade-off to manage:** None worth discussing; money maths belongs in the system of record.

    **How you prove it worked:**

    - Numeric-faithfulness checks on all money amounts in answers.

    **Same pattern elsewhere:** Telco: an agent prorates a mid-cycle plan change in its head and quotes a wrong first bill.
  takeaway: Use the LLM for judgement and code for arithmetic.
  related:
  - rag-12
  - rag-01
  code: |
    @tool
    def payoff_quote(loan_id: str, payoff_date: date) -> dict:
        return servicing.payoff(loan_id, as_of=payoff_date)       # per-diem interest from the system

    @tool
    def calc(expression: str) -> str:
        return str(safe_eval(expression))                          # anything else: calculator, never text

    def check_amounts(answer, tool_results):
        return all(a in money_values(tool_results) for a in money_values(answer))
