source: regensis
section: llmops-cicd
patterns:
- id: ops-01
  title: Last week's bad answer can't be reproduced
  tags:
  - Reliability
  - FinTech
  scenario: |-
    A complaint arrives about a wrong answer the bank's assistant gave about early repayment charges eight days ago. Engineering tries to reproduce it. Since then, the prompt changed twice, the index was rebuilt, and the model was upgraded. Git has the code, but nothing records which prompt, index snapshot and model produced the answer.
  antipattern: |-
    **Git for code only.**

    *Think of it this way:* Trying to bake the same cake again when the recipe, oven and flour have all changed and nobody wrote down which were used.
  fails: |-
    **Mechanism:** Behavior depends on prompt, model version, index snapshot, embeddings, and parameters.

    - Behaviour depends on more than code.
    - Prompts, indexes and models change on different schedules.
    - No single record ties them together.

    **Root cause:** Only code is versioned.

    **Where it breaks:** Release engineering.
  diagram:
    bad:
    - Complaint · 8 days ago
    - '!Prompt x2 · Changed'
    - Index + model · Changed
    - '!Can''t replay · Unknown config'
    bad_note: Git for code only
    good:
    - Version all · Prompt, model
    - +Index snapshot · Retained
    - +Manifest id · On traces
    - Replay · Any release
    good_note: Release manifest versions the whole bundle
  solution: |-
    1. Version every component (prompt, model id, index snapshot, embedding model, tool versions, guardrail config).
    2. Record each production configuration as a release manifest with an id, stamped on every trace.
    3. Keep index snapshots long enough to replay recent incidents.
  works: |-
    **Trade-off to manage:** Snapshots cost storage; keep them on a rolling window.

    **How you prove it worked:**

    - Ability to rebuild any release from its manifest, tested quarterly.

    **Same pattern elsewhere:** Telco: a regulator asks a carrier to explain an AI answer about contract terms, and the configuration that produced it can't be reconstructed.
  takeaway: Reproducibility needs the whole bundle versioned.
  related:
  - tel-10
  - obs-11
  - cicd-02
  code: |
    manifest = {
        "release": "care-bot-2026.11.07",
        "prompt": "care.main@31", "model": "provider/model-2026-08-14",
        "index": "kb_2026_11_05_snapshot", "embedder": "bge-m3@rev3",
        "tools": {"billing": "2.4.1", "orders": "1.9.0"}, "guardrails": "baseline@12",
    }
    release_store.save(manifest)
    span.set_attribute("release.id", manifest["release"])           # stamped on every trace
    # replay: load manifest by trace → same prompt/model/index snapshot
  lang: python
- id: ops-02
  title: Intent model trained on clean text, served on raw transcripts
  tags:
  - Reliability
  - Telco
  scenario: |-
    A carrier fine-tunes a small intent classifier on chat logs that were lowercased, had phone numbers masked and emojis removed. The serving service sends raw text. Offline accuracy is 94%; production is 78%, worst for messages with phone numbers, which are exactly the porting intents.
  antipattern: |-
    **Different text cleaning in training and serving code.**

    *Think of it this way:* Training a sniffer dog on one brand of shampoo and then deploying it in a different building.
  fails: |-
    **Mechanism:** The model sees inputs in production that differ from training.

    - Preprocessing differs between training and serving.
    - The model sees unfamiliar inputs in production.
    - Nobody tested parity.

    **Root cause:** Separate preprocessing code paths.

    **Where it breaks:** ML pipeline.
  diagram:
    bad:
    - Training · Cleaned text
    - '!Serving · Raw text'
    - 94% offline · 78% prod
    - '!Porting worst · Phone numbers'
    bad_note: Separate preprocessing paths
    good:
    - Shared lib · Preprocess
    - +Parity test · Same input
    - +Log sample · In prod
    - Gap alert · By intent
    good_note: One shared transform plus a parity test
  solution: |-
    1. Share one preprocessing library between training and serving.
    2. Add a parity test that runs the same raw input through both paths.
    3. Log preprocessed inputs for a sample in production.
  works: |-
    **Trade-off to manage:** None significant.

    **How you prove it worked:**

    - Offline vs production accuracy gap by intent.

    **Same pattern elsewhere:** FinTech: a transaction-categorisation model trained on cleaned merchant names receives raw descriptors at serving time.
  takeaway: Same transform in training and serving.
  related:
  - ops-11
  code: |
    # one shared package used by training and serving
    from nlp_preprocess import normalize_transcript

    def test_parity():
        raw = load_fixture("raw_ivr_transcript.txt")
        assert training_pipeline.preprocess(raw) == serving_service.preprocess(raw)

    if random() < 0.01:
        log.info("preprocessed_sample", raw_ref=store(raw), processed=normalize_transcript(raw))
  lang: python
- id: ops-03
  title: Fine-tuning a model on monthly price plans
  tags:
  - Reliability
  - Cost
  - Latency
  - Telco
  scenario: |-
    A carrier spends three months and $40k fine-tuning a model on its price plans and promotions so the bot "knows the catalog". The catalog changes monthly. Two weeks after deployment, the model confidently quotes last month's prices, and retraining each month is too slow and expensive.
  antipattern: |-
    **Fine-tuning for knowledge.**

    *Think of it this way:* Tattooing the menu on the waiter's arm when the menu changes every month.
  fails: |-
    **Mechanism:** Fine-tuning is good for style, format, and behavior, but poor for fresh, factual knowledge. Retraining for each update is costly.

    - Fine-tuning bakes knowledge into weights.
    - Knowledge goes stale as soon as the catalog changes.
    - The model can't cite where a price came from.

    **Root cause:** Fine-tuning used for fresh, factual knowledge.

    **Where it breaks:** Approach selection.
  diagram:
    bad:
    - Fine-tune · Price plans
    - '!3 months · $40k'
    - Catalog changes · Monthly
    - '!Stale prices · Confidently'
    bad_note: Fine-tune to teach the price list
    good:
    - Catalog tool · TMF620
    - +RAG · Explanations
    - +Fine-tune · Tone, format
    - Fresh + cited · Prices
    good_note: Catalog tool for facts, fine-tune for behaviour
  solution: |-
    1. Use a ladder (prompting, then RAG or tools for knowledge, then fine-tuning for behaviour, format or cost).
    2. Get prices from the catalog (TMF620) as a tool.
    3. Fine-tune only for stable behaviour (tone, format, classification) once evals and data exist.
  works: |-
    **Trade-off to manage:** Tools add latency, but prices are always current and citable.

    **How you prove it worked:**

    - Price accuracy against the live catalog.

    **Same pattern elsewhere:** FinTech: a bank fine-tunes on its rate sheet, and the model quotes old mortgage rates after a rate change.
  takeaway: RAG for knowledge, fine-tuning for behaviour.
  related:
  - ft-01
  - rag-01
  code: |
    LADDER = ["prompting", "rag_or_tools", "fine_tune"]

    @tool
    def get_plan_price(offering_id: str) -> dict:
        return tmf620.product_offering_price(offering_id)      # monthly prices from the catalog

    # fine-tune only for stable behaviour (tone, format, classification), with evals + data in place
  lang: python
- id: ops-04
  title: Collections model fine-tuned on raw call transcripts
  tags:
  - Reliability
  - Compliance
  - FinTech
  scenario: |-
    A lender fine-tunes a model on 50,000 historical collections-call transcripts to sound like its best agents. The data includes calls where agents pressured customers and implied legal action without basis. The fine-tuned model reproduces these phrases, creating FDCPA risk.
  antipattern: |-
    **Training on raw historical transcripts.**

    *Think of it this way:* Teaching an apprentice by having them shadow everyone, including the staff who were later disciplined.
  fails: |-
    **Mechanism:** The model learns everything in the data, including mistakes.

    - The model learns everything in the data, including bad behaviour.
    - Transcripts were never filtered by QA outcome.
    - PII is also embedded in training data.

    **Root cause:** Unvetted training data.

    **Where it breaks:** Data curation.
  diagram:
    bad:
    - 50k calls · Raw
    - '!Bad agents · Included'
    - Fine-tune · Learns it
    - '!Pressure lines · FDCPA risk'
    bad_note: Fine-tune on raw historical transcripts
    good:
    - QA filter · Compliant only
    - +Remove PII · Dedupe
    - +Label · Examples
    - Compliance eval · Before deploy
    good_note: Curated, compliant, de-identified training data
  solution: |-
    1. Filter training data by QA scores and compliance reviews; remove non-compliant calls.
    2. Remove PII, deduplicate, and label examples.
    3. Hold out a test set and run compliance evals on the fine-tuned model before deployment.
    4. Track data lineage (which calls, which filters).
  works: |-
    **Trade-off to manage:** Filtering reduces data volume; quality matters more than quantity.

    **How you prove it worked:**

    - Compliance phrase scans of model outputs.

    **Same pattern elsewhere:** Telco: a care model fine-tuned on old chats learns to quote retired policies and sarcastic replies.
  takeaway: Fine-tuning amplifies your data, good and bad.
  related:
  - ft-05
  - data-06
  code: |
    def build_training_set(calls):
        ok = [c for c in calls if c.qa_score >= 4 and c.compliance_review == "pass"]
        cleaned = [redact_pii(c.transcript) for c in ok]
        deduped = dedupe(cleaned, threshold=0.9)
        lineage.record(source="calls_2026_q3", filters=["qa>=4", "compliance=pass", "pii", "dedupe"], n=len(deduped))
        return label(deduped)

    train, test = split(build_training_set(calls), test_frac=0.15)
    assert compliance_eval(finetuned_model, test).violations == 0
  lang: python
- id: ops-05
  title: Nobody knows which data trained the credit-memo model
  tags:
  - Reliability
  - Cost
  - Compliance
  - FinTech
  scenario: |-
    A bank's model-risk team asks for documentation of a fine-tuned model that drafts credit memos: training data, code version, hyperparameters, evaluation results and approver. The model is a file in an S3 bucket named final_v3_new. The validation is failed and the model is suspended.
  antipattern: |-
    **Models stored as files in buckets.**

    *Think of it this way:* A medicine on a shelf with no label, batch number or expiry date.
  fails: |-
    **Mechanism:** No audit trail, no rollback, no comparison.

    - Models are stored as files with no metadata.
    - No lineage to data and code.
    - Validation can't be evidenced.

    **Root cause:** No model registry.

    **Where it breaks:** MLOps tooling.
  diagram:
    bad:
    - final_v3_new · In S3
    - '!No lineage · Data? Code?'
    - Model risk · Asks
    - '!Suspended · Failed validation'
    bad_note: Models as files in a bucket
    good:
    - Registry · MLflow etc.
    - +Lineage · Data + commit
    - +Approval · Gate deploy
    - Model card · Published
    good_note: Registry with lineage, approval gate, model card
  solution: |-
    1. Use a model registry (MLflow, Weights and Biases, SageMaker or Vertex) with lineage (data version, code commit, evals, approver).
    2. Gate production deployment on registry status (approved).
    3. Produce model cards for every production model.
  works: |-
    **Trade-off to manage:** Registration adds process steps; automate them in the training pipeline.

    **How you prove it worked:**

    - Share of production models with complete registry records.

    **Same pattern elsewhere:** Telco: a carrier can't show which data trained its churn-reason classifier during a privacy audit.
  takeaway: Every production model should have a birth certificate.
  related:
  - gov-01
  - ops-15
  code: |
    import mlflow

    with mlflow.start_run():
        mlflow.log_params({"data_version": DATA_V, "code_commit": GIT_SHA})
        mlflow.log_metrics(eval_results)
        mlflow.register_model(model_uri, "credit-memo-writer")

    client.set_model_version_tag("credit-memo-writer", v, "approved_by", "mrm-lead")
    def deploy(name, version):
        assert client.get_model_version(name, version).tags.get("status") == "approved"   # gate on registry
  lang: python
- id: ops-06
  title: All traffic switched to a new model at once
  tags:
  - Reliability
  - Telco
  scenario: |-
    A carrier switches 100% of its care bot to a new model version on Monday morning. Offline evals passed. In production, the new model handles abbreviations and prepaid-brand slang differently, and transfers to agents rise 35% before the team rolls back two hours later.
  antipattern: |-
    **No gradual rollout.**

    *Think of it this way:* Changing every traffic light in a city to a new system at once instead of testing one junction.
  fails: |-
    **Mechanism:** Offline evals don't catch everything.

    - Offline evals don't catch everything.
    - No gradual exposure.
    - Rollback is manual and slow.

    **Root cause:** Big-bang rollout.

    **Where it breaks:** Deployment strategy.
  diagram:
    bad:
    - New model · Evals passed
    - '!100% traffic · Monday'
    - Transfers +35% · Slang
    - '!Manual rollback · 2 hours'
    bad_note: 100% switch on Monday morning
    good:
    - Shadow · Compare silently
    - +Canary 5% · Monitored
    - +Ramp · Progressive
    - Auto-rollback · On breach
    good_note: Shadow, canary, ramp with auto-rollback
  solution: |-
    1. Shadow first (new model runs silently, outputs compared), then canary (1-5%), then progressive ramp.
    2. Define automatic rollback triggers on key metrics (transfer rate, errors, quality score).
    3. Avoid Monday peaks for changes.
  works: |-
    **Trade-off to manage:** Slower rollouts; far fewer incidents.

    **How you prove it worked:**

    - Canary vs control metric comparison.

    **Same pattern elsewhere:** FinTech: a bank switches its fraud-alert explanations to a new model and complaint volume jumps.
  takeaway: Shadow, canary, then ramp.
  related:
  - cicd-05
  - cicd-06
  code: |
    ROLLOUT = [("shadow", 0), ("canary", 0.02), ("ramp", 0.25), ("ramp", 0.5), ("full", 1.0)]
    ROLLBACK_IF = {"transfer_rate": +0.03, "error_rate": +0.01, "quality_score": -0.02}

    for stage, pct in ROLLOUT:
        gateway.set_traffic("new_model", pct, shadow=(stage == "shadow"))
        wait(hours=24, avoid=["MON 08:00-12:00"])
        if any(delta(m) * (1 if d > 0 else -1) > abs(d) for m, d in ROLLBACK_IF.items()):
            gateway.set_traffic("new_model", 0); alert("auto-rollback"); break
  lang: python
- id: ops-07
  title: Twelve teams call four providers directly
  tags:
  - Reliability
  - Cost
  - Security
  - FinTech
  scenario: |-
    Across a bank, 12 teams call four model providers directly with their own API keys, retry logic and logging. Security can't see which data goes where, finance can't attribute cost, and a key leaked from one team's repository takes days to trace.
  antipattern: |-
    **Direct provider calls everywhere.**

    *Think of it this way:* Every department running its own phone lines with no switchboard.
  fails: |-
    **Mechanism:** No central control of keys, quotas, fallbacks, caching, logging, or policy.

    - No central control of keys, quotas, logging or policy.
    - Inconsistent retries and fallbacks.
    - No view of data flows to providers.

    **Root cause:** No LLM gateway.

    **Where it breaks:** Platform architecture.
  diagram:
    bad:
    - 12 teams · Own keys
    - '!4 providers · Direct calls'
    - No visibility · Data, cost
    - '!Leaked key · Days to trace'
    bad_note: Direct provider calls from every team
    good:
    - Gateway · All traffic
    - +Virtual keys · Per team
    - +Policy · PII, routing
    - Egress block · Direct calls
    good_note: One LLM gateway with keys, policy, metering
  solution: |-
    1. Route all model access through a gateway (LiteLLM, Portkey or a cloud AI gateway) for auth, routing, rate limits, fallbacks, caching, metering and PII policy.
    2. Issue per-team virtual keys with budgets.
    3. Block direct provider egress at the network level.
  works: |-
    **Trade-off to manage:** The gateway becomes critical infrastructure; run it highly available.

    **How you prove it worked:**

    - Share of LLM traffic via the gateway; direct-egress alerts.

    **Same pattern elsewhere:** Telco: business units in a carrier sign separate AI contracts and nobody can enforce CPNI rules on prompts.
  takeaway: Centralise model access the way you centralise database access.
  related:
  - obs-05
  - ops-19
  code: |
    # litellm proxy config.yaml (excerpt)
    # model_list:
    #   - model_name: mid-tier
    #     litellm_params: {model: bedrock/<model-id>}
    #   - model_name: mid-tier
    #     litellm_params: {model: vertex_ai/<model-id>}       # fallback route
    # router_settings: {routing_strategy: usage-based-routing, num_retries: 2}
    # general_settings: {master_key: os.environ/LITELLM_MASTER_KEY}

    key = gateway.keys.create(team="cards-ai", max_budget=5000, budget_duration="30d")   # per-team virtual key
    # network: egress to provider endpoints allowed only from the gateway subnet
  lang: python
- id: ops-08
  title: Self-hosted model runs out of GPU memory at 50 users
  tags:
  - Reliability
  - Cost
  - Telco
  scenario: |-
    For data-sovereignty reasons, a European carrier self-hosts an open-weight model for its care agents. Single-request benchmarks look great. At 50 concurrent agents with long call transcripts, the server runs out of GPU memory and requests fail.
  antipattern: |-
    **Benchmarking single requests only.**

    *Think of it this way:* Testing a restaurant kitchen with one order and opening on a Saturday night.
  fails: |-
    **Mechanism:** KV cache memory grows with concurrency and context length.

    - KV-cache memory grows with concurrency times context length.
    - Benchmarks used single short requests.
    - No autoscaling or admission control.

    **Root cause:** Capacity planning ignored realistic concurrency and context lengths.

    **Where it breaks:** Serving infrastructure.
  diagram:
    bad:
    - Self-hosted · Sovereignty
    - '!1-request test · Fast'
    - 50 agents · Long context
    - '!GPU OOM · Failures'
    bad_note: Benchmark single short requests
    good:
    - Load test · Real lengths
    - +vLLM · Paged attention
    - +Limits · Context, concur.
    - Autoscale · Queue depth
    good_note: Realistic load tests, batching, admission control
  solution: |-
    1. Load-test with realistic concurrency and lengths.
    2. Use serving engines with continuous batching and paged attention (vLLM, TGI, TensorRT-LLM).
    3. Set max context and concurrency limits, autoscale on queue depth, and shed load gracefully.
  works: |-
    **Trade-off to manage:** Headroom costs GPUs; size for peak with a buffer.

    **How you prove it worked:**

    - GPU memory, queue depth and rejection rates.

    **Same pattern elsewhere:** FinTech: a bank's on-prem model for document review fails during month-end processing.
  takeaway: Plan GPU capacity for concurrency times context length.
  related:
  - ops-17
  - cost-03
  code: |
    # vllm serve <model> --max-model-len 8192 --max-num-seqs 64 --gpu-memory-utilization 0.9
    #   (continuous batching + paged attention)

    async def admit(req):
        if queue.depth() > MAX_QUEUE:
            raise HTTPException(503, "busy, retry shortly")                     # shed gracefully
        return await queue.put(req)

    # load test: locust -u 200 --spawn-rate 20 with realistic prompt/response lengths
    # autoscale: KEDA on vllm_num_requests_waiting
  lang: python
- id: ops-09
  title: Cost per call falls while cost per resolved dispute triples
  tags:
  - Reliability
  - Cost
  - FinTech
  scenario: |-
    A card issuer moves its dispute assistant to a cheaper model to cut cost per call by 60%. The cheaper model resolves fewer disputes in one session, so customers return and escalate to agents. Cost per resolved dispute, including agent time, triples.
  antipattern: |-
    **Optimizing the wrong unit.**

    *Think of it this way:* Buying cheaper tyres that wear out three times as fast.
  fails: |-
    **Mechanism:** Cheaper calls that fail more often cost more overall.

    - The optimised unit (cost per call) wasn't the business unit.
    - Failures shift cost elsewhere.
    - Nobody measured end-to-end cost.

    **Root cause:** Optimising the wrong unit.

    **Where it breaks:** Cost management.
  diagram:
    bad:
    - Cheaper model · -60% per call
    - '!Fewer resolved · In session'
    - Escalations · To agents
    - '!Cost/outcome x3 · Total'
    bad_note: Optimise cost per call
    good:
    - Outcome cost · Incl. humans
    - +Repeat contact · Counted
    - +Route + cache · Where safe
    - Evals hold · Then switch
    good_note: Optimise cost per resolved outcome
  solution: |-
    1. Measure cost per successful outcome (resolved dispute), including human time and repeat contacts.
    2. Use caching, model routing and prompt compression only where evals show outcomes hold.
  works: |-
    **Trade-off to manage:** Outcome attribution needs cross-system data.

    **How you prove it worked:**

    - Cost per outcome dashboard by version.

    **Same pattern elsewhere:** Telco: a cheaper model for plan changes lowers bot cost but raises store visits.
  takeaway: Optimise cost per success, not cost per call.
  related:
  - cost-01
  - eval-14
  code: |
    def cost_per_resolved_dispute(month):
        llm = ledger.sum(use_case="disputes", month=month)
        human = worklog.hours(queue="disputes", month=month) * LOADED_HOURLY_RATE
        repeats = contacts.repeat_cost(intent="dispute", month=month)
        resolved = disputes.count(status="resolved", month=month)
        return (llm + human + repeats) / resolved
  lang: python
- id: ops-10
  title: Thirty percent of questions are the same and all pay full price
  tags:
  - Reliability
  - Telco
  scenario: |-
    On bill-run days, 30% of a carrier's chatbot questions are near-duplicates ("why is my bill higher this month", "what is this new fee"). Every one is answered from scratch, with retrieval and a full model call, and the 12k-token system prompt is re-processed each time.
  antipattern: |-
    **Every request hits the model.**

    *Think of it this way:* A bakery that bakes each loaf to order even when everyone wants the same bread.
  fails: |-
    **Mechanism:** Repeated work wastes money and latency.

    - No exact or semantic caching for general answers.
    - No provider prompt caching for the stable prefix.
    - Repeated work costs money and latency.

    **Root cause:** No caching strategy.

    **Where it breaks:** Serving architecture.
  diagram:
    bad:
    - Bill-run day · Peak
    - '!30% duplicates · Same Qs'
    - Full pipeline · Every time
    - '!Cost + latency · High'
    bad_note: Every request hits the model
    good:
    - Prompt cache · Stable prefix
    - +Answer cache · General only
    - +TTL + purge · On change
    - No personal · Caching
    good_note: Prompt caching plus general-answer caches
  solution: |-
    1. Enable provider prompt caching for the stable prefix (see ctx-06).
    2. Cache answers to general, non-personalised questions (exact and semantic) with TTLs and invalidation on content change.
    3. Never cache personalised answers across users (see ctx-17).
  works: |-
    **Trade-off to manage:** Caches can serve stale content; invalidate on catalog and policy changes.

    **How you prove it worked:**

    - Cache hit rates and cost per conversation.

    **Same pattern elsewhere:** FinTech: during a card outage, thousands ask "Is there a problem with cards?" and each triggers a full RAG pipeline.
  takeaway: The cheapest token is the one you never generate.
  related:
  - ctx-06
  - ctx-17
  - cost-06
  code: |
    def answer(q, user):
        if is_general(q):
            if (hit := exact_cache.get(norm(q))) or (hit := semantic_cache.get(q, min_sim=0.95)):
                return hit
        resp = llm(system=[{"text": STABLE_PREFIX, "cache": True}], user=q)    # provider prompt caching
        if is_general(q):
            semantic_cache.put(q, resp, ttl=86400, source_docs=resp.doc_ids)   # invalidated on content change
        return resp
  lang: python
- id: ops-11
  title: Notebook works, the production rewrite doesn't
  tags:
  - Reliability
  - Compliance
  - FinTech
  scenario: |-
    A data scientist builds a KYC document classifier in a notebook with 96% accuracy. Engineering rewrites it as a service. The service scores 88%: a different PDF library, an unpinned model version and a forgotten text-normalisation cell.
  antipattern: |-
    **Manual translation of experiments into services.**

    *Think of it this way:* Copying a recipe by watching a video and missing the step the chef did off-camera.
  fails: |-
    **Mechanism:** Hidden state, untracked dependencies, and rewrite bugs.

    - Hidden notebook state and cell order.
    - Untracked dependencies.
    - Manual translation introduces bugs.

    **Root cause:** Notebooks handed over instead of artifacts.

    **Where it breaks:** Development workflow.
  diagram:
    bad:
    - Notebook · 96%
    - '!Rewrite · As service'
    - Missed cell · + new libs
    - '!88% · In service'
    bad_note: Rewrite the notebook by hand
    good:
    - Shared module · Tested
    - +Pinned env · Container
    - +Same evals · Both
    - Parity · Checked
    good_note: Shared modules, pinned env, same evals
  solution: |-
    1. Move logic into shared, tested modules used by both notebook and service.
    2. Pin environments and containerise pipelines.
    3. Run the same eval suite against both.
  works: |-
    **Trade-off to manage:** Less freedom in notebooks; much faster delivery.

    **How you prove it worked:**

    - Accuracy parity check between experiment and service.

    **Same pattern elsewhere:** Telco: a churn-reason prototype in a notebook loses accuracy when rebuilt as a streaming job.
  takeaway: Promote artifacts, not notebooks.
  related:
  - ops-02
  code: |
    # notebook and service import the same tested module
    from care_ai.pipeline import build_pipeline          # src/care_ai/pipeline.py, unit-tested

    pipe = build_pipeline(config="configs/prod.yaml")
    # Dockerfile pins: python 3.12, requirements.lock
