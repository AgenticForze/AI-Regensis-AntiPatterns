- id: tel-15
  title: BaaS partner sees another partner's prompts in shared dashboards
  tags:
  - Reliability
  - FinTech
  - Critical
  scenario: |-
    A banking-as-a-service provider offers an AI support assistant to several fintech partners. Partner support engineers get access to a shared observability dashboard. One partner's engineer can filter traces and see another partner's customers' conversations.
  antipattern: |-
    **One telemetry store with no tenant scoping.**

    *Think of it this way:* A shared mailroom where any tenant can open any other tenant's post.
  fails: |-
    **Mechanism:** Telemetry contains customer content, and access control was forgotten.

    - Telemetry isn't scoped by tenant.
    - Access control was designed for the product, not for telemetry.
    - Telemetry contains customer content.

    **Root cause:** Multi-tenant telemetry without isolation.

    **Where it breaks:** Telemetry access control.
  diagram:
    bad:
    - Shared dash · All partners
    - '!No tenant scope · Filters'
    - Other partner · Visible
    - '!Data breach · Contract risk'
    bad_note: One shared telemetry store, no tenant scope
    good:
    - Tenant id · On all data
    - +Row-level · Access
    - +Separate store · Regulated
    - Isolation test · Regular
    good_note: Tenant tags, row-level access, separate stores
  solution: |-
    1. Tag all telemetry with tenant id and enforce row-level access by tenant.
    2. Use separate stores for regulated or high-risk tenants, with data residency where required.
    3. Test isolation like any other security control.
  works: |-
    **Trade-off to manage:** Per-tenant stores raise cost and operations; use them only where required.

    **How you prove it worked:**

    - Access audits and cross-tenant query alerts.

    **Same pattern elsewhere:** Telco: an MVNO's staff see the host operator's other MVNO customers' chats in a shared tool.
  takeaway: Telemetry inherits the data's security requirements.
  related:
  - ctx-17
  - rag-06
  code: |
    def export(span, tenant):
        span.set_attribute("tenant.id", tenant.id)
        store = tenant.dedicated_store if tenant.risk == "high" else shared_store
        store.write(span, region=tenant.data_region)

    # dashboards: row-level security  WHERE tenant_id = current_setting('app.tenant_id')
    def test_tenant_isolation(client_a):
        assert not client_a.query_traces(filter={"tenant.id": "partner-b"})
