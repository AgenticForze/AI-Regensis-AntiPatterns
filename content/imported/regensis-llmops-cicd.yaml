  solution: |-
    1. Tag regulated intents and prompts; changes to them require compliance approval in the PR (CODEOWNERS).
    2. Add deterministic disclosure checks (required phrases or facts) to evals.
    3. Keep an approval record linked to the release manifest.
  works: |-
    **Trade-off to manage:** Slower changes to regulated journeys; that's the point.

    **How you prove it worked:**

    - Regulated changes merged without approval.

    **Same pattern elsewhere:** Telco: a carrier changes its bot's contract-cancellation wording without legal review, breaching consumer-protection rules on cancellation rights.
  takeaway: Regulated changes need a named approver in the pipeline.
  related:
  - gov-03
  - cicd-02
  code: |
    # CODEOWNERS
    # prompts/regulated/**   @compliance-reviewers

    REQUIRED_DISCLOSURES = {"apr_offer": ["Representative APR", "subject to status"]}

    def check_disclosures(intent, reply):
        missing = [p for p in REQUIRED_DISCLOSURES.get(intent, []) if p.lower() not in reply.lower()]
        assert not missing, f"missing disclosures: {missing}"

    manifest["approvals"] = github.pr_approvals(pr_number, team="compliance-reviewers")
