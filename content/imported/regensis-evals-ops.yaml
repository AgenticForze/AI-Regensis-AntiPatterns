- id: eval-11
  title: Offline gains that never move first-contact resolution
  tags:
  - Quality
  - Telco
  scenario: |-
    Over six months, a carrier's chatbot team raises its offline answer-quality score from 71% to 86%. First-contact resolution and repeat-contact rate do not change. The offline set measured whether answers were correct, but customers mostly needed the bot to complete actions (reset voicemail PIN, pay a bill), which it could not do.
  antipattern: |-
    **Never connecting evals to business outcomes.**

    *Think of it this way:* Training a sprinter's form in front of a mirror for months without ever timing a race.
  fails: |-
    **Mechanism:** The offline proxy may not correlate with what users value.

    - The offline metric was a proxy that did not correlate with the business outcome.
    - Nobody validated the proxy against online results.
    - The real failure (no action capability) was invisible to the offline eval.

    **Root cause:** Offline evals were never linked to online business metrics.

    **Where it breaks:** Measurement strategy.
  diagram:
    bad:
    - Offline score · 71% to 86%
    - '!FCR flat · No change'
    - Needed actions · PIN, payment
    - '!Proxy wrong · 6 months'
    bad_note: Optimise an unvalidated offline score
    good:
    - Online metrics · 7-day repeat
    - +A/B test · Big changes
    - +Correlate · Offline vs online
    - Study failures · Find gaps
    good_note: Link offline evals to online outcomes
  solution: |-
    1. Track online outcomes (containment with no repeat contact in 7 days, task completion, CSAT, transfer reason).
    2. Run A/B tests for significant changes and check whether offline gains predict online gains.
    3. Analyse failed sessions to find what the offline set does not measure.
  works: |-
    **Trade-off to manage:** A/B testing needs traffic and time; use it for big changes and offline evals for fast iteration.

    **How you prove it worked:**

    - Correlation between offline score changes and online metric changes across releases.

    **Same pattern elsewhere:** FinTech: a bank bot's answer quality improves but call deflection stays flat, because most callers want to dispute a transaction, which the bot cannot start.
  takeaway: Offline evals are a proxy, so validate the proxy.
  related:
  - aev-20
  - obs-01
  code: |
    def online_outcomes(sessions):
        return {
            "containment_7d": mean(not s.repeat_contact_within(days=7) for s in sessions),
            "task_completion": mean(s.task_completed for s in sessions),
            "csat": mean(s.csat for s in sessions if s.csat),
            "transfer_reasons": Counter(s.transfer_reason for s in sessions if s.transferred)}

    ab = experiment("prompt_v12", control="v11", metric="containment_7d", min_effect=0.02)
    print(correlation(offline_deltas, online_deltas))          # do offline gains predict online gains?
