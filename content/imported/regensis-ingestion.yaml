    - +Cred expiry · Monitored
    - Freshness · Index side
    good_note: Failure and missing-run alerts, credential monitoring
  solution: |-
    1. Alert on job failures and on missing successful runs (dead man's switch).
    2. Monitor credential expiry.
    3. Check freshness and volume from the index side.
  works: |-
