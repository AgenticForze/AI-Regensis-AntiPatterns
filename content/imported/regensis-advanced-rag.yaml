  scenario: |-
    A carrier's retrieval uses a general embedding model. Queries with jargon (MSISDN, ICCID, ONT, VoLTE, APN) retrieve poorly, because the model treats them as rare tokens. The team keeps tuning prompts, but retrieval recall for technical questions stays at 55%.
  antipattern: |-
    **Generic embeddings for domain jargon.**

    *Think of it this way:* A librarian who doesn't know the trade vocabulary of the books.
  fails: |-
    - Embeddings don't capture domain terms.
    - Prompt tuning can't fix retrieval.
