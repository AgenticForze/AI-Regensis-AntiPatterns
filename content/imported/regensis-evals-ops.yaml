- id: eval-12
  title: Same model grades its own dispute letters
  tags:
  - Quality
  - FinTech
  scenario: |-
    A bank drafts chargeback dispute letters with model X and evaluates them with model X as the judge, with no reference letters. The judge passes 96%. Network reviewers reject 15% for missing required elements, the same omissions the judge overlooked.
  antipattern: |-
    **Model X judging model X with no reference answer.**

    *Think of it this way:* Letting a student grade their own exam. They make the same mistakes when grading as they did when answering.
  fails: |-
    **Mechanism:** Self-preference bias and shared blind spots.

    - The generator and judge share blind spots.
    - Self-preference bias makes a model rate its own style highly.
    - No reference answers or required-element lists anchor the judgement.

    **Root cause:** An unanchored self-judge.

    **Where it breaks:** Judge design.
  diagram:
    bad:
    - Model X writes · Dispute letter
    - '!Model X judges · No reference'
    - 96% pass · Shared blind spot
    - '!15% rejected · By networks'
    bad_note: Model X judges model X, no references
    good:
    - Other judge · Different family
    - +Checklist · Required elements
    - +References · Accepted letters
    - Validate · Vs network result
    good_note: Different judge, checklist, real outcomes
  solution: |-
    1. Use a different (often stronger) model family as judge, or several judges.
    2. Give the judge a checklist of required elements and reference letters.
    3. Validate the judge on letters that networks actually rejected.
  works: |-
    **Trade-off to manage:** A stronger judge costs more per evaluation; sample rather than judging everything.

    **How you prove it worked:**

    - Agreement between the judge and the network outcome (accepted or rejected).

    **Same pattern elsewhere:** Telco: the same model writes and judges outage notifications, missing that it never states the estimated restoration time.
  takeaway: Don't let the student grade their own exam.
  related:
  - eval-03
  code: |
    JUDGES = [Judge(model="judge-family-a"), Judge(model="judge-family-b")]   # not the generator's family
    CHECKLIST = ["cites_correct_reason_code", "includes_required_evidence", "within_network_deadline"]

    def grade(letter, reference):
        votes = [j.check(letter, reference, CHECKLIST) for j in JUDGES]
        return {c: all(v[c] for v in votes) for c in CHECKLIST}

    validation = [grade(l.text, l.reference) for l in network_rejected_letters]
    assert recall_of_failures(validation) > 0.9                  # judge must catch real rejections
  lang: python
- id: eval-13
  title: Order-capture pipeline regresses and nobody knows which step
  tags:
  - Quality
  - Cost
  - Telco
  scenario: |-
    A B2B carrier automates order capture from customer emails: classify request, extract services and sites, validate against the catalog, create a draft order (TMF622). Order accuracy drops from 88% to 74% after a release that touched three steps. The team spends a week bisecting.
  antipattern: |-
    **No component-level evals.**

    *Think of it this way:* A factory line that only inspects finished cars. When defects rise, nobody knows which station caused them.
  fails: |-
    **Mechanism:** End-to-end metrics hide which step regressed.

    - Only end-to-end order accuracy is measured.
    - Errors compound across steps and mask each other.
    - Changes to several steps ship together.

    **Root cause:** No component-level (unit) evals for a multi-step pipeline.

    **Where it breaks:** Eval design for pipelines.
  diagram:
    bad:
    - Email to order · 4 stages
    - '!Release · 3 stages changed'
    - 88% to 74% · End-to-end
    - '!Week bisecting · No attribution'
    bad_note: Only end-to-end order accuracy
    good:
    - Classify eval · Accuracy
    - +Extract eval · Field F1
    - +Validate eval · Precision
    - E2E eval · Before release
    good_note: Per-stage evals plus end-to-end
  solution: |-
    1. Evaluate each stage on its own labelled set (classification accuracy, extraction field-level F1, validation precision).
    2. Store intermediate outputs in traces so failures can be attributed to a stage.
    3. Run stage evals in CI for any change to that stage, and end-to-end evals before release.
  works: |-
    **Trade-off to manage:** Labelling intermediate outputs costs more than labelling only the final result.

    **How you prove it worked:**

    - Stage-level dashboards; a drop in one stage's metric pinpoints the regression.

    **Same pattern elsewhere:** FinTech: an invoice-to-payment pipeline (classify, extract, match PO, schedule ACH) regresses and the team cannot tell whether extraction or matching broke.
  takeaway: Unit tests and integration tests apply to LLM systems too.
  related:
  - rag-16
  - aev-10
  code: |
    STAGES = {"classify": (classifier, accuracy), "extract": (extractor, field_f1),
              "validate": (validator, precision)}

    def stage_evals(changed: set[str]):
        for name, (fn, metric) in STAGES.items():
            if name in changed or "all" in changed:
                score = metric(fn, datasets[name])
                assert score >= baseline[name] - 0.01, f"{name} regressed: {score:.3f}"

    with tracer.span("order_capture") as s:                      # intermediate outputs in traces
        s.set("classify.out", c := classifier(msg)); s.set("extract.out", e := extractor(msg, c))
