- id: rag-16
  title: KB migration drops quality and nobody can localize it
  tags:
  - Quality
  - Cost
  - Telco
  scenario: |-
    A carrier migrates its care knowledge base from Confluence to ServiceNow. The chatbot's resolution rate drops from 58% to 47%. The team spends two weeks rewriting prompts. The real cause was that ServiceNow exports dropped image alt text and table formatting, which collapsed retrieval recall for device setup questions.
  antipattern: |-
    **End-to-end accuracy as the only metric.**

    *Think of it this way:* A car that got slower after a service, and the mechanic keeps retuning the engine when the tyres were put on wrong.
  fails: |-
    **Mechanism:** You can't tell if retrieval, reranking, or generation regressed.

    - Only end-to-end resolution rate is measured.
    - Retrieval, reranking and generation share one score.
    - The team guesses at the most visible component, the prompt.

    **Root cause:** No component-level evaluation, so regressions cannot be localized.

    **Where it breaks:** Evaluation design.
  diagram:
    bad:
    - KB migrated · To ServiceNow
    - '!Tables lost · In export'
    - Resolution down · 58% to 47%
    - '!Prompt rewrites · Two weeks lost'
    bad_note: Only end-to-end resolution rate
    good:
    - Retrieval eval · Recall@k
    - +Generation eval · Faithfulness
    - +Compare traces · Doc ids
    - Root cause · Same day
    good_note: Stage-level evals on every change
  solution: |-
    1. Measure retrieval separately (recall@k, MRR against labelled relevant docs) and generation separately (faithfulness, answer relevance) with tools such as RAGAS or TruLens.
    2. Run the retrieval eval as part of any content migration's acceptance criteria.
    3. Keep traces with retrieved document ids so you can compare before and after.
  works: |-
    **Trade-off to manage:** Labelling relevant documents per question takes expert time; start with 200 high-volume intents.

    **How you prove it worked:**

    - Stage-level dashboard per intent; alert when recall drops even if answers still look fluent.

    **Same pattern elsewhere:** FinTech: a bank moves its policy documents to SharePoint; quality drops and the team blames the model upgrade done the same week.
