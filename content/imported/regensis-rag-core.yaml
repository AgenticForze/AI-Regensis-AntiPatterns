- id: rag-13
  title: Six copies of the SIM activation guide after a merger
  tags:
  - Quality
  - Telco
  scenario: |-
    After a merger, a carrier indexes the knowledge bases of both brands plus retail, care and B2B wiki spaces. Six versions of the SIM activation guide exist, two of them for the retired brand's provisioning system. The top 5 results are near- duplicates, and the steps from the retired system come first.
  antipattern: |-
    **Indexing every source without deduplication.**

    *Think of it this way:* Asking for directions and getting the same answer from five people, four of whom are reading from an old map.
  fails: |-
    **Mechanism:** Duplicates crowd out diverse evidence. Old copies conflict with new ones.

    - Near-duplicate documents crowd the top-k and remove diversity.
    - Older copies conflict with the current one.
    - Nothing marks which source is authoritative.

    **Root cause:** Ingestion has no deduplication and no notion of a canonical source.

    **Where it breaks:** Ingestion and ranking.
  diagram:
    bad:
    - Two brands · Many wikis
    - '!6 copies · Same guide'
    - Top-5 = dupes · Old ones first
    - '!Wrong steps · Retired system'
    bad_note: Index every wiki copy
    good:
    - Hash + MinHash · At ingestion
    - +Canonical tag · One owner
    - +MMR ranking · Diverse top-5
    - Current steps · Cited
    good_note: Dedup, canonical source, MMR
  solution: |-
    1. Deduplicate at ingestion with content hashing plus MinHash for near-duplicates.
    2. Mark a canonical source per topic, and down-rank or drop non-canonical copies.
    3. Apply MMR (maximal marginal relevance) at retrieval to keep results diverse.
    4. Retire content from decommissioned systems with the system itself.
  works: |-
    **Trade-off to manage:** Aggressive dedup can remove legitimate channel-specific variants; keep a channel tag and dedup within channel.

    **How you prove it worked:**

    - Duplicate ratio in the top-5 per query.
    - Content inventory report showing copies per topic.

    **Same pattern elsewhere:** FinTech: after acquiring another bank, two different wire cut-off times live in the index and the bot quotes the acquired bank's.
  takeaway: Diversity in the top-k is a feature.
  related:
  - rag-14
  - data-04
  code: |
    def ingest(doc):
        h = sha256(normalize(doc.text))
        if registry.exists(h): return "exact-duplicate"
        if (near := minhash_lsh.query(minhash(doc.text), threshold=0.9)):
            doc.meta["canonical"] = registry.is_canonical(doc.topic, doc.source)
            if not doc.meta["canonical"]: return f"near-duplicate of {near[0]}"
        index.add(doc); registry.add(h, doc)

    results = mmr(query_vec, candidates, k=6, lambda_=0.7)      # diverse results at query time
