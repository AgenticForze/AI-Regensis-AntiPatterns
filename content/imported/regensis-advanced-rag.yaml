- id: ft-19
  title: Fine-tune saves on tokens, costs more to host
  tags:
  - Quality
  - Cost
  - Telco
  scenario: |-
    A carrier fine-tunes a model to shorten prompts, cutting tokens per call by 60%. The fine-tuned model requires a dedicated hosted endpoint billed hourly. At the carrier's traffic levels, total cost rises.
  antipattern: |-
    **Count only per-token savings.**

    *Think of it this way:* Buying a van to save on courier fees when you only send three parcels a week.
  fails: |-
    - Only per-token savings were considered.
    - Hosting and minimum commitments ignored.
    - Traffic profile not modelled.

    **Root cause:** Incomplete cost model.

    **Where it breaks:** Business case.
  diagram:
    bad:
    - Fine-tune · Shorter prompts
    - '!-60% tokens · Per call'
    - Dedicated · Endpoint hourly
    - '!Total cost · Up'
    bad_note: Count only per-token savings
    good:
    - TCO model · All costs
    - +Traffic · Modelled
    - +Alternatives · Caching, routing
    - Revisit · As traffic shifts
    good_note: Total cost of ownership against real traffic
  solution: |-
    1. Model total cost of ownership (hosting, training, evaluation, retraining, ops) against traffic.
    2. Compare with prompt caching, routing and smaller hosted models.
    3. Revisit as traffic changes.
  works: |-
    **Trade-off to manage:** None significant.

    **How you prove it worked:**

    - Cost per thousand requests including hosting.

    **Same pattern elsewhere:** FinTech: a bank's fine-tuned model sits on a dedicated endpoint for a low-volume internal tool.
  takeaway: Count the whole cost, not just the tokens.
  related:
  - cost-18
  - cost-01
  code: |
    def monthly_tco(option, traffic_tokens_m):
        if option == "self_hosted_finetune":
            return gpu_hours(traffic_tokens_m) * GPU_RATE + TRAINING_AMORTISED + EVAL_OPS + RETRAIN_AMORTISED
        if option == "hosted_small_cached":
            return traffic_tokens_m * SMALL_PRICE * (1 - CACHE_HIT * 0.9)
        return traffic_tokens_m * LARGE_PRICE

    best = min(["self_hosted_finetune", "hosted_small_cached", "hosted_large"], key=lambda o: monthly_tco(o, T))
