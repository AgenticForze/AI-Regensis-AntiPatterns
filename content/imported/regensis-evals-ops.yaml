- id: aev-03
  title: Plan-change evals demand one exact tool sequence
  tags:
  - Quality
  - Telco
  scenario: |-
    A carrier's plan-change agent is evaluated by exact match against a golden tool-call sequence: get_account, get_plans, check_eligibility, change_plan. A new version calls check_eligibility before get_plans, which is equally valid, and fails 40% of evals. The team reverts an improvement because the eval said it was worse.
  antipattern: |-
    **Requiring one golden trajectory.**

    *Think of it this way:* Marking a maths answer wrong because the student did the steps in a different but correct order.
  fails: |-
    **Mechanism:** Many paths are equally correct. Strict matching punishes valid variation and rewards overfitting.

    - Many trajectories are equally correct.
    - Exact matching punishes valid variation.
    - It also rewards overfitting to one script.

    **Root cause:** The eval encodes one path instead of the constraints that matter.

    **Where it breaks:** Trajectory scoring.
  diagram:
    bad:
    - Golden path · 4 calls fixed
    - '!Valid reorder · New version'
    - 40% fail · Exact match
    - '!Revert · Good change lost'
    bad_note: Exact match on one golden sequence
    good:
    - Must include · Eligibility
    - +Must not · Cancel tools
    - +Order rule · Check first
    - Final state · Plan changed
    good_note: Invariants, order rules only where needed
  solution: |-
    1. Check invariants (must include eligibility check before change_plan, must not call cancel tools) instead of the full sequence.
    2. Apply order constraints only where the business requires them.
    3. Combine invariants with final-state checks.
  works: |-
    **Trade-off to manage:** Invariants can miss subtle inefficiencies; track step counts separately.

    **How you prove it worked:**

    - Review eval failures for valid alternative paths.

    **Same pattern elsewhere:** FinTech: an address-change agent fails evals for looking up the customer by phone instead of by account number.
  takeaway: Grade constraints, not a script.
  related:
  - aev-02
  code: |
    INVARIANTS = [
        lambda calls: "check_eligibility" in calls and calls.index("check_eligibility") < calls.index("change_plan"),
        lambda calls: not any(c.startswith("cancel_") for c in calls),
    ]

    def grade_plan_change(trace, env):
        calls = [s.tool for s in trace.tool_spans]
        return all(inv(calls) for inv in INVARIANTS) and env.subscription(trace.sub_id).plan == trace.case.target_plan
  lang: python
- id: aev-04
  title: Collections agent eval sends real emails to customers
  tags:
  - Quality
  - FinTech
  - Critical
  scenario: |-
    A lender runs a new evaluation of its collections agent against a staging environment that, unknown to the team, is connected to the production email service. 400 real customers receive payment reminder emails, some outside allowed contact hours, creating FDCPA and complaint exposure.
  antipattern: |-
    **No sandbox for agent evals.**

    *Think of it this way:* Testing a fire alarm by setting fire to the building.
  fails: |-
    **Mechanism:** Agent evals execute actions. Real tools have real side effects.

    - Agent evals execute real actions.
    - Staging shared credentials or connectors with production.
    - No guard prevented outbound messages from test runs.

    **Root cause:** No isolated simulation environment for agent evaluation.

    **Where it breaks:** Eval infrastructure.
  diagram:
    bad:
    - Eval run · Collections
    - '!Staging · Prod email wired'
    - 400 emails · Real customers
    - '!FDCPA risk · Complaints'
    bad_note: Evals in a staging env wired to prod
    good:
    - Sandbox · Fake customers
    - +Mocked tools · Recorded
    - +Egress blocked · Allow-list only
    - Reset state · Each run
    good_note: Sandbox with mocked tools and blocked egress
  solution: |-
    1. Run agent evals in a sandbox with mocked or recorded tools and seeded fake customers.
    2. Use test tenants and allow-listed test recipients only; block outbound channels at the network level.
    3. Reset environment state for every run.
  works: |-
    **Trade-off to manage:** Simulators can drift from real systems; refresh recordings regularly.

    **How you prove it worked:**

    - Alerts on any outbound message from eval or staging identities.

    **Same pattern elsewhere:** Telco: an eval run of an outage-notification agent sends real SMS to 10,000 subscribers.
  takeaway: Agent evals need a simulator, not production.
  related:
  - aev-05
  - aev-14
  - cicd-08
  code: |
    @pytest.fixture
    def sandbox():
        env = Sandbox(tenant="eval-tenant", seed_customers=fake_customers(n=50))
        env.tools.email = RecordingMock(allow=["@eval.invalid"])      # allow-listed test recipients only
        env.network.block_egress(except_=["mock-services.internal"])  # outbound blocked at network level
        yield env
        env.reset()                                                    # fresh state every run

    def test_collections(sandbox):
        run = agent.run(task="Remind overdue customer C-17", env=sandbox)
        assert sandbox.tools.email.sent_to("C-17")
