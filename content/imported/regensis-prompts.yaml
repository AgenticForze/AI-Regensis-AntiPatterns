- id: prm-13
  title: Port-in form extraction differs between runs
  tags:
  - Quality
  - Telco
  scenario: |-
    A carrier extracts fields from port-in authorisation forms with temperature 1.0, the SDK default. The same scanned form, processed twice, gives different account numbers in 3% of cases. Ports are rejected by the losing carrier for mismatched data.
  antipattern: |-
    **Default or high temperature for deterministic tasks.**

    *Think of it this way:* Asking a clerk to copy a number and letting them improvise.
  fails: |-
    **Mechanism:** Sampling randomness adds variance where none is wanted.

    - High temperature adds randomness to a deterministic task.
    - Sampling parameters were never chosen deliberately.
    - No cross-check of extracted numbers.

    **Root cause:** Sampling parameters treated as defaults rather than part of the prompt.

    **Where it breaks:** Model call configuration.
  diagram:
    bad:
    - Temp 1.0 · SDK default
    - '!Same form · Run twice'
    - 3% differ · Account no.
    - '!Port rejected · Mismatch'
    bad_note: Default temperature 1.0 for extraction
    good:
    - Temp low · Extraction
    - +Validate · Format, checksum
    - +Cross-check · Customer input
    - Eval params · Like prompts
    good_note: Low temperature, validation, evaluated params
  solution: |-
    1. Use low temperature for extraction and classification.
    2. Validate extracted values (format, checksum, match against what the customer typed).
    3. Evaluate parameter choices like any other prompt change.
  works: |-
    **Trade-off to manage:** Low temperature can repeat the same error consistently; validation catches it.

    **How you prove it worked:**

    - Consistency rate across repeated runs; rejection rate by reason.

    **Same pattern elsewhere:** FinTech: IBANs extracted from invoices vary between runs.
  takeaway: Sampling parameters are part of the prompt.
  related:
  - eval-07
  code: |
    PORT_FIELDS = {"msisdn": r"^\+1\d{10}$", "account_number": r"^\d{6,12}$", "pin": r"^\d{4,10}$"}

    out = llm.structured(form_image_text, schema=PortInForm, temperature=0)
    for field, rx in PORT_FIELDS.items():
        v = getattr(out, field)
        if not re.fullmatch(rx, v) or v != normalize(customer_typed.get(field, v)):
            out = flag_for_review(out, field)
