- id: cost-14
  title: Large model classifying 100 million transactions a month
  tags:
  - Cost
  - FinTech
  scenario: |-
    A neobank uses a large general model with a long prompt to categorise every card transaction (100 million a month). It works, but costs $180k a month. A small model fine-tuned on two years of labelled categories would match the accuracy at a fraction of the cost.
  antipattern: |-
    **Large model for a narrow, huge task.**

    *Think of it this way:* Hiring a senior consultant to sort the post.
  fails: |-
    - A general model used for a narrow, high-volume task.
    - Labelled data exists but isn't used.
    - Cost scales linearly with volume.

    **Root cause:** No consideration of specialised small models.

    **Where it breaks:** Model strategy.
  diagram:
