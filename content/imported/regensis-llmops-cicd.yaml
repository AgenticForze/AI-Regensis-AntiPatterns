- id: cicd-04
  title: Two-hour eval suite on every PR gets skipped
  tags:
  - Reliability
  - Cost
  - Telco
  scenario: |-
    A carrier runs its full 3,000-case eval suite, including long agent tasks, on every pull request. It takes two hours and costs $60. Engineers start adding [skip-evals] to commit messages, and soon most PRs ship untested.
  antipattern: |-
    **Full suite on every PR.**

    *Think of it this way:* An airport security line so slow that staff open a side door.
  fails: |-
    - One suite for every purpose.
    - Slow feedback leads to bypasses.
    - Cost discourages running it.

    **Root cause:** No tiered eval strategy.

    **Where it breaks:** CI design.
  diagram:
    bad:
    - 3,000 cases · Every PR
    - '!2 hours · $60 each'
    - '[skip-evals] · Added'
    - '!Untested · Most PRs'
    bad_note: Full suite on every PR
    good:
    - PR smoke · Under 5 min
    - +Merge suite · Under 30 min
    - +Nightly · Full + long
    - By change · Selected
    good_note: Tiered evals selected by change
  solution: |-
    1. Tier evals (PR smoke under 5 minutes, merge suite under 30 minutes, nightly full suite including long tasks).
    2. Select PR evals by what changed (prompt for billing runs billing cases).
    3. Disallow skip flags on protected branches.
  works: |-
    **Trade-off to manage:** Smaller PR suites can miss rare regressions; nightly runs catch them.

    **How you prove it worked:**

    - Share of merged PRs with eval results.

    **Same pattern elsewhere:** FinTech: a bank's eval suite takes so long that releases are batched monthly, slowing every fix.
  takeaway: Fast evals get run. Slow evals get skipped.
  related:
  - cicd-01
  - cicd-10
  code: |
    TIERS = {"pr": {"max_minutes": 5, "suite": "smoke"},
             "merge": {"max_minutes": 30, "suite": "standard"},
             "nightly": {"suite": "full", "include": ["long_tasks"]}}

    def pr_cases(changed_files):
        areas = {AREA_OF[f] for f in changed_files if f in AREA_OF}          # prompts/billing → billing cases
        return [c for c in SUITES["smoke"] if c.area in areas] or SUITES["smoke"]

    # branch protection: required check "ai-evals/pr"; [skip evals] not honoured on main
