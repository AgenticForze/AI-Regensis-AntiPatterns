        facts = xbrl.facts(ticker, concepts=["CommonStockDividendsPerShareDeclared"], periods="last_4")
        if facts:
            return llm.explain(question, data=facts)                  # structured facts first
        html = edgar.latest_filing_html(ticker, form="10-Q")
