  - tel-14
  code: |
    ALLOWED_LABELS = {"model", "feature", "intent", "tenant_tier", "status"}

    def record_latency(seconds, **labels):
        bad = set(labels) - ALLOWED_LABELS
        if bad:
            raise ValueError(f"high-cardinality labels not allowed on metrics: {bad}")   # put them on traces
        llm_latency.labels(**labels).observe(seconds)

    span.set_attribute("account.id_hash", h(account_id))                           # per-customer detail on traces
