    def delegate(sub, brief: Brief):
        result = sub.run(context=brief.model_dump())              # scoped brief, not the full 100k
        return result.condensed                                   # findings only, no transcript

    briefs = [Brief(task=f"Check {r} exposure", inputs={"region": r}, constraints=LIMITS,
                    output_schema=Exposure.model_json_schema()) for r in REGIONS]
