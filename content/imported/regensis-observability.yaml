  code: |
    PRICES = {  # versioned price table, USD per 1M tokens
        ("model-x", "2026-10"): {"input": 3.0, "output": 15.0, "cache_read": 0.3, "cache_write": 3.75}}

    def cost(model, usage, month):
        p = PRICES[(model, month)]
        return (usage.input_tokens * p["input"] + usage.output_tokens * p["output"] +
                usage.cache_read_input_tokens * p["cache_read"]) / 1e6   # provider-reported usage, not a local tokenizer

    assert abs(ledger.month_total() - invoice.total) / invoice.total < 0.02, "reconcile monthly"
  lang: python
- id: tel-13
  title: Support tickets are the only quality signal
  tags:
  - Reliability
  - FinTech
  scenario: |-
    A bank learns about assistant quality problems from complaints weeks later. The app already knows when a user rephrases the same question, copies an answer, abandons, or taps "talk to an agent", but none of this is emitted as telemetry.
  antipattern: |-
    **No in-product feedback events.**

    *Think of it this way:* A shop that only learns customers are unhappy from formal complaints, while ignoring people putting items back and walking out.
  fails: |-
    **Mechanism:** You lack the fastest, cheapest quality signal.

    - No in-product feedback events.
    - Implicit signals are available but discarded.
    - Feedback isn't tied to traces.

    **Root cause:** Feedback telemetry was never designed.

    **Where it breaks:** Product analytics and instrumentation.
  diagram:
    bad:
    - Complaints · Weeks later
    - '!Rephrase · Not captured'
    - Abandon · Not captured
    - '!Slow fixes · No signal'
    bad_note: Learn quality from complaints
    good:
    - Thumbs · Explicit
    - +Rephrase, copy · Implicit
    - +Escalate · Event
    - Trace id · On every event
    good_note: Explicit and implicit feedback events with trace ids
  solution: |-
    1. Emit explicit feedback (thumbs, ratings) and implicit events (rephrase, retry, copy, abandon, escalate) with the trace id.
    2. Build quality indicators from them per intent.
  works: |-
    **Trade-off to manage:** Implicit signals are noisy; use them as triage signals, not ground truth.

    **How you prove it worked:**

    - Implicit-dissatisfaction rate per intent and version.

    **Same pattern elsewhere:** Telco: a carrier ignores that customers retype "speak to a human" in 20% of billing chats.
  takeaway: Implicit feedback is free telemetry.
  related:
  - obs-03
  code: |
    IMPLICIT = {"rephrase", "retry", "copy", "abandon", "escalate"}

    def emit_feedback(trace_id, kind, value=None):
        assert kind in IMPLICIT | {"thumbs", "rating"}
        events.emit("assistant_feedback", trace_id=trace_id, kind=kind, value=value)

    quality = sql("""SELECT intent, AVG(CASE WHEN kind='thumbs' AND value='down' THEN 1 ELSE 0 END) AS down_rate,
                     AVG(CASE WHEN kind='rephrase' THEN 1 ELSE 0 END) AS rephrase_rate
                     FROM assistant_feedback JOIN traces USING (trace_id) GROUP BY intent""")
  lang: python
- id: tel-14
  title: Finding failed refunds means regex over 500 GB of logs
  tags:
  - Reliability
  - Cost
  - Telco
  scenario: |-
    A carrier's agent logs lines like "Agent applied credit of 25 dollars to acct 123...". When finance asks how many credits failed last month, an engineer spends two days writing regex over 500 GB of logs and still isn't sure the number is right.
  antipattern: |-
    **`print(f"Agent did {x}")` style logging.**

    *Think of it this way:* Keeping accounts as a diary instead of a ledger.
  fails: |-
    **Mechanism:** Unstructured text can't be queried or aggregated reliably.

    - Logs are free-text sentences.
    - Formats vary by developer and change over time.
    - Queries are slow and unreliable.

    **Root cause:** Unstructured logging.

    **Where it breaks:** Logging practice.
  diagram:
    bad:
    - '''Applied credit'' · Prose log'
    - '!Formats vary · By developer'
    - 500 GB regex · Two days
    - '!Unsure count · For finance'
    bad_note: Free-text log sentences
    good:
    - JSON event · credit_applied
    - +Keys · Amount, status
    - +Trace ids · Linked
    - Query · Seconds
    good_note: Structured JSON events with a schema
  solution: |-
    1. Emit structured JSON events with consistent keys (event, tool, status, amount, currency, account_ref, trace_id, span_id).
    2. Define an event schema for business actions.
  works: |-
    **Trade-off to manage:** Structured events are less readable raw; tooling handles that.

    **How you prove it worked:**

    - Share of logs that parse as structured events.

    **Same pattern elsewhere:** FinTech: a bank can't count fee reversals done by its agent without parsing prose logs.
  takeaway: Log events, not sentences.
  related:
  - tel-03
  code: |
    class RefundEvent(BaseModel):
        event: Literal["refund.requested", "refund.issued", "refund.failed"]
        tool: str; status: str; amount: Decimal; currency: str
        account_ref: str; trace_id: str; span_id: str

    def log_refund(evt: RefundEvent):
        logger.info(evt.model_dump_json())           # structured JSON, consistent keys

    # query: SELECT * FROM logs WHERE event = 'refund.failed' AND ts > now() - interval '1 day'
