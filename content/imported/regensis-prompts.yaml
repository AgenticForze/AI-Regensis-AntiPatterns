- id: prm-15
  title: SIM registration extractor invents an ID number from a blurry photo
  tags:
  - Quality
  - Telco
  scenario: |-
    In a market where SIM registration requires a national ID, a carrier extracts ID fields from photos. For blurry photos, the model invents a plausible ID number instead of returning nothing. Hundreds of SIMs are registered to wrong identities, breaching registration rules.
  antipattern: |-
    **Forcing an answer in every case.**

    *Think of it this way:* A form that makes "ID number" mandatory, so people write anything to get past it.
  fails: |-
    **Mechanism:** The model has no permitted way to say "not found".

    - The output schema requires every field.
    - The prompt gives no legal way to say "unreadable".
    - No validation of the ID format or checksum.

    **Root cause:** No escape hatch for missing information.

    **Where it breaks:** Output schema and prompt.
  diagram:
    bad:
    - Blurry ID · Photo
    - '!Field required · Schema'
    - Invented ID · Plausible
    - '!Wrong owner · SIM registered'
    bad_note: Every field required, no 'unreadable'
    good:
    - Nullable · + confidence
    - +Checksum · Validate
    - +Re-capture · Or review
    - Null evals · Blurry cases
    good_note: Nullable fields, checksum, re-capture flow
  solution: |-
    1. Allow null or "unreadable" values, with a confidence field, and define when to use them.
    2. Validate ID format and checksum, and route failures to manual review or a re-capture request.
    3. Include blurry and partial photos in evals with null as the correct answer.
  works: |-
    **Trade-off to manage:** More manual reviews; required by the regulation.

    **How you prove it worked:**

    - Rate of checksum failures and null answers.

    **Same pattern elsewhere:** FinTech: a KYC extractor invents a passport expiry date when the field is covered by a thumb.
  takeaway: Give the model a legal way to say I don't know.
  related:
  - rag-10
  - eval-08
  code: |
    class IdExtraction(BaseModel):
        id_number: str | None                    # null when unreadable
        readable: bool
        confidence: float

    out = llm.structured(photo, schema=IdExtraction,
                         instructions="If any digit is unclear, set id_number to null and readable to false.")
    if not out.readable or out.confidence < 0.9 or not id_checksum_ok(out.id_number):
        return request_recapture(reason="photo unclear")
  lang: python
- id: prm-16
  title: Max fee waiver of $25 in the prompt, $100 in practice
  tags:
  - Quality
  - FinTech
  scenario: |-
    A bank's assistant prompt says "You may waive fees up to $25 per customer per year." Customers who push or claim special circumstances get $100 waived. The waiver tool accepts any amount, so the prompt was the only control.
  antipattern: |-
    **Business rules enforced only through instructions.**

    *Think of it this way:* A sign saying "maximum 2 cookies" next to an open jar.
  fails: |-
    **Mechanism:** Prompts are probabilistic guidance, not enforcement.

    - Business rules are enforced only by instructions.
    - Prompts are probabilistic guidance.
    - The tool doesn't check limits or history.

    **Root cause:** Policy enforcement placed in the prompt instead of code.

    **Where it breaks:** Tool layer.
  diagram:
    bad:
    - Prompt · Max $25
    - '!Pushy customer · Special case'
    - Tool accepts · Any amount
    - '!$100 waived · Repeatedly'
    bad_note: Limit stated only in the prompt
    good:
    - Tool cap · $25 per year
    - +Fee history · From system
    - +Refusal reason · Returned
    - Prompt · Explains only
    good_note: Limit enforced in the tool from fee history
  solution: |-
    1. Enforce the limit in the waiver tool (amount cap, yearly total from the fee system).
    2. Return a clear refusal reason the model can explain.
    3. Use the prompt to explain the policy to customers, not to enforce it.
  works: |-
    **Trade-off to manage:** None significant.

    **How you prove it worked:**

    - Waivers per customer per year; limit-breach attempts.

    **Same pattern elsewhere:** Telco: "maximum $20 goodwill credit" in the prompt, while the credit API accepts any value.
  takeaway: Prompts guide. Code enforces.
  related:
  - agf-05
  - ctx-03
  code: |
    @tool
    def waive_fee(account_id: str, fee_id: str, amount: Decimal):
        cap, used = Decimal("25"), fee_system.waived_this_year(account_id)
        if amount > cap or used + amount > YEARLY_LIMIT:
            return {"status": "REFUSED",
                    "why": f"waivers are limited to ${cap} per fee and ${YEARLY_LIMIT} per year (used ${used})"}
        return fee_system.waive(account_id, fee_id, amount)
  lang: python
- id: prm-17
  title: A magic prompt template adds 800 tokens and no gain
  tags:
  - Quality
  - Cost
  - Telco
  scenario: |-
    An engineer copies a popular "ultimate system prompt" template from social media into a carrier's ticket-classification step. It adds 800 tokens of generic instructions (think step by step, take a deep breath, you will be tipped). Evals show no gain, and cost rises 40% for that step.
  antipattern: |-
    **Cargo-cult prompting.**

    *Think of it this way:* A lucky charm taped to the server rack.
  fails: |-
    **Mechanism:** Generic tricks are rarely tuned to your task or model.

    - Generic tricks aren't tuned to the task or model.
    - Nobody evaluated the change.
    - Tokens cost money on every call.

    **Root cause:** Cargo-cult prompting.

    **Where it breaks:** Prompt design practice.
  diagram:
    bad:
    - Viral template · Copied
    - '!+800 tokens · Generic'
    - No gain · In evals
    - '!+40% cost · That step'
    bad_note: Copy a viral prompt template
    good:
    - Minimal · Start small
    - +Add on fail · Eval-driven
    - +Ablate · Sections
    - Lean prompt · Cheaper
    good_note: Minimal prompt, add only what evals justify
  solution: |-
    1. Start with a minimal prompt and add instructions only when evals show a failure they fix.
    2. Ablate sections and remove those with no effect.
  works: |-
    **Trade-off to manage:** None significant.

    **How you prove it worked:**

    - Tokens per call and eval impact per prompt section.

    **Same pattern elsewhere:** FinTech: a bank's extraction prompt carries a long "expert persona" preamble that costs money and changes nothing.
  takeaway: Every token in the prompt should earn its place.
  related:
  - prm-03
  - prm-14
  code: |
    prompt = MINIMAL_PROMPT
    for section in CANDIDATE_SECTIONS:                    # add only what evals justify
        gain = eval_suite.run(prompt + section).score - eval_suite.run(prompt).score
        if gain > 0.01:
            prompt += section
    print(tokens(prompt), eval_suite.run(prompt).score)
  lang: python
- id: prm-18
  title: French-Canadian customers get English replies and US date formats
  tags:
  - Quality
  - FinTech
  scenario: |-
    A Canadian bank's assistant serves English and French speakers. The prompt doesn't specify response language or formats. Quebec customers writing in French sometimes get English replies, and dates appear as 10/11/2026, which French-speaking customers read as 10 November rather than October 11.
  antipattern: |-
    **No locale handling.**

    *Think of it this way:* A receptionist who answers in whatever language the last caller used.
  fails: |-
    **Mechanism:** The model guesses language and formats from mixed signals.

    - Locale is inferred from mixed signals.
    - Date and currency formats aren't specified.
    - Evals are English-only.

    **Root cause:** Locale not passed as an explicit input.

    **Where it breaks:** Prompt inputs and formatting.
  diagram:
    bad:
    - French message · Quebec
    - '!English reply · Sometimes'
    - 10/11/2026 · Ambiguous
    - '!Confusion · Wrong date'
    bad_note: Language and formats left to the model
    good:
    - Locale input · fr-CA
    - +Reply language · Specified
    - +Dates in code · Formatter
    - Per-locale · Evals
    good_note: Explicit locale, formats rendered in code
  solution: |-
    1. Pass the customer's locale explicitly and specify response language.
    2. Format dates and currency in code (ISO dates or locale-aware formatters), not by the model.
    3. Evaluate per language.
  works: |-
    **Trade-off to manage:** None significant.

    **How you prove it worked:**

    - Language-mismatch rate; per-locale quality.

    **Same pattern elsewhere:** Telco: a carrier's Spanish-language bot replies in English when the plan name is in English.
  takeaway: Make locale an explicit input.
  related:
  - rag-20
  code: |
    from babel.dates import format_date
    from babel.numbers import format_currency

    locale = customer.locale                                  # "fr_CA"
    facts = {"due_date": format_date(bill.due, locale=locale),
             "amount": format_currency(bill.total, "CAD", locale=locale)}   # formatted in code
    reply = llm(system=f"Respond in {LANG_NAME[locale]}.", context=facts, user=q)
    eval_by_language(["en_CA", "fr_CA"])
  lang: python
- id: prm-19
  title: Hello {customer_name} reaches customers
  tags:
  - Quality
  - Telco
  scenario: |-
    A carrier's outage-notification prompt uses a template with {plan_name} and {customer_name}. A data pipeline change drops plan_name. The template renders the literal text "{plan_name}", and the model includes it in 40,000 SMS messages.
  antipattern: |-
    **Unchecked template rendering.**

    *Think of it this way:* A mail merge that prints "Dear <<FirstName>>" on every letter.
  fails: |-
    **Mechanism:** Template bugs silently corrupt prompts.

    - Template rendering doesn't fail on missing variables.
    - Inputs aren't typed or validated.
    - No tests on rendered prompts.

    **Root cause:** Unchecked template rendering.

    **Where it breaks:** Templating layer.
  diagram:
    bad:
    - Field dropped · plan_name
    - '!Renders literal · ''{plan_name}'''
    - Model repeats · In SMS
    - '!40k messages · Sent'
    bad_note: Lenient templates, no output scan
    good:
    - Strict render · Raise if missing
    - +Typed inputs · Validated
    - +Unit tests · Rendered
    - Output scan · Placeholders
    good_note: Strict rendering, typed inputs, output scan
  solution: |-
    1. Use strict templating that raises on missing variables (for example StrictUndefined in Jinja2).
    2. Validate inputs with types before rendering.
    3. Unit-test rendered prompts, and scan outputs for template syntax before sending.
  works: |-
    **Trade-off to manage:** Strict rendering causes hard failures; fail to a safe default message.

    **How you prove it worked:**

    - Output scan for braces and placeholder patterns.

    **Same pattern elsewhere:** FinTech: a bank's payment-reminder messages include "{due_date}" when a field is missing.
  takeaway: Test the template rendering, not just the model.
  related:
  - cicd-03
  code: |
    from jinja2 import Environment, StrictUndefined

    env = Environment(undefined=StrictUndefined)              # raises on missing variables
    class Vars(BaseModel):
        customer_name: constr(min_length=1); plan: str

    text = env.from_string(TEMPLATE).render(**Vars(**raw_vars).model_dump())
    assert not re.search(r"\{\{.*?\}\}|\{[a-z_]+\}", reply), "template syntax leaked"
  lang: python
- id: prm-20
  title: Weeks of hand-tuning for a 1% gain
  tags:
  - Quality
  - Cost
  - FinTech
  scenario: |-
    A bank's document-classification team spends six weeks rewording prompts to move accuracy from 91% to 92%. Each change is tested on the latest failing example, sometimes undoing earlier gains.
  antipattern: |-
    **Manual trial-and-error without a system.**

    *Think of it this way:* Tuning a radio by turning the dial a millimetre at a time and listening by ear.
  fails: |-
    **Mechanism:** Slow, unrepeatable, and biased by the last example seen.

    - Manual trial and error is slow and unrepeatable.
    - Changes are biased by the last example seen.
    - Prompting may have plateaued.

    **Root cause:** No systematic optimisation approach.

    **Where it breaks:** Optimisation strategy.
  diagram:
    bad:
    - Reword · By hand
    - '!Last example · Biased'
    - 6 weeks · +1 point
    - '!Undo gains · Sometimes'
    bad_note: Endless manual rewording
    good:
    - Eval set · Change log
    - +DSPy · Optimiser
    - +Fine-tune · If plateau
    - Held-out · Test set
    good_note: Eval-driven, automated optimisation or fine-tune
  solution: |-
    1. Iterate with an eval set and keep a change log of results.
    2. Try automated prompt optimisation (for example DSPy) over the eval set.
    3. Consider fine-tuning a small model once prompting plateaus and data exists.
  works: |-
    **Trade-off to manage:** Automated optimisation can overfit; keep a held-out set.

    **How you prove it worked:**

    - Accuracy per week of effort.

    **Same pattern elsewhere:** Telco: a carrier hand-tunes a ticket-routing prompt for months instead of training a small classifier on two years of labelled tickets.
  takeaway: When hand-tuning plateaus, optimise systematically or change the approach.
  related:
  - ft-03
  - eval-17
  code: |
    import dspy

    class Explain(dspy.Signature):
        """Explain a bill line to a customer."""
        bill_line = dspy.InputField(); explanation = dspy.OutputField()

    program = dspy.ChainOfThought(Explain)
    optimizer = dspy.MIPROv2(metric=bill_explain_metric, auto="light")
    optimized = optimizer.compile(program, trainset=dev_set)          # automated, over the eval set
    changelog.append({"version": "v15", "score": evaluate(optimized, test_set)})
  lang: python
