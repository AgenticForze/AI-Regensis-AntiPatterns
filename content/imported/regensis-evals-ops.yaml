- id: aev-02
  title: Dispute agent grants provisional credit before verifying identity
  tags:
  - Quality
  - FinTech
  scenario: |-
    A bank's card-dispute agent is evaluated on whether the dispute ends with the right status and provisional credit. It scores 93%. A review of traces shows that in 8% of runs it issued provisional credit before completing identity verification, which policy forbids. Fraudsters learned to exploit the gap.
  antipattern: |-
    **Outcome-only grading.**

    *Think of it this way:* Checking that a bank teller ended the day with the right cash total, without checking whether they asked for ID before paying out.
  fails: |-
    **Mechanism:** A correct end state can hide dangerous, wasteful, or policy-violating steps.

    - Outcome-only grading passes runs with forbidden steps.
    - Order of operations matters for policy, not only for the result.
    - The trajectory was never inspected.

    **Root cause:** No trajectory evaluation of required and forbidden steps.

    **Where it breaks:** Eval suite and tool preconditions.
  diagram:
    bad:
    - Dispute agent · Eval run
    - '!Right status · Credit issued'
    - Credit first · ID check later
    - '!Exploited · By fraudsters'
    bad_note: Grade only the final outcome
    good:
    - Required order · Verify, credit
    - +Forbidden · Unverified credit
    - +Precondition · In credit tool
    - Trace audit · In production
    good_note: Trajectory rules plus tool preconditions
  solution: |-
    1. Add trajectory checks (verify_identity must precede issue_credit, and no credit tool call in unverified sessions).
    2. Enforce the precondition in the credit tool as well, using session verification status.
    3. Track step count and redundant calls as efficiency metrics.
  works: |-
    **Trade-off to manage:** Trajectory checks need maintained policy definitions; keep them few and important.

    **How you prove it worked:**

    - Automated trajectory assertions on every eval run; production trace audits for ordering violations.

    **Same pattern elsewhere:** Telco: a SIM-swap agent completes the swap correctly but called the swap tool before the fraud score came back.
  takeaway: How the agent got there matters as much as where it landed.
  related:
  - aev-03
  - aev-09
  - agf-13
  code: |
    def trajectory_checks(trace):
        calls = [s.tool for s in trace.tool_spans]
        verified_at = calls.index("verify_identity") if "verify_identity" in calls else None
        credit_at = calls.index("issue_credit") if "issue_credit" in calls else None
        return {"identity_before_credit": credit_at is None or (verified_at is not None and verified_at < credit_at),
                "steps": len(calls),
                "redundant_calls": len(calls) - len(set(map(str, trace.tool_spans)))}

    # and in the tool itself: if not session.identity_verified: return {"status": "REFUSED"}
