  - tel-02
  - tel-15
  code: |
    REDACTORS = {
        "pan": lambda v: "*" * 12 + v[-4:],
        "name": tokenize,                                # reversible only in the vault
        "amount": lambda v: v, "merchant_category": lambda v: v, "date": lambda v: v,
    }

    def export_span(span):
        redacted = {k: REDACTORS.get(field_type(k), redact_default)(v) for k, v in span.attrs.items()}
        debug_store.write(redacted)
        raw_store.write(span.attrs, retention_days=7, acl="incident-responders")   # break-glass, audited
