- id: obs-16
  title: Traces redacted so heavily that nothing can be debugged
  tags:
  - Reliability
  - FinTech
  scenario: |-
    To meet PCI DSS and privacy rules, a card issuer replaces every number and name in traces with "[REDACTED]". When the dispute assistant misreads transaction amounts, engineers see "Customer disputes [REDACTED] at [REDACTED] for [REDACTED]" and can't debug.
  antipattern: |-
    **All-or-nothing approach to sensitive data.**

    *Think of it this way:* Blacking out every word of a document to keep it safe, then wondering why nobody can use it.
  fails: |-
    **Mechanism:** Too much redaction kills debuggability. Too little violates privacy.

    - All-or-nothing redaction removes debugging value.
    - Amounts and merchants aren't sensitive in the same way as card numbers.
    - No controlled access path exists for real investigations.

    **Root cause:** Redaction designed without considering debugging needs.

    **Where it breaks:** Telemetry pipeline and access policy.
  diagram:
    bad:
    - PCI concern · Traces
    - '!All redacted · Every number'
    - Amount bug · Can't see
    - '!Undebuggable · Incidents'
    bad_note: Redact everything
    good:
    - Mask PAN · Last 4
    - +Keep amounts · Dates, MCC
    - +Raw store · Restricted
    - Break-glass · Audited
    good_note: Field-level redaction plus audited raw access
  solution: |-
    1. Redact field by field (mask PAN to last 4, tokenise names, keep amounts, dates and merchant categories).
    2. Keep raw traces in a restricted store with short retention and role-based access.
    3. Provide audited break-glass access for incidents.
