  scenario: |-
    A carrier's assistant prompt includes three fixed examples, all about refunds. When answering questions about device shipping, it often opens with "I understand you'd like a refund" and uses refund-style wording.
  antipattern: |-
    **Static few-shot examples for all inputs.**

    *Think of it this way:* A new hire who has only seen three example letters and makes every letter look like them.
  fails: |-
