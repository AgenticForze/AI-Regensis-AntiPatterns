source: regensis
section: ingestion
patterns:
- id: data-01
  title: CRM export column renamed, plan names vanish from the index
  tags:
  - Quality
  - Telco
  scenario: |-
    A carrier's knowledge pipeline ingests a nightly CRM export to build customer-context documents for agent assist. The CRM team renames plan_name to product_offering_name. The pipeline doesn't fail; it fills the field with blanks. For two weeks, agent assist shows customers with no plan, and suggestions are generic.
  antipattern: |-
    **No contract with the upstream export.**

    *Think of it this way:* A supplier changing the label on a box, and your warehouse quietly filing it as empty.
  fails: |-
    - No contract between producer and consumer.
    - Missing fields default to blank instead of failing.
    - No data-quality checks on outputs.

    **Root cause:** No data contracts or schema validation.

    **Where it breaks:** Ingestion pipeline.
  diagram:
    bad:
    - Field renamed · CRM export
    - '!Pipeline · Fills blanks'
    - No plan · In context
    - '!2 weeks · Generic help'
    bad_note: No contract with the upstream export
    good:
    - Contract · Schema + owner
    - +Producer CI · Tests it
    - +Validate · Fail loudly
    - Null alerts · Per field
    good_note: Data contract, schema validation, quality alerts
  solution: |-
    1. Define data contracts (schema, required fields, semantics, owner) with upstream teams, and test them in the producer's CI.
    2. Validate schemas at ingestion and fail loudly on missing required fields.
    3. Add quality checks (null rates, distributions) with alerts.
  works: |-
    **Trade-off to manage:** Contracts need cross-team agreement.

    **How you prove it worked:**

    - Null-rate alerts per field.

    **Same pattern elsewhere:** FinTech: a core-banking extract renames a balance field, and the assistant shows zero balances.
  takeaway: Data you depend on needs a contract.
  related:
  - cicd-18
  - data-11
  code: |
    class CrmPlanRecord(BaseModel):          # data contract with the CRM team
        account_id: str; plan_code: str; plan_name: constr(min_length=1); effective_from: date

    def ingest(batch):
        try:
            rows = [CrmPlanRecord.model_validate(r) for r in batch]
        except ValidationError as e:
            raise IngestionHalted(f"contract violation: {e.errors()[:3]}")      # fail loudly
        if null_rate(batch, "plan_name") > 0.01: alert("plan_name null rate spike")
        return rows
  lang: python
- id: data-02
  title: OCR misreads income documents with no confidence check
  tags:
  - Quality
  - FinTech
  scenario: |-
    A mortgage lender's pipeline OCRs payslips and bank statements for an underwriting assistant. Low-quality phone photos produce digit errors (8 read as 3). The pipeline passes all text on, and the assistant summarises incomes that are off by thousands.
  antipattern: |-
    **Pass all OCR text downstream.**

    *Think of it this way:* Copying numbers from a smudged fax without saying it was smudged.
  fails: |-
    - OCR confidence is ignored.
    - No validation against document totals.
    - Low-quality inputs flow downstream silently.

    **Root cause:** No quality gates on extracted data.

    **Where it breaks:** Document ingestion.
  diagram:
    bad:
    - Phone photo · Payslip
    - '!OCR errors · 8 as 3'
    - Passed on · No checks
    - '!Wrong income · Summarised'
    bad_note: Pass all OCR text downstream
    good:
    - Confidence · Per field
    - +Cross-check · Totals
    - +Low score · Human verify
    - Mark · Confidence
    good_note: Confidence gates and arithmetic cross-checks
  solution: |-
    1. Capture OCR confidence per field and route low-confidence fields to human verification or re-upload requests.
    2. Cross-check totals (gross minus deductions equals net) and year-to-date figures.
    3. Mark extracted values with confidence in downstream context.
  works: |-
    **Trade-off to manage:** More manual verification for bad images.

    **How you prove it worked:**

    - Share of low-confidence fields; underwriting corrections.

    **Same pattern elsewhere:** Telco: OCR on ID documents for postpaid sign-up misreads dates of birth.
  takeaway: Extracted data needs a confidence score and a cross-check.
  related:
  - rag-09
  - prm-15
  code: |
    def extract_income(doc):
        fields = ocr.extract(doc, fields=["gross", "deductions", "net", "ytd_gross"])
        low = [f for f in fields.values() if f.confidence < 0.9]
        if low:
            return request_verification(doc, fields=[f.name for f in low])
        if abs(fields["gross"].value - fields["deductions"].value - fields["net"].value) > 1:
            return request_reupload(doc, reason="totals don't reconcile")
        return {k: {"value": f.value, "confidence": f.confidence} for k, f in fields.items()}
  lang: python
- id: data-03
  title: No freshness SLO for promotion pages
  tags:
  - Quality
  - Telco
  scenario: |-
    A carrier's marketing team updates promotion pages daily. The knowledge pipeline crawls the website weekly. The bot regularly quotes expired promotions, and store staff have to honour or explain them.
  antipattern: |-
    **Weekly crawl for daily-changing content.**

    *Think of it this way:* A newspaper delivered once a week for a market that changes daily.
  fails: |-
    - Update frequency of sources isn't matched by the pipeline.
    - No freshness targets per source.
    - Expired content isn't removed promptly.

    **Root cause:** No freshness SLOs.

    **Where it breaks:** Knowledge pipeline.
  diagram:
    bad:
    - Promos · Daily changes
    - '!Crawl · Weekly'
    - Expired promos · Quoted
    - '!Stores · Honour them'
    bad_note: Weekly crawl for daily-changing content
    good:
    - SLO · Hours for promos
    - +CMS events · Update
    - +Expiry · Enforced
    - Lag · Monitored
    good_note: Freshness SLO per source, events, expiry dates
  solution: |-
    1. Set freshness SLOs per source based on change frequency and risk (promotions within hours).
    2. Use CMS events to update, and expiry dates on promotional content that the index enforces.
    3. Monitor lag per source.
  works: |-
    **Trade-off to manage:** Event-driven ingestion is more complex.

    **How you prove it worked:**

    - Lag between source publish and index update.

    **Same pattern elsewhere:** FinTech: a bank's rate pages update instantly but the assistant's index refreshes weekly (see rag-05).
  takeaway: Every source needs a freshness target.
  related:
  - rag-05
  - cicd-11
  code: |
    FRESHNESS_SLO = {"promotions": timedelta(hours=2), "help_articles": timedelta(days=1), "legal": timedelta(days=1)}

    @cms.webhook
    def on_publish(evt):
        index.upsert(evt.doc, meta={"expires_at": evt.doc.promo_end, "source": evt.source})

    def search(q):
        return index.search(q, filter={"$or": [{"expires_at": None}, {"expires_at": {"$gt": now()}}]})

    for src, slo in FRESHNESS_SLO.items():
        if index_lag(src) > slo: alert(f"{src} freshness SLO breached")
  lang: python
- id: data-04
  title: After a bank merger, customer ids collide across systems
  tags:
  - Quality
  - FinTech
  - Critical
  scenario: |-
    After a merger, a bank's assistant combines data from both banks' systems. Customer ids overlap, and the integration layer joins on id alone. Some customers see another person's accounts in the assistant's summary.
  antipattern: |-
    **Join merged systems on overlapping ids.**

    *Think of it this way:* Two schools merging and seating students by roll number, so two different "number 14"s share a desk.
  fails: |-
    - Identifiers aren't globally unique across sources.
    - No master data management or entity resolution.
    - Joins aren't validated.

    **Root cause:** Missing master data management.

    **Where it breaks:** Data integration.
  diagram:
    bad:
    - Two banks · Merged
    - '!Same ids · Different people'
    - Join on id · Only
    - '!Wrong accounts · Shown'
    bad_note: Join merged systems on overlapping ids
    good:
    - Master index · Global ids
    - +Mappings · Per source
    - +Validate · Name, DOB
    - Quarantine · Conflicts
    good_note: Master customer index and validated joins
  solution: |-
    1. Use a master customer index with globally unique ids and source-system mappings.
    2. Validate joins (name, date of birth, address) and quarantine conflicts.
    3. Test data integration with known collision cases before exposing it to AI.
  works: |-
    **Trade-off to manage:** MDM is a substantial programme.

    **How you prove it worked:**

    - Join conflict rates; customer reports of unknown accounts.

    **Same pattern elsewhere:** Telco: after acquiring a regional carrier, account numbers overlap and the bot shows the wrong bills.
  takeaway: Join on identity you can trust, not on ids that happen to match.
  related:
  - rag-13
  - ctx-17
  code: |
    def resolve_customer(source_system, source_id):
        gid = mci.lookup(source_system, source_id)            # master customer index, globally unique id
        if gid: return gid
        candidates = mci.match(name=..., dob=..., address=...)
        if len(candidates) != 1:
            quarantine.put(source_system, source_id, candidates)   # conflicts never reach the AI
            return None
        return mci.link(candidates[0], source_system, source_id)
  lang: python
- id: data-05
  title: Can't tell which version of a document produced an answer
  tags:
  - Quality
  - Telco
  scenario: |-
    A customer disputes a bot answer about device trade-in terms from last month. The knowledge base article has since been edited twice. The vector store keeps only the latest chunks with no version info, so the carrier can't show what the bot actually relied on.
  antipattern: |-
    **Chunks without versions.**

    *Think of it this way:* A contract where pages get replaced and no one keeps the old ones.
  fails: |-
    - Chunks have no document version.
    - Old versions aren't retained.
    - Traces store chunk ids without versions.

    **Root cause:** No lineage from answer to source version.

    **Where it breaks:** Ingestion and tracing.
  diagram:
    bad:
    - Dispute · Trade-in terms
    - '!Article · Edited twice'
    - Latest only · No version
    - '!Can''t show · What was used'
    bad_note: Chunks without versions
    good:
    - Version + hash · On chunks
    - +Traces · Record version
    - +History · Content store
    - Lookup · For complaints
    good_note: Version and hash on chunks and traces, history kept
  solution: |-
    1. Store document id, version and content hash on every chunk, and record them in traces.
    2. Retain historical versions in the content store (not necessarily in the live index).
    3. Make "what did the bot rely on" a supported query for complaints teams.
  works: |-
    **Trade-off to manage:** Storage for history.

    **How you prove it worked:**

    - Traces with complete source versions.

    **Same pattern elsewhere:** FinTech: a bank can't prove which fee schedule version its assistant quoted.
  takeaway: Every answer should point to a version, not just a document.
  related:
  - ops-01
  - rag-15
  code: |
    def chunk_meta(doc, i, text):
        return {"doc_id": doc.id, "version": doc.version, "content_hash": sha256(text), "chunk_index": i}

    span.set_attribute("retrieval.sources", [f"{h.meta['doc_id']}@{h.meta['version']}" for h in hits])

    def what_did_the_bot_rely_on(trace_id):          # supported query for complaints teams
        refs = traces.get(trace_id).attr("retrieval.sources")
        return [content_store.get_version(*r.split("@")) for r in refs]
  lang: python
- id: data-06
  title: Intent labels from three vendors disagree
  tags:
  - Quality
  - Telco
  scenario: |-
    A carrier outsources intent labelling to three vendors. Each interprets "billing dispute" versus "billing question" differently. The trained router is inconsistent, and evals built on the labels can't be trusted.
  antipattern: |-
    **Labels without shared guidelines.**

    *Think of it this way:* Three referees using slightly different rulebooks.
  fails: |-
    - No shared labelling guidelines.
    - Inter-annotator agreement not measured.
    - Label quality not audited.

    **Root cause:** Uncontrolled labelling process.

    **Where it breaks:** Labelling operations.
  diagram:
    bad:
    - 3 vendors · Labelling
    - '!Own rules · Each'
    - Disagree · Dispute vs Q
    - '!Bad router · Bad evals'
    bad_note: Labels without shared guidelines
    good:
    - Guidelines · Edge cases
    - +Gold items · Calibrate
    - +Agreement · Measured
    - Audits · Continuous
    good_note: Guidelines, agreement checks, gold items, audits
  solution: |-
    1. Write guidelines with definitions, edge cases and examples, owned by the business.
    2. Measure inter-annotator agreement and calibrate vendors with gold-standard items.
    3. Audit samples continuously and re-label disputed classes.
  works: |-
    **Trade-off to manage:** Guidelines and audits cost time.

    **How you prove it worked:**

    - Agreement scores per class and vendor.

    **Same pattern elsewhere:** FinTech: complaint-category labels differ between internal teams, confusing the classifier.
  takeaway: Labels need a rulebook and a referee.
  related:
  - eval-16
  - ft-03
  code: |
    GUIDELINES = "labeling/intent_guidelines_v3.md"       # owned by the business

    def calibrate(vendor):
        gold = gold_items(n=100)
        acc = mean(vendor.label(i) == i.gold for i in gold)
        if acc < 0.9: retrain_vendor(vendor, GUIDELINES)

    kappa = fleiss_kappa(labels_by_vendor(sample=500))
    disputed = [c for c, k in per_class_kappa().items() if k < 0.6]
    relabel(classes=disputed, by="senior_annotators")
  lang: python
- id: data-07
  title: HR and legal files indexed into the employee assistant
  tags:
  - Quality
  - FinTech
  - Critical
  scenario: |-
    A bank's internal assistant indexes "all SharePoint sites" to help employees. The crawl includes HR investigations, salary reviews and legal privileged documents, which become searchable by anyone who asks the right question.
  antipattern: |-
    **Index everything the crawler can reach.**

    *Think of it this way:* Moving every filing cabinet into the open-plan office because people need documents.
  fails: |-
    - Indexing scope defined by location, not classification.
    - Sensitive documents lack labels.
    - Permissions not carried into the index.

    **Root cause:** No data classification gate for AI ingestion.

    **Where it breaks:** Ingestion scope and governance.
  diagram:
    bad:
    - All sites · Crawled
    - '!HR, legal · Included'
    - Searchable · By anyone
    - '!Exposure · Privileged'
    bad_note: Index everything the crawler can reach
    good:
    - Approved · Sources only
    - +Labels · Classification
    - +Exclude · Restricted
    - Owner review · Before index
    good_note: Approved sources, classification, permission-aware retrieval
  solution: |-
    1. Ingest only sources approved for the use case, with classification labels on documents.
    2. Exclude restricted classifications by default, and carry permissions into retrieval (see rag-06).
    3. Review sources with data owners before indexing.
  works: |-
    **Trade-off to manage:** Smaller corpus.

    **How you prove it worked:**

    - Classification audits of indexed content.

    **Same pattern elsewhere:** Telco: an employee assistant indexes network security designs and lawful-intercept procedures.
  takeaway: Index by permission and classification, not by location.
  related:
  - rag-06
  - sec-06
  code: |
    APPROVED_SOURCES = {"employee_assistant": ["it_kb", "benefits_public", "travel_policy"]}
    EXCLUDED_CLASSIFICATIONS = {"restricted", "legal_privileged", "hr_confidential"}

    def ingest(doc, use_case):
        if doc.source not in APPROVED_SOURCES[use_case]:
            return "skipped: source not approved"
        if doc.classification in EXCLUDED_CLASSIFICATIONS:
            return "skipped: restricted classification"
        index.add(doc, acl=doc.permissions)                  # permissions carried into retrieval
  lang: python
- id: data-08
  title: Usage events arrive late and the bill-shock alert is wrong
  tags:
  - Quality
  - Latency
  - Telco
  scenario: |-
    A carrier's agent sends proactive alerts when roaming usage passes thresholds. Roaming usage records (TAP files from partner networks) arrive hours or days late. The agent tells customers they've used 200 MB when they've already used 2 GB, and they keep using data.
  antipattern: |-
    **Late data presented as current.**

    *Think of it this way:* A fuel gauge that updates a day after you've driven.
  fails: |-
    - Event time and processing time are confused.
    - Late data isn't accounted for.
    - Alerts present stale data as current.

    **Root cause:** Pipeline ignores data latency and completeness.

    **Where it breaks:** Streaming design and messaging.
  diagram:
    bad:
    - Roaming · TAP files
    - '!Arrive late · Hours/days'
    - '''200 MB'' · Alert'
    - '!Really 2 GB · Bill shock'
    bad_note: Late data presented as current
    good:
    - Event time · Tracked
    - +'As of' · Shown
    - +Delay notice · Messaging
    - Real-time · OCS source
    good_note: Event time, 'as of', real-time sources
  solution: |-
    1. Track event time, arrival time and completeness per source; show "as of" times.
    2. Adjust messaging for known delays ("roaming usage can take up to 48 hours to appear").
    3. Use real-time sources (online charging) for thresholds where available.
  works: |-
    **Trade-off to manage:** None significant.

    **How you prove it worked:**

    - Lag distributions per source.

    **Same pattern elsewhere:** FinTech: card transactions post late and the spending assistant tells customers they are under budget.
  takeaway: Show when the data is from, not just what it says.
  related:
  - rag-01
  - data-03
  code: |
    def usage_status(subscription_id):
        u = usage.latest(subscription_id)
        completeness = usage.completeness(subscription_id, source="roaming_tap")   # late roaming records
        return {"used_gb": u.gb, "as_of": u.event_time_max,
                "note": "Roaming usage can take up to 48 hours to appear." if completeness < 1 else None}

    def bill_shock_check(sub):
        return ocs.realtime_balance(sub) if ocs.available() else usage_status(sub)   # online charging first
  lang: python
- id: data-09
  title: Backfill job duplicates every chunk in the vector store
  tags:
  - Quality
  - FinTech
  scenario: |-
    A bank re-runs its document ingestion to backfill missing metadata. The job inserts new chunks instead of updating existing ones. Every document now appears twice, and retrieval returns duplicates that crowd out other results.
  antipattern: |-
    **Re-run inserts duplicates.**

    *Think of it this way:* Re-shelving books without checking whether they're already on the shelf.
  fails: |-
    - Ingestion isn't idempotent.
    - Chunk ids aren't deterministic.
    - No duplicate checks after jobs.

    **Root cause:** Non-idempotent pipelines.

    **Where it breaks:** Ingestion design.
  diagram:
    bad:
    - Backfill · Re-run
    - '!Insert · Not upsert'
    - 2x chunks · Every doc
    - '!Duplicates · In results'
    bad_note: Re-run inserts duplicates
    good:
    - Stable ids · Doc+ver+idx
    - +Upsert · Idempotent
    - +Count check · After job
    - New version · If risky
    good_note: Deterministic ids, upserts, post-job checks
  solution: |-
    1. Use deterministic chunk ids (document id, version, chunk index) and upsert.
    2. Make backfills idempotent and run them against a new index version when risky.
    3. Check counts and duplicates after every job.
  works: |-
    **Trade-off to manage:** None significant.

    **How you prove it worked:**

    - Duplicate rate and chunk count per document.

    **Same pattern elsewhere:** Telco: a re-index of device manuals doubles chunks and halves retrieval diversity.
  takeaway: Every pipeline run should be safe to repeat.
  related:
  - rag-13
  - ops-18
  code: |
    def chunk_id(doc_id, version, i): return f"{doc_id}:{version}:{i}"     # deterministic

    def backfill(docs, index_name):
        for d in docs:
            for i, c in enumerate(chunk(d)):
                vdb.upsert(index_name, id=chunk_id(d.id, d.version, i), vector=embed(c.text))   # upsert, never insert
        dupes = vdb.count_duplicates(index_name, by="content_hash")
        assert dupes == 0 and vdb.count(index_name) == expected_chunks(docs)
  lang: python
- id: data-10
  title: Production call records copied unmasked into dev
  tags:
  - Quality
  - Compliance
  - Telco
  - Critical
  scenario: |-
    To make agent testing realistic, engineers copy a month of production call-detail records and customer profiles into the development environment. Dev has weaker access controls, and contractors can query the data. A privacy audit flags a CPNI breach.
  antipattern: |-
    **Production data copied into dev.**

    *Think of it this way:* Taking real patient files home to practise filling in forms.
  fails: |-
    - Production data in non-production environments.
    - No masking or synthetic alternatives.
    - Weaker controls in dev.

    **Root cause:** No test-data management.

    **Where it breaks:** Environments and data management.
  diagram:
    bad:
    - Prod CDRs · A month
    - '!Copied · To dev'
    - Contractors · Can query
    - '!CPNI breach · Audit'
    bad_note: Production data copied into dev
    good:
    - Masked · Tokenised
    - +Synthetic · Realistic
    - +Block copies · Technical
    - Scan dev · Identifiers
    good_note: Masked or synthetic test data, copies blocked
  solution: |-
    1. Use masked, tokenised or synthetic data in non-production, generated by an approved pipeline.
    2. Preserve realistic distributions and edge cases in synthetic data.
    3. Block production data copies to lower environments technically.
  works: |-
    **Trade-off to manage:** Synthetic data may miss rare real patterns; seed it carefully.

    **How you prove it worked:**

    - Scans for production identifiers in dev.

    **Same pattern elsewhere:** FinTech: a bank copies real transaction data into a test vector store for an AI prototype.
  takeaway: Realistic test data doesn't mean real customer data.
  related:
  - cicd-08
  - aev-04
  code: |
    def build_dev_dataset():
        prod_sample = synthetic_pipeline.sample_schema_and_distributions(source="call_records")
        return synthetic_pipeline.generate(prod_sample, n=100_000, preserve=["edge_cases", "distributions"],
                                           pii="tokenised")         # approved pipeline only

    # IAM: deny s3:GetObject on prod buckets for dev roles; DLP blocks prod data copies to lower envs
  lang: python
- id: data-11
  title: Null APR in the rates table becomes a 0% quote
  tags:
  - Quality
  - FinTech
  - Critical
  scenario: |-
    A bank's rates table, used by the assistant's pricing tool, has a null APR for a new credit-card product after a botched load. The tool returns null, the template renders 0.00%, and the assistant tells customers the card has 0% APR.
  antipattern: |-
    **Nulls flow through as zeros.**

    *Think of it this way:* A price tag that fell off, so the till rings up zero.
  fails: |-
    - No quality checks on reference data.
    - Nulls coerced to zero.
    - The tool doesn't reject incomplete records.

    **Root cause:** Missing data-quality validation on data behind tools.

    **Where it breaks:** Data pipeline and tool validation.
  diagram:
    bad:
    - Bad load · Rates table
    - '!APR null · New card'
    - Renders 0.00% · Template
    - '!''0% APR'' · Told customers'
    bad_note: Nulls flow through as zeros
    good:
    - Validate · On load
    - +Block · If checks fail
    - +Null = error · In tool
    - Reconcile · With system
    good_note: Quality checks on load, nulls as errors
  solution: |-
    1. Validate reference data on load (required fields, ranges, allowed values) and block publication if checks fail.
    2. Treat nulls as errors in tools, never as zero.
    3. Reconcile rates against the product system of record.
  works: |-
    **Trade-off to manage:** Failed checks delay product launches until fixed.

    **How you prove it worked:**

    - Data-quality checks with alerts on failure.

    **Same pattern elsewhere:** Telco: a missing price in the catalog feed shows a new phone plan as $0.
  takeaway: Missing is not zero.
  related:
  - tool-14
  - data-01
  code: |
    class RateRow(BaseModel):
        product_id: str
        apr: condecimal(gt=0, lt=Decimal("40"))           # null or 0 fails validation
        effective_from: date

    def load_rates(rows):
        valid = [RateRow.model_validate(r) for r in rows]    # block publication on failure
        mismatches = [r for r in valid if r.apr != product_system.apr(r.product_id)]
        if mismatches: raise PublishBlocked(mismatches)

    @tool
    def get_apr(product_id):
        r = rates.get(product_id)
        if r is None or r.apr is None: return {"status": "ERROR", "why": "rate unavailable"}   # never 0
  lang: python
- id: data-12
  title: Agents compute active subscribers three different ways
  tags:
  - Quality
  - Cost
  - Telco
  scenario: |-
    A carrier gives analytics agents SQL access to its warehouse. Asked "How many active subscribers do we have in Texas?", three agents return three numbers, because each defines "active" differently (any usage in 30 days, billing status, or not suspended). Executives lose trust in the AI answers.
  antipattern: |-
    **Agents define metrics in their own SQL.**

    *Think of it this way:* Three accountants each using their own definition of revenue.
  fails: |-
    - No shared metric definitions.
    - Agents write their own SQL.
    - Results aren't reconcilable.

    **Root cause:** No semantic layer for agents.

    **Where it breaks:** Data architecture.
  diagram:
    bad:
    - '''Active subs?'' · Texas'
    - '!3 agents · 3 queries'
    - 3 numbers · 3 definitions
    - '!Trust lost · Executives'
    bad_note: Agents define metrics in their own SQL
    good:
    - Semantic layer · Certified
    - +Definitions · Shared
    - +Query metrics · Not tables
    - Show definition · In answer
    good_note: Certified metrics via a semantic layer
  solution: |-
    1. Provide a semantic layer or metrics store with certified definitions (active subscriber, ARPU, churn).
    2. Agents query metrics through it, not raw tables.
    3. Show the definition with every answer.
  works: |-
    **Trade-off to manage:** Semantic layers need governance and upkeep.

    **How you prove it worked:**

    - Divergent answers for the same metric question.

    **Same pattern elsewhere:** FinTech: agents compute "net new deposits" differently from finance's official figure.
