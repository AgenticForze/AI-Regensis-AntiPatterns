    def end_chat(session):
        s = llm.structured(session.transcript, schema=InteractionSummary)
        tmf621.add_note(session.ticket_id, s.model_dump())          # case record, any channel can read it

    def start_ivr(caller):
        open_cases = tmf621.open_tickets(caller.customer_id, days=7)
