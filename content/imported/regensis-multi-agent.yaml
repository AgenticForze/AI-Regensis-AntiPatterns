    SUPPRESSES = {"hardship": {"collections_contact"}, "dispute": {"collections_contact"},
                  "deceased": {"collections_contact", "marketing"}, "bankruptcy": {"collections_contact"}}

    def allowed(action, customer_id):
        status = customer_record.statuses(customer_id)                  # system of record, every call
        return not any(action in SUPPRESSES[s] for s in status)

    @tool
    def send_collections_message(customer_id, text):
        if not allowed("collections_contact", customer_id):
            return {"status": "SUPPRESSED", "why": customer_record.statuses(customer_id)}
