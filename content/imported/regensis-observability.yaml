- id: tel-18
  title: Telemetry is 40% of infrastructure cost
  tags:
  - Reliability
  - Cost
  - Compliance
  - Telco
  scenario: |-
    A carrier's AI platform logs every prompt, completion and tool payload at debug level in production, plus full traces at 100%. Telemetry becomes 40% of infrastructure cost. An audit shows 90% of it is never queried.
  antipattern: |-
    **Emitting everything at debug level in production.**

    *Think of it this way:* Recording every conversation in the building forever, in case one matters.
  fails: |-
    **Mechanism:** Volume costs money and hides signal.

    - Debug-level logging in production.
    - No sampling or aggregation.
    - Nobody measures what's used.

    **Root cause:** Telemetry has no budget or value review.

    **Where it breaks:** Telemetry governance.
  diagram:
    bad:
    - Debug level · In production
    - '!100% traces · Full payloads'
    - 40% of infra · Cost
    - '!90% unused · Never queried'
    bad_note: Debug everything, keep everything
    good:
    - Usage review · What's queried
    - +Tail sampling · Keep failures
    - +Aggregate · At collector
    - Budget · % of serving
    good_note: Levels, sampling, aggregation and a budget
  solution: |-
    1. Review query usage, and drop or aggregate unused data.
    2. Use log levels, tail sampling and collector-side aggregation.
    3. Set a telemetry budget as a share of serving cost.
  works: |-
    **Trade-off to manage:** Cutting too much hurts debugging; keep high-value traces (errors, feedback) at 100%.

    **How you prove it worked:**

    - Telemetry cost per request; percentage of data queried.

    **Same pattern elsewhere:** FinTech: a bank's AI observability bill exceeds its model bill.
  takeaway: Telemetry has a cost-to-value ratio. Manage it.
  related:
  - tel-05
  - tel-03
  code: |
    # collector: aggregate high-volume data, sample the rest
    # processors: [filter/drop_debug_logs, tail_sampling, metricstransform/aggregate_by_route]

    usage = telemetry_backend.query_usage(days=90)
    unused = [ds for ds in usage.datasets if ds.queries == 0]
    for ds in unused: telemetry_backend.set_retention(ds.name, days=7)

    assert telemetry_cost() <= 0.10 * serving_cost(), "telemetry budget: 10% of serving cost"
  lang: python
- id: tel-19
  title: Logs show the template, not the prompt the model saw
  tags:
  - Reliability
  - FinTech
  scenario: |-
    A wealth assistant logs the prompt template id and variables. A complaint shows the model ignored the client's risk profile. The template looks correct. The bug is in context assembly: the risk-profile block was truncated when the portfolio was large. Nobody can see it, because the rendered prompt wasn't captured.
  antipattern: |-
    **Logging the template ID only.**

    *Think of it this way:* Checking the recipe when the cook used a page with a corner torn off.
  fails: |-
    **Mechanism:** Bugs live in variable substitution, truncation, and context assembly.

    - Templates are logged, but rendered messages are not.
    - Bugs live in substitution, truncation and ordering.
    - The template review gives false confidence.

    **Root cause:** Missing capture of what the model actually received.

    **Where it breaks:** Instrumentation of the LLM call.
  diagram:
    bad:
    - Template · Looks right
    - '!Risk block · Truncated'
    - Not logged · Rendered prompt
    - '!Ignored risk · Complaint'
    bad_note: Log template id only
    good:
    - Rendered msgs · Captured
    - +Tokens · Per component
    - +Truncation · Event logged
    - Diff · Across versions
    good_note: Capture rendered messages and truncation events
  solution: |-
    1. Capture the final rendered messages and tool definitions per call (redacted, sampled as needed), with token counts per component.
    2. Record truncation events explicitly.
  works: |-
    **Trade-off to manage:** Rendered prompts are large and sensitive; store them in the restricted content store.

    **How you prove it worked:**

    - Truncation rate per component; diff of rendered prompts across versions.

    **Same pattern elsewhere:** Telco: a care bot ignores the customer's plan because the account-context block was dropped when history was long.
  takeaway: Log what the model saw, not what you meant to send.
  related:
  - ctx-19
  - ctx-08
  code: |
    def call_model(template, variables, tools):
        messages = render(template, variables)
        counts = {"system": tokens(messages[0]), "history": tokens(messages[1:-1]),
                  "user": tokens(messages[-1]), "tools": tokens(tools)}
        truncated = fit_to_window(messages)
        span.set_attribute("prompt.rendered_ref", restricted_store.put(redact(messages)))   # what the model saw
        span.set_attribute("prompt.tokens_by_component", json.dumps(counts))
        if truncated.dropped:
            span.add_event("context.truncated", {"dropped_tokens": truncated.dropped})
        return llm(truncated.messages, tools=tools)
  lang: python
- id: tel-20
  title: Bill explanations cut off mid-sentence for large accounts
  tags:
  - Reliability
  - Telco
  scenario: |-
    Business customers with 40+ lines report that bill explanations stop mid-sentence. Engineers suspect the model. The response metadata, which wasn't recorded, would have shown finish_reason = max_tokens: the output limit was set to 500 tokens for all accounts.
  antipattern: |-
    **Ignoring response metadata.**

    *Think of it this way:* A printer that stops mid-page because it ran out of paper, while you check the ink.
  fails: |-
    **Mechanism:** Stop reasons, safety flags, and cache hits explain many failures.

    - Response metadata (stop reason, filter flags, cache hits) is discarded.
    - Truncation looks like a model failure.
    - One limit applied to every account size.

    **Root cause:** Model-side metadata not recorded.

    **Where it breaks:** LLM call instrumentation.
  diagram:
    bad:
    - 40+ lines · Business bill
    - '!Cut off · Mid-sentence'
    - Blame model · Wrong guess
    - '!max_tokens · Was the cause'
    bad_note: Discard response metadata
    good:
    - Stop reason · Recorded
    - +Params · Max tokens, temp
    - +Spike alert · Truncation
    - Size limits · By task
    good_note: Record stop reason and parameters, alert on truncation
  solution: |-
    1. Record stop or finish reason, content-filter flags, cached-token counts and request parameters (temperature, max tokens).
    2. Alert on spikes in truncation.
    3. Size output limits by task (or summarise large accounts by group).
  works: |-
    **Trade-off to manage:** None significant.

    **How you prove it worked:**

    - Truncation rate by account size.

    **Same pattern elsewhere:** FinTech: corporate-card statement summaries truncate for large companies with many cardholders.
  takeaway: The stop reason is the first thing to check.
  related:
  - tel-19
  code: |
    resp = llm.generate(messages, max_tokens=limit_for(task="bill_explanation", n_lines=account.line_count))
    span.set_attribute("gen_ai.response.finish_reasons", [resp.stop_reason])
    span.set_attribute("gen_ai.request.max_tokens", resp.request.max_tokens)
    span.set_attribute("gen_ai.usage.cached_tokens", resp.usage.cache_read_input_tokens)

    if resp.stop_reason == "max_tokens":
        metrics.inc("llm_truncated", task="bill_explanation")   # alert on spikes
        resp = summarise_by_line_group(account)                    # large accounts: grouped summary
  lang: python
