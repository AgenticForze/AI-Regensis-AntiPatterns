- id: agf-13
  title: Account-closure plan ignores pending transactions
  tags:
  - Reliability
  - FinTech
  scenario: |-
    A bank's account-closure agent plans four steps: confirm identity, transfer the balance, close the account, send confirmation. During execution, the balance check shows a pending card authorisation. The agent continues with the original plan, closes the account, and the pending payment later bounces with fees.
  antipattern: |-
    **Rigid plan-then-execute with no feedback.**

    *Think of it this way:* Following a recipe exactly even after you discover the oven is broken.
  fails: |-
    **Mechanism:** Real environments return surprises.

    - The plan was made once, upfront, from assumptions.
    - New observations didn't trigger re-planning.
    - Preconditions for closure weren't checked in code.

    **Root cause:** Plan-then-execute with no observe and re-plan step.

    **Where it breaks:** Agent control loop and tool preconditions.
  diagram:
    bad:
    - Plan 4 steps · Upfront
    - '!Pending auth · Observed'
    - Plan continues · Ignored
    - '!Payment bounces · Fees'
    bad_note: Fixed plan, no re-planning
    good:
    - Plan · As state
    - +Observe · Each result
    - +Re-plan · On surprise
    - Preconditions · In close tool
    good_note: Observe results, re-plan, tool preconditions
  solution: |-
    1. Use a plan-execute-observe loop where tool results can change the plan.
    2. Enforce preconditions in the close_account tool (no pending items, zero balance) and return why it refused.
    3. Keep the plan as editable state visible in traces.
  works: |-
    **Trade-off to manage:** Re-planning adds LLM calls; trigger it only on unexpected results.

    **How you prove it worked:**

    - Closures followed by returned items; tool refusals by reason.

    **Same pattern elsewhere:** Telco: a disconnect agent keeps going after discovering the line has an active device-installment balance.
  takeaway: Plans are hypotheses, so update them on evidence.
  related:
  - agf-01
  - rag-17
  code: |
    @tool
    def close_account(account_id: str):
        acct = core.accounts.get(account_id)
        blockers = []
        if acct.pending_transactions: blockers.append(f"{len(acct.pending_transactions)} pending transactions")
        if acct.balance != 0: blockers.append(f"balance {acct.balance}")
        if blockers:
            return {"status": "REFUSED", "preconditions_failed": blockers}   # plan must change
        return core.accounts.close(account_id)

    while not done:                                               # plan → execute → observe → replan
        step = plan.next(); obs = execute(step); plan = planner.update(plan, obs)
