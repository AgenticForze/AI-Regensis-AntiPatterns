  code: |
    def eval_rag(pipeline, golden):
        retr = [pipeline.retrieve(g.q, k=10) for g in golden]
        return {
            "recall@10": mean(any(d.id in g.relevant for d in r) for r, g in zip(retr, golden)),
            "mrr": mean(first_rank(r, g.relevant) for r, g in zip(retr, golden)),
            "faithfulness": ragas.faithfulness(golden, pipeline),
            "answer_relevance": ragas.answer_relevancy(golden, pipeline)}

