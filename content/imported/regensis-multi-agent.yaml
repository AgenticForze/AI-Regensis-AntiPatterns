  scenario: |-
    A bank's teams have built 30 agents in 18 months. Several overlap (three different "statement" agents), some call deprecated APIs, and some run with credentials of employees who have left. An audit can't establish what each agent can do.
  antipattern: |-
    **Agents built ad hoc with no registry.**

    *Think of it this way:* An office where anyone can hire temps without telling HR.
  fails: |-
    - No registry of agents, owners, tools and permissions.
    - Duplicated effort.
    - Orphaned credentials.

    **Root cause:** Agent sprawl without governance.

    **Where it breaks:** Platform governance.
