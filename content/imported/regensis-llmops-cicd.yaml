- id: cicd-07
  title: Same commit builds two different agents
  tags:
  - Reliability
  - FinTech
  scenario: |-
    A fintech's agent image is built with unpinned Python dependencies. Two builds of the same commit, a day apart, pull different versions of an LLM SDK. One build retries tool calls on 5xx; the other doesn't. A production incident can't be reproduced in staging.
  antipattern: |-
    **Rebuild per environment, unpinned.**

    *Think of it this way:* Two cakes from the same recipe with ingredients from different suppliers.
  fails: |-
    - Floating dependencies change between builds.
    - Behaviour depends on library defaults.
    - Images aren't immutable artifacts.

    **Root cause:** Non-reproducible builds.

    **Where it breaks:** Build pipeline.
  diagram:
    bad:
