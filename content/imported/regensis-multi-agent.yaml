- id: mas-18
  title: Group chat of agents with no end condition
  tags:
  - Reliability
  - Telco
  scenario: |-
    A carrier prototypes a "group chat" of agents (sales, solution architect, pricing, legal) to draft enterprise proposals. Without a clear end condition, the agents keep adding suggestions and thanking each other. Runs end when the token limit is hit, and the proposal is often unfinished.
  antipattern: |-
    **Open group chat of agents.**

    *Think of it this way:* A meeting without an agenda or a chair.
  fails: |-
    - No defined deliverable or exit criteria.
    - No speaker selection or turn limits.
    - Politeness loops waste tokens.

    **Root cause:** Unstructured multi-agent conversation.

    **Where it breaks:** Orchestration.
  diagram:
    bad:
    - 4 agents · Group chat
    - '!No end · Condition'
    - Thank-you loops · Tokens
    - '!Unfinished · Proposal'
    bad_note: Open group chat of agents
    good:
    - Deliverable · Sections list
    - +Chair · Picks speaker
    - +Turn cap · Limit
    - Done · When complete
    good_note: Deliverable checklist, chair, turn cap
  solution: |-
    1. Define the deliverable and a checklist of required sections; end when all are filled.
    2. Use a chair (orchestrator) to select the next agent and cap turns.
    3. Prefer a pipeline (sections assigned to agents) over open chat.
  works: |-
    **Trade-off to manage:** Less emergent creativity; much more predictable output.

    **How you prove it worked:**

    - Runs ending at token limits; completeness of outputs.

    **Same pattern elsewhere:** FinTech: an investment-committee simulation of agents rarely reaches a decision.
  takeaway: Agents need an agenda and a chair.
  related:
  - mas-02
  code: |
    REQUIRED_SECTIONS = ["market_sizing", "competitors", "pricing", "risks", "recommendation"]
    ASSIGN = {"market_sizing": analyst, "competitors": researcher, "pricing": pricing_agent,
              "risks": risk_agent, "recommendation": chair}

    doc = {}
    for section in REQUIRED_SECTIONS:                      # pipeline, not open chat
        doc[section] = ASSIGN[section].write(section, context=doc)
    assert all(doc.get(s) for s in REQUIRED_SECTIONS)     # end condition: checklist complete
