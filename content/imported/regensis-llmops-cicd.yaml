- id: cicd-10
  title: Flaky evals fixed with retry until green
  tags:
  - Reliability
  - Telco
  scenario: |-
    A carrier's eval stage fails intermittently because LLM outputs vary. The team configures the CI job to retry up to three times until it passes. Real regressions now pass on the second or third attempt.
  antipattern: |-
    **Retry flaky evals until green.**

    *Think of it this way:* Re-taking a blood test until the result looks normal.
  fails: |-
    - Nondeterminism is handled by retrying.
    - Retries hide real regressions.
    - Thresholds aren't statistical.

    **Root cause:** Treating LLM eval variance as test flakiness.

    **Where it breaks:** Eval gate design.
  diagram:
    bad:
    - Evals flaky · Variance
    - '!Retry x3 · Until pass'
    - Regression · Passes on 2nd
    - '!Shipped · Broken'
    bad_note: Retry flaky evals until green
    good:
    - k trials · Per case
    - +CI gate · Aggregate + CI
    - +Hard checks · Always pass
    - Low temp · Where fit
    good_note: Repeated trials, statistical gates
  solution: |-
    1. Run multiple trials and gate on aggregate scores with confidence intervals.
    2. Separate deterministic checks (schema, safety rules) that must always pass from statistical quality checks.
    3. Lower variance with low temperature where appropriate.
  works: |-
    **Trade-off to manage:** More trials cost more; use them on the merge suite.

    **How you prove it worked:**

    - Variance of eval scores across runs; retry counts.

    **Same pattern elsewhere:** FinTech: a bank re-runs its compliance eval until it passes, missing a disclosure regression.
  takeaway: Don't retry until green. Measure the distribution.
  related:
  - eval-07
  - cicd-04
  code: |
    def gate(candidate, baseline, trials=5):
        det = deterministic_checks(candidate)                           # schema, safety: must be 100%
        assert det.pass_rate == 1.0, det.failures
        a = [run_quality(baseline) for _ in range(trials)]
        b = [run_quality(candidate) for _ in range(trials)]
        lo, hi = bootstrap_ci(np.array(b) - np.array(a))
        assert hi > -0.01, f"quality regression (95% CI {lo:.3f}..{hi:.3f})"   # no retry-until-green
  lang: python
