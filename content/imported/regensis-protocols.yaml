- id: tool-13
  title: Agent hammers the mainframe core-banking system
  tags:
  - Reliability
  - Cost
  - Latency
  - FinTech
  scenario: |-
    A bank's agents call a mainframe-backed balance API on every turn "to stay current". At peak, agent traffic triples mainframe transactions, raising MIPS costs and slowing branch systems.
  antipattern: |-
    **Call the mainframe on every turn.**

    *Think of it this way:* Asking the head office for your balance every time you blink.
  fails: |-
    - No caching or rate limits.
    - Agents call tools more than needed.
    - Legacy systems have costly capacity.

    **Root cause:** Tools hitting expensive legacy systems without protection.

    **Where it breaks:** Tool layer.
  diagram:
    bad:
    - Every turn · Balance call
    - '!Peak · 3x txns'
    - MIPS cost · Rises
    - '!Branches slow · Shared system'
    bad_note: Call the mainframe on every turn
    good:
    - Cache · Short TTL
    - +Rate limit · Per session
    - +Facade · Protects
    - Call rules · When needed
    good_note: Caching, rate limits, facade, call rules
  solution: |-
    1. Cache read results with short TTLs where freshness allows, and fetch once per turn at most.
    2. Rate-limit tools per session and overall, and protect legacy systems with a facade.
    3. Instruct agents when to call (only for balance questions).
  works: |-
    **Trade-off to manage:** Slightly stale reads; show "as of" times.

    **How you prove it worked:**

    - Calls per session; legacy system load attributed to agents.

    **Same pattern elsewhere:** Telco: agents overload a legacy billing system with balance queries on bill-run day.
  takeaway: Protect legacy systems from enthusiastic agents.
  related:
  - tool-08
  - obs-12
  code: |
    @tool(rate_limit_per_session="3/min")
    def get_balance(ctx: Session) -> dict:
        """Call only when the customer asks about balance or available funds."""
        key = f"bal:{ctx.account_id}:{ctx.turn_id}"
        if (hit := cache.get(key)) or (hit := cache.get(f"bal:{ctx.account_id}", max_age_s=30)):
            return hit
        bal = core_facade.balance(ctx.account_id)                      # facade with global rate limit
        cache.set(key, bal); cache.set(f"bal:{ctx.account_id}", bal, ttl=30)
        return bal
