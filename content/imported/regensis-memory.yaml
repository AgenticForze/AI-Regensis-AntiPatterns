- id: mem-16
  title: Do not market to me becomes market to me in a summary
  tags:
  - Quality
  - Compliance
  - Telco
  scenario: |-
    A customer tells a carrier's assistant: "Don't call or text me with offers." Memory consolidation summarises the conversation as "Customer: interested in offers via call/text?" with the negation lost. The marketing agent uses it, the customer gets promotional texts, and it becomes a TCPA complaint.
  antipattern: |-
    **Consent kept as summarised memory.**

    *Think of it this way:* A note that says "no peanuts" smudged into "peanuts".
  fails: |-
    - Summarisation can drop negation.
    - Consent is stored as free-text memory.
    - The marketing agent trusts memory over the consent system.

    **Root cause:** Consent handled as conversational memory instead of a system of record.

    **Where it breaks:** Consent management.
  diagram:
    bad:
    - '''Don''t text me'' · Customer'
    - '!Summarised · Negation lost'
    - Marketing agent · Reads memory
    - '!Texts sent · TCPA risk'
    bad_note: Consent kept as summarised memory
    good:
    - Consent tool · Immediate
    - +System record · Opt-out
    - +Agents check · Consent system
    - Negation tests · Consolidation
    good_note: Consent tool writes to system of record
  solution: |-
    1. Write consent changes to the consent-management system immediately via a tool, with confirmation to the customer.
    2. Marketing agents must check the consent system, never memory.
    3. Test memory consolidation for negation and preference preservation.
  works: |-
    **Trade-off to manage:** None significant.

    **How you prove it worked:**

    - Contacts sent to customers with opt-out requests in transcripts.

    **Same pattern elsewhere:** FinTech: a bank's assistant records "doesn't want paper mail" as "wants paper mail" in a summarised note.
  takeaway: Consent lives in the consent system, not in a summary.
  related:
  - mem-03
  - ctx-15
  code: |
    @tool
    def update_marketing_consent(customer_id: str, opt_in: bool):
        consent_system.set(customer_id, channel="all", marketing=opt_in, source="assistant_chat")
        return {"status": "UPDATED", "tell_customer": "You won't receive marketing from us."}

    def can_market(customer_id):
        return consent_system.get(customer_id).marketing                # never memory

    def test_consolidation_keeps_negation():
        assert "do not" in consolidate(["Customer said: do not market to me"])[0].lower()
  lang: python
- id: mem-17
  title: Vulnerability flag remembered by one agent, ignored by others
  tags:
  - Quality
  - Compliance
  - FinTech
  scenario: |-
    A UK bank customer tells the assistant they've been diagnosed with a condition affecting their ability to manage money. The assistant notes it in its memory and responds kindly. Other channels and the collections process never see it, so the customer receives standard arrears letters, contrary to the bank's vulnerable- customer obligations.
  antipattern: |-
    **Disclosure stays in agent memory.**

    *Think of it this way:* A nurse who learns about a patient's allergy and writes it on their own hand.
  fails: |-
    - Vulnerability disclosures stay in agent memory.
    - No structured flag in the system of record.
    - Downstream processes don't adapt.

    **Root cause:** Regulated customer circumstances not recorded where processes use them.

    **Where it breaks:** Process and data integration.
  diagram:
    bad:
    - Disclosure · Vulnerability
    - '!Agent memory · Only'
    - Collections · Unaware
    - '!Arrears letters · Standard'
    bad_note: Disclosure stays in agent memory
    good:
    - Flag tool · Consent
    - +Customer record · Updated
    - +All channels · Check flag
    - Evals · Recognise
    good_note: Flag in customer record, all processes check it
  solution: |-
    1. On disclosure, record a vulnerability flag via a tool (with customer consent where required) in the customer record.
    2. Ensure all channels and processes (collections, marketing) check the flag.
    3. Train and evaluate the assistant on recognising disclosures.
  works: |-
    **Trade-off to manage:** Handling sensitive data needs strict access controls.

    **How you prove it worked:**

    - Disclosures in transcripts without flags in records.

    **Same pattern elsewhere:** Telco: a customer who discloses a medical need for a working line isn't flagged for priority repair.
  takeaway: Important disclosures must change the record, not just the reply.
  related:
  - mas-13
  - mem-16
  code: |
    @tool
    def record_vulnerability(customer_id: str, category: str, consent: bool):
        if not consent:
            return {"status": "CONSENT_NEEDED"}
        customer_record.set_flag(customer_id, "vulnerable", category=category)   # system of record
        return {"status": "RECORDED"}

    def before_contact(customer_id, process):                           # collections, marketing, ...
        if customer_record.flag(customer_id, "vulnerable"):
            return VULNERABLE_CUSTOMER_PROCESS[process]
  lang: python
- id: mem-18
  title: Assistant assumes memory that new customers don't have
  tags:
  - Quality
  - FinTech
  scenario: |-
    A neobank's assistant prompt says "Use what you remember about the customer to personalise answers." For new customers with no memories, it invents context ("As you mentioned before, you're saving for a house").
  antipattern: |-
    **Prompt assumes memories exist.**

    *Think of it this way:* A host greeting a first-time guest with "Welcome back!"
  fails: |-
    - Prompt assumes memories exist.
    - Empty memory isn't handled explicitly.
    - The model fills the gap.

    **Root cause:** No cold-start handling.

    **Where it breaks:** Prompt and context assembly.
  diagram:
    bad:
    - New customer · No memory
    - '!Prompt · ''Use memory'''
    - Invents · 'As you said'
    - '!Confused · Customer'
    bad_note: Prompt assumes memories exist
    good:
    - Empty marker · Explicit
    - +Rule · Cite only stored
    - +New-user evals · Cases
    - Clean start · Welcome
    good_note: Explicit empty marker, no invented history
  solution: |-
    1. Pass an explicit "no memories available" marker when memory is empty.
    2. Instruct the model to never reference past conversations unless a memory is present.
    3. Evaluate new-customer conversations.
  works: |-
    **Trade-off to manage:** None significant.

    **How you prove it worked:**

    - References to past conversations without memory records.

    **Same pattern elsewhere:** Telco: a bot tells a new prospect "as you said last time, your Wi-Fi drops at night".
  takeaway: An empty memory must be said out loud.
  related:
  - prm-15
  code: |
    def memory_block(customer_id):
        items = memory.search_recent(customer_id)
        if not items:
            return "<memories>NONE. Do not refer to any past conversation.</memories>"
        return "<memories>\n" + "\n".join(f"- {m.text} ({m.recorded_at:%b %Y})" for m in items) + "\n</memories>"

    SYSTEM = "Only reference past conversations that appear in <memories>."
