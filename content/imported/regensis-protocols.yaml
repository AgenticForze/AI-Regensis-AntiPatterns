- id: tool-14
  title: Agent trusts a coverage tool's malformed response
  tags:
  - Reliability
  - Telco
  scenario: |-
    A carrier's serviceability API occasionally returns an empty JSON object during maintenance. The agent interprets missing fields as "no restrictions" and tells prospects fiber is available at addresses where it isn't.
  antipattern: |-
    **Unvalidated tool responses.**

    *Think of it this way:* Reading a blank form as "everything approved".
  fails: |-
    - Responses aren't validated.
    - Missing data is interpreted optimistically.
    - The model fills gaps.

    **Root cause:** No schema validation of tool responses.

    **Where it breaks:** Tool implementation.
  diagram:
    bad:
    - Empty JSON · Maintenance
    - '!No fields · Read as OK'
    - '''Available'' · Told prospect'
    - '!No fiber · Reality'
    bad_note: Unvalidated tool responses
    good:
    - Validate · Schema
    - +Status enum · Incl. UNKNOWN
    - +Error · If invalid
    - Honest reply · Unknown
    good_note: Schema validation and explicit UNKNOWN status
  solution: |-
    1. Validate responses against a schema in the tool; treat invalid ones as errors.
    2. Return explicit status (AVAILABLE, NOT_AVAILABLE, UNKNOWN).
    3. Teach the agent to handle UNKNOWN honestly.
  works: |-
    **Trade-off to manage:** None significant.

    **How you prove it worked:**

    - Response validation failures per tool.

    **Same pattern elsewhere:** FinTech: a KYC vendor's empty response is read as "no adverse media".
  takeaway: Missing data means unknown, never yes.
  related:
  - cicd-18
  - agf-11
  code: |
    class Coverage(BaseModel):
        status: Literal["AVAILABLE", "NOT_AVAILABLE", "UNKNOWN"]
        technology: str | None = None; max_down_mbps: int | None = None

    @tool
    def check_coverage(address_id: str) -> dict:
        raw = coverage_api.lookup(address_id)
        try:
            return Coverage.model_validate(raw).model_dump()
        except ValidationError:
            return {"status": "UNKNOWN", "why": "coverage system returned invalid data",
                    "tell_customer": "I can't confirm coverage right now; I'll have a specialist check."}
