- id: sec-13
  title: Coordinated thumbs-up teaches the bot to waive fees
  tags:
  - Security
  - FinTech
  scenario: |-
    A bank uses thumbs-up feedback to select examples for prompt updates and periodic fine-tuning. A forum coordinates users to thumbs-up conversations where the bot waived fees and thumbs-down refusals. The next update makes the bot more willing to waive.
  antipattern: |-
    **Thumbs-up feeds training directly.**

    *Think of it this way:* Letting customers vote on the shop's discount policy.
  fails: |-
    - User feedback is used as training signal without validation.
    - Feedback can be gamed at scale.
    - Policy outcomes are learned from preference, not rules.

    **Root cause:** Untrusted feedback poisons the improvement loop.

    **Where it breaks:** Data flywheel.
  diagram:
    bad:
    - Forum · Coordinates
    - '!Thumbs-up · Fee waivers'
    - Training data · Selected
    - '!More waivers · Next update'
    bad_note: Thumbs-up feeds training directly
    good:
    - Triage only · Feedback
    - +Expert labels · Before training
    - +Anomaly check · Bursts
    - Policy tool · Fixed rules
    good_note: Expert labels, anomaly checks, policy in tools
  solution: |-
    1. Treat feedback as a triage signal; require expert labels before data enters training or examples.
    2. Detect coordinated feedback (bursts, new accounts, similar text).
    3. Keep policy decisions in tools so preference can't change them.
  works: |-
    **Trade-off to manage:** Expert labelling costs time.

    **How you prove it worked:**

    - Feedback anomaly detection; policy drift in evals after updates.

    **Same pattern elsewhere:** Telco: users mass-rate retention chats to teach the bot to offer bigger discounts.
  takeaway: Feedback is a signal, not a label.
  related:
  - ops-12
  - ft-05
  code: |
    def feedback_to_training(fb_batch):
        suspicious = detect_coordination(fb_batch, signals=["burst", "new_accounts", "text_similarity"])
        clean = [f for f in fb_batch if f.id not in suspicious]
        candidates = [f for f in clean if f.rating == "up"]
        return expert_label(candidates)                       # triage signal, never direct training data

    # fee waivers stay in the waive_fee tool with server-side rules, so preference data can't change them
  lang: python
- id: sec-14
  title: Community MCP server installed in the NOC agent
  tags:
  - Security
  - Telco
  scenario: |-
    A network engineer adds a community MCP server for "network diagnostics" to the NOC agent. Its tool description includes hidden instructions to send command output to an external endpoint, and the server itself makes outbound calls. Device configurations leak.
  antipattern: |-
    **Install community tool servers freely.**

    *Think of it this way:* Plugging a free USB stick from a conference into a production server.
  fails: |-
    - Third-party tools run with the agent's access.
    - Tool descriptions are prompts and can contain injections.
    - No review or egress control.

    **Root cause:** Unvetted tool supply chain.

    **Where it breaks:** Tool governance.
  diagram:
    bad:
    - Community MCP · Installed
    - '!Hidden text · In tool doc'
    - Outbound calls · From server
    - '!Configs leak · Exfiltrated'
    bad_note: Install community tool servers freely
    good:
    - Registry · Approved only
    - +Review · Code + docs
    - +Sandbox · No egress
    - Pin version · And hash
    good_note: Approved registry, review, sandbox, egress control
  solution: |-
    1. Allow only approved MCP servers from an internal registry, pinned by version and hash.
    2. Review tool descriptions and code, and run servers sandboxed with egress restrictions.
    3. Scope credentials per server.
  works: |-
    **Trade-off to manage:** Slower adoption of new tools.

    **How you prove it worked:**

    - Inventory of installed tools; egress monitoring.

    **Same pattern elsewhere:** FinTech: an analyst installs an unofficial market-data MCP server that exfiltrates portfolio queries.
  takeaway: A tool is code plus a prompt. Vet both.
  related:
  - tool-10
  - sec-17
  code: |
    REGISTRY = load("mcp_registry.yaml")       # name, url/image, version, sha256 of tool definitions, scopes

    def connect(name):
        e = REGISTRY[name]
        server = sandbox.run(e.image, egress_allow=e.egress, cpu="0.5", mem="512Mi")
        defs = server.list_tools()
        if sha256(canonical_json(defs)) != e.tools_sha256:
            raise SecurityError(f"{name}: tool definitions changed since review")
        return MCPClient(server, credentials=vault.scoped(name, e.scopes))
  lang: python
- id: sec-15
  title: Huge pasted inputs exhaust the assistant's capacity
  tags:
  - Security
  - Cost
  - Latency
  - FinTech
  scenario: |-
    Users of a fintech's assistant discover they can paste entire books and ask for summaries. A few accounts automate this, sending 150k-token requests every few seconds. Costs spike and latency for regular customers rises.
  antipattern: |-
    **Unlimited input size and rate.**

    *Think of it this way:* A self-service printer at a bank that someone uses to print novels.
  fails: |-
    - No input size limits.
    - No per-user rate or token limits.
    - Out-of-scope use isn't detected.

    **Root cause:** Unbounded resource consumption.

    **Where it breaks:** Gateway and input validation.
  diagram:
    bad:
    - Book pasted · 150k tokens
    - '!Automated · Every few s'
    - Cost spike · Unbounded
    - '!Slow for all · Customers'
    bad_note: Unlimited input size and rate
    good:
    - Input limit · Per intent
    - +User quota · Tokens/min
    - +Scope check · Cheap, early
    - Anomaly · Per user
    good_note: Input limits, per-user quotas, early scope check
  solution: |-
    1. Limit input length per intent and per user, and rate-limit tokens per user.
    2. Classify out-of-scope requests and refuse them early and cheaply.
    3. Monitor per-user cost anomalies.
  works: |-
    **Trade-off to manage:** Some legitimate long documents need a separate, authorised flow.

    **How you prove it worked:**

    - Tokens per user distributions; scope-classifier hits.

    **Same pattern elsewhere:** Telco: a free web chat for prospects is used as a general-purpose LLM by bots.
  takeaway: Every input is a cost the user chooses for you.
  related:
  - obs-05
  - cost-07
  code: |
    LIMITS = {"default": 4000, "document_review": 20000}        # input tokens per intent

    @gateway.middleware
    def abuse_controls(req, call_next):
        if tokens(req.input) > LIMITS.get(req.intent, LIMITS["default"]):
            raise HTTPException(413, "input too long for this request type")
        if not rate_limiter.allow(req.user, tokens=tokens(req.input), per="1h", limit=200_000):
            raise HTTPException(429)
        if scope_clf.out_of_scope(req.input[:2000]):
            return cheap_refusal()                               # refuse early, before the big model
        return call_next(req)
  lang: python
- id: sec-16
  title: Deleted customer still found in the vector store
  tags:
  - Security
  - Telco
  scenario: |-
    An EU carrier deletes a former customer's data from CRM and billing after the retention period. Their support conversations were embedded into a vector store used for agent assist and conversation memory. Months later, the assistant surfaces the customer's details to an agent.
  antipattern: |-
    **Vector store outside the deletion process.**

    *Think of it this way:* Shredding a file but keeping a photocopy in another cabinet.
  fails: |-
    - Vector stores and memory aren't in the deletion process.
    - Embeddings and chunk text are stored without customer keys.
    - Nobody inventoried derived data.

    **Root cause:** AI-derived data outside data-lifecycle controls.

    **Where it breaks:** Data governance for AI stores.
  diagram:
    bad:
    - CRM deleted · Retention end
    - '!Vector store · Not included'
    - Chunks · No customer key
    - '!Resurfaces · Months later'
    bad_note: Vector store outside the deletion process
    good:
    - Customer key · On chunks
    - +Deletion job · Includes AI
    - +Minimise · Pseudonymise
    - Verify · Deletion
    good_note: Customer keys on chunks, deletion jobs, minimisation
  solution: |-
    1. Tag chunks and memories with customer keys, and include vector stores in deletion and retention jobs.
    2. Avoid embedding raw personal data where summaries or pseudonymised text suffice.
    3. Encrypt stores and restrict access.
  works: |-
    **Trade-off to manage:** Per-customer tagging adds metadata and indexing work.

    **How you prove it worked:**

    - Deletion verification queries against AI stores.

    **Same pattern elsewhere:** FinTech: a bank's advisor-assistant memory keeps a closed client's financial details.
  takeaway: Derived data is still personal data.
  related:
  - tel-09
  - data-07
  - mem-06
  code: |
    def erase_customer(customer_id):
        key = pseudo_key(customer_id)
        for store in (vector_index, memory_store, semantic_cache, transcripts):
            n = store.delete(filter={"customer_key": key})
            dsr_log.record(customer_id, store=store.name, deleted=n)

    def ingest_note(note, customer_id):
        vector_index.upsert(embed(pseudonymise(note.text)), meta={"customer_key": pseudo_key(customer_id)})
