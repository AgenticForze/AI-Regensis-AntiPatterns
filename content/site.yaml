title: Applied AI Anti-Patterns
eyebrow: Field guide · Production AI architecture
headline: Anti-patterns in production AI, from RAG to advanced agentic systems
tagline: A field guide to the design mistakes that stall enterprise AI programs, why they fail, and the architectures that replace them. Covers retrieval, models, agents, operations, governance, the major cloud platforms, cost, and harness engineering.
footer: Applied AI Anti-Patterns · Platform names and capabilities reflect public documentation as of November 2026. Cost figures are illustrative.
intro: |
  Most enterprise AI programs don't fail because the model is weak. They fail because the system
  around the model was designed for a demo, not for production. That system covers data, retrieval,
  orchestration, guardrails, evaluation, identity and cost controls.
  This guide catalogs the recurring design mistakes across the full stack and pairs each one with
  a production-grade alternative.

  Each entry is written to be defensible in an architecture review. It names a concrete enterprise
  scenario, the mechanism of failure, the replacement design, and the reason that design holds up
  under scale, audit and change.
anatomy:
  - Problem statement
  - The anti-pattern
  - Why it fails
  - Broken vs. fixed diagram
  - Recommended solution
  - Why it succeeds
  - Reference implementation
  - Key takeaway & follow-up
