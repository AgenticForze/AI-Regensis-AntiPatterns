- id: mas-13
  title: Collections agent and hardship agent contradict each other
  tags:
  - Reliability
  - FinTech
  scenario: |-
    A lender runs a collections agent (goal: maximise recovery) and a hardship agent (goal: support vulnerable customers). A customer in an approved hardship plan still receives a payment demand from the collections agent the next day, which breaches the lender's own hardship policy.
  antipattern: |-
    **Agents optimise conflicting goals alone.**

    *Think of it this way:* Two departments with opposite targets and no shared calendar.
  fails: |-
    - Agents optimise local goals.
    - No shared customer state or priority rules.
    - Policy precedence isn't enforced.

    **Root cause:** No system-level policy over agents with competing objectives.

    **Where it breaks:** Coordination and policy.
  diagram:
    bad:
    - Hardship · Plan approved
    - '!Collections · Own goal'
    - Demand sent · Next day
    - '!Policy breach · Complaint'
    bad_note: Agents optimise conflicting goals alone
    good:
    - Status flags · System record
    - +Precedence · Hardship first
    - +Tool check · Every agent
    - Cross-agent · Evals
    good_note: Status in system of record, precedence in code
  solution: |-
    1. Keep customer status (hardship, dispute, deceased, bankruptcy) in the system of record and check it in every agent's tools.
    2. Define precedence rules (hardship and disputes suppress collections) enforced in code.
    3. Evaluate cross-agent scenarios.
  works: |-
    **Trade-off to manage:** None significant.

    **How you prove it worked:**

    - Contacts sent to customers with suppression flags.

    **Same pattern elsewhere:** Telco: a retention agent offers a discount to a customer the credit agent has just suspended for non-payment.
  takeaway: Agents need shared rules, not just shared data.
