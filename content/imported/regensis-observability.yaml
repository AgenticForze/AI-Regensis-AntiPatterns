  scenario: |-
    A carrier's AI team estimates token usage with a generic tokenizer and a fixed price per token. Its cost dashboard is consistently 15% below the provider invoice, because the model tokenises differently and cached and reasoning tokens are priced differently.
  antipattern: |-
    **Estimating tokens with a generic tokenizer.**

