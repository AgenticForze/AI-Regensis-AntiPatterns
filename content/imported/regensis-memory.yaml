    A bank adds a semantic cache to its assistant to cut cost. "What's my current balance?" from two different customers is semantically identical, so the second customer receives the first customer's cached answer, including their balance.
  antipattern: |-
    **Shared cache or memory keyed incorrectly.**

    *Think of it this way:* A pharmacy that hands out the last prescription filled to anyone who asks for "my prescription".
  fails: |-
    **Mechanism:** Context assembly mixes tenants or users.

    - The cache key ignores who is asking.
