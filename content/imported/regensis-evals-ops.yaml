- id: eval-17
  title: Fifty prompt iterations overfit the eval set
  tags:
  - Quality
  - Telco
  scenario: |-
    A carrier's plan-recommendation bot team iterates its prompt 50 times against the same 250 eval cases until it hits 99%. In production, recommendation acceptance drops slightly. The prompt now contains special-case rules for specific eval phrasings.
  antipattern: |-
    **Tuning against the same set you report on.**

    *Think of it this way:* A student who memorises the practice test answers instead of learning the subject.
  fails: |-
    **Mechanism:** You fit the quirks of the test, not the task.

    - The same set is used for tuning and for reporting.
    - Each iteration fits quirks of those 250 cases.
    - Generalisation to new phrasing gets worse.

    **Root cause:** No held-out test set.

    **Where it breaks:** Eval methodology.
  diagram:
    bad:
    - 250 cases · One set
    - '!50 iterations · Same set'
    - 99% eval · Special rules
    - '!Prod worse · Overfit'
    bad_note: Tune and report on the same 250 cases
    good:
    - Dev set · Iterate freely
    - +Test set · Held out
    - +Refresh test · From prod
    - Watch gap · Dev vs test
    good_note: Dev set to iterate, held-out test to report
  solution: |-
    1. Split into a dev set (iterate freely) and a test set (touch rarely, report from it).
    2. Refresh the test set with new production samples regularly.
    3. Review the prompt for rules that mention specific cases.
  works: |-
    **Trade-off to manage:** Splitting means fewer cases to iterate on; grow the dev set from production.

    **How you prove it worked:**

    - Gap between dev and test scores; a widening gap signals overfitting.

    **Same pattern elsewhere:** FinTech: a loan-FAQ prompt tuned to 100% on its eval set mishandles slightly reworded questions about payment holidays.
  takeaway: Hold out a set you never tune on.
  related:
  - eval-08
  - eval-05
  code: |
    dev, test = split(cases, test_frac=0.3, seed=7)

    for i in range(iterations):
        prompt = improve(prompt, failures=run(prompt, dev).failures)   # iterate on dev only

    final = run(prompt, test)                                          # touch rarely, report from here
    if any(re.search(re.escape(c.key_phrase), prompt) for c in test):
        warn("prompt mentions specific test cases")
    test.refresh(sample_production(n=100), keep_frac=0.7)              # regular refresh
