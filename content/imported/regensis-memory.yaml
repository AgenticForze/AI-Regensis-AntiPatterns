    - +Output schema · Condensed
    - +Ask for more · If needed
    - Merge · Short results
    good_note: Scoped briefs in, condensed results out
  solution: |-
    1. Pass each sub-agent a scoped brief (task, inputs, constraints, output schema).
    2. Sub-agents return condensed results, not transcripts.
  works: |-
