- id: mem-02
  title: Long-term memory is a pile of raw transcripts
  tags:
  - Quality
  - FinTech
  scenario: |-
    A bank's advisor assistant stores every past conversation as raw transcript chunks and retrieves the most similar ones as "memory". When asked about a client's goals, it retrieves small talk about a holiday because it was semantically similar to "plans".
  antipattern: |-
    **Raw transcripts as memory.**

    *Think of it this way:* Keeping every receipt you've ever had in one box and calling it your budget.
  fails: |-
    - Raw transcripts are noisy.
    - Similarity search returns chit-chat over facts.
    - No distinction between facts, preferences and events.

    **Root cause:** No memory extraction or structure.

    **Where it breaks:** Memory design.
  diagram:
    bad:
    - Every chat · Raw chunks
    - '!''Client goals?'' · Advisor asks'
    - Holiday talk · Retrieved
    - '!No facts · Noise'
    bad_note: Raw transcripts as memory
    good:
    - Extract · Typed facts
    - +Source + date · Confidence
    - +Retrieve · Type + recency
    - Transcripts · In records
    good_note: Typed, sourced memories with smart retrieval
  solution: |-
    1. Extract typed memories (goal, preference, life event, constraint) with source, date and confidence.
    2. Retrieve by type and relevance, combining similarity with recency and importance.
    3. Keep raw transcripts in the record system, not in the memory index.
  works: |-
    **Trade-off to manage:** Extraction costs an LLM call per conversation.

    **How you prove it worked:**

    - Relevance of retrieved memories in evals.

    **Same pattern elsewhere:** Telco: a care assistant's "memory" retrieves greetings instead of the customer's known network issue.
  takeaway: Memories are curated facts, not transcripts.
  related:
  - mem-09
  - ctx-09
  code: |
    class MemoryItem(BaseModel):
        type: Literal["goal", "preference", "life_event", "constraint"]
        text: str; source_conversation: str; recorded_at: datetime; confidence: float; importance: int

    def remember(transcript, client_id):
        for m in llm.structured(transcript, schema=list[MemoryItem]):
            memory.upsert(client_id, m)                 # typed facts; raw transcripts stay in the record system

