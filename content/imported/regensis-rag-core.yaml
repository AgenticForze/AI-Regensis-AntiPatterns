- id: rag-11
  title: Early termination fee chunk has no context
  tags:
  - Quality
  - Cost
  - Telco
  scenario: |-
    A customer asks what it costs to leave before their contract ends. The bot answers "$200 early termination fee". That chunk came from the legacy two-year service contract terms. The customer is on a device installment plan, where the remaining device balance becomes due instead. The customer cancels expecting $200 and is billed $780.
  antipattern: |-
    **Chunks stored with no title, section, or document context.**

    *Think of it this way:* A page torn out of a manual that says "Turn it clockwise". Without the chapter heading, you don't know if it's the valve or the thermostat.
  fails: |-
    **Mechanism:** Once split, a chunk loses the heading that gave it meaning.

    - The section heading (legacy service agreements) was in a different chunk.
    - The retrieved chunk reads like a universal rule.
    - The LLM cannot tell which contract type the rule applies to.

    **Root cause:** Chunks lose their surrounding context when split, and no context is added back.

    **Where it breaks:** Chunking and enrichment at index time.
  diagram:
    bad:
    - '''Cost to leave?'' · Customer asks'
    - '!Chunk only · No section'
    - $200 ETF · Legacy contract
    - '!Billed $780 · Device balance'
    bad_note: Chunk without its section heading
    good:
    - Context header · Doc + section
    - +Contract filter · From account
    - +Payoff tool · Billing calc
    - Right amount · Cited
    good_note: Contextual headers and an account filter
  solution: |-
    1. Prepend contextual headers (document title, section path, applies-to contract type, effective dates) to every chunk before embedding.
    2. Or use contextual retrieval, generating a one-line situating summary per chunk at index time.
    3. Filter on contract type from the customer's account, and calculate the payoff amount with a billing tool.
  works: |-
    **Trade-off to manage:** Headers add tokens to every chunk, slightly increasing index size and context cost.

    **How you prove it worked:**

    - Eval questions that differ only by contract type.
    - Dispute reasons coded "told a different fee by chat" in billing.

    **Same pattern elsewhere:** FinTech: a chunk says "the fee is waived after 12 months" with no indication it applies to the business account, not the personal one.
  takeaway: Every chunk should make sense on its own.
  related:
  - rag-01
  - ctx-14
  code: |
    def contextual_chunk(doc, section, text):
        header = (f"[{doc.title} > {' > '.join(section.path)} | applies to: {doc.contract_type} | "
                  f"effective {doc.effective_from}–{doc.effective_to or 'present'}]")
        return header + "\n" + text                              # embed header + body

    hits = search(q, filter={"contract_type": account.contract_type})
    payoff = billing.early_termination_quote(account.id)         # amount from the billing tool
