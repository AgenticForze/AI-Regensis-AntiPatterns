- id: tel-16
  title: Eval results live only in CI logs
  tags:
  - Reliability
  - Latency
  - Telco
  scenario: |-
    A carrier's AI team runs evals on every release. Results print to CI logs that expire after 30 days. When leadership asks how bot quality changed over the last 50 releases, nobody can answer, and a slow decline goes unnoticed.
  antipattern: |-
    **Eval results live only in CI logs.**

    *Think of it this way:* Weighing yourself every day and never writing the number down.
  fails: |-
    **Mechanism:** You lose the quality history needed to spot slow drift.

    - Eval results aren't stored as data.
    - History is lost with CI log retention.
    - Slow drift is invisible.

    **Root cause:** Eval results not treated as telemetry.

    **Where it breaks:** Eval pipeline.
  diagram:
    bad:
    - Evals run · Every release
    - '!CI logs · 30-day expiry'
    - 50 releases · No history
    - '!Slow decline · Unnoticed'
    bad_note: Eval output in expiring CI logs
    good:
    - Eval records · Versioned
    - +Tracker · Or metrics store
    - +Chart · Per release
    - Trend alert · Across releases
    good_note: Eval results stored per release and charted
  solution: |-
    1. Push eval results as versioned records (release, prompt, model, metric, slice) to an experiment tracker or metrics store.
    2. Chart quality per release and slice.
    3. Alert on downward trends across releases.
  works: |-
    **Trade-off to manage:** None significant.

    **How you prove it worked:**

    - Presence of eval records for every release.

    **Same pattern elsewhere:** FinTech: a bank's model risk team can't evidence ongoing performance because eval history wasn't kept.
  takeaway: Eval results are telemetry too.
  related:
  - eval-20
  - cicd-01
  code: |
    def publish_eval(results, release):
        for r in results:
            metrics_store.write("eval_score", value=r.score,
                                tags={"release": release.version, "prompt": release.prompt_version,
                                      "model": release.model, "metric": r.metric, "slice": r.slice})

    if trend(metric="faithfulness", last_n_releases=4) < 0:
        alert("faithfulness trending down across releases")
  lang: python
- id: tel-17
  title: Child spans appear to start before their parents
  tags:
  - Reliability
  - Latency
  - FinTech
  scenario: |-
    A bank's traces of the payments assistant show tool spans starting before the agent span that called them, and latency breakdowns don't add up. Hosts in two data centres have clock drift of up to 400 ms.
  antipattern: |-
    **Unsynchronized clocks in distributed services.**

    *Think of it this way:* Two referees with watches set differently arguing about when the goal was scored.
  fails: |-
    **Mechanism:** Timing analysis and latency breakdowns become wrong.

    - Distributed hosts have unsynchronised clocks.
    - Timestamps from different hosts are compared.
    - Analysis tools show impossible orderings.

    **Root cause:** Clock skew in distributed tracing.

    **Where it breaks:** Infrastructure and instrumentation.
  diagram:
    bad:
    - Two DCs · Clock drift
    - '!400 ms skew · Between hosts'
    - Child first · Impossible
    - '!Bad analysis · Latency'
    bad_note: Unsynchronised host clocks
    good:
    - NTP/PTP · Synced
    - +Monotonic · Durations
    - +Skew fix · At collector
    - Drift alert · Monitored
    good_note: NTP sync, monotonic durations, skew correction
  solution: |-
    1. Sync clocks with NTP or PTP and monitor drift.
    2. Measure durations with monotonic clocks.
    3. Use collector-side skew correction where available.
  works: |-
    **Trade-off to manage:** None significant.

    **How you prove it worked:**

    - Count of traces with negative child offsets.

    **Same pattern elsewhere:** Telco: traces between a cloud bot and on-prem BSS show impossible timings due to drift on on-prem servers.
  takeaway: Durations from monotonic clocks, timestamps from synced clocks.
  related:
  - tel-07
  code: |
    import time

    def timed_step(fn):
        t0 = time.monotonic()                        # durations from a monotonic clock
        out = fn()
        duration = time.monotonic() - t0
        span.set_attribute("step.duration_ms", duration * 1000)
        return out

    # infra: chrony/NTP on all nodes; alert if node_timex_offset_seconds > 0.05
