    A bank's GenAI platform team publishes an eval dashboard for 14 use cases. The mortgage assistant shows 81% faithfulness. Nobody knows whether that is acceptable, no team owns the number, and it slowly drops to 73% over a quarter before a complaint review notices.
  antipattern: |-
