- id: cost-20
  title: Prompt compression saves tokens and drops the disclosures
  tags:
  - Cost
  - Compliance
  - FinTech
  scenario: |-
    To cut costs, a bank applies aggressive automatic prompt compression to its loan assistant's retrieved documents. Token use drops 45%, but compressed context sometimes removes the required APR range and fee disclosures, and answers omit them.
  antipattern: |-
    **Compress context to cut tokens.**

    *Think of it this way:* Shrinking a contract to save paper and losing the small print.
  fails: |-
    - Compression drops low-frequency but critical text.
    - Optimisation was measured on cost only.
    - Disclosure completeness wasn't evaluated.

    **Root cause:** Cost optimisation without quality gates.

    **Where it breaks:** Optimisation process.
  diagram:
    bad:
    - Compression · Aggressive
    - '!-45% tokens · Saved'
    - APR dropped · Disclosures
    - '!Non-compliant · Answers'
    bad_note: Compress context to cut tokens
    good:
    - Exempt · Disclosures
    - +Evals · Compliance
    - +Canary · Rollout
    - Savings · Safe ones
    good_note: Exempt critical text, quality-gated rollout
  solution: |-
    1. Evaluate every cost optimisation on quality, including compliance checks.
    2. Exempt critical sections (disclosures, rates) from compression.
    3. Roll out optimisations behind canaries.
  works: |-
    **Trade-off to manage:** Smaller savings.

    **How you prove it worked:**

    - Disclosure-presence checks on answers.

    **Same pattern elsewhere:** Telco: compression drops contract cancellation terms from retrieved context.
  takeaway: A saving that breaks compliance isn't a saving.
  related:
  - cicd-19
  - eval-14
  code: |
    PROTECTED = ["<disclosure>", "<rate_table>"]

    def compress(prompt):
        parts = split_protected(prompt, PROTECTED)              # protected sections pass through untouched
        return "".join(p if p.protected else compressor.compress(p.text, ratio=0.5) for p in parts)

    results = eval_suite.run(pipeline_with(compress), include=["compliance_disclosures"])
    assert results["compliance_disclosures"] == 1.0
    flags.canary("prompt_compression", pct=0.05)
  lang: python
