- id: sec-17
  title: Analytics agent's code runs with network access
  tags:
  - Security
  - FinTech
  - Critical
  scenario: |-
    A bank's analytics agent writes and runs Python to analyse customer data. The execution environment has network access and database credentials. A prompt injection in a CSV comment field makes the agent upload a data extract to an external paste site.
  antipattern: |-
    **Generated code with network and DB creds.**

    *Think of it this way:* Letting a temp work in the records room with an open window to the street.
  fails: |-
    - Generated code runs with broad access.
    - Untrusted data can steer the code.
    - No egress controls.

    **Root cause:** Unsandboxed code execution.

    **Where it breaks:** Execution environment.
  diagram:
    bad:
    - Agent code · Python
    - '!CSV comment · Injection'
    - Network open · DB creds
    - '!Data uploaded · Paste site'
    bad_note: Generated code with network and DB creds
    good:
    - Sandbox · Isolated
    - +No egress · Network
    - +Read-only · Minimised data
    - Code log · Audited
    good_note: Isolated sandbox, no egress, read-only data
  solution: |-
    1. Run generated code in an isolated sandbox with no network egress, limited CPU, memory and time.
    2. Provide data through read-only, minimised mounts, not credentials.
    3. Review or restrict libraries, and log all executed code.
  works: |-
    **Trade-off to manage:** Less flexibility for the agent.

    **How you prove it worked:**

    - Egress attempts from sandboxes; code audit logs.

    **Same pattern elsewhere:** Telco: a network-analytics agent's code can reach the internet and production routers.
  takeaway: Generated code is untrusted code. Sandbox it.
  related:
  - sec-14
  code: |
    def run_generated_code(code: str, dataset_path: str):
        audit.log("agent_code", sha=sha256(code), code=code)
        return sandbox.run(
            image="py-analytics:locked",            # vetted libraries only
            code=code,
            mounts={dataset_path: "/data:ro"},       # read-only, minimised data, no credentials
            network="none", cpu=1, memory="2Gi", timeout_s=60)
