- id: rag-10
  title: Card benefits bot invents trip insurance
  tags:
  - Quality
  - FinTech
  scenario: |-
    A cardholder asks the issuer's chatbot whether their card includes trip-cancellation insurance. Their card tier does not. Retrieval returns the benefits guide of a premium card with a similar name, with a low relevance score, and the bot says yes and explains how to claim. The trip is cancelled, the claim is rejected, and the complaint escalates.
  antipattern: |-
    **Always generating, even when retrieval returns nothing relevant.**

    *Think of it this way:* A new employee who never says "I don't know" and instead answers from whatever leaflet happens to be on the desk.
  fails: |-
    **Mechanism:** LLMs are trained to be helpful. Given weak context, they fill gaps from parametric memory.

    - Retrieval always returns k chunks, even when none are relevant.
    - The prompt has no permitted way to say "this benefit is not on your card".
    - The LLM fills the gap with plausible text from a near match.

    **Root cause:** There is no abstain path and no check that the retrieved document belongs to the customer's actual product.

    **Where it breaks:** Retrieval thresholding, product resolution and the answer policy.
  diagram:
    bad:
    - Trip cover? · Classic card
    - '!Top chunk · Premium guide'
    - Low score · Still used
    - '!Says yes · Claim denied'
    bad_note: Always answer from the top chunk
    good:
    - Resolve card · Product id
    - +Filter + score · Threshold
    - +Benefits table · Yes/no tool
    - Not included · Offer handoff
    good_note: Product filter, threshold, abstain path
  solution: |-
    1. Resolve the cardholder's product from the card system and filter benefits documents by product id.
    2. Apply a relevance threshold; below it, answer "I can't confirm that benefit on your card" and offer a handoff.
    3. Let benefit questions use a structured benefits table (benefit, product, yes/no) as a tool.
    4. Evaluate refusal behaviour explicitly with questions about benefits the card does not have.
  works: |-
    **Trade-off to manage:** Too high a threshold makes the bot unhelpful. Tune it on labelled data and watch handoff volume.

    **How you prove it worked:**

    - Abstain rate and answer rate by intent; a near-zero abstain rate is a red flag.
    - Negative-case eval set where the correct answer is "not included".

    **Same pattern elsewhere:** Telco: a bot confirms that a prepaid plan includes Wi-Fi calling abroad because it retrieved the postpaid feature page.
  takeaway: A good RAG system knows when it has nothing to say.
  related:
  - prm-15
  - rag-01
  code: |
    def benefits_answer(q, card_id):
        product = cards.get(card_id).product_id
        if (row := benefits_table.lookup(product, benefit=classify_benefit(q))):   # structured tool first
            return answer_from_row(row)
        hits = [h for h in rerank(q, search(q, filter={"product_id": product})) if h.score >= 0.45]
        if not hits:
            return "I can't confirm that benefit on your card. Want me to connect you with a specialist?"
        return generate(q, hits)
