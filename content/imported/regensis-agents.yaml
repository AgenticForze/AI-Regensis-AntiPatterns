- id: agf-14
  title: Diagnosis agent tells the dispatch agent to see above
  tags:
  - Reliability
  - Telco
  scenario: |-
    A field-service system has a diagnosis agent and a dispatch agent. The diagnosis agent ends with "Root cause as discussed above; schedule accordingly." The dispatch agent has its own context, so there is no "above". It books a generic technician without the fiber splicing skill, and the job needs a second visit.
  antipattern: |-
    **Unstructured messages between agents.**

    *Think of it this way:* Handing over a patient with a note saying "see what we talked about". The next shift wasn't in the room.
  fails: |-
    **Mechanism:** Each agent has a different context, so implicit references break.

    - Agents pass free text with implicit references.
    - Each agent has a different context window.
    - Required fields for the next step aren't enforced.

    **Root cause:** No typed contract between agents.

    **Where it breaks:** Multi-agent interfaces.
  diagram:
    bad:
    - Diagnosis · Agent
    - '!''See above'' · Free text'
    - Dispatch · No context
    - '!Wrong skill · Second visit'
    bad_note: Free-text handoff between agents
    good:
    - Handoff schema · Skill, parts
    - +Validate · In code
    - +Shared state · By id
    - Right tech · First visit
    good_note: Typed handoff schema and shared state
  solution: |-
    1. Define a handoff schema (site_id, fault_type, required_skill, parts, priority, evidence) validated in code.
    2. Store shared artifacts in a state store referenced by id.
    3. Reject handoffs that are missing required fields.
  works: |-
    **Trade-off to manage:** Schemas need maintenance as processes change; version them.

    **How you prove it worked:**

    - Second-visit rate; handoff validation failures.

    **Same pattern elsewhere:** FinTech: a fraud-triage agent hands a case to a customer-contact agent without the confirmed fraudulent transactions, and the customer is asked about the wrong ones.
  takeaway: Agent handoffs need API contracts.
  related:
  - mas-03
  - aev-18
  code: |
    class DispatchHandoff(BaseModel):
        site_id: str; fault_type: Literal["fiber_cut", "ont_failure", "power", "config"]
        required_skill: str; parts: list[str]; priority: Literal["P1", "P2", "P3"]
        evidence_refs: list[str]                                   # ids in the shared state store

    def handoff(diag_output: dict):
        try:
            h = DispatchHandoff.model_validate(diag_output)
        except ValidationError as e:
            return reject_back_to_diagnosis(e.errors())           # no "see above"
        dispatch_agent.run(h)
  lang: python
- id: agf-15
  title: Mortgage document agent runs inside a 30-second HTTP call
  tags:
  - Reliability
  - Cost
  - Latency
  - FinTech
  scenario: |-
    A mortgage lender exposes its document-review agent behind an API gateway with a 30-second timeout. Reviews of a 200-page application take 2-5 minutes. Most requests time out at the gateway, but the agent keeps running, and clients resubmit, creating duplicate reviews and double costs.
  antipattern: |-
    **Running long agent tasks inside an HTTP request.**

    *Think of it this way:* Ordering a wedding cake at a drive-through window and expecting it before the driver behind you honks.
  fails: |-
    **Mechanism:** Agent runtime is unpredictable and often long.

    - Agent runtime is long and unpredictable.
    - Synchronous request-response doesn't fit long jobs.
    - Clients retry on timeout, duplicating work.

    **Root cause:** Agents modelled as requests instead of jobs.

    **Where it breaks:** Service architecture.
  diagram:
    bad:
    - Review request · 200 pages
    - '!30 s gateway · Timeout'
    - Agent runs on · Unseen
    - '!Resubmits · Double cost'
    bad_note: Long agent inside an HTTP request
    good:
    - Job id · Returned now
    - +Queue + worker · Async
    - +Status, stream · Or webhook
    - Idem key · No duplicates
    good_note: Async job, status, idempotent submit
  solution: |-
    1. Accept the request, return a job id, run the agent asynchronously from a queue.
    2. Provide status endpoints, progress streaming or webhooks.
    3. Deduplicate submissions with an idempotency key.
  works: |-
    **Trade-off to manage:** Async adds job storage and client changes; it is required for long tasks.

    **How you prove it worked:**

    - Gateway timeouts and duplicate job counts.

    **Same pattern elsewhere:** Telco: a B2B quote-generation agent behind a 60-second CPQ integration timeout.
  takeaway: Agents are jobs, not requests.
  related:
  - agf-07
  code: |
    @app.post("/mortgage-docs")
    def submit(req: DocRequest, idem: str = Header(alias="Idempotency-Key")):
        if (job := jobs.by_key(idem)): return {"job_id": job.id}      # dedupe resubmits
        job = jobs.create(idem, req)
        queue.publish("mortgage-agent", {"job_id": job.id})            # agent runs async
        return JSONResponse({"job_id": job.id, "status_url": f"/jobs/{job.id}"}, status_code=202)

    @app.get("/jobs/{job_id}")
    def status(job_id): return jobs.get(job_id).progress()            # or SSE / webhook
