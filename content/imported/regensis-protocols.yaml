- id: tool-19
  title: Two MCP servers both offer a tool named transfer
  tags:
  - Reliability
  - FinTech
  scenario: |-
    A bank's agent connects to two MCP servers: one for internal account transfers and one for a brokerage partner. Both expose a tool named "transfer". The agent calls the brokerage transfer when the customer meant moving money between their own current and savings accounts.
  antipattern: |-
    **Colliding tool names across servers.**

    *Think of it this way:* Two contacts in your phone both called "Mum".
  fails: |-
    - Tool names collide across servers.
    - Descriptions don't disambiguate.
    - The client doesn't namespace.

    **Root cause:** No namespacing or disambiguation across tool sources.

    **Where it breaks:** MCP client configuration and tool naming.
  diagram:
    bad:
    - Server A · transfer
    - '!Server B · transfer'
    - Ambiguous · Same name
    - '!Wrong rail · Brokerage'
    bad_note: Colliding tool names across servers
    good:
    - Namespace · Per server
    - +Clear names · Own accounts
    - +When not · In docs
    - Load · By intent
    good_note: Namespaced tools and intent-based loading
  solution: |-
    1. Namespace tools by server (banking__transfer_between_own_accounts, brokerage__transfer_to_investment).
    2. Write descriptions that say when not to use each tool.
    3. Load only the servers needed for the intent.
  works: |-
    **Trade-off to manage:** Longer tool names.

    **How you prove it worked:**

    - Name collisions at registration; wrong-server calls in evals.

    **Same pattern elsewhere:** Telco: care and wholesale MCP servers both expose "get_account", with different meanings.
  takeaway: Tool names need namespaces once you have more than one server.
  related:
  - tool-03
  - sec-14
  code: |
    def load_tools(intent):
        servers = {"move_money": ["banking"], "invest": ["brokerage"]}[intent.domain]   # only what's needed
        tools = []
        for s in servers:
            for t in mcp[s].list_tools():
                t.name = f"{s}__{t.name}"                                    # namespaced
                tools.append(t)
        return tools

    # banking__transfer_between_own_accounts: "Moves cash between the customer's bank accounts.
    #   Do NOT use to fund an investment account (use brokerage__transfer_to_investment)."
  lang: python
- id: tool-20
  title: No one knows which tools agents actually use
  tags:
  - Reliability
  - Telco
  scenario: |-
    A carrier's platform exposes 80 tools to agents. When the BSS team plans to retire an API, nobody can say which agents call the tools that depend on it, how often, or with what error rates. The retirement breaks two agents.
  antipattern: |-
    **Tools without usage telemetry.**

    *Think of it this way:* Turning off a water main without knowing which houses it supplies.
  fails: |-
    - No per-tool usage or error telemetry.
    - Dependencies between tools and APIs aren't mapped.
    - Changes are risky.

    **Root cause:** Tools without observability or inventory.

    **Where it breaks:** Tool platform.
  diagram:
    bad:
    - 80 tools · Exposed
    - '!API retired · Planned'
    - Who uses it? · Unknown
    - '!2 agents · Broken'
    bad_note: Tools without usage telemetry
    good:
    - Tool metrics · Calls, errors
    - +Dependency map · Tool to API
    - +Registry · Owners
    - Notify · Before retire
    good_note: Per-tool metrics, dependency map, registry
  solution: |-
    1. Emit metrics per tool (calls, callers, latency, errors) and keep a dependency map from tools to backend APIs.
    2. Maintain a tool registry with owners and deprecation status.
    3. Notify consuming agents before retirements.
  works: |-
    **Trade-off to manage:** None significant.

    **How you prove it worked:**

    - Tools without usage data; unknown callers.

    **Same pattern elsewhere:** FinTech: a bank retires a fraud-score API and silently breaks an agent tool.
  takeaway: You can't retire what you can't see being used.
  related:
  - mas-15
  - tel-11
  code: |
    def instrumented(tool):
        def run(*a, ctx, **kw):
            t0 = monotonic()
            try:
                return tool(*a, ctx=ctx, **kw)
            except Exception:
                tool_errors.labels(tool=tool.__name__, caller=ctx.agent_id).inc(); raise
            finally:
                tool_calls.labels(tool=tool.__name__, caller=ctx.agent_id).inc()
                tool_latency.labels(tool=tool.__name__).observe(monotonic() - t0)
        return run

    registry.register(tool="get_bill_summary", owner="billing-platform", backends=["billing-api/v3"], status="active")
  lang: python
