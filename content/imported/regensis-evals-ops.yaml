- id: aev-01
  title: eSIM agent says activated, but no profile was installed
  tags:
  - Quality
  - Telco
  scenario: |-
    A carrier evaluates its eSIM-transfer agent with an LLM judge that reads the final message. The suite passes at 96%. In production, 11% of customers who were told "Your eSIM is active" have no service: the agent created the order, but the SM-DP+ profile download never completed, and the agent never checked.
  antipattern: |-
    **Judging the agent's text instead of the resulting state.**

    *Think of it this way:* Grading a plumber by asking them whether the leak is fixed, instead of turning the tap on.
  fails: |-
    **Mechanism:** Agents can claim success they didn't achieve.

    - The eval graded the agent's claim, not the system state.
    - The agent's success message came before the asynchronous provisioning step finished.
    - Nothing compared the order state and SIM profile state after the run.

    **Root cause:** Response-based grading for a task whose success is a change in external systems.

    **Where it breaks:** Eval harness design.
  diagram:
    bad:
    - eSIM transfer · Agent run
    - '!''Active!'' · Final message'
    - 'Judge: pass · 96%'
    - '!11% no service · Profile failed'
    bad_note: Judge reads the final message
    good:
    - Agent run · In sandbox
    - +Order state · TMF622 done
    - +Profile state · INSTALLED
    - Then confirm · Or 'pending'
    good_note: Assert system state after the run
  solution: |-
    1. Grade outcomes by querying system state after the run (order completed in TMF622, profile status INSTALLED on the SM-DP+, line active in inventory).
    2. Make the agent wait on, or poll, provisioning status before confirming, with a "pending" message if not done.
    3. Keep the judge only for tone and clarity, as a secondary score.
  works: |-
    **Trade-off to manage:** State checks need a sandbox BSS with realistic async behaviour, which takes effort to build.

    **How you prove it worked:**

    - Post-run state assertions in the eval harness; in production, a reconciliation of "confirmed" sessions against activation records.

    **Same pattern elsewhere:** FinTech: a card-replacement agent says "new card on its way" while the card-issuing request failed validation.
  takeaway: Check the world, not the agent's claim about the world.
  related:
  - aev-12
  - aev-04
  code: |
    def grade_esim_run(run, env):
        order = env.tmf622.get_order(run.order_id)
        profile = env.smdp.profile_status(run.iccid)
        line = env.inventory.line(run.msisdn)
        outcome = order.state == "completed" and profile == "INSTALLED" and line.status == "active"
        claimed = "activated" in run.final_message.lower()
        return {"outcome": outcome,
                "false_claim": claimed and not outcome,                    # the real failure
                "tone": judge.tone(run.final_message)}                      # secondary score only
