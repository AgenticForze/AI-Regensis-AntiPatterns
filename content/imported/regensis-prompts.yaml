    A wealth platform's assistant prompt starts "You are a world-class tax attorney with 30 years of experience." Answers sound confident but miss the client's state of residence, account type and tax year, which the prompt never provides.
  antipattern: |-
    **Relying on persona statements for quality.**

    *Think of it this way:* Putting on a doctor's coat doesn't tell you the patient's symptoms.
  fails: |-
    **Mechanism:** A persona sets tone, but quality comes from task context, criteria, and information.

