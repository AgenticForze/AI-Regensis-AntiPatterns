  code: |
    @tool
    def start_port_in(msisdn: str, losing_carrier: str, account_number: str, pin: str) -> dict:
        order = porting.submit(msisdn, losing_carrier, account_number, pin)
        state_store.put(f"port:{msisdn}", {"order_id": order.id, "status": "SUBMITTED"})
        return {"order_id": order.id, "expected": "usually within 2-4 hours", "status": "SUBMITTED"}

    @tool
    def get_port_status(order_id: str) -> dict: return porting.status(order_id)

    porting.on_complete(lambda o: notify(o.customer, f"Your number {o.msisdn} is now active."))
