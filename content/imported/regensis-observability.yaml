    A carrier's care bot logs full prompts and completions to its central logging platform, which 600 engineers can search. A privacy audit finds customer addresses, account PINs and call-detail summaries (CPNI) in logs retained for 13 months.
  antipattern: |-
    **Capturing raw prompt and completion text by default.**

    *Think of it this way:* Photocopying every customer's file and leaving the copies in the staff kitchen.
  fails: |-
    **Mechanism:** Prompts contain user data. Logs are widely accessible and long-retained.

    - Prompts contain customer data by design.
    - Logs are widely accessible and long-retained.
    - Nobody classified telemetry as a data store.

    **Root cause:** Content capture on by default, with no redaction or access policy.

    **Where it breaks:** Telemetry pipeline.
  diagram:
    bad:
    - Full prompts · Logged
    - '!Addresses, PINs · CPNI'
    - 600 engineers · Can search
    - '!13 months · Retention'
    bad_note: Full prompts logged by default
    good:
    - Redact · At collector
    - +Opt-in content · Per env
    - +Restricted store · Short retention
    - Audited access · Break-glass
    good_note: Redact at the collector, restricted content store
  solution: |-
    1. Detect and redact PII before export (Microsoft Presidio or a similar library at the collector), and never log PINs or secrets.
    2. Make content capture opt-in per environment and per field.
    3. Store sensitive content in a restricted, short-retention store with audited access.
  works: |-
    **Trade-off to manage:** Redaction removes some debugging context; keep tokenised identifiers to stitch traces.

    **How you prove it worked:**

    - Scheduled PII scans of log indexes; access audit reports.

    **Same pattern elsewhere:** FinTech: a bank finds full card numbers and SSNs in assistant logs, putting the logging platform in PCI scope.
  takeaway: Prompts are customer data, so treat logs as a data store.
  related:
  - obs-16
  - sec-06
  - data-07
  code: |
    from presidio_analyzer import AnalyzerEngine
    from presidio_anonymizer import AnonymizerEngine
    analyzer, anonymizer = AnalyzerEngine(), AnonymizerEngine()

    CAPTURE_CONTENT = {"dev": True, "staging": True, "prod": False}       # opt-in per environment

    def redact_for_export(text: str) -> str:
        found = analyzer.analyze(text, language="en", entities=["PERSON", "PHONE_NUMBER", "LOCATION", "EMAIL_ADDRESS"])
        return anonymizer.anonymize(text, found).text

    span.set_attribute("gen_ai.prompt", redact_for_export(prompt) if CAPTURE_CONTENT[ENV] else "[not captured]")
