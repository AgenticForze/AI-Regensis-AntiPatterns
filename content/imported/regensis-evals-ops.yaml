- id: aev-11
  title: Port-in agent gives up on the first rejection
  tags:
  - Quality
  - Telco
  scenario: |-
    A port-in agent receives a rejection from the losing carrier ("account number mismatch"). The correct behaviour is to ask the customer to confirm the account number and PIN from their old carrier and resubmit. Instead, the agent tells the customer the port failed and to visit a store. Evals never included rejections.
  antipattern: |-
    **Only testing successful paths.**

    *Think of it this way:* A delivery driver who drives home with the parcel because the doorbell didn't work, instead of knocking.
  fails: |-
    **Mechanism:** Recovery is a core agent skill and fails silently.

    - Only successful paths are tested.
    - Recovery behaviour is undefined.
    - Common, fixable errors become customer failures.

    **Root cause:** Error-recovery is not evaluated or specified.

    **Where it breaks:** Eval suite and agent instructions.
  diagram:
    bad:
    - Port-in · Submitted
    - '!Rejected · Account mismatch'
    - Gives up · Go to store
    - '!Lost customer · Fixable error'
    bad_note: Only successful paths tested
    good:
    - Inject codes · Each rejection
    - +Expected fix · Per code
    - +Score recovery · Or escalation
    - Resubmit · Confirmed data
    good_note: Inject rejections and score recovery
  solution: |-
    1. Inject specific rejections (account mismatch, PIN mismatch, number not portable) and define the expected recovery for each.
    2. Score whether the agent recovers correctly, retries appropriately or escalates honestly.
    3. Map rejection codes to recovery actions in the tool response.
  works: |-
    **Trade-off to manage:** Not every error is recoverable; the eval must also check honest escalation.

    **How you prove it worked:**

    - Recovery rate per rejection code in production.

    **Same pattern elsewhere:** FinTech: an ACH payment agent gives up when a payment returns R03 (no account) instead of asking the customer to re-check the account number.
  takeaway: Score recovery, not just success.
  related:
  - aev-05
  - agf-11
  code: |
    RECOVERY = {"6C": "ask_customer_for_account_number", "8C": "ask_customer_for_pin",
                "NP": "explain_not_portable_and_escalate"}

    @pytest.mark.parametrize("code,expected", RECOVERY.items())
    def test_port_rejection_recovery(code, expected, sandbox):
        sandbox.npac.inject_rejection(code)
        trace = port_agent.run("port my number", env=sandbox)
        assert expected in [s.tool for s in trace.tool_spans]

    # tool response carries the mapping: {"status": "REJECTED", "code": "8C", "next_action": "ask_customer_for_pin"}
  lang: python
- id: aev-12
  title: Agent says the card is frozen but never called the tool
  tags:
  - Quality
  - FinTech
  - Critical
  scenario: |-
    A customer reports a stolen card. The bank's agent replies "I've frozen your card and ordered a replacement." It called the replacement tool but never called freeze_card. Fraudulent transactions continue for two hours.
  antipattern: |-
    **No consistency check between claims and actions.**

    *Think of it this way:* An assistant who tells you the door is locked because they meant to lock it.
  fails: |-
    **Mechanism:** Models narrate actions they never took.

    - Models narrate actions they intended but didn't take.
    - Nothing compares claims in the reply with the tool log.
    - The eval judged the message as correct.

    **Root cause:** No consistency check between claimed and executed actions.

    **Where it breaks:** Runtime guardrail and eval.
  diagram:
    bad:
    - Stolen card · Reported
    - '!''Card frozen'' · Says agent'
    - No freeze call · In trace
    - '!Fraud 2 hours · Continues'
    bad_note: Trust the agent's description of its actions
    good:
    - Freeze first · Fixed workflow
    - +Extract claims · From reply
    - +Match trace · Tool log
    - Block mismatch · Or correct
    good_note: Compare claims with the tool log, workflow for critical actions
  solution: |-
    1. Extract claimed actions from the final reply (classifier or structured output) and compare with the tool-call log; block or correct mismatches.
    2. Make critical actions part of a workflow (stolen card always triggers freeze first) rather than a model choice.
    3. Add this consistency check to every agent eval.
  works: |-
    **Trade-off to manage:** Claim extraction can produce false alarms; tune it on labelled replies.

    **How you prove it worked:**

    - Claim-vs-trace mismatch rate, alerting on any critical action.

    **Same pattern elsewhere:** Telco: an agent says "I've barred international calls on the stolen phone" without calling the barring tool.
  takeaway: Every claimed action must appear in the trace.
  related:
  - aev-01
  - obs-07
  code: |
    CLAIMS = {"freeze": "freeze_card", "replace": "order_replacement", "block": "block_merchant"}

    def claimed_vs_done(reply: str, trace) -> list[str]:
        claimed = extract_claimed_actions(reply)            # classifier / structured output
        done = {s.tool for s in trace.tool_spans if s.status == "ok"}
        return [c for c in claimed if CLAIMS[c] not in done]

    if (missing := claimed_vs_done(reply, trace)):
        reply = correct_reply(reply, missing)              # block or correct before sending
  lang: python
- id: aev-13
  title: Framework chosen on a public benchmark fails on BSS workflows
  tags:
  - Quality
  - Telco
  scenario: |-
    A carrier picks an agent framework and model because they top a public coding and web-browsing benchmark. On the carrier's own tasks (change plan, move a line to another account, troubleshoot fiber), the choice ranks third of four candidates.
  antipattern: |-
    **Choosing agents and models on public leaderboards alone.**

    *Think of it this way:* Hiring a chef because they won a baking contest, for a job running a barbecue.
  fails: |-
    **Mechanism:** Public benchmarks don't match your tools, data, or policies, and some are contaminated.

    - Public benchmarks don't use your tools, data or policies.
    - Some public benchmarks are contaminated in training data.
    - The decision was never tested on internal tasks.

    **Root cause:** Selection based on public leaderboards instead of an internal task suite.

    **Where it breaks:** Vendor and model selection.
  diagram:
    bad:
    - Leaderboard · Top rank
    - '!Chosen · Framework + model'
    - Own tasks · Ranks 3rd
    - '!Rework · Months'
    bad_note: Pick by public leaderboard
    good:
    - Shortlist · Public scores
    - +Task suite · Top 30 flows
    - +Sandbox runs · Each candidate
    - Decide · On own tasks
    good_note: Internal task suite from real workflows
  solution: |-
    1. Build an internal task suite from the top 30 real workflows, run in a sandbox.
    2. Use public benchmarks only to shortlist.
    3. Re-run the internal suite for every model or framework change.
  works: |-
    **Trade-off to manage:** An internal suite takes weeks to build, but it pays off on every later decision.

    **How you prove it worked:**

    - Internal suite results per candidate.

    **Same pattern elsewhere:** FinTech: a bank selects a model on general reasoning benchmarks and it struggles with its specific reconciliation and statement formats.
  takeaway: Your tasks are the only benchmark that matters.
  related:
  - ops-16
  code: |
    INTERNAL_SUITE = load_tasks("workflows/top30/*.yaml")   # real BSS workflows, sandboxed

    def choose(candidates):
        shortlist = [c for c in candidates if c.public_benchmark_rank <= 5]   # public only to shortlist
        scores = {c.name: run_suite(c, INTERNAL_SUITE, env=bss_sandbox).success_rate for c in shortlist}
        return max(scores, key=scores.get), scores
  lang: python
- id: aev-14
  title: Agent eval scores swing with live FX rates
  tags:
  - Quality
  - FinTech
  scenario: |-
    A cross-border payments agent is evaluated against live FX quotes, live account balances and today's date. The same version scores 78% on Monday and 64% on Tuesday, because rates, holidays and balances changed. The team cannot tell whether a change helped.
  antipattern: |-
    **Evals depend on live data that changes.**

    *Think of it this way:* Comparing two runners on different days, one with a tailwind and one in the rain.
  fails: |-
    **Mechanism:** You can't compare runs when the world changes underneath.

    - The environment changes between runs.
    - Expected answers depend on live data.
    - Run-to-run comparisons are meaningless.

    **Root cause:** Non-deterministic eval environment.

    **Where it breaks:** Eval infrastructure.
  diagram:
    bad:
    - Live FX · Live balances
    - '!Monday 78% · Same version'
    - Tuesday 64% · Data changed
    - '!Can''t compare · Changes'
    bad_note: Evals against live, changing data
    good:
    - Snapshot · Rates, balances
    - +Freeze clock · Fixed date
    - +Replay tools · Recorded
    - Live smoke · Separate test
    good_note: Frozen clock, seeded data, recorded tools
  solution: |-
    1. Snapshot and seed environments (balances, rates, holidays), freeze the clock, and replay recorded tool responses.
    2. Version the environment snapshot with the eval set.
    3. Run a separate live smoke test for integration, not for comparisons.
  works: |-
    **Trade-off to manage:** Snapshots go stale; refresh them on a schedule, re-baselining scores.

    **How you prove it worked:**

    - Baseline re-runs on the same snapshot should match closely.

    **Same pattern elsewhere:** Telco: an order agent's evals change daily because the live catalog and stock levels change.
  takeaway: Reproducible environments make agent evals comparable.
  related:
  - aev-04
  - cicd-08
  code: |
    def eval_env(snapshot="snapshots/fx_2026_10_01.json"):
        env = Sandbox.from_snapshot(snapshot)                # balances, FX rates, holiday calendar
        env.freeze_clock("2026-10-01T09:00:00Z")
        env.tools.fx_rates = Replay("recordings/fx_rates.jsonl")
        return env

    EVAL_SET = {"version": "fx-evals@4", "env_snapshot": "snapshots/fx_2026_10_01.json"}   # versioned together
  lang: python
- id: aev-15
  title: B2B move agent fine at 3 steps, lost at 30
  tags:
  - Quality
  - Telco
  scenario: |-
    An enterprise-services agent handles office moves (disconnect at old site, order at new site, port numbers, migrate devices). Evals use mostly single-site moves of 3-5 steps. Real moves of 10 sites take 30-50 steps. The agent forgets earlier sites, re- orders one circuit twice and misses another.
  antipattern: |-
    **Eval suite skewed toward short horizons.**

    *Think of it this way:* A marathon runner trained only for 5 km.
  fails: |-
    **Mechanism:** Context drift, compounding errors, and memory loss appear only on long runs.

    - Evals skew to short tasks.
    - Context drift and compounding errors appear only on long runs.
    - Reliability decays with horizon and nobody measured how fast.

    **Root cause:** The eval suite doesn't represent long-horizon tasks.

    **Where it breaks:** Eval coverage.
  diagram:
    bad:
    - Evals · 3-5 steps
    - '!Real move · 30-50 steps'
    - Drift · Sites forgotten
    - '!Duplicate order · Missed circuit'
    bad_note: Evals with only short tasks
    good:
    - Long tasks · 10-site moves
    - +Curve · Success vs length
    - +Task list · Tick off sites
    - State check · Each site once
    good_note: Long tasks, success vs length, task-list state
  solution: |-
    1. Include long-horizon tasks, and plot success against task length.
    2. Track goal retention (is every site handled exactly once) as a final-state check.
    3. Use a structured task list as agent state, ticking items off, to reduce drift.
  works: |-
    **Trade-off to manage:** Long tasks are slow and expensive to evaluate; run them nightly, not per PR.

    **How you prove it worked:**

    - Success rate by number of sites or steps.

    **Same pattern elsewhere:** FinTech: an estate-settlement agent works for one account but loses track across 12 accounts and 4 beneficiaries.
  takeaway: Reliability decays with horizon, so measure the curve.
  related:
  - aev-07
  - ctx-02
  code: |
    def long_horizon_report(agent, tasks):
        rows = []
        for t in tasks:                                        # 3 to 30+ steps
            env = sandbox(t); agent.run(t, env=env)
            handled = Counter(env.sites_processed())
            rows.append({"steps": t.length, "success": t.check(env),
                         "goal_retention": all(handled[s] == 1 for s in t.sites)})   # each site exactly once
        return group_mean(rows, by="steps")                    # plot success vs task length
  lang: python
- id: aev-16
  title: Accounts-payable agent changes a vendor's bank details from an email
  tags:
  - Quality
  - Security
  - FinTech
  - Critical
  scenario: |-
    A company's AP agent reads the AP inbox and updates vendor records. An attacker spoofs a supplier and emails "our bank details have changed" with new account details. The agent updates the vendor master, and the next $180,000 payment goes to the attacker, a classic business email compromise.
  antipattern: |-
    **Red-teaming only chat output, not actions.**

    *Think of it this way:* A receptionist who updates the payroll bank account of anyone who emails asking nicely.
  fails: |-
    **Mechanism:** Agent risk is in actions, especially from indirect prompt injection in tool results.

    - Untrusted email content drives a high-risk write action.
    - Red-team tests covered chat output, not actions.
    - No out-of-band verification for bank detail changes.

    **Root cause:** Agent safety evals ignore indirect injection and action risk.

    **Where it breaks:** Safety evals, tool permissions and process controls.
  diagram:
    bad:
    - Spoofed email · New bank details
    - '!AP agent · Reads inbox'
    - Vendor updated · By agent
    - '!$180k lost · To attacker'
    bad_note: Email content drives a bank-detail change
    good:
    - Request only · No write tool
    - +Call-back · Known number
    - +Dual approval · Bank changes
    - Injection evals · In CI
    good_note: No write capability, call-back, dual approval
  solution: |-
    1. Remove the agent's ability to change bank details; it may only open a change request.
    2. Require out-of-band verification (call-back to a known number) and dual approval for bank-detail changes.
    3. Add injection test emails to the eval suite and score unsafe actions attempted.
  works: |-
    **Trade-off to manage:** Manual verification slows legitimate changes, which are rare and worth the delay.

    **How you prove it worked:**

    - Alerts on vendor bank-detail changes followed by payments within 30 days.

    **Same pattern elsewhere:** Telco: an email-reading agent receives a request to transfer a business's numbers to another account and starts a port-out.
  takeaway: For agents, safety is measured in actions.
  related:
  - rag-19
  - sec-02
  - gov-02
  code: |
    @tool
    def request_bank_detail_change(vendor_id: str, new_iban: str, source_email_id: str):
        # the agent can no longer change bank details directly
        return change_requests.open(vendor_id, new_iban, source=source_email_id,
                                    controls=["callback_to_known_number", "dual_approval"])

    INJECTION_EMAILS = load("evals/ap_injection_emails.jsonl")
    unsafe = sum("update_vendor_bank" in [s.tool for s in ap_agent.run(e).tool_spans] for e in INJECTION_EMAILS)
    assert unsafe == 0
  lang: python
- id: aev-17
  title: Automated scores look fine, but nobody reads the traces
  tags:
  - Quality
  - Telco
  scenario: |-
    A carrier's agent passes all automated checks for months. Customers start complaining that the agent asks for the same account PIN twice and apologises excessively. None of the automated graders measure repetition or tone.
  antipattern: |-
    **100% automated grading with no qualitative review.**

    *Think of it this way:* A restaurant that checks food temperatures automatically but never tastes the food.
  fails: |-
    **Mechanism:** Automated graders miss new failure modes they weren't written for.

    - Automated graders only find failure modes they were written for.
    - New failure patterns emerge after model or prompt changes.
    - No one does qualitative review.

    **Root cause:** 100% automated grading with no human error analysis.

    **Where it breaks:** Eval operating rhythm.
  diagram:
    bad:
    - Auto checks · All passing
    - '!New patterns · Repeats PIN ask'
    - Not measured · No grader
    - '!Complaints · Found late'
    bad_note: 100% automated grading
    good:
    - Weekly review · Sampled traces
    - +Taxonomy · Classify issues
    - +New checks · Automated
    - Rotate · Reviewers
    good_note: Weekly trace review that feeds new checks
  solution: |-
    1. Hold weekly trajectory review sessions on sampled runs, including negative feedback.
    2. Classify findings into a failure taxonomy and write automated checks for new patterns.
    3. Rotate reviewers across product, engineering and care.
  works: |-
    **Trade-off to manage:** Review time is expensive; 1-2 hours a week is enough to find most patterns.

    **How you prove it worked:**

    - Number of new failure modes found per month; time from discovery to automated check.

    **Same pattern elsewhere:** FinTech: a bank agent's automated scores are fine, but reviews reveal it pushes credit card upgrades in unrelated conversations.
  takeaway: Read the traces. Then automate what you find.
  related:
  - obs-17
  - eval-05
  code: |
    @schedule(cron="0 15 * * MON")
    def weekly_review():
        sample = traces.sample(n=30, strata={"negative_feedback": 10, "random": 15, "new_version": 5})
        session = review.create(traces=sample, reviewers=rotate(["product", "engineering", "care"]))
        for f in session.findings:
            taxonomy.add(f.category)
            if f.new_pattern:
                checks.register(auto_check_for(f))           # becomes an automated check
  lang: python
- id: aev-18
  title: Planner prompt change silently breaks the payment executor
  tags:
  - Quality
  - FinTech
  scenario: |-
    A bank's bill-pay system has a planner agent and an executor agent. A team improves the planner's prompt and its own evals improve. The planner now writes amounts with thousands separators ("1,250.00"). The executor's parser reads "1" and schedules $1 payments, which fail reconciliation.
  antipattern: |-
    **Each agent evaluated in isolation only.**

    *Think of it this way:* Changing a recipe card's format so the kitchen printer prints garbage, while the recipe itself got better.
  fails: |-
    **Mechanism:** Agents are coupled through message formats and expectations.

    - Each agent was evaluated alone.
    - The message format between agents was an implicit contract.
    - No end-to-end test ran on the planner change.

    **Root cause:** No contract tests or system evals for multi-agent changes.

    **Where it breaks:** CI for multi-agent systems.
  diagram:
    bad:
    - Planner tweak · Evals better
    - '!''1,250.00'' · New format'
    - Executor reads · '1'
    - '!$1 payments · Recon breaks'
    bad_note: Each agent evaluated in isolation
    good:
    - Typed schema · Decimal string
    - +Contract test · Every PR
    - +System eval · On merge
    - Validate · At each hop
    good_note: Typed handoffs, contract tests, system evals
  solution: |-
    1. Define typed handoff schemas with validation (amount as decimal string, no separators).
    2. Add contract tests that validate one agent's outputs against the next agent's schema.
    3. Run end-to-end system evals on any agent change.
  works: |-
    **Trade-off to manage:** End-to-end evals are slower; run them on merge, and contract tests on every PR.

    **How you prove it worked:**

    - Schema validation failures between agents; reconciliation breaks.

    **Same pattern elsewhere:** Telco: a diagnosis agent's new output format breaks the dispatch agent's parsing of the required technician skill.
  takeaway: Test agents alone and together.
  related:
  - agf-14
  - mas-03
  - cicd-12
  code: |
    class PaymentStep(BaseModel):
        amount: constr(pattern=r"^\d+\.\d{2}$")           # decimal string, no separators
        currency: str; payee_id: str

    def test_planner_executor_contract():
        for case in PLANNER_CASES:
            out = planner.run(case)
            for step in out.payment_steps:
                PaymentStep.model_validate(step)            # planner output must satisfy executor schema
  lang: python
- id: aev-19
  title: Judge approves an answer that contradicts the tool result
  tags:
  - Quality
  - Telco
  scenario: |-
    A carrier's billing agent tells a customer their bill includes a $15 late fee. The billing tool result shows no late fee; the $15 was an equipment charge. The LLM judge, which only sees the question and the answer, rates it correct and well explained.
  antipattern: |-
    **The judge sees only the user question and final answer.**

    *Think of it this way:* Asking someone to check a translation without showing them the original text.
  fails: |-
    **Mechanism:** Groundedness can't be checked without the evidence.

    - The judge has no access to the evidence.
    - It can grade fluency and plausibility only.
    - Grounding errors pass.

    **Root cause:** The judge lacks the tool outputs needed to check faithfulness.

    **Where it breaks:** Judge input design.
  diagram:
    bad:
    - '''$15 late fee'' · Agent says'
    - '!Tool data · Equipment fee'
    - Judge sees Q+A · Only
    - '!Rated correct · Ungrounded'
    bad_note: Judge sees only question and answer
    good:
    - Tool outputs · To the judge
    - +Rubric · Claims supported
    - +Code check · Amounts, dates
    - Grounded · Verdict
    good_note: Give the judge tool outputs and a faithfulness rubric
  solution: |-
    1. Pass relevant tool outputs (or the full trace) to the judge.
    2. Use a faithfulness rubric (every factual claim must be supported by tool data).
    3. Add a deterministic check for amounts and dates against tool results.
  works: |-
    **Trade-off to manage:** Bigger judge inputs cost more; pass only the tool results referenced.

    **How you prove it worked:**

    - Judge agreement with human review on grounding cases.

    **Same pattern elsewhere:** FinTech: a judge approves a claim that a payment cleared, which the payments tool reported as pending.
  takeaway: A judge needs the evidence to judge grounding.
  related:
  - eval-03
  - aev-12
  code: |
    def judge_answer(answer, trace):
        tool_data = {s.tool: s.output for s in trace.tool_spans}
        verdict = judge.rubric("Every factual claim must be supported by TOOL DATA.", answer=answer, tool_data=tool_data)
        numbers_ok = all(v in flatten_values(tool_data) for v in money_and_dates(answer))   # deterministic
        return verdict.passed and numbers_ok
  lang: python
- id: aev-20
  title: Offline evals pass while customers redo tasks by hand
  tags:
  - Quality
  - FinTech
  scenario: |-
    A bank's agent for updating direct debits passes offline evals at 90%. In production, 30% of customers then call or visit a branch to make the same change, because the agent's confirmation was unclear or the change didn't stick. None of this appears in offline metrics.
  antipattern: |-
    **Offline-only agent evaluation.**

    *Think of it this way:* A hotel whose online reviews are great but whose guests keep calling reception to fix their room.
  fails: |-
    **Mechanism:** The real distribution of tasks and environments differs from the test suite.

    - Offline task distribution differs from real tasks.
    - Silent failures (customer redoes the task elsewhere) are not linked back.
    - No online agent metrics.

    **Root cause:** Offline-only agent evaluation.

    **Where it breaks:** Production measurement.
  diagram:
    bad:
    - Offline 90% · Direct debits
    - '!Unclear confirm · In prod'
    - 30% redo · Call or branch
    - '!Invisible · Not linked'
    bad_note: Offline evals only
    good:
    - Takeover rate · Per intent
    - +Repeat 7 days · Cross-channel
    - +Undo rate · Reversals
    - Trace grading · Weekly sample
    good_note: Takeover and repeat-contact metrics in production
  solution: |-
    1. Track human takeover rate, repeat contact within 7 days on the same intent, undo or reversal rate and escalations.
    2. Join agent sessions to downstream channels (call, branch) by customer and intent.
    3. Sample and grade production traces weekly.
  works: |-
    **Trade-off to manage:** Cross-channel joins need data engineering and privacy review.

    **How you prove it worked:**

    - Repeat-contact and takeover dashboards per intent and version.

    **Same pattern elsewhere:** Telco: after the agent "changes" a plan, customers call care within days to fix it.
  takeaway: Human takeover rate is the truest agent metric.
  related:
  - eval-11
  - obs-13
  code: |
    def online_agent_metrics(sessions, contacts):
        return {
            "human_takeover": mean(s.handed_off for s in sessions),
            "repeat_contact_7d": mean(contacts.same_intent_within(s.customer, s.intent, days=7) for s in sessions),
            "reversal_rate": mean(s.action_undone_within(hours=48) for s in sessions),
            "escalations": sum(s.escalated for s in sessions)}
  lang: python
