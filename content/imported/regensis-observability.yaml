- id: tel-04
  title: Three teams report token usage three different ways
  tags:
  - Reliability
  - Cost
  - Telco
  scenario: |-
    A carrier's care, sales and network teams each log LLM usage. One logs "tokens" (input plus output), one logs only output, one logs characters. Finance cannot reconcile internal reports with the provider's invoice, and chargebacks to business units are disputed.
  antipattern: |-
    **Ad-hoc field names per team.**

    *Think of it this way:* Three branches measuring sales in dollars, euros and "units", then adding them up.
  fails: |-
    **Mechanism:** You can't aggregate what isn't standardized.

    - No shared schema for usage and cost.
    - Cached and reasoning tokens are priced differently and often missing.
    - Aggregation produces nonsense.

    **Root cause:** Ad-hoc usage fields per team.

    **Where it breaks:** Shared instrumentation and gateway.
  diagram:
    bad:
    - 'Care: tokens · In + out'
    - '!Sales: output · Only'
    - 'Network: chars · Characters'
    - '!No reconcile · Invoice'
    bad_note: Ad-hoc usage fields per team
    good:
    - Schema · In/out/cached
    - +Gateway · Fills it
    - +Cost USD · Per BU
    - Monthly · Reconcile
    good_note: One usage schema populated at the gateway
  solution: |-
    1. Define a shared usage schema (input, output, cached and reasoning tokens, model, provider, cost in USD, feature, tenant, business unit).
    2. Populate it in one place, the LLM gateway or shared client library, from provider usage fields.
    3. Reconcile monthly against invoices.
  works: |-
    **Trade-off to manage:** Teams must migrate to the shared client; make it the easiest path.

    **How you prove it worked:**

    - Variance between internal cost totals and invoices.

    **Same pattern elsewhere:** FinTech: a bank's chargeback model for AI usage collapses because divisions report usage inconsistently.
  takeaway: Standardise the schema before you build the dashboard.
  related:
  - tel-12
  - obs-05
  code: |
    @dataclass
    class Usage:
        provider: str; model: str; input_tokens: int; output_tokens: int
        cached_tokens: int; reasoning_tokens: int; cost_usd: float
        feature: str; tenant: str; business_unit: str

    def from_provider(resp, ctx) -> Usage:                 # populated once, in the gateway
        u = resp.usage
        return Usage(ctx.provider, resp.model, u.input_tokens, u.output_tokens,
                     getattr(u, "cache_read_input_tokens", 0), getattr(u, "reasoning_tokens", 0),
                     PRICES.cost(resp.model, u), ctx.feature, ctx.tenant, ctx.bu)
