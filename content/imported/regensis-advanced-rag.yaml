    def answer_with_sources(q):
        hits = retrieve(q, k=8)
        out = llm.generate(q, sources=hits, schema=list[Claim])           # optionally a format-tuned model
        verified = [c for c in out if nli.entails(hits[c.source_id].text, c.claim) > 0.8]
        return render(verified, citations=True)
