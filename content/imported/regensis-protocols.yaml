- id: tool-15
  title: Balance unchanged right after the payment, so the agent pays again
  tags:
  - Reliability
  - FinTech
  scenario: |-
    A bank's bill-pay agent makes a credit-card payment, then checks the card balance to confirm. The balance service is eventually consistent and still shows the old balance. The agent concludes the payment failed and pays again.
  antipattern: |-
    **Confirm a write with a stale read.**

    *Think of it this way:* Checking your letterbox seconds after posting a letter and assuming it wasn't sent.
  fails: |-
    - Reads after writes may be stale.
    - The agent uses a read to confirm a write.
    - No idempotency on the payment.

    **Root cause:** Ignoring eventual consistency in tool design.

    **Where it breaks:** Tool semantics.
  diagram:
    bad:
    - Pay card · Done
    - '!Read balance · Stale'
    - '''Failed'' · Agent thinks'
    - '!Pays again · Duplicate'
    bad_note: Confirm a write with a stale read
    good:
    - Receipt · Payment id
    - +Status · From write
    - +Idem key · Blocks repeat
    - Docs · Consistency
    good_note: Use the write's receipt plus idempotency
  solution: |-
    1. Return a confirmation (payment id and status) from the write tool and use that, not a later read.
    2. Use idempotency keys so a repeated payment is rejected.
    3. Document consistency guarantees in tool descriptions.
  works: |-
    **Trade-off to manage:** None significant.

    **How you prove it worked:**

    - Duplicate payments within minutes.

    **Same pattern elsewhere:** Telco: after adding a data pass, the usage tool still shows the old allowance and the agent adds another pass.
  takeaway: Confirm a write with its receipt, not with a read.
  related:
  - agf-06
  code: |
    @tool
    def make_payment(amount: Decimal, ctx: Session) -> dict:
        """Returns payment_id and status. The balance can take up to 15 minutes to update after a payment."""
        key = f"pay:{ctx.account_id}:{ctx.intent_id}"                  # one payment per intent
        r = payments.create(ctx.account_id, amount, idempotency_key=key)
        return {"payment_id": r.id, "status": r.status, "note": "use this confirmation, not the balance"}
  lang: python
- id: tool-16
  title: A generic http_request tool for everything
  tags:
  - Reliability
  - Security
  - Telco
  scenario: |-
    A carrier's internal agent has a single http_request(url, method, body) tool so it can call "any internal API". A prompt injection makes it call an internal admin endpoint that resets a network element's configuration.
  antipattern: |-
    **One generic HTTP tool.**

    *Think of it this way:* Giving someone a phone that can dial any extension, including the emergency shutdown line.
  fails: |-
    - Unlimited reach inside the network.
    - No per-endpoint authorisation.
    - Server-side request forgery by design.

    **Root cause:** Generic tools with unbounded scope.

    **Where it breaks:** Tool design.
  diagram:
    bad:
    - http_request · Any URL
    - '!Injection · Admin endpoint'
    - Config reset · Network element
    - '!Outage · Risk'
    bad_note: One generic HTTP tool
    good:
    - Specific tools · Approved ops
    - +Allow-list · Read-only
    - +Segmentation · Network
    - Alerts · Off-list calls
    good_note: Specific tools, allow-lists, segmentation
  solution: |-
    1. Replace generic HTTP with specific tools for approved operations.
    2. If a generic fetch is needed, restrict it to an allow-list of read-only endpoints and methods.
    3. Enforce network segmentation for agent runtimes.
  works: |-
    **Trade-off to manage:** More tools to build.

    **How you prove it worked:**

    - Calls to non-allow-listed endpoints.

    **Same pattern elsewhere:** FinTech: an agent's generic HTTP tool reaches an internal payments admin API.
  takeaway: Generic tools are generic attack surface.
  related:
  - tool-01
  - sec-17
  code: |
    READ_ONLY_ALLOW = {("GET", "https://api.status.internal/v1/services"),
                       ("GET", "https://kb.internal/api/articles")}

    @tool
    def fetch_internal(method: str, url: str) -> dict:
        base = url.split("?")[0]
        if (method, base) not in READ_ONLY_ALLOW:
            return {"status": "REFUSED", "why": "endpoint not on the read-only allow-list"}
        return http.request(method, url, timeout=5).json()
    # agent runtime network policy: egress only to the gateway and allow-listed hosts
