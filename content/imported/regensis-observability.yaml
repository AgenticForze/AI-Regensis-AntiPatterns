  code: |
    from opentelemetry.instrumentation.requests import RequestsInstrumentor
    from opentelemetry.instrumentation.sqlalchemy import SQLAlchemyInstrumentor
    RequestsInstrumentor().instrument(); SQLAlchemyInstrumentor().instrument(engine=engine)

    def traced_tool(fn):
        def wrapper(**args):
            with tracer.start_as_current_span(f"tool {fn.__name__}") as s:
                s.set_attribute("tool.args", redact(json.dumps(args)))
                out = fn(**args)
                s.set_attribute("tool.result_size", len(json.dumps(out))); return out
        return wrapper
