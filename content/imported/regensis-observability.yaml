    - +Inline rules · 100% cheap
    - Cost share · Tracked
    good_note: Async sampled judging plus cheap inline checks
  solution: |-
    1. Sample 1-10% for judge evaluation, asynchronously, after the response.
    2. Oversample risky intents, negative feedback and new versions.
    3. Run cheap deterministic checks (amounts, schema, banned phrases) inline on 100%.
