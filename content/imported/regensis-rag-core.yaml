- id: rag-15
  title: AML policy assistant gives answers with no citations
  tags:
  - Quality
  - Compliance
  - FinTech
  scenario: |-
    A bank's AML operations team uses an assistant to answer questions such as "When do we need enhanced due diligence for a correspondent bank?" During an internal audit, examiners ask which policy section supported a decision. The assistant gave no citations, so analysts cannot show their basis, and the finding goes into the audit report.
  antipattern: |-
    **Answers without source attribution.**

    *Think of it this way:* A student who writes the right answer but shows no working. In an exam that requires working, it still scores zero.
  fails: |-
    **Mechanism:** Users can't verify. Engineers can't tell retrieval errors from generation errors.

    - Answers are free text with no link to source passages.
    - Analysts cannot verify answers, and auditors cannot trace decisions.
    - Engineers cannot tell retrieval errors from generation errors.

    **Root cause:** Citations were treated as a UX extra instead of a compliance and debugging requirement.

    **Where it breaks:** Prompt contract, output schema and post-processing.
  diagram:
    bad:
    - EDD question · AML analyst
    - '!Free-text answer · No sources'
    - Audit asks why · No trail
    - '!Audit finding · Issued'
