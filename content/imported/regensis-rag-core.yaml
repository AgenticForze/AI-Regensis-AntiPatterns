- id: rag-17
  title: Multi-hop question about maintenance and SLA penalties
  tags:
  - Quality
  - Telco
  scenario: |-
    An enterprise account manager asks the copilot "Which of my customers are affected by Saturday's planned maintenance on the Chicago POP, and which have SLA credits above $10k?" The copilot retrieves the maintenance notice and stops there, listing no customers. Two key accounts are not notified and claim SLA credits.
  antipattern: |-
    **One retrieval pass for every question.**

    *Think of it this way:* Asking "Who won the race that my friend's cousin ran in?" You first need to find the cousin, then the race, then the winner. One lookup cannot do it.
  fails: |-
    **Mechanism:** The second fact depends on the first. A single query can't fetch both.

    - The answer needs maintenance window, then affected circuits, then customers, then contract SLA terms.
    - A single retrieval pass can only fetch documents similar to the whole question.
    - Inventory and contracts are structured data, not documents.

    **Root cause:** Single-shot retrieval for a question that needs a chain of lookups across systems.

    **Where it breaks:** Query planning and tools.
  diagram:
    bad:
    - Affected + SLA? · Account mgr
    - '!One search · Whole question'
    - Notice only · No customers
    - '!Not notified · SLA claims'
    bad_note: One retrieval for a chained question
    good:
    - Plan steps · Decompose
    - +Circuits · TMF638 inventory
    - +Customers + SLA · Contract lookup
    - Table + sources · Verified
    good_note: Decompose and call inventory tools per hop
  solution: |-
    1. Decompose the question into steps and let an agent call tools in sequence (maintenance calendar, service inventory (TMF638) for affected circuits, customer and contract lookup).
    2. Use a graph (site to circuit to service to customer) for relationship queries.
    3. Return a table with each hop's source so the account manager can verify it.
  works: |-
    **Trade-off to manage:** Multi-step plans are slower (several seconds) and need tool access with proper permissions.

    **How you prove it worked:**

    - Eval set of multi-hop questions with ground truth from inventory queries.
    - Track partial answers (fewer entities than expected).

    **Same pattern elsewhere:** FinTech: "Which of my clients hold funds exposed to the downgraded issuer?" needs holdings, then fund constituents, then the issuer list.
  takeaway: Some questions need a plan, not a search.
