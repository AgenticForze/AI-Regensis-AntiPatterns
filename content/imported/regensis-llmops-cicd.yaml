- id: cicd-19
  title: Cost regression merged without anyone noticing
  tags:
  - Reliability
  - Cost
  - FinTech
  scenario: |-
    A refactor of a bank's assistant adds the full account history to every prompt "for better context". Quality evals pass. Token usage per conversation triples, and the monthly bill rises by $40k before finance notices.
  antipattern: |-
    **CI checks quality, not cost.**

    *Think of it this way:* Approving a building plan without checking the budget.
  fails: |-
    - CI measures quality but not cost.
    - Token growth is invisible until the bill.
    - No budget threshold per change.

    **Root cause:** Cost not part of the release gate.

    **Where it breaks:** CI eval stage.
  diagram:
    bad:
    - Refactor · Full history
    - '!Quality · Evals pass'
    - Tokens x3 · Unseen
    - '!+$40k · Monthly'
    bad_note: CI checks quality, not cost
    good:
    - Tokens · Per eval case
    - +Delta · Vs baseline
    - +Threshold · Needs approval
    - Trend · Per release
    good_note: Cost and latency deltas gate the PR
  solution: |-
    1. Record tokens, cost and latency per eval case, and compare with the baseline in the PR.
    2. Block or require approval when cost per task rises above a threshold.
    3. Track cost per release over time.
  works: |-
    **Trade-off to manage:** Some legitimate improvements cost more; the gate asks for approval, not refusal.

    **How you prove it worked:**

    - Cost delta per PR.

    **Same pattern elsewhere:** Telco: a prompt change adds the full product catalog to every call and doubles cost.
  takeaway: Cost is a test result too.
  related:
  - eval-14
  - cost-01
  code: |
    def cost_gate(candidate, baseline):
        c, b = candidate.per_case, baseline.per_case
        delta = (mean(x.cost for x in c) - mean(x.cost for x in b)) / mean(x.cost for x in b)
        comment_on_pr(f"cost/task {delta:+.0%}, p95 latency {p95(c) - p95(b):+.2f}s")
        if delta > 0.15:
            require_approval("finops-owner")
  lang: python
- id: cicd-20
  title: Deployment succeeds but the bot can't reach the catalog
  tags:
  - Reliability
  - Telco
  scenario: |-
    A carrier deploys a new bot version. The deployment is marked successful because pods are healthy. A network-policy change blocks access to the product catalog API, so every plan question gets "I can't help with that right now." It takes 3 hours for someone to notice.
  antipattern: |-
    **Healthy pods means done.**

    *Think of it this way:* A restaurant that opens because the lights are on, without checking the kitchen has gas.
  fails: |-
    - Health checks test the process, not the journeys.
    - Dependencies aren't verified after deploy.
    - No automatic rollback on journey failures.

    **Root cause:** No post-deploy verification of key journeys.

    **Where it breaks:** Deployment pipeline.
  diagram:
    bad:
    - Deploy · Pods healthy
    - '!Catalog API · Blocked'
    - Plan Qs fail · Every one
    - '!3 hours · To notice'
    bad_note: Healthy pods means done
    good:
    - Smoke tests · Top journeys
    - +Tool checks · Reachability
    - +Auto-rollback · On failure
    - Synthetic · Continuous
    good_note: Post-deploy journey tests with auto-rollback
  solution: |-
    1. Run synthetic journey tests after deploy (top intents end to end, including tool calls).
    2. Check dependency reachability in readiness probes for critical tools.
    3. Roll back automatically if smoke tests fail.
  works: |-
    **Trade-off to manage:** Synthetic tests need test accounts in production systems, kept read-only.

    **How you prove it worked:**

    - Synthetic journey success rate, continuously.

    **Same pattern elsewhere:** FinTech: a bank's assistant deploys fine but can't reach the card-status API due to an expired certificate.
  takeaway: Deployed isn't done. Verify the journeys.
  related:
  - obs-20
  - cicd-16
  code: |
    JOURNEYS = ["check_balance", "pay_bill", "plan_change_quote", "outage_status"]

    def post_deploy_smoke(env):
        failures = [j for j in JOURNEYS if not synthetic_journey(env, j).ok]   # end to end incl. tool calls
        if failures:
            rollback(env); page("deploy smoke failed", failures)

    @app.get("/ready")
    def ready():
        return {"catalog": catalog.ping(), "billing": billing.ping()} if catalog.ping() else Response(status_code=503)
  lang: python
