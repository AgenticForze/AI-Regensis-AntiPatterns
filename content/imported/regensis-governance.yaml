- id: gov-19
  title: Nobody knows the regulator notification deadline for an AI incident
  tags:
  - Compliance
  - FinTech
  scenario: |-
    An EU bank's AI assistant exposes customer data for six hours due to a caching bug. The incident team handles the technical fix but doesn't know whether it qualifies as a major ICT-related incident or a personal-data breach, or the reporting deadlines for each.
  antipattern: |-
    **Technical response only.**

    *Think of it this way:* Knowing how to put out a fire but not that you must call the fire brigade.
  fails: |-
    - AI incidents aren't mapped to reporting obligations.
    - Classification criteria are unknown to responders.
    - Deadlines are missed.

    **Root cause:** Regulatory reporting not integrated into AI incident response.

    **Where it breaks:** Incident management.
  diagram:
    bad:
    - Data exposed · 6 hours
    - '!Tech fix · Done'
    - Report? · Unknown
    - '!Deadline · Missed'
    bad_note: Technical response only
    good:
    - Map types · To regimes
    - +Criteria · Deadlines
    - +Compliance · Hour one
    - Tabletop · Practised
    good_note: Incident types mapped to reporting rules and clocks
  solution: |-
    1. Map AI incident types to reporting regimes (data protection breach notification, operational-resilience incident reporting) with criteria and deadlines.
    2. Include compliance in AI incident playbooks from the first hour.
    3. Practise with tabletop exercises.
  works: |-
    **Trade-off to manage:** None significant.

    **How you prove it worked:**

    - Time from detection to classification decision.

    **Same pattern elsewhere:** Telco: a carrier doesn't know whether an AI-driven CPNI exposure must be reported to the regulator and law enforcement, and within what timeframe.
  takeaway: Know your reporting clock before the incident starts it.
  related:
  - sec-20
  - obs-19
  code: |
    REPORTING = {
        "personal_data_breach": {"regime": "GDPR Art. 33", "deadline_hours": 72, "notify": "DPO"},
        "major_ict_incident":   {"regime": "DORA", "deadline_hours": 4, "notify": "Operational Resilience"},
        "consumer_harm":        {"regime": "sector regulator", "deadline_hours": 24, "notify": "Compliance"},
    }

    def classify_ai_incident(inc):
        hits = [r for t, r in REPORTING.items() if t in inc.types]
        compliance.page(inc, deadlines=[(r["regime"], inc.detected_at + timedelta(hours=r["deadline_hours"])) for r in hits])
  lang: python
- id: gov-20
  title: Governance checklist signed but never checked
  tags:
  - Compliance
  - Security
  - Telco
  scenario: |-
    A carrier's AI governance board approves launches based on a self-assessed checklist ("evals done: yes", "PII handled: yes"). Post-launch reviews show half of the "yes" answers had no evidence.
  antipattern: |-
    **Self-attested checklist.**

    *Think of it this way:* A pilot ticking a pre-flight checklist from memory without looking at the plane.
  fails: |-
    - Self-attested answers.
    - No linked evidence.
    - No automated verification.

    **Root cause:** Governance relies on attestation instead of evidence.

    **Where it breaks:** Governance process.
  diagram:
    bad:
    - Checklist · Self-assessed
    - '!''Evals: yes'' · No proof'
    - Approved · Launch
    - '!Half missing · Evidence'
    bad_note: Self-attested checklist
    good:
    - Evidence links · Per item
    - +Pipeline · Generates
    - +Spot checks · Approvals
    - Report · Gaps
    good_note: Evidence links generated by the pipeline
  solution: |-
    1. Require evidence links for each checklist item (eval report, DPIA, red-team results, model card).
    2. Generate as much evidence automatically from the pipeline as possible.
    3. Spot-check approvals.
  works: |-
    **Trade-off to manage:** More effort per launch, mostly automated.

    **How you prove it worked:**

    - Checklist items without evidence.

    **Same pattern elsewhere:** FinTech: a bank's AI approvals cite "validated" models that have no validation report.
  takeaway: Governance runs on evidence, not ticks.
  related:
  - gov-12
  - cicd-15
  code: |
    CHECKLIST = {"eval_report": "evals/runs/*.html", "dpia": "privacy/dpia/*.pdf",
                 "red_team": "security/redteam/*.json", "model_card": "governance/cards/*.md"}

    def approve(use_case):
        evidence = {k: find_artifact(use_case, pattern) for k, pattern in CHECKLIST.items()}
        missing = [k for k, v in evidence.items() if not v]
        if missing: raise PermissionError(f"evidence missing: {missing}")
        approvals.record(use_case, evidence=evidence)
        if random() < 0.1: audit.spot_check(use_case)
  lang: python
