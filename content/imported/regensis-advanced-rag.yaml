  code: |
    TEACHER_POLICY = {"provider-a": {"distillation_allowed": False}, "open-model-x": {"license": "apache-2.0"}}

    def approve_synthetic_source(teacher):
        p = TEACHER_POLICY[teacher]
        if p.get("distillation_allowed") is False:
            raise PermissionError(f"{teacher} terms prohibit training competing models on outputs")
        provenance.record(teacher=teacher, license=p.get("license"), reviewed_by="legal")
