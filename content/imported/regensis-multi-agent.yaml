  related:
  - mas-01
  - cost-03
  code: |
    ROUTES = {"balance": tools.get_balance, "outage": agents.network, "plan_change": agents.orders}

    def handle(msg):
        intent = router.classify(msg)
        target = ROUTES.get(intent.name)                    # route straight to the agent/tool that answers
        with latency_budget(LATENCY_BUDGET[intent.name]):   # e.g. 3 s for balance
            return target(msg) if target else agents.orchestrator.run(msg)   # hierarchy only when needed
