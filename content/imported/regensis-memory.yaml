  antipattern: |-
    **Broadcasting the parent's context.**

    *Think of it this way:* Sending every contractor the whole project archive instead of their own work order.
  fails: |-
    **Mechanism:** Sub-agents need a focused brief, not the whole history.

    - The parent broadcasts its context.
    - Sub-agents need focus, not history.
