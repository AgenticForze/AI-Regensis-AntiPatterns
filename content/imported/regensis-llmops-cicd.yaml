- id: cicd-18
  title: BSS API change breaks the agent's tools in production
  tags:
  - Reliability
  - Cost
  - Telco
  scenario: |-
    The BSS team releases a new version of the customer-account API, renaming a field from accountStatus to status. The agent's tool parses accountStatus, gets null, and treats every account as inactive. The agent tells customers their accounts are suspended.
  antipattern: |-
    **Unguarded dependency on another team's API.**

    *Think of it this way:* A supplier changing the shape of a part without telling the factory that uses it.
  fails: |-
    - The agent depends on an API it doesn't own.
    - No contract tests between teams.
    - Null was treated as a valid value.

    **Root cause:** No consumer-driven contract tests for tool dependencies.

    **Where it breaks:** Cross-team CI.
  diagram:
    bad:
    - API v2 · Field renamed
    - '!Tool parses · Old name'
    - Null status · Inactive
    - '!''Suspended'' · Told customers'
    bad_note: Unguarded dependency on another team's API
    good:
    - Contract test · In BSS CI
    - +Strict schema · Tool response
    - +Missing = error · Not a value
    - Pin version · TMF API
    good_note: Contract tests and strict response validation
  solution: |-
    1. Add consumer-driven contract tests (for example Pact) that run in the BSS team's pipeline.
    2. Validate tool responses strictly; treat missing required fields as errors, not values.
    3. Subscribe to API change notices and pin API versions (TM Forum APIs are versioned).
  works: |-
    **Trade-off to manage:** Contract tests require cross-team agreement.

    **How you prove it worked:**

    - Tool response validation errors as a metric.

    **Same pattern elsewhere:** FinTech: a core-banking upgrade changes a balance field's sign convention and the agent tells customers they're overdrawn.
  takeaway: Tools are integrations. Test the contract.
  related:
  - tool-09
  - cicd-03
  code: |
    # consumer contract (Pact) published by the agent team, verified in the BSS pipeline
    pact.given("account ACC-1 exists").upon_receiving("get product inventory") \
        .with_request("GET", "/tmf-api/productInventory/v5/product?relatedParty.id=ACC-1") \
        .will_respond_with(200, body=EachLike({"id": Like("P1"), "status": Term("active|suspended", "active")}))

    class InventoryItem(BaseModel):
        model_config = ConfigDict(extra="ignore")
        id: str; status: str                                # missing required field → error, not a value
