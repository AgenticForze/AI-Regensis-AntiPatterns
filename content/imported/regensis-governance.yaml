    class Override(BaseModel):
        case_id: str; ai_recommendation: str; human_decision: str
        reason_code: Literal["wrong_fact", "policy_misread", "missing_context", "customer_preference", "other"]

    @schedule(cron="0 8 1 * *")
    def monthly_override_review():
        rows = overrides.last_month()
        for code, items in group_by(rows, "reason_code").items():
            eval_set.add([to_eval_case(o) for o in items[:20]])
            metrics.gauge("override_rate", len(items) / decisions.count_last_month(), reason=code)
