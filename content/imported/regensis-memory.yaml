- id: mem-19
  title: Memory feature launched with no memory evals
  tags:
  - Quality
  - Compliance
  - Telco
  scenario: |-
    A carrier launches long-term memory for its assistant. No tests check whether the right facts are stored, updated, retrieved or forgotten. Months later, an audit finds 30% of memories are wrong, outdated or irrelevant.
  antipattern: |-
    **Memory feature with no evals.**

    *Think of it this way:* Installing a filing system without ever checking what gets filed.
  fails: |-
    - Memory quality isn't measured.
    - Extraction and retrieval errors accumulate.
    - Nobody notices until an audit.

    **Root cause:** No evaluation for memory operations.

    **Where it breaks:** Eval suite.
  diagram:
    bad:
    - Memory · Launched
    - '!No tests · Write, recall'
    - Errors build · Months
    - '!30% wrong · Audit'
    bad_note: Memory feature with no evals
    good:
    - Write evals · Right facts
    - +Update evals · Supersede
    - +Retrieval · Relevance
    - Samples · Human review
    good_note: Evals for write, update, retrieve, forget
  solution: |-
    1. Evaluate memory writes (correct facts extracted, sensitive ones skipped), updates (superseding), retrieval (relevance) and deletion.
    2. Use multi-session test scripts with known ground truth.
    3. Sample stored memories for human review regularly.
  works: |-
    **Trade-off to manage:** Multi-session evals are more complex to build.

    **How you prove it worked:**

    - Memory accuracy rate from samples.

    **Same pattern elsewhere:** FinTech: a bank's advisor-memory feature is never evaluated, and stale goals drive recommendations.
  takeaway: If memory isn't evaluated, it's accumulating errors.
  related:
  - mem-02
  - mem-09
  code: |
    SCRIPT = [  # multi-session ground truth
        {"session": 1, "user": "I'm moving to Austin next month", "expect_write": {"type": "life_event"}},
        {"session": 2, "user": "Actually we're moving to Dallas", "expect_supersede": "Austin"},
        {"session": 3, "user": "What do you know about my move?", "expect_recall": "Dallas"},
        {"session": 4, "user": "Forget my move", "expect_deleted": "Dallas"},
    ]

    def eval_memory(assistant):
        return mean(run_session_and_check(assistant, step) for step in SCRIPT)
  lang: python
- id: mem-20
  title: Branch kiosk shows the previous customer's context
  tags:
  - Quality
  - FinTech
  - Critical
  scenario: |-
    A bank pilots an AI assistant on in-branch kiosks. A customer walks away without ending the session. The next customer asks "What's my balance?" and the assistant, still in the previous session, answers with the first customer's balance.
  antipattern: |-
    **Kiosk session never ends.**

    *Think of it this way:* A cash machine that doesn't eject the last person's card.
  fails: |-
    - Sessions don't end on inactivity.
    - Context isn't cleared between users.
    - No re-authentication for sensitive data.

    **Root cause:** Session isolation not designed for shared devices.

    **Where it breaks:** Session management.
  diagram:
    bad:
    - Customer A · Walks away
    - '!Session · Still open'
    - Customer B · 'My balance?'
    - '!A''s balance · Shown'
    bad_note: Kiosk session never ends
    good:
    - Idle timeout · End session
    - +Clear memory · All
    - +Re-auth · For data
    - Clear state · Start/end
    good_note: Idle timeout, cleared memory, re-authentication
  solution: |-
    1. End sessions on inactivity and clear all working memory.
    2. Re-authenticate before showing account data, and on any sign of a new user.
    3. Show a clear session-start and end state.
  works: |-
    **Trade-off to manage:** More re-authentication friction.

    **How you prove it worked:**

    - Session duration and idle-time distributions; tests for leftover context.

    **Same pattern elsewhere:** Telco: an in-store demo tablet keeps a previous customer's account open in the assistant.
  takeaway: On shared devices, every new question might be a new person.
  related:
  - mem-04
  - ctx-17
  code: |
    IDLE_TIMEOUT = timedelta(seconds=90)

    @kiosk.on_idle(IDLE_TIMEOUT)
    def end_session(session):
        session.working_memory.clear(); session.auth.revoke()
        ui.show_welcome_screen()                                       # clear start/end state

    def show_account(session):
        if not session.auth.valid() or face_changed(session) or card_removed(session):
            return ui.reauthenticate()
        return ui.render(accounts.summary(session.customer_id))
  lang: python
