  scenario: |-
    An AML team uses an LLM to draft Suspicious Activity Report narratives. Engineers built the eval set and labelled 200 drafts as good or bad. Evals pass at 93%. A quality review by senior investigators finds 31% of drafts miss the who, what, when, where and why elements regulators expect.
  antipattern: |-
    **Crowdsourced or engineer-written labels for domain tasks.**

    *Think of it this way:* Having the kitchen staff grade a surgeon's notes. They can check spelling, not medicine.
  fails: |-
    **Mechanism:** Non-experts can't judge correctness in specialized domains.

    - Labellers lacked domain knowledge of what a strong SAR narrative needs.
    - The labels rewarded fluent writing over regulatory completeness.
    - No labelling guidelines or agreement measurement.

    **Root cause:** Eval labels came from non-experts on an expert task.

    **Where it breaks:** Labelling process.
  diagram:
    bad:
    - SAR drafts · By LLM
    - '!Engineers label · Fluency'
    - Evals 93% · Looks great
    - '!31% incomplete · Expert review'
    bad_note: Engineers label expert work
