- id: rag-14
  title: Old and new overdraft fee policies both retrieved
  tags:
  - Quality
  - FinTech
  scenario: |-
    A bank removes its $35 non-sufficient-funds fee. The new policy page is published, but older FAQ entries and a PDF fee schedule still mention $35. The bot answers "you may be charged $35 or no fee depending on the situation", which is wrong and confuses customers.
  antipattern: |-
    **No source authority or recency ranking.**

    *Think of it this way:* Two signs at a junction pointing opposite ways. Without knowing which sign is newer or official, a driver averages them and goes nowhere.
  fails: |-
    **Mechanism:** The LLM sees two confident claims and blends them.

    - Retrieval returns both the old and new documents with similar scores.
    - Nothing tells the model which one wins.
    - The LLM tries to reconcile them and produces a blended answer.

    **Root cause:** No source authority or effective-date metadata, and no tie-break rule.

    **Where it breaks:** Metadata, ranking and the answer instructions.
  diagram:
    bad:
    - NSF fee? · Customer asks
    - '!Old FAQ $35 · New page $0'
    - Model blends · Both retrieved
    - '!''$35 or $0'' · Confusing'
    bad_note: No tie-break between policies
    good:
    - Effective date · On every doc
    - +Drop expired · At query time
    - +Official first · Authority rank
    - $0 cited · Clear answer
    good_note: Effective dates, authority, retire old
  solution: |-
    1. Store effective_date, expiry and authority level for every document.
    2. Exclude superseded documents at query time, and boost official policy over FAQs.
    3. Instruct the model to use the newest effective policy and cite it, and to flag conflicts rather than merge them.
    4. Make policy retirement part of the change process, owned by the policy team.
  works: |-
    **Trade-off to manage:** Maintaining authority metadata takes content-governance effort; automate it from the CMS where possible.

    **How you prove it worked:**

    - Conflict detector that flags retrievals containing different values for the same attribute.
    - Eval cases for every policy change in the last 12 months.

    **Same pattern elsewhere:** Telco: the EU roaming regulation removed most intra-EU roaming surcharges, but old pages still list surcharges and the bot quotes both.
  takeaway: Tell the model which source wins before it has to guess.
  related:
  - rag-05
  - rag-13
  code: |
    AUTHORITY = {"policy": 3, "procedure": 2, "faq": 1}

    def policy_search(q, today):
        hits = search(q, filter={"effective_date": {"$lte": today},
                                 "$or": [{"expiry": None}, {"expiry": {"$gt": today}}]}, k=30)
        for h in hits:
            h.score *= 1 + 0.2 * AUTHORITY[h.meta["doc_type"]]
        return sorted(hits, key=lambda h: h.score, reverse=True)[:6]
    # prompt: "Use the newest effective policy, cite it, and flag any conflict instead of merging."
