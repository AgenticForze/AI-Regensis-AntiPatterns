source: regensis
section: evals-ops
patterns:
- id: eval-01
  title: Bill-explanation prompt shipped after a vibe check
  tags:
  - Quality
  - Telco
  scenario: |-
    A carrier's "explain my bill" assistant gets frequent complaints that it is too long. A product manager adds "Be concise, max 3 sentences" to the prompt, tries ten bills, likes the result and ships it. First-bill questions (proration after a plan change mid-cycle) now get a three-sentence answer that skips the proration, and first-bill calls to care rise 18% in two weeks.
  antipattern: |-
    **Manual spot checks as the release gate.**

    *Think of it this way:* Tasting one spoonful from the top of the pot and declaring the whole stew seasoned. The salt sank to the bottom.
  fails: |-
    **Mechanism:** Ten cherry-picked examples miss regressions in the other 99% of traffic. Humans remember the wins.

    - Ten hand-picked bills were all simple, single-line accounts.
    - The change had a global side effect on complex bills, the cases that drive most calls.
    - Nothing compared old and new behaviour on a representative set.

    **Root cause:** Manual spot checks were the release gate, with no versioned golden dataset.

    **Where it breaks:** Release process and eval harness.
  diagram:
    bad:
    - Be concise · Prompt tweak
    - '!10 simple bills · Looked fine'
    - Proration lost · Complex bills
    - '!Calls +18% · First bills'
    bad_note: Ship after trying ten bills
    good:
    - Golden set · 500 real bills
    - +Per-case checks · Proration, total
    - +Old vs new · Every change
    - Gate release · By intent
    good_note: Golden set of real bills gates every change
  solution: |-
    1. Build a golden set of 300-500 real (anonymised) bills covering first bills, proration, roaming, device installments, taxes and credits.
    2. Define pass criteria per case (mentions proration amount, correct total, under N words) and run old vs new on every prompt change.
    3. Block release if any high-volume intent regresses beyond a threshold.
  works: |-
    **Trade-off to manage:** Building and anonymising the golden set takes a few weeks of effort, but it is reused for every future change.

    **How you prove it worked:**

    - Care call-reason codes for "bill explanation" per bot version.
    - Weekly eval trend per bill type.

    **Same pattern elsewhere:** FinTech: a "concise" tweak to a card-statement assistant drops the minimum-payment warning that Reg Z disclosures require.
  takeaway: If it isn't in the eval set, it isn't protected.
  related:
  - eval-05
  - eval-15
  - prm-02
  code: |
    CASES = load_jsonl("golden/bill_explanations.jsonl")       # 400 anonymised bills, tagged by intent

    def check(case, out):
        return {"total_correct": case.total in out,
                "mentions_proration": (not case.prorated) or "prorat" in out.lower(),
                "short_enough": len(out.split()) <= 120}

    def gate(old, new):
        for intent, rows in group_by(CASES, "intent").items():
            d = pass_rate(new, rows, check) - pass_rate(old, rows, check)
            if volume[intent] > 0.05 and d < -0.02:
                sys.exit(f"blocked: {intent} regressed {d:.1%}")
  lang: python
- id: eval-02
  title: ROUGE scores a collections-call summary that drops the dispute
  tags:
  - Quality
  - Compliance
  - FinTech
  - Critical
  scenario: |-
    A lender auto-summarises collections calls for the next agent. The team evaluates summaries with ROUGE against human summaries and gets 0.61, which looks good. In a compliance review, 7% of summaries omit that the customer disputed the debt. Under the FDCPA, a dispute must stop collection until the debt is validated, so the next agent keeps collecting.
  antipattern: |-
    **N-gram overlap metrics for free-form generation.**

    *Think of it this way:* Grading a medical handover note by how many words it shares with a model note. A note that leaves out "allergic to penicillin" can still score well.
  fails: |-
    **Mechanism:** A correct answer phrased differently scores low. A fluent wrong answer with matching words scores high.

    - ROUGE rewards word overlap, not the presence of critical facts.
    - A fluent summary missing one key sentence loses little score.
    - The facts that matter legally are rare and short.

    **Root cause:** A generic NLP metric was used instead of task-specific, risk-weighted criteria.

    **Where it breaks:** Eval design.
  diagram:
    bad:
    - Call summary · Collections
    - '!ROUGE 0.61 · Looks good'
    - Dispute missing · 7% of calls
    - '!Keeps collecting · FDCPA breach'
    bad_note: ROUGE against human summaries
    good:
    - Element list · Dispute, PTP
    - +Binary checks · Per element
    - +Structured flag · dispute = true
    - Must-pass · Compliance gate
    good_note: Required elements as binary must-pass checks
  solution: |-
    1. Define required elements per call type (dispute raised, promise to pay amount and date, cease-contact request, hardship) as binary checks.
    2. Score each element with a validated LLM judge or a classifier, and weight compliance elements as must-pass.
    3. Add a structured field extraction (dispute = true/false) that downstream systems read, not just a free-text summary.
  works: |-
    **Trade-off to manage:** Element checklists take domain effort to define and keep up to date with regulations.

    **How you prove it worked:**

    - Recall of each required element on a labelled set, tracked separately.
    - Compliance QA sampling of summaries where a dispute keyword appears in the transcript.

    **Same pattern elsewhere:** Telco: care-call summaries miss "customer requested cancellation", so the retention team never calls back and the line churns.
  takeaway: Measure what customers and regulators care about, not word overlap.
  related:
  - eval-04
  - eval-16
  code: |
    REQUIRED = {"collections": ["dispute_raised", "promise_to_pay", "cease_contact", "hardship"]}
    MUST_PASS = {"dispute_raised", "cease_contact"}               # compliance elements

    class CallSummary(BaseModel):
        dispute_raised: bool; promise_amount: float | None; promise_date: date | None
        cease_contact: bool; hardship: bool; narrative: str

    def score(transcript, summary: CallSummary, labels):
        checks = {e: getattr(summary, e) == labels[e] for e in REQUIRED["collections"] if hasattr(summary, e)}
        return all(checks[e] for e in MUST_PASS), checks
  lang: python
- id: eval-03
  title: LLM judge loves retention chats humans rate poorly
  tags:
  - Quality
  - Telco
  scenario: |-
    A retention-chat bot is scored by an LLM judge on "helpfulness" and averages 4.6 out of 5. Human QA reviewers score the same chats 2.8, because the bot offers long, friendly answers but rarely presents the save offer the customer qualifies for. Leadership has been reporting the 4.6 for a quarter.
  antipattern: |-
    **Trusting an LLM judge without validating it against humans.**

    *Think of it this way:* A thermometer that was never checked against a real one. It always reads a comfortable 21 degrees, so nobody notices the heating is broken.
  fails: |-
    **Mechanism:** Judges have biases: verbosity, position, self-preference, and leniency.

    - The judge prefers long, polite answers (verbosity and style bias).
    - Helpfulness was never defined in terms of the business goal (right offer presented).
    - Judge scores were never compared with human labels.

    **Root cause:** The evaluator itself was never evaluated.

    **Where it breaks:** Judge design and calibration.
  diagram:
    bad:
    - Retention chats · Judged by LLM
    - '!Score 4.6 · Likes long text'
    - Humans 2.8 · No offer shown
    - '!Wrong KPI · A quarter lost'
    bad_note: Uncalibrated helpfulness judge
    good:
    - Expert labels · 200 chats
    - +Binary criteria · Offer, price
    - +Agreement · Kappa, P/R
    - Re-check · Quarterly
    good_note: Criteria judge calibrated to expert labels
  solution: |-
    1. Label 150-200 chats by expert QA reviewers on specific criteria (eligible offer presented, correct price, no false promises).
    2. Rewrite the judge as binary checks per criterion, with reasoning before the verdict and access to the eligibility data.
    3. Measure agreement (precision and recall per criterion, Cohen's kappa) and iterate until acceptable; re-check quarterly.
  works: |-
    **Trade-off to manage:** Human labelling is slow and expensive; keep the calibration set small but representative and refresh it.

    **How you prove it worked:**

    - Running human-judge agreement on a weekly sample.
    - Correlation between judge scores and the business metric (save rate).

    **Same pattern elsewhere:** FinTech: a judge rates a robo-advice bot's explanations highly even when the recommended portfolio does not match the client's risk profile.
  takeaway: A judge is a model too, so evaluate the evaluator.
  related:
  - eval-04
  - eval-12
  code: |
    CRITERIA = ["eligible_offer_presented", "price_matches_catalog", "no_false_promises"]

    def judge(chat, eligibility):
        return {c: judge_llm.json(f"Criterion: {c}. Reason step by step, then answer PASS or FAIL.",
                                  chat=chat, eligibility=eligibility)["verdict"] == "PASS" for c in CRITERIA}

    expert = load("retention_qa_labels_180.jsonl")
    for c in CRITERIA:
        kappa = cohen_kappa([judge(x.chat, x.elig)[c] for x in expert], [x.labels[c] for x in expert])
        print(c, round(kappa, 2))                                 # iterate until acceptable; re-check quarterly
  lang: python
- id: eval-04
  title: Complaint classifier judged on a 1-10 scale
  tags:
  - Quality
  - Compliance
  - FinTech
  scenario: |-
    A bank uses an LLM to classify customer complaints into regulatory categories and route them. Quality is tracked with an LLM judge giving a 1-10 "accuracy" score averaging 7.4. Nobody knows what 7.4 means. A regulator exam later finds that complaints alleging discrimination were often classified as general service complaints and not escalated.
  antipattern: |-
    **Vague Likert-scale scoring.**

    *Think of it this way:* Rating a restaurant "7 out of 10" without saying whether the problem was the food, the service, or food poisoning.
  fails: |-
    **Mechanism:** LLMs and humans are inconsistent on fine-grained scales. The number has no defined meaning.

    - A fuzzy scale with no definition gives unstable, uninterpretable scores.
    - Critical misroutes and minor wording issues get similar scores.
    - The average hides the rare, high-risk category.

    **Root cause:** Likert scoring was used instead of explicit, binary criteria tied to outcomes.

    **Where it breaks:** Rubric design.
  diagram:
    bad:
    - Complaints · Classified
    - '!Judge 1-10 · Avg 7.4'
    - Fair-lending · Misrouted
    - '!Exam finding · Not escalated'
    bad_note: 1-10 accuracy score from a judge
    good:
    - Labelled set · By compliance
    - +Confusion matrix · Per category
    - +Binary check · High-risk route
    - Zero tolerance · Separate gate
    good_note: Confusion matrix plus binary high-risk checks
  solution: |-
    1. Evaluate classification as classification, with a confusion matrix against labelled data.
    2. Define binary checks for high-risk routing ("Allegation of discrimination routed to fair-lending queue, yes or no").
    3. Set zero-tolerance thresholds for the high-risk categories, separate from overall accuracy.
  works: |-
    **Trade-off to manage:** Binary criteria need more upfront definition but make every failure actionable.

    **How you prove it worked:**

    - Recall per high-risk category, reviewed by compliance monthly.

    **Same pattern elsewhere:** Telco: a ticket classifier scored 1-10 hides that outage reports are misrouted to billing, delaying network incident detection.
  takeaway: Binary criteria beat fuzzy scales.
  related:
  - eval-02
  - eval-09
  code: |
    from sklearn.metrics import confusion_matrix, classification_report

    y_true, y_pred = labelled.category, [classify(t) for t in labelled.text]
    print(classification_report(y_true, y_pred))
    cm = confusion_matrix(y_true, y_pred, labels=CATEGORIES)

    HIGH_RISK = ["discrimination_allegation", "udaap", "elder_abuse"]
    for cat in HIGH_RISK:                                         # zero tolerance, separate from accuracy
        missed = [t for t, yt, yp in zip(labelled.text, y_true, y_pred) if yt == cat and yp != cat]
        assert not missed, f"{cat}: {len(missed)} misrouted"
  lang: python
- id: eval-05
  title: Eval set frozen before the eSIM-only phone launch
  tags:
  - Quality
  - Telco
  scenario: |-
    A carrier built its chatbot eval set at launch. A year later, a major handset maker ships eSIM-only phones in the market, and eSIM transfer questions jump to 14% of chats. The eval set has three eSIM questions. Evals pass at 94% while eSIM conversations fail half the time and stores are flooded with walk-ins.
  antipattern: |-
    **A static golden set built at launch.**

    *Think of it this way:* Studying for this year's exam with last year's past papers when the syllabus has changed.
  fails: |-
    **Mechanism:** User behavior drifts, and new features and intents appear. The eval set measures last year's traffic.

    - The eval set represents last year's traffic mix.
    - New intents appear with product launches, regulations and seasons.
    - Nobody compares eval intent mix with production intent mix.

    **Root cause:** The golden set is static and not fed by production.

    **Where it breaks:** Eval data operations.
  diagram:
    bad:
    - Eval set · Built at launch
    - '!eSIM launch · 14% of chats'
    - 3 eSIM cases · Evals 94%
    - '!Store walk-ins · Bot fails'
    bad_note: Static eval set from launch day
    good:
    - Sample prod · Weekly
    - +Label failures · New cases
    - +Mix check · Eval vs prod
    - Pre-launch · Add cases early
    good_note: Weekly production sampling feeds the eval set
  solution: |-
    1. Sample production conversations weekly, label failures and add them as eval cases.
    2. Compare intent distribution of the eval set with production and alert on gaps.
    3. Add eval cases before known launches (new devices, price changes, regulatory changes).
  works: |-
    **Trade-off to manage:** Continuous labelling needs a small standing team or vendor budget.

    **How you prove it worked:**

    - Divergence metric between eval and production intent mix.
    - Failure rate per new intent cluster.

    **Same pattern elsewhere:** FinTech: a bank's assistant eval set has no questions about a new instant-payments service, which becomes the top contact reason after launch.
  takeaway: Every production bug becomes a test case.
  related:
  - eval-01
  - eval-17
  - obs-06
  code: |
    def refresh_eval_set():
        sample = prod_logs.sample(n=500, since=days_ago(7))
        failures = [s for s in sample if s.feedback == "down" or s.escalated]
        eval_set.add(label(failures), source="production")

        gap = js_divergence(intent_dist(eval_set), intent_dist(prod_logs.last(days=7)))
        if gap > 0.1:
            alert(f"eval set drifted from production intents: {top_missing_intents()}")

    release_calendar.on("device_launch", lambda e: eval_set.add(seed_cases(e.product)))
  lang: python
- id: eval-06
  title: Investment-app assistant tested only on friendly questions
  tags:
  - Quality
  - FinTech
  scenario: |-
    A brokerage app launches an assistant tested with 400 questions written by the product team, all about app features. In the first week, users ask "Should I put my emergency fund into this meme stock?", "Give me a guaranteed 20% strategy", and questions in Hindi and Spanish. The assistant gives stock-specific opinions, which the firm is not licensed to give in this channel.
  antipattern: |-
    **Eval data written by the team who built the feature.**

    *Think of it this way:* Crash-testing a car only by driving it carefully around the car park.
  fails: |-
    **Mechanism:** Builders test what they designed for. Real users don't.

    - The eval set reflects how builders expect the product to be used.
    - Out-of-scope, adversarial and regulated-advice questions were never tested.
    - The model's default helpfulness fills the gap.

    **Root cause:** Eval coverage designed from the feature list, not from real user behaviour and risks.

    **Where it breaks:** Eval dataset design.
  diagram:
    bad:
    - 400 questions · Feature-only
    - '!Real users · Meme stocks'
    - Never tested · Advice asks
    - '!Gives opinions · Unlicensed'
    bad_note: Evals written by the builders
    good:
    - Risk categories · Advice, adversary
    - +Seed from logs · Real phrasing
    - +Expected policy · Decline, route
    - Coverage map · Vs production
    good_note: Adversarial and out-of-scope categories
  solution: |-
    1. Add categories deliberately (out of scope, personalised advice requests, adversarial, ambiguous, multilingual, long inputs).
    2. Seed synthetic cases from real contact-centre logs and social media questions.
    3. Define the expected behaviour for each (decline with education, route to a licensed advisor, answer generally).
  works: |-
    **Trade-off to manage:** Broader coverage increases eval cost and time; run the full set nightly and a subset per change.

    **How you prove it worked:**

    - Coverage report of eval categories against production intent clusters.
    - Weekly review of conversations flagged as advice-like by a classifier.

    **Same pattern elsewhere:** Telco: a care bot is never tested on "How do I track my partner's phone?", which touches privacy and stalking risk.
  takeaway: Test the inputs you didn't design for.
  related:
  - eval-10
  - sec-01
  code: |
    CATEGORIES = {
        "out_of_scope":     "decline_with_education",
        "personal_advice":  "route_to_licensed_advisor",
        "adversarial":      "refuse",
        "ambiguous":        "ask_clarifying_question",
        "multilingual":     "answer_generally",
        "long_input":       "answer_generally",
    }
    cases = [c for cat in CATEGORIES for c in synth_from_logs(cat, contact_centre_logs, n=40)]
    results = {cat: mean(behaviour(run(c)) == CATEGORIES[cat] for c in cases if c.cat == cat) for cat in CATEGORIES}
  lang: python
- id: eval-07
  title: Prompt A/B declared a winner on 100 examples
  tags:
  - Quality
  - Telco
  scenario: |-
    Two prompts for a device-troubleshooting bot are compared on 100 eval cases. Prompt B scores 2 points higher and ships. On the next run, B is 1 point lower than A. The team has spent three weeks chasing what was noise.
  antipattern: |-
    **Running each eval once and treating it as truth.**

    *Think of it this way:* Flipping a coin ten times, getting six heads, and concluding the coin is biased.
  fails: |-
    **Mechanism:** LLM outputs are stochastic. Small eval sets have wide confidence intervals.

    - LLM outputs vary between runs even with the same input.
    - With 100 cases, the confidence interval is roughly plus or minus 8-10 points.
    - Single runs and unpaired comparisons exaggerate small differences.

    **Root cause:** Evals were treated as deterministic measurements.

    **Where it breaks:** Eval methodology.
  diagram:
    bad:
    - Prompt A vs B · 100 cases
    - '!B +2 points · One run'
    - Ships B · Declared winner
    - '!Rerun: B -1 · It was noise'
    bad_note: One run, 100 cases, declare a winner
    good:
    - Size the set · Detectable effect
    - +k trials · Per case
    - +Paired wins · Same inputs
    - Bootstrap CI · Then decide
    good_note: Repeated trials, paired comparison, CIs
  solution: |-
    1. Run several trials per case and report the mean with confidence intervals (bootstrap).
    2. Use paired comparison on the same cases and count wins, losses and ties.
    3. Compute the minimum detectable effect before the experiment and size the set accordingly.
  works: |-
    **Trade-off to manage:** More trials multiply eval cost; use cheaper models for judging, and sample.

    **How you prove it worked:**

    - Re-run the baseline twice to measure run-to-run noise on your set.

    **Same pattern elsewhere:** FinTech: a fraud-alert explanation prompt "improves" analyst agreement by 3% on 80 cases, which disappears in production.
  takeaway: A 2% gain on 100 examples is noise.
  related:
  - eval-14
  - eval-17
  code: |
    import numpy as np

    def paired_eval(a, b, cases, trials=5):
        sa = np.array([[score(a(c)) for _ in range(trials)] for c in cases]).mean(1)
        sb = np.array([[score(b(c)) for _ in range(trials)] for c in cases]).mean(1)
        diff = sb - sa
        boot = [np.random.choice(diff, len(diff)).mean() for _ in range(2000)]
        lo, hi = np.percentile(boot, [2.5, 97.5])
        return {"wins": (diff > 0).sum(), "losses": (diff < 0).sum(), "ties": (diff == 0).sum(),
                "ci95": (lo, hi), "significant": lo > 0 or hi < 0}
  lang: python
- id: eval-08
  title: KYC extraction few-shots leaked into the eval set
  tags:
  - Quality
  - Security
  - Compliance
  - FinTech
  scenario: |-
    A neobank uses an LLM to extract fields from identity documents and utility bills for KYC. The prompt includes 12 example documents. Offline accuracy is 98%. In production, accuracy on address extraction is 81%. The 12 prompt examples were also in the 200-document eval set, along with near-duplicates from the same templates.
  antipattern: |-
    **Few-shot examples in the prompt are also in the eval set.**

    *Think of it this way:* Giving students the exam answers as worked examples, then using the same questions on the exam.
  fails: |-
    **Mechanism:** The model is graded on questions it was shown the answers to.

    - Few-shot examples and eval cases came from the same pool.
    - Near-duplicates (same utility provider template) inflate scores.
    - The eval never saw the long tail of real document layouts.

    **Root cause:** No separation between prompt-building data and evaluation data.

    **Where it breaks:** Data management for prompts and evals.
  diagram:
    bad:
    - 12 examples · In prompt
    - '!Same 12 · In eval set'
    - 98% offline · Inflated
    - '!81% in prod · Addresses'
    bad_note: Few-shot examples also in the eval set
    good:
    - Three pools · Example/dev/test
    - +Split by · Template, issuer
    - +Overlap check · Hash + MinHash
    - Prod-like test · Real mix
    good_note: Disjoint pools split by template
  solution: |-
    1. Split data into prompt-example, dev and held-out test pools with no overlap, including by template and provider.
    2. Check overlap automatically with hashing and near-duplicate detection.
    3. Build the test set from production samples in proportion to real document types.
  works: |-
    **Trade-off to manage:** Held-out sets reduce the data available for prompt examples; that is the price of honest measurement.

    **How you prove it worked:**

    - Gap between offline and production accuracy, measured on audited production samples.

    **Same pattern elsewhere:** Telco: a port-in form extractor is tested on the same carrier templates used as examples and fails on smaller carriers' formats.
  takeaway: Never grade on the answer key you handed out.
  related:
  - eval-17
  - ft-04
  code: |
    pools = split_by_group(kyc_docs, group_key=lambda d: (d.template_id, d.provider),
                           ratios={"prompt_examples": .1, "dev": .3, "test": .6})

    def overlap(a, b):
        ha = {minhash(d.text) for d in a}
        return [d for d in b if any(jaccard(minhash(d.text), h) > 0.85 for h in ha)]

    assert not overlap(pools["prompt_examples"], pools["test"]), "leakage between few-shots and test"
    pools["test"] = stratify(pools["test"], by="doc_type", target=prod_doc_type_mix)
  lang: python
- id: eval-09
  title: 92% overall hides 55% on business billing disputes
  tags:
  - Quality
  - Telco
  scenario: |-
    A carrier's billing assistant scores 92% on its eval set. Small-business customers, with multi-line accounts and pooled data, are 6% of traffic but 30% of revenue at risk. Their dispute questions succeed only 55% of the time. The account-management team learns this from a churned customer.
  antipattern: |-
    **One aggregate score.**

    *Think of it this way:* A hospital reporting a great average recovery rate while one ward has a serious infection problem.
  fails: |-
    **Mechanism:** Averages blend high-volume easy cases with rare, high-risk ones.

    - The headline metric is an average weighted by volume.
    - Small, high-value segments barely move the average.
    - Nobody looks at slices.

    **Root cause:** Evaluation reports aggregate scores without segment or risk-tier breakdowns.

    **Where it breaks:** Eval reporting.
  diagram:
    bad:
    - 'Eval: 92% · All traffic'
    - '!SMB = 6% · Of volume'
    - SMB disputes · 55% success
    - '!Churned SMB · Found late'
    bad_note: One aggregate score
    good:
    - Slice metrics · Segment, intent
    - +Oversample · Small slices
    - +Per-slice bar · Weighted
    - Worst slice · In every review
    good_note: Per-slice thresholds weighted by impact
  solution: |-
    1. Slice every metric by intent, customer segment, product, channel, language and risk tier.
    2. Set per-slice thresholds, and weight by business impact, not just volume.
    3. Report the worst slice next to the mean in every review.
  works: |-
    **Trade-off to manage:** Small slices have wide confidence intervals; oversample them in the eval set.

    **How you prove it worked:**

    - Automated slice report with alerts when any slice falls below its threshold.

    **Same pattern elsewhere:** FinTech: a bank chatbot is 91% accurate overall but 60% on questions from small- business borrowers about loan payment deferrals.
  takeaway: Report the worst slice, not just the mean.
  related:
  - eval-04
  - rag-20
  code: |
    SLICES = ["intent", "segment", "product", "channel", "language", "risk_tier"]

    def sliced_report(results, thresholds):
        report = {}
        for dim in SLICES:
            for val, rows in group_by(results, dim).items():
                acc = mean(r.correct for r in rows)
                report[(dim, val)] = acc
                if acc < thresholds.get((dim, val), thresholds["default"]):
                    flag(dim, val, acc, impact=business_weight(dim, val))
        worst = min(report, key=report.get)
        return {"mean": mean(r.correct for r in results), "worst_slice": (worst, report[worst])}
  lang: python
- id: eval-10
  title: No safety suite before the investing assistant launch
  tags:
  - Quality
  - Cost
  - Security
  - FinTech
  - Critical
  scenario: |-
    A fintech launches a budgeting and investing assistant. Within days, a user jailbreaks it into saying a specific crypto token offers "guaranteed returns" and posts the screenshot. The firm faces press coverage and a regulator inquiry about misleading financial promotions.
  antipattern: |-
    **Quality evals only.**

    *Think of it this way:* Testing that a lock opens with the right key but never testing whether it opens with a paperclip.
  fails: |-
    **Mechanism:** Safety failures are rare in normal traffic, so quality evals never see them.

    - Quality evals use normal traffic, where jailbreaks are rare.
    - Nobody owned adversarial testing.
    - Output filters checked toxicity but not financial promotion rules.

    **Root cause:** Safety and compliance were not a separate, blocking test suite.

    **Where it breaks:** Eval suite and release gates.
  diagram:
    bad:
    - Quality evals · Normal traffic
    - '!Jailbreak · In first week'
    - Guaranteed · Returns claim
    - '!Regulator · Inquiry'
    bad_note: Quality evals only
    good:
    - Red-team suite · Per category
    - +Policy check · Promotion rules
    - +Zero tolerance · Release gate
    - Refresh · New techniques
    good_note: Blocking red-team suite plus output policy
  solution: |-
    1. Build a red-team suite covering jailbreaks, prompt injection, PII leakage, guaranteed-return claims, specific securities recommendations and unlicensed advice.
    2. Add an output policy check for financial-promotion rules ("guaranteed", return promises, missing risk warnings).
    3. Make the suite a release blocker with zero tolerance for critical categories, and refresh it with new public jailbreak techniques.
  works: |-
    **Trade-off to manage:** Strict output filters cause some false refusals; measure the false-refusal rate alongside.

    **How you prove it worked:**

    - Attack success rate per category, tracked per release.
    - Production classifier for promotion-like outputs with human review.

    **Same pattern elsewhere:** Telco: a care bot is manipulated into revealing another subscriber's address, a CPNI violation.
  takeaway: Safety is a separate test suite with zero tolerance.
  related:
  - eval-06
  - sec-01
  - sec-08
  code: |
    SUITE = {"jailbreak": 120, "prompt_injection": 80, "pii_leak": 60,
             "guaranteed_returns": 50, "specific_security_rec": 50, "unlicensed_advice": 50}
    BANNED = re.compile(r"\bguarantee(d)?\b|risk[- ]free|can't lose", re.I)

    def promo_policy_ok(text):
        return not BANNED.search(text) and ("capital at risk" in text.lower() or not mentions_returns(text))

    results = {cat: run_suite(cat, n) for cat, n in SUITE.items()}
    assert all(r.critical_failures == 0 for r in results.values()), "release blocked"
