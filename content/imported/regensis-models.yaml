- id: cost-15
  title: Retry storm doubles cost during a provider incident
  tags:
  - Cost
  - Latency
  - Telco
  scenario: |-
    During a provider slowdown, a carrier's services retry failed calls immediately up to five times, at several layers (SDK, gateway, application). Each customer message generates up to 125 attempts. The provider throttles harder, and successful calls are billed multiple times when timeouts occurred after processing.
  antipattern: |-
    **Immediate retries at every layer.**

    *Think of it this way:* Everyone in a traffic jam honking harder.
  fails: |-
    - Retries at multiple layers multiply.
    - No backoff or jitter.
    - No circuit breaker.

    **Root cause:** Uncoordinated retry policy.

    **Where it breaks:** Resilience configuration.
  diagram:
    bad:
    - Provider slow · Incident
    - '!SDK x5 · Gateway x5'
    - App x5 · 125 attempts
    - '!Throttled · Billed twice'
    bad_note: Immediate retries at every layer
    good:
    - One layer · Gateway
    - +Backoff · + jitter
    - +Breaker · Degraded mode
    - Retry budget · Max 10%
    good_note: One retry layer, backoff, breaker, budget
  solution: |-
    1. Retry in one layer only (usually the gateway) with exponential backoff and jitter.
    2. Add circuit breakers and fall back to degraded mode.
    3. Set retry budgets (for example at most 10% extra traffic).
  works: |-
    **Trade-off to manage:** Fewer retries means some failures surface to users; use the degraded mode.

    **How you prove it worked:**

    - Attempts per request; retry ratio during incidents.

    **Same pattern elsewhere:** FinTech: a bank's batch job retries every failed document instantly and exhausts its quota.
  takeaway: Retry in one place, with backoff and a budget.
  related:
  - obs-12
  - agf-16
  code: |
    # retries live ONLY in the gateway; SDK clients set max_retries=0
    client = Provider(max_retries=0)

    gateway = Gateway(
        retry=Retry(max_attempts=3, backoff="exponential_jitter", budget_ratio=0.10),   # ≤10% extra traffic
        circuit_breaker=CircuitBreaker(error_rate=0.3, window_s=30, cooldown_s=60),
        on_open=degraded_mode)
  lang: python
- id: cost-16
  title: Embeddings recomputed for unchanged documents every night
  tags:
  - Cost
  - FinTech
  scenario: |-
    A bank's nightly job re-embeds all 3 million policy and product chunks, though fewer than 1% change each day. The job takes 5 hours and costs thousands a month.
  antipattern: |-
    **Re-embed everything nightly.**

    *Think of it this way:* Repainting the whole house because one window frame chipped.
  fails: |-
    - Full re-embedding regardless of change.
    - No content hashing.
    - Waste of time and money.

    **Root cause:** Non-incremental indexing.

    **Where it breaks:** Ingestion pipeline.
  diagram:
    bad:
    - 3M chunks · Nightly
    - '!<1% changed · Daily'
    - 5 hours · Job
    - '!Wasted $ · Monthly'
    bad_note: Re-embed everything nightly
    good:
    - Hash chunks · Content
    - +Changed only · Embed
    - +Deletions · Explicit
    - Full rebuild · Model change
    good_note: Content hashing, embed only changes
  solution: |-
    1. Hash chunk content and only embed new or changed chunks.
    2. Process deletions explicitly.
    3. Do full rebuilds only on embedding-model changes.
  works: |-
    **Trade-off to manage:** Hash and change tracking logic.

    **How you prove it worked:**

    - Embedding calls per day vs changed chunks.

    **Same pattern elsewhere:** Telco: a carrier re-embeds its entire device-manual library weekly.
  takeaway: Embed what changed.
  related:
  - rag-05
  - ops-18
  code: |
    def nightly_index(docs):
        for doc in docs:
            for c in chunk(doc):
                h = sha256(normalize(c.text))
                if registry.hash(c.id) == h:
                    continue                                   # unchanged → no embedding call
                vdb.upsert(c.id, embed(c.text), meta={"hash": h}); registry.set(c.id, h)
        for gone in registry.ids() - current_chunk_ids(docs):
            vdb.delete(gone); registry.remove(gone)           # deletions explicit
