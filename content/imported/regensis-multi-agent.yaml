- id: mas-17
  title: Majority vote of three identical agents
  tags:
  - Reliability
  - Cost
  - FinTech
  scenario: |-
    A bank's sanctions-alert triage uses three agents to vote on whether a name match is a true hit. All three use the same model, prompt and data. They agree 98% of the time, including on the same wrong answers, so the vote adds cost but not accuracy.
  antipattern: |-
    **Vote among identical agents.**

    *Think of it this way:* Asking the same person three times and calling it a panel.
  fails: |-
    - Voters aren't independent.
    - Errors are correlated.
    - Agreement is mistaken for confidence.

    **Root cause:** Ensembles without diversity.

    **Where it breaks:** Decision design.
  diagram:
    bad:
    - 3 agents · Same model
    - '!Same prompt · Same data'
    - Agree 98% · Same errors
    - '!Cost x3 · No gain'
    bad_note: Vote among identical agents
    good:
    - Fuzzy score · Deterministic
    - +DOB, country · Checks
    - +Other model · Different view
    - Uncertain · To analyst
    good_note: Diverse evidence, calibration, human for uncertain
  solution: |-
    1. Use diverse evidence (deterministic fuzzy matching scores, date of birth and nationality checks, a different model) rather than copies.
    2. Calibrate confidence against labelled outcomes.
    3. Route uncertain cases to human analysts.
  works: |-
    **Trade-off to manage:** Diverse components are more work to build.

    **How you prove it worked:**

    - Error correlation between voters.

    **Same pattern elsewhere:** Telco: three identical agents vote on whether an alarm is a real outage.
  takeaway: Copies agree. That's not confidence.
  related:
  - mas-07
  code: |
    def sanctions_match(customer, hit):
        evidence = {
            "name_score": jaro_winkler(customer.name, hit.name),          # deterministic fuzzy match
            "dob_match": customer.dob == hit.dob if hit.dob else None,
            "nationality_match": customer.nationality in hit.nationalities,
            "llm_assessment": other_family_llm.assess(customer, hit).probability,
        }
        p = calibrated_model.predict_proba(features(evidence))            # calibrated on labelled outcomes
        return "clear" if p < 0.05 else "true_match" if p > 0.95 else route_to_analyst(customer, hit, evidence)
