  scenario: |-
    A bank ships a fine-tuned model together with a rewritten prompt and a new retrieval index. Quality improves on some intents and worsens on others. Nobody can tell which change caused what.
  antipattern: |-
    **Ship three changes at once.**

    *Think of it this way:* Changing diet, exercise and sleep at once and not knowing which helped.
  fails: |-
