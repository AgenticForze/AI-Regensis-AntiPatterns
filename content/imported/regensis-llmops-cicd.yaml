    - Lock + hashes · Deps
    - +Build once · Image
    - +Promote · By digest
    - Manifest · Records digest
    good_note: Lock files, one image promoted by digest
  solution: |-
    1. Use lock files with hashes, and build once.
    2. Promote the same immutable image (by digest) through environments.
    3. Record the image digest in the release manifest.
  works: |-
