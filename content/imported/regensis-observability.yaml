- id: tel-07
  title: Traces stop at the Kafka topic between fraud scoring and the agent
  tags:
  - Reliability
  - FinTech
  scenario: |-
    A bank's fraud pipeline publishes high-risk transactions to Kafka. A customer-contact agent consumes them and contacts the customer. Traces stop at the producer; the agent's spans start a new trace. When a customer complains about a confusing fraud-alert message, nobody can connect it to the scoring decision.
  antipattern: |-
    **Not passing trace context across async boundaries.**

    *Think of it this way:* A relay race where each runner starts their own stopwatch, so no one knows the team's total time.
  fails: |-
    **Mechanism:** Agents use queues, background jobs, and sub-agents. Each hop drops the parent context.

    - Trace context isn't propagated in message headers.
    - Async hops, sub-agents and tools break the trace.
    - Root-cause analysis across systems fails.

    **Root cause:** Broken context propagation across asynchronous boundaries.

    **Where it breaks:** Instrumentation of queues and agents.
  diagram:
    bad:
    - Fraud score · Trace A
    - '!Kafka topic · No context'
    - Agent · Trace B
    - '!Can''t link · Complaint'
    bad_note: No trace context across the queue
    good:
    - traceparent · In headers
    - +Agent span · Child of A
    - +Span links · Fan-out
    - Test · Propagation
    good_note: W3C context in headers, span links
  solution: |-
    1. Propagate W3C trace context in Kafka headers and in tool and sub-agent calls.
    2. Use span links for fan-out and fan-in.
    3. Test propagation in integration tests.
  works: |-
    **Trade-off to manage:** Very long-lived traces can be awkward in some backends; use links rather than one giant trace.

    **How you prove it worked:**

    - Share of agent traces with a parent span from the upstream system.

    **Same pattern elsewhere:** Telco: an order event goes through a message bus to a provisioning agent and the trace breaks at the bus.
  takeaway: A trace is only as complete as its weakest hop.
  related:
  - obs-02
  - tel-11
  code: |
    from opentelemetry.propagate import inject, extract

    def publish_score(event):
        headers = {}
        inject(headers)                                  # W3C traceparent into Kafka headers
        producer.send("fraud-scores", value=event, headers=list(headers.items()))

    def consume(msg):
        ctx = extract(dict(msg.headers))
        with tracer.start_as_current_span("fraud_agent.handle", context=ctx):
            agent.run(msg.value)
