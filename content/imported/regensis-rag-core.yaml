source: regensis
section: rag-core
patterns:
- id: rag-01
  title: Fixed-size chunking splits the roaming tariff table
  tags:
  - Quality
  - Compliance
  - Telco
  scenario: |-
    A mobile operator launches a GenAI care assistant in its app and IVR that answers from rate-plan guides and roaming tariff PDFs. A customer on the Unlimited Elite plan asks "How much is data in Mexico?" and is told it is included. Mexico is Zone 2 for that plan, billed at $2/MB after 5 GB. The customer returns from a week in Cancun to a $1,400 bill, opens a dispute, and the case ends up in a regulator complaint queue.
  antipattern: |-
    **Every document is cut into 512-token chunks regardless of structure.**

    *Think of it this way:* A roaming tariff is an airline fare grid: cities down the side, fare classes across the top. Cut the grid into strips every few inches, hand someone the strip that says "$2/MB, 5 GB, $10/day" and ask about Mexico on Elite. They cannot know which row or column they are holding, so they guess. The LLM does the same.
  fails: |-
    **Mechanism:** A table row lands in one chunk and its column headers in another. The retrieved chunk has numbers with no labels, so the LLM guesses.

    - The roaming guide is a matrix of zones (rows) x plans (columns) x allowance, overage and day-pass price.
    - The splitter cuts every 512 tokens, so the plan-name header row lands in chunk 13 and the Zone 2 rates in chunk 14.
    - The query "Mexico data roaming Elite" matches chunk 14 because it mentions Mexico and data rates.
    - The LLM sees numbers with no plan labels and borrows the neighbouring Unlimited Max column, where Mexico is included.

    **Root cause:** The bot retrieves a PDF rendering of data the BSS already holds as structured records. The product catalog and rating engine are the source of truth for price; the PDF is marketing collateral generated from them.

    **Where it breaks:** In the ingestion pipeline and the tool layer, not the prompt. No prompt can restore a table header that is not in the context.
  diagram:
    bad:
    - Roaming PDF · Zones x plans
    - '!Split at 512 · Ignores layout'
    - Chunk 14 · Rates, no plans
    - '!Wrong quote · Bill shock'
    bad_note: Tariff PDF cut every 512 tokens
    good:
    - Layout parser · Table detected
    - +Row chunks · Plan+zone+rate
    - +Price tool · TMF620 catalog
    - Grounded · Cites offer ID
    good_note: Row-level chunks, prices from the catalog
  solution: |-
    1. Route every price, allowance and eligibility question to a tool backed by the TMF620 Product Catalog or a rating-engine quote API. The LLM explains the number but never reads it from a PDF.
    2. Parse the remaining PDFs layout-aware (Docling, Azure Document Intelligence) and turn each table row into a self-describing line such as "Unlimited Elite, Zone 2 (Mexico, Canada), 5 GB included, then $2/MB, effective 2026-07-01".
    3. Store plan_id, zone, effective_date and channel as chunk metadata, resolve the customer's actual plan from Product Inventory (TMF637) and filter on it before retrieval.
    4. Require the answer to cite the productOffering id and effective date, and reject any currency amount that is not in the tool response.
  works: |-
    **Trade-off to manage:** Tool calls add 200-400 ms and a dependency on catalog uptime. Cache by offer_id plus version, invalidate on catalog change events, and fall back to "I'll text you the exact rate" if the API is down.

    **How you prove it worked:**

    - Golden set of about 300 plan x zone questions whose expected answers are generated from the catalog itself, run in CI on every index or prompt change.
    - Numeric-faithfulness check on 100% of price answers (regex plus comparison, so it is cheap) with an alert on any mismatch.
    - Join bot session ids to billing disputes and goodwill credits within 30 days and alert on a spike for roaming intents.

    **Same pattern elsewhere:** FinTech: a card fee-schedule PDF lists purchase APR, cash-advance APR and FX fee by card tier. Chunking separates tier headers from rates and the bot quotes the Platinum cash-advance APR to a Classic cardholder, a misleading disclosure. Same fix: pull rates from the card product system as a tool.
  takeaway: |-
    If the BSS already holds a fact as structured data, don't retrieve it from a PDF. Call the system of record, and use RAG only for the explanation around it.
  related:
  - rag-11
  - tool-01
  - ctx-14
  generic: Chunk by meaning, not by token count.
  code: |
    def get_roaming_rate(customer_id: str, country_iso: str) -> dict:
        plan = product_inventory.get_active_plan(customer_id)    # TMF637
        offer = catalog.get_offering(plan.offering_id)           # TMF620
        zone = offer.roaming_zones.lookup(country_iso)
        return {"plan": offer.name, "offer_id": offer.id, "zone": zone.name,
                "included_gb": zone.allowance_gb, "overage_per_mb": zone.overage_rate,
                "effective": offer.valid_from}

    # Guardrail: every amount in the answer must exist in the tool result
    assert all(a in tool_amounts for a in extract_amounts(answer))
  lang: python
- id: rag-02
  title: Vector-only search confuses chargeback reason codes
  tags:
  - Quality
  - FinTech
  scenario: |-
    A card issuer gives dispute analysts a RAG copilot over Visa and Mastercard dispute rules. An analyst asks "evidence required for Visa 13.2". The copilot returns the guidance for 13.1 (merchandise not received) instead of 13.2 (cancelled recurring transaction). The analyst files the wrong evidence, the case loses at pre-arbitration, and the bank absorbs a $2,300 loss plus network fees.
  antipattern: |-
    **Pure dense embeddings for everything.**

    *Think of it this way:* Asking a librarian who only understands topics, not catalog numbers, for "the book at shelf 13.2". They bring you something about the same topic from shelf 13.1, because to them both shelves "mean" disputed card purchases.
  fails: |-
    **Mechanism:** Embeddings capture meaning, not exact strings. Product SKUs, error codes, names, and legal citations look nearly identical in vector space.

    - Reason codes 13.1, 13.2 and 13.3 sit in chapters that share most of their vocabulary.
    - Dense embeddings encode meaning, so "13.1" and "13.2" land almost on top of each other in vector space.
    - The top-1 chunk is the longer, more general 13.1 section, and the LLM answers confidently from it.

    **Root cause:** Pure semantic retrieval is used for queries whose key term is an exact identifier. Embeddings are weak at codes, SKUs, account and rule numbers.

    **Where it breaks:** Retrieval layer: query analysis plus the index (add a sparse/keyword index next to the vector index).
  diagram:
    bad:
    - Ask 'Visa 13.2' · Code in query
    - '!Embed query · Codes blur'
    - Top-1 is 13.1 · Wrong rule
    - '!Wrong evidence · Case lost'
    bad_note: Vector-only search for reason codes
    good:
    - Code detector · Regex on query
    - +Filter on code · Metadata match
    - +BM25 + vector · RRF fusion
    - Correct rule · Code shown
    good_note: Hybrid search with an exact-code filter
  solution: |-
    1. Hybrid search with BM25 plus dense vectors, merged with reciprocal rank fusion (RRF).
    2. Detect identifiers in the query with regex (reason codes, MCCs, Reg citations) and apply them as a hard metadata filter on reason_code before ranking.
    3. Index each reason code as its own document with network, code, title and evidence list as structured fields.
    4. Show the matched reason code in the answer header so the analyst can see a mismatch at a glance.
  works: |-
    **Trade-off to manage:** Two indexes cost more storage and an extra query (about 20-50 ms). RRF weights need tuning per corpus; overweighting BM25 hurts natural-language questions.

    **How you prove it worked:**

    - Eval set of 150 code-specific questions across all reason codes, with exact-match scoring on the code cited.
    - Track pre-arbitration loss rate per reason code for cases where the copilot was used.

    **Same pattern elsewhere:** Telco: a field-tech copilot confuses ONT alarm codes LOS and LOF, or router error E-4031 and E-4013, and the technician replaces the wrong part.
  takeaway: Dense for meaning, sparse for identifiers, and fuse both.
  related:
  - rag-03
  - rag-16
  code: |
    REASON_CODE = re.compile(r"\b(?:visa|mc|mastercard)?\s*(\d{1,2}\.\d{1,2}|4\d{3})\b", re.I)

    def retrieve_dispute_rules(q: str, k: int = 8):
        flt = {}
        if (m := REASON_CODE.search(q)):
            flt["reason_code"] = m.group(1)                    # hard filter before ranking
        lexical = bm25.search(q, filter=flt, k=50)
        dense = vectors.search(embed(q), filter=flt, k=50)
        hits = rrf([[h.id for h in lexical], [h.id for h in dense]])[:k]
        return [{"reason_code": h.meta["reason_code"], "text": h.text} for h in fetch(hits)]
  lang: python
- id: rag-03
  title: No reranker for broadband troubleshooting articles
  tags:
  - Quality
  - Telco
  scenario: |-
    A fiber broadband provider runs an agent-assist tool that suggests knowledge articles while the call is live. For "red LOS light on the ONT after a storm", the correct article (check the fiber drop, dispatch a tech) ranks 11th. The top three are about Wi-Fi speed. Agents read the wrong steps, the call runs 9 minutes longer and a second truck roll is booked a day late.
  antipattern: |-
    **Taking the vector DB's top-5 as final.**

    *Think of it this way:* A search engine without the "best match first" step. It hands you every page that mentions your words, sorted by how many words overlap, not by which page actually answers your question.
  fails: |-
    **Mechanism:** Bi-encoder similarity is fast but coarse. It ranks on topic overlap, not on whether the chunk answers the question.

    - The bi-encoder ranks by topic overlap, so generic "internet not working" articles score high.
    - The specific fiber-cut article uses technical wording (ONT, LOS, drop cable) that the customer never says.
    - Only the top 3 results are shown, so the right article is retrieved but never seen.

    **Root cause:** The vector store's first-stage similarity is used as the final ranking. Fast bi-encoders are good for recall, not precision.

    **Where it breaks:** Retrieval pipeline, between the vector search and the prompt or UI.
  diagram:
    bad:
    - '''Red LOS light'' · Live call'
    - '!Vector top-3 · Topic overlap'
    - Wi-Fi articles · Right one is 11th
    - '!Long call · Late truck roll'
    bad_note: Top-k from the vector store is final
    good:
    - Query + alarm · From OSS
    - +Retrieve 50 · High recall
    - +Cross-encoder · Rerank to 5
    - Fiber-cut steps · Right dispatch
    good_note: Retrieve 50, rerank, add device telemetry
  solution: |-
    1. Retrieve wide (top 50), then rerank with a cross-encoder such as Cohere Rerank or bge-reranker and keep the top 5.
    2. Add the device state from the OSS (ONT alarm = LOS) to the query, so retrieval uses telemetry and not only the transcript.
    3. Measure recall@50 and precision@5 separately so you know which stage to tune.
  works: |-
    **Trade-off to manage:** A cross-encoder adds 50-150 ms for 50 candidates. For a live call that is fine; for autocomplete it may not be, so rerank fewer candidates there.

    **How you prove it worked:**

    - Click-through and used-article rate per suggestion position in the agent UI.
    - Offline eval with intents labelled by senior agents, tracking MRR before and after the reranker.

    **Same pattern elsewhere:** FinTech: a bank's contact-centre assistant ranks generic "card declined" articles above the specific "card blocked after 3 wrong PINs" procedure.
  takeaway: Retrieve wide, rerank narrow.
  related:
  - rag-02
  - rag-04
  code: |
    def troubleshoot_context(transcript: str, line_id: str):
        ont = oss.get_ont_status(line_id)                      # e.g. {"alarm": "LOS", "rx_dbm": -31.2}
        query = f"{transcript}\nDevice state: alarm={ont.alarm}, rx={ont.rx_dbm} dBm"
        candidates = hybrid_search(query, k=50)                # stage 1: recall
        ranked = reranker.rank(query, [c.text for c in candidates])
        top = [candidates[r.index] for r in ranked[:5]]        # stage 2: precision
        metrics.log(recall_at_50=gold_in(candidates), precision_at_5=gold_in(top))
        return top
  lang: python
- id: rag-04
  title: Stuffing 30 chunks mixes fund share classes
  tags:
  - Quality
  - Compliance
  - FinTech
  scenario: |-
    A wealth-management firm's advisor copilot answers questions from fund prospectuses. To "improve recall" the team raises k from 5 to 30. Asked for the expense ratio of a fund's Class A shares, the copilot answers with a blend: the Class A front load and the Class I expense ratio. An advisor quotes it to a client, which is a fee disclosure error under suitability rules.
  antipattern: |-
    **Treating the context window as free.**

    *Think of it this way:* Asking a colleague a question while handing them thirty printouts, eight of which look almost the same. The more near-duplicates you add, the more likely they read the right number off the wrong page.
  fails: |-
    **Mechanism:** Irrelevant chunks are distractors. Models attend less reliably to the middle of long contexts ("lost in the middle"), and conflicting chunks cause blended answers.

    - A prospectus repeats the same table for Classes A, C, I and R6 with slightly different numbers.
    - With k=30, several share-class tables land in context together, and the correct one sits in the middle.
    - Models attend less reliably to the middle of long contexts, and similar tables invite blending.
    - Cost per question triples and accuracy drops.

    **Root cause:** The context window is treated as free capacity. More chunks means more distractors, not more recall, once the right chunk is already in the top 5.

    **Where it breaks:** Retrieval tuning and context assembly.
  diagram:
    bad:
    - Class A fee? · Advisor asks
    - '!k = 30 · All share classes'
    - Lost in middle · Tables blend
    - '!Wrong fee · Disclosure error'
    bad_note: Raise k to 30 for recall
    good:
    - Extract class · Class A
    - +Filter + rerank · Top 5 only
    - +Fee from data · Structured tool
    - Right fee · Cited
    good_note: Filter by share class, rerank, small k
  solution: |-
    1. Tune k with an eval set rather than by intuition, and add a reranker score threshold.
    2. Extract the share class from the question and filter chunks on share_class metadata.
    3. Put the strongest evidence first and repeat the question after the context.
    4. For fee numbers, use the fund data service (structured expense ratios) as a tool, as in rag-01.
  works: |-
    **Trade-off to manage:** A low k can miss multi-part answers. Use query decomposition for those rather than a global high k.

    **How you prove it worked:**

    - Accuracy and cost per question plotted against k on a held-out set; pick the knee of the curve.
    - Answer check that the share class named in the answer matches the one in the question.

    **Same pattern elsewhere:** Telco: an enterprise-sales copilot pulls 30 chunks from several MSA versions and quotes the SLA credit from the 2023 contract instead of the 2025 amendment.
  takeaway: Context is a budget, not a bucket.
  related:
  - rag-03
  - ctx-01
  - ctx-07
  code: |
    def fund_context(q: str, fund_id: str):
        share_class = extract_share_class(q) or "A"          # "Class I", "Admiral", ...
        hits = hybrid_search(q, filter={"fund_id": fund_id, "share_class": share_class}, k=40)
        hits = [h for h in rerank(q, hits) if h.score >= THRESHOLD][:K_FROM_EVAL]   # k tuned offline
        fees = fund_data.expense_ratios(fund_id, share_class)   # numbers come from the tool
        ctx = "\n".join(h.text for h in hits)
        return f"{ctx}\n\nFEES (authoritative): {fees}\n\nQuestion again: {q}"
  lang: python
- id: rag-05
  title: Stale index quotes the old savings APY
  tags:
  - Quality
  - Compliance
  - FinTech
  scenario: |-
    After a central-bank rate cut, a digital bank lowers its high-yield savings APY from 4.40% to 4.05% on a Monday. Its chatbot keeps quoting 4.40% for nine days because the knowledge index is rebuilt by a weekly batch job that failed silently. Customers open accounts expecting 4.40%, complaints arrive, and compliance flags a potential UDAAP issue (unfair or deceptive practice).
  antipattern: |-
    **One-time batch indexing with no update pipeline.**

    *Think of it this way:* A shop window still showing last week's prices. The shop changed the till, but nobody changed the sign, and customers walk in trusting the sign.
  fails: |-
    **Mechanism:** Sources change daily. Deleted and updated documents stay in the index as ghosts.

    - Rates live in the product system and are copied into web pages and FAQs.
    - The RAG index is a snapshot built weekly; the job failed and no one was alerted.
    - Old and new pages coexist in the index, so the old page still ranks.

    **Root cause:** The index is treated as a one-time build instead of a cache of a changing source, with no invalidation, no freshness metadata and no lag monitoring.

    **Where it breaks:** Ingestion pipeline and index operations.
  diagram:
    bad:
    - Rate cut · APY 4.05%
    - '!Weekly batch · Job failed'
    - Old page ranks · 4.40% indexed
    - '!Wrong APY · UDAAP risk'
    bad_note: Weekly batch index, silent failure
    good:
    - Rates API tool · Live APY
    - +CDC events · Reindex on change
    - +Freshness meta · Newest wins
    - Lag alert · Probe hourly
    good_note: Rates from the API, event-driven index
  solution: |-
    1. Never answer rates from the index. Call the deposit product system (or rates API) as a tool, the same principle as rag-01.
    2. Event-driven incremental indexing (CDC or CMS webhooks) for all other content, with hard deletes of retired pages.
    3. Store source_updated_at and content hash on every chunk, and prefer the newest effective version.
    4. Alert when index lag exceeds a threshold, or when a scheduled build fails.
  works: |-
    **Trade-off to manage:** Event-driven indexing is more moving parts than a nightly batch. Keep a nightly full reconciliation as a safety net.

    **How you prove it worked:**

    - Freshness probe that asks the bot the current APY every hour and compares it with the rates API.
    - Metric for the age of the oldest chunk per source, and index-lag SLO.

    **Same pattern elsewhere:** Telco: a retention bot keeps offering a promo that marketing ended last week, and care has to honour it on hundreds of accounts.
  takeaway: An index is a cache, and every cache needs an invalidation strategy.
  related:
  - rag-01
  - rag-14
  - data-03
  code: |
    TOOLS = [Tool("get_deposit_rate", lambda product_id: rates_api.current(product_id))]  # never from the index

    def on_cms_event(evt):                                      # webhook / CDC
        if evt.type == "retired":
            index.delete(filter={"doc_id": evt.doc_id}); return
        for c in chunk(fetch(evt.url)):
            index.upsert(c.id, embed(c.text), meta={"doc_id": evt.doc_id, "hash": sha256(c.text),
                                                    "source_updated_at": evt.updated_at})
        metrics.gauge("index_lag_s", now() - evt.updated_at)    # alert above threshold
  lang: python
- id: rag-06
  title: Relationship-manager copilot surfaces a SAR memo
  tags:
  - Quality
  - Security
  - Compliance
  - FinTech
  - Critical
  scenario: |-
    A bank rolls out an internal copilot for relationship managers over a shared index of CRM notes, credit memos and compliance files. An RM asks "Any concerns on this client?" and gets a summary of a Suspicious Activity Report narrative. SAR confidentiality is legally protected, and an RM who mentions it to the client could commit tipping off. The copilot is pulled the same day.
  antipattern: |-
    **One shared index, with access control only in the UI.**

    *Think of it this way:* A hotel key card that opens every room because the lock only checks that the card is from this hotel, not which room it was issued for.
  fails: |-
    **Mechanism:** Retrieval does not know who is asking. The LLM happily summarizes what it was given.

    - All documents are embedded into one index with no access-control metadata.
    - Access control exists only in the source systems and the UI, not in retrieval.
    - The LLM summarises whatever it is given; "do not reveal restricted data" in the prompt does not enforce anything.

    **Root cause:** Permissions are enforced at the application edge instead of at query time inside retrieval.

    **Where it breaks:** Indexing (store ACLs) and retrieval (filter by the caller's identity).
  diagram:
    bad:
    - RM asks · About client
    - '!Shared index · No ACLs'
    - SAR memo found · Retrieved
    - '!Summarised · Tipping-off risk'
    bad_note: One shared index, ACLs only in the UI
    good:
    - Identity · Entitlements
    - +ACL filter · At query time
    - +SAR isolated · FIU-only index
    - Safe answer · Audited
    good_note: ACL metadata, filter by entitlement
  solution: |-
    1. Carry document ACLs and classification (public, internal, confidential, SAR-restricted) into chunk metadata at ingestion.
    2. Filter retrieval by the caller's entitlements, resolved from the identity provider on every request.
    3. Keep SAR and investigation data out of general-purpose indexes entirely; use a separate index only the FIU can reach.
    4. Never rely on the LLM to withhold information.
  works: |-
    **Trade-off to manage:** Per-user filtering lowers cache hit rates and complicates semantic caching, which must be keyed by entitlement group.

    **How you prove it worked:**

    - Red-team users per role who run probing questions in CI; any restricted chunk in a retrieval result fails the build.
    - Audit log of retrieved document ids per user, reviewed for classification violations.

    **Same pattern elsewhere:** Telco: a store-staff copilot reveals call-detail records (CPNI) of another account holder, a breach of FCC CPNI rules.
  takeaway: Enforce permissions in retrieval, never in the prompt.
  related:
  - sec-04
  - ctx-17
  - data-07
  code: |
    def rm_copilot_search(q: str, user_token: str):
        user = idp.resolve(user_token)                          # entitlements on every request
        allowed = {"public", "internal"} | ({"confidential"} if "rm" in user.roles else set())
        hits = index.search(embed(q), k=20, filter={
            "classification": {"$in": list(allowed)},
            "acl_groups": {"$in": user.groups}})
        assert all(h.meta["classification"] != "sar_restricted" for h in hits)  # SAR lives in a separate FIU index
        return hits
  lang: python
- id: rag-07
  title: Embedding model upgraded without reindexing
  tags:
  - Quality
  - Telco
  scenario: |-
    A carrier's care-agent assistant team upgrades the embedding model in the query service to a newer, better-scoring version. The 2 million document chunks are still embedded with the old model. Overnight, retrieval returns near-random articles and agent-assist acceptance drops from 41% to 6%. Rollback takes four hours because no one recorded which model built the index.
  antipattern: |-
    **Query embeddings from model v2, document embeddings from v1.**

    *Think of it this way:* Updating the language a librarian speaks, while every catalog card is still written in the old language. The words look like words, but nothing matches.
  fails: |-
    **Mechanism:** Different models produce incompatible vector spaces. Similarity scores become noise.

    - Query vectors come from model v2; document vectors from v1.
    - Different models produce incompatible vector spaces, so cosine similarity is noise.
    - Nothing in the index records which model and version built it.

    **Root cause:** The embedding model is treated as a service dependency instead of part of the index version.

    **Where it breaks:** MLOps and index lifecycle.
  diagram:
    bad:
    - Query model v2 · Upgraded
    - '!Index on v1 · 2M chunks'
    - Spaces differ · Scores = noise
    - '!Bad articles · Acceptance 6%'
    bad_note: Upgrade the query model only
    good:
    - New index v2 · Built in parallel
    - +Retrieval eval · Must pass
    - +Alias switch · Blue-green
    - Model check · On startup
    good_note: Version the index, blue-green switch
  solution: |-
    1. Store embedding model name and version in index metadata; the query service refuses to query an index built with another model.
    2. Build the new index in parallel, run retrieval evals on it, then switch with an alias (blue-green).
    3. Keep the old index until the new one passes a production canary.
  works: |-
    **Trade-off to manage:** Re-embedding millions of chunks costs time and money. Budget it into every model upgrade and use batch embedding endpoints.

    **How you prove it worked:**

    - Startup check comparing the query model id with the index model id.
    - Alert on a sudden drop in top-1 similarity scores or suggestion acceptance.

    **Same pattern elsewhere:** FinTech: a KYC document-similarity service upgrades its embedding model and starts matching unrelated passports as duplicates.
  takeaway: Query and document embeddings must come from the same model version.
  related:
  - ops-18
  - ops-01
  code: |
    def query_index(alias: str, q: str):
        idx = vdb.resolve_alias(alias)
        if idx.meta["embed_model"] != EMBEDDER.name_version:
            raise RuntimeError(f"index built with {idx.meta['embed_model']}, query uses {EMBEDDER.name_version}")
        return idx.search(EMBEDDER.embed(q), k=10)

    # migration: build kb_v2 in parallel -> eval -> canary -> vdb.swap_alias("kb", "kb_v2"); keep kb_v1 until canary passes
  lang: python
- id: rag-08
  title: Follow-up question retrieved without its history
  tags:
  - Quality
  - Telco
  scenario: |-
    On a family plan, a customer asks the chatbot "How do I add an international day pass to my line?" then "And what about my wife's line?" The second message is sent to retrieval as-is and returns articles about adding a new line to the account. The customer gives up and calls care.
  antipattern: |-
    **No query rewriting in multi-turn chat.**

    *Think of it this way:* Walking into a library and only saying "and what about the other one?" The librarian has no idea what "the other one" refers to.
  fails: |-
    **Mechanism:** Follow-up questions depend on history. The bare follow-up has no searchable content.

    - Follow-up turns depend on earlier turns for meaning.
    - The raw follow-up contains no searchable terms about day passes.
    - Retrieval matches "line" and returns line-management content.

    **Root cause:** The retriever sees the latest utterance instead of a standalone query built from the conversation.

    **Where it breaks:** Query construction step before retrieval.
  diagram:
    bad:
    - '''Wife''s line?'' · Follow-up'
    - '!Raw retrieval · No context'
    - Add-a-line docs · Wrong topic
    - '!Calls care · Bot abandoned'
    bad_note: Raw follow-up sent to retrieval
    good:
    - Condense query · With history
    - +Resolve line · From inventory
    - +Retrieve · Day pass docs
    - Right answer · Logged rewrite
    good_note: Condense history into a standalone query
  solution: |-
    1. Condense history and the new message into a standalone query ("add international day pass to secondary line on family plan") with a small, fast model.
    2. Resolve entities from account context, such as which subscription belongs to "my wife's line", via Product Inventory.
    3. Log rewritten queries next to originals for debugging and evals.
  works: |-
    **Trade-off to manage:** Rewriting adds one small-model call (about 100-300 ms) and can occasionally distort a clear question; skip rewriting for first turns.

    **How you prove it worked:**

    - Multi-turn eval set built from real follow-up patterns, scored on retrieval recall.
    - Rate of sessions where a follow-up turn leads to "talk to an agent".

    **Same pattern elsewhere:** FinTech: "What's the limit on it?" after a question about a business credit card retrieves the personal debit card limits.
  takeaway: Retrieve on what the user means, not what they typed.
  related:
  - ctx-12
  - mem-01
  code: |
