- id: tel-03
  title: Account ID as a metric label explodes the metrics bill
  tags:
  - Reliability
  - Cost
  - Latency
  - FinTech
  scenario: |-
    A bank's engineers add account_id and session_id as labels on assistant latency and token metrics so they can filter by customer. Active time series grow from 40,000 to 30 million. The metrics bill rises tenfold and dashboards time out.
  antipattern: |-
    **Using user ID, session ID, or prompt text as metric labels.**

    *Think of it this way:* Creating a separate filing cabinet for every customer instead of one cabinet with folders.
  fails: |-
    **Mechanism:** Each unique label value creates a new time series.

    - Each unique label combination creates a new time series.
    - Account and session ids are unbounded.
    - Metrics backends aren't built for per-entity data.

    **Root cause:** High-cardinality identifiers on metrics.

    **Where it breaks:** Metrics design.
  diagram:
    bad:
    - Add labels · account_id
    - '!Series · 40k to 30M'
    - Bill x10 · Metrics
    - '!Dashboards · Time out'
    bad_note: Account and session ids as labels
    good:
    - Labels · Model, intent
    - +Ids on traces · And logs
    - +Allow-list · In collector
    - Series alert · Per metric
    good_note: Low-cardinality labels, ids on traces
  solution: |-
    1. Keep metric labels low-cardinality (model, feature, intent, tenant tier, status).
    2. Put per-customer and per-session detail on traces and structured logs.
    3. Enforce label allow-lists in the shared instrumentation library and the collector.
  works: |-
    **Trade-off to manage:** Per-customer questions need a trace or log query, which is slower than a metric.

    **How you prove it worked:**

    - Active series count alerts per metric.

    **Same pattern elsewhere:** Telco: engineers add MSISDN as a label on bot metrics and the metrics cluster falls over.
