- id: agf-18
  title: Three-hour troubleshooting session forgets the original fault
  tags:
  - Reliability
  - Telco
  scenario: |-
    A home-internet support agent works with a customer through modem resets, Wi-Fi channel changes and speed tests over three hours of intermittent chat. By the end it suggests resetting the modem again and has forgotten the customer said the problem only happens when it rains, a strong hint of a damaged outdoor cable.
  antipattern: |-
    **Appending every turn and tool result forever.**

    *Think of it this way:* A meeting that runs so long nobody remembers the agenda.
  fails: |-
    **Mechanism:** Context fills, early instructions get diluted, and the model drifts.

    - Every turn and tool result is appended forever.
    - Early key facts get diluted by later noise.
    - Cost per turn grows steadily.

    **Root cause:** No memory management or pinned task state.

    **Where it breaks:** Context management in the agent runtime.
  diagram:
    bad:
    - 3-hour session · Many steps
    - '!All appended · Tool outputs'
    - Rain clue lost · Early fact
    - '!Reset again · Repeated step'
    bad_note: Append every turn forever
    good:
    - Pinned state · Symptoms, tried
    - +Compact · Old tool output
    - +Ticket · TMF621 case
    - Right lead · Outdoor cable
    good_note: Pinned task state plus compaction
  solution: |-
    1. Keep a pinned task-state block (problem, key symptoms, steps tried, results).
    2. Summarise or drop old tool outputs, and keep constraints and symptoms verbatim.
    3. Store the case in a ticket (TMF621) so a human or later session can continue.
  works: |-
    **Trade-off to manage:** Summaries lose detail; keep critical facts verbatim in the pinned block.

    **How you prove it worked:**

    - Repeated-step rate in long sessions; tokens per turn over time.

    **Same pattern elsewhere:** FinTech: a long mortgage-application chat forgets that the borrower is self-employed and asks for payslips again.
  takeaway: Memory needs a retention policy.
  related:
  - ctx-02
  - ctx-15
  - mem-02
  code: |
    def build_context(case):
        pinned = (f"<task_state>\nProblem: {case.problem}\nSymptoms: {case.symptoms}\n"
                  f"Tried: {case.steps_tried}\nResults: {case.results}\n</task_state>")   # verbatim, always present
        recent = case.turns[-8:]
        older = summarize(case.turns[:-8], keep=["symptoms", "constraints"]) if len(case.turns) > 8 else ""
        return [pinned, older, *recent]

    tmf621.update_ticket(case.ticket_id, notes=case.state_summary())       # resumable by a human
  lang: python
- id: agf-19
  title: Pay John sends money to the wrong John
  tags:
  - Reliability
  - FinTech
  - Critical
  scenario: |-
    A banking assistant receives "Send $500 to John for rent." The customer has three saved payees named John. The agent picks the most recently used, John Martinez, instead of the landlord John Okafor. The payment is instant (no recall), and getting the money back depends on the recipient's goodwill.
  antipattern: |-
    **Forcing the agent to always act.**

    *Think of it this way:* A courier who delivers to the first house on the street with the right surname instead of knocking to ask.
  fails: |-
    **Mechanism:** Ambiguity plus confident action means wrong actions.

    - The agent is designed to always complete the task.
    - Ambiguity is resolved by a heuristic, silently.
    - The payment rail is irreversible.

    **Root cause:** No clarification action and no rule for when to ask.

    **Where it breaks:** Agent policy and tool design.
  diagram:
    bad:
    - '''Pay John'' · $500 rent'
    - '!3 Johns · Saved payees'
    - Picks recent · Heuristic
    - '!Wrong John · Instant, no recall'
    bad_note: Always act, guess the payee
    good:
    - Detect · Several matches
    - +Ask user · Which John?
    - +Payee id · Required
    - Confirm · Full details
    good_note: Ask when ambiguous, confirm before paying
  solution: |-
    1. Give the agent an ask_user action, and define when it must ask (several matches, new payee, high amount, irreversible rail).
    2. Make the payment tool require a resolved payee_id, never a name.
    3. Show a confirmation with full payee details before sending.
  works: |-
    **Trade-off to manage:** Extra questions add friction; ask only when ambiguity or risk is real.

    **How you prove it worked:**

    - Rate of payments to non-usual payees followed by disputes or recall requests.

    **Same pattern elsewhere:** Telco: "Add the data pass to Sam's line" on a family plan with two lines for Sam and Samantha.
  takeaway: Asking is a valid action.
  related:
  - gov-02
  - agf-04
  code: |
    @tool
    def send_payment(payee_id: str, amount: Decimal, confirmed: bool = False):
        payee = payees.get(payee_id)                               # resolved id, never a name
        if not confirmed:
            return {"status": "NEEDS_CONFIRMATION",
                    "show_user": f"Send {amount} to {payee.name}, account ending {payee.acct[-4:]}, bank {payee.bank}?"}
        return payments.send(payee_id, amount)

    def resolve_payee(name):
        matches = payees.search(name)
        return matches[0].id if len(matches) == 1 else ask_user(f"Which {name}?", options=matches)
